/* =====================================================================
   11. Pantallas de cierre (Ticket creado / cobro / entrega): el círculo lleva el EMBLEMA oficial;
   la palomita (o el reloj si el cobro queda pendiente) pasa a una insignia dorada, igual que en el sello de registro.
   Solo 2D (sin 3D), para que Safari/iPhone lo dibuje siempre.
   ===================================================================== */
.okmark {
  position: relative; width: 104px; height: 104px; border-radius: 50%; overflow: visible;
  background: var(--lux-logo) center / 112% 112% no-repeat, #050506 !important;
  box-shadow: 0 0 0 2px rgba(223,186,115,.55), 0 0 0 8px rgba(223,186,115,.12), 0 0 34px rgba(223,186,115,.25) !important;
  animation: lux-okmark-in .8s var(--lux-ease) both;
}
.okmark::before {   /* destello que cruza el emblema una vez */
  content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: linear-gradient(112deg, transparent 44%, rgba(255,248,226,.45) 50%, transparent 56%) 140% 0 / 320% 100% no-repeat;
  mix-blend-mode: screen; animation: lux-em-sweep 1.2s cubic-bezier(.5,0,.3,1) .5s both;
}
.okmark svg {
  position: absolute; right: -16px; bottom: -6px; width: 32px !important; height: 32px !important; padding: 7px; box-sizing: border-box;
  border-radius: 50%; background: linear-gradient(135deg, #F5E3B5, #DFBA73 55%, #C29B53);

@keyframes lux-okmark-in { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .okmark, .okmark::before { animation: none !important; } .okmark svg { transform: none; stroke-dashoffset: 0 !important; animation: none !important; } }
/* ---------- Avisos y barra inferior legibles (reporte de Gand, 6 nov 2026) ---------- */
/* El aviso era translúcido (72 % / 90 %) y lo de abajo se leía a través: ahora es sólido */
.toast { background: #18181B !important; box-shadow: 0 10px 30px rgba(0,0,0,.45) !important; }

<script>
/* =====================================================================
   ALAGA · Cliente de la caja fuerte (navegador o Node 18+). Sin dependencias.
   - Cada registro se guarda primero en una bandeja local y después se envía.
   - Reenviar es seguro: el servidor reconoce el folio (UUID) y no duplica.
   - Lo que el servidor rechaza NO se borra: pasa a “rechazados” para que una persona lo revise.
   - El token de sesión se guarda solo en memoria (cerrar la app obliga a entrar de nuevo).
   - Cada pendiente recuerda quién lo registró y solo se envía con la sesión de esa persona, en el orden original.
     (Si se cambia de usuario en el mismo teléfono sin conexión, lo del siguiente espera a que se envíe lo del anterior.)
   ===================================================================== */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.CajaFuerteCliente = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";
  const PREFIJO = "alaga-cf:";

  function memoria() { const m = new Map(); return { getItem: k => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: k => m.delete(k) }; }
  /* UUID v4. crypto.randomUUID solo existe en contextos seguros (https/localhost); getRandomValues existe siempre. */
  function uuid() {
    const c = globalThis.crypto;
    if (c && typeof c.randomUUID === "function") return c.randomUUID();
    if (!c || typeof c.getRandomValues !== "function") throw new Error("Este navegador no tiene generador aleatorio seguro.");
    const b = c.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }
  class ErrorCaja extends Error { constructor(msg, status) { super(msg); this.status = status; } }

  class CajaFuerteCliente {
    /* espacio: separa la bandeja de cada app en el mismo teléfono (p. ej. "finanzas", "sistema").
       tiempo: límite de cada petición en ms (una red colgada no deja nada esperando para siempre). */
    constructor({ url, dispositivo = "telefono", almacen, fetch: f, espacio, tiempo = 15000, tiempoDescarga = 120000 } = {}) {
      if (!url) throw new Error("Falta la dirección del servidor.");
      this.url = String(url).replace(/\/+$/, "");
      if (espacio !== undefined && !/^[a-z0-9-]{1,20}$/.test(espacio)) throw new Error("Espacio inválido.");
      const base = PREFIJO + (espacio ? espacio + ":" : "");
      this._kB = base + "bandeja"; this._kR = base + "rechazados"; this.tiempo = tiempo; this.tiempoDescarga = tiempoDescarga; this._ctls = new Set();
      this.dispositivo = String(dispositivo).slice(0, 40);
      this.almacen = almacen || memoria();
      this._fetch = f || globalThis.fetch.bind(globalThis);
      this.token = null; this.usuario = null; this._enviando = null; this._timer = null; this._espera = 0;
      this.alCambiar = null;   // función opcional: se llama cuando cambian pendientes o rechazados
    }
    /* ---------- Bandeja local ---------- */
    _leer(k) { const v = this.almacen.getItem(k); if (!v) return []; try { const a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch (e) { throw new Error(`La bandeja local (${k}) está dañada; no se modifica para no perder datos.`); } }
    _guardar(k, arr) {
      this.almacen.setItem(k, JSON.stringify(arr));           // si el almacenamiento está lleno, esto lanza: la app debe avisar
      if (this.almacen.getItem(k) !== JSON.stringify(arr)) throw new Error("No se pudo confirmar el guardado local.");
    }
    pendientes() { return this._leer(this._kB); }
    /* Agrega a “rechazados” sin repetir el mismo folio (dos pestañas pueden recibir el mismo rechazo). */
    _sumarRechazados(nuevos) { const r = this.rechazados(), ids = new Set(r.map(x => x.evento.id)); this._guardar(this._kR, r.concat(nuevos.filter(x => !ids.has(x.evento.id) && ids.add(x.evento.id)))); }
    rechazados() { return this._leer(this._kR); }
    /* Registra un movimiento. Queda guardado localmente ANTES de intentar enviarlo. Devuelve el folio. */
    /* id opcional: permite que la app use como folio local el mismo UUID que verá la caja fuerte. */
    registrar(type, data, { at = Date.now(), id } = {}) {
      if (typeof type !== "string" || !data || typeof data !== "object") throw new Error("Registro inválido.");
      if (!this.usuario) throw new Error("Inicia sesión para registrar (cada registro queda a nombre de quien lo hace).");
      if (this.usuario.rol === "consulta") throw new Error("Tu rol es de consulta: no registra movimientos.");
      if (id !== undefined && !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(id)) throw new Error("Folio inválido.");
      if (id !== undefined && this.pendientes().some(x => x.id === id)) throw new Error("Ese folio ya está en la bandeja.");
      const e = { id: id || uuid(), type, data: JSON.parse(JSON.stringify(data)), at: Math.floor(at), usuario: this.usuario.usuario };
      const b = this.pendientes(); b.push(e); this._guardar(this._kB, b);
      this._avisar(); return e.id;
    }
    /* Decisión humana explícita (solo Administración, con conexión): aparta los pendientes de una persona que ya no podrá
       enviarlos (cuenta desactivada, se fue). Antes pregunta a la caja fuerte cuáles ya llegaron (una respuesta perdida o
       cancelada no significa que no se aplicó): esos salen de la bandeja como ya aplicados, sin pasar a recaptura.
       Lo que no llegó no se borra: pasa a “rechazados” para revisarlo o capturarlo de nuevo. Devuelve {apartados, yaAplicados}. */
    async apartarPendientesDe(usuario, motivo = "Apartado manualmente") {
      const sale = this.pendientes().filter(e => e.usuario === usuario);
      if (!sale.length) return { apartados: 0, yaAplicados: 0 };
      if (!this.token || !this.usuario || this.usuario.rol !== "administracion") throw new Error("Solo Administración, con sesión iniciada, puede apartar pendientes de otra persona.");
      const ya = new Set();
      for (let k = 0; k < sale.length; k += 500) {
        const r = await this._req("POST", "/api/eventos/existen", { ids: sale.slice(k, k + 500).map(e => e.id) });
        if (!r || !Array.isArray(r.existen)) throw new Error("La caja fuerte no confirmó qué registros ya tiene; no se apartó nada.");
        r.existen.forEach(x => ya.add(x));
      }
      const ids = new Set(sale.map(e => e.id)), sigue = this.pendientes(), salen = sigue.filter(e => ids.has(e.id));
      const aparta = salen.filter(e => !ya.has(e.id));
      this._sumarRechazados(aparta.map(e => ({ evento: e, error: String(motivo).slice(0, 200), codigo: "apartado", el: Date.now() })));
      this._guardar(this._kB, this.pendientes().filter(e => !ids.has(e.id)));
      this._avisar(); return { apartados: aparta.length, yaAplicados: salen.length - aparta.length };
    }
    /* Quitar un rechazado es una decisión humana explícita (se recomienda anotarlo o rehacerlo corregido). */
    descartarRechazado(id) { const r = this.rechazados(); const n = r.filter(x => x.evento.id !== id); if (n.length === r.length) return false; this._guardar(this._kR, n); this._avisar(); return true; }
    _avisar() { if (typeof this.alCambiar === "function") { try { this.alCambiar({ pendientes: this.pendientes().length, rechazados: this.rechazados().length }); } catch (e) {} } }

    /* ---------- Sesión ---------- */
    /* extra.headers: cabeceras adicionales; extra.completo: devuelve {status, etag, json} y acepta 304 (sin cambios). */
    async _req(method, path, body, extra = {}) {
      const headers = { "X-Dispositivo": this.dispositivo };
      if (body !== undefined) headers["Content-Type"] = "application/json";
      const tok = this.token;                   // un 401 solo invalida el token con el que se hizo ESTA petición
      if (tok) headers.Authorization = "Bearer " + tok;
      Object.assign(headers, extra.headers || {});
      /* Dos límites: la caja fuerte debe empezar a responder en `tiempo` (15 s); la descarga puede tardar hasta
         `tiempoDescarga` (2 min) para que una Wi-Fi lenta pero viva funcione con mucha historia. */
      const ctl = typeof AbortController === "function" ? new AbortController() : null;
      if (ctl) this._ctls.add(ctl);
      let timer = ctl ? setTimeout(() => ctl.abort(), this.tiempo) : null;
      let r, j = null;
      try {
        r = await this._fetch(this.url + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, cache: "no-store", signal: ctl ? ctl.signal : undefined });
        if (timer) { clearTimeout(timer); timer = setTimeout(() => ctl.abort(), this.tiempoDescarga); }
        if (r.status !== 304) { try { j = await r.json(); } catch (e) { if (e && e.name === "AbortError") throw e; } }
      }
      catch (e) { throw new ErrorCaja(e && e.name === "AbortError" ? "La caja fuerte no respondió a tiempo" : "Sin conexión con la caja fuerte"); }
      finally { if (timer) clearTimeout(timer); if (ctl) this._ctls.delete(ctl); }
      if (r.status === 401 && this.token === tok) { this.token = null; }
      if (!r.ok && !(extra.completo && r.status === 304)) { const err = new ErrorCaja((j && j.error) || `Error ${r.status}`, r.status); err.datos = j; throw err; }
      return extra.completo ? { status: r.status, etag: r.headers && r.headers.get ? r.headers.get("etag") : null, json: j } : j;
    }
    async iniciarSesion(usuario, contrasena) {
      const r = await this._req("POST", "/api/sesion", { usuario, contrasena });
      this.token = r.token; this.usuario = r.usuario; this._lote = 100; return r.usuario;
    }
    /* Pendientes de otras personas en este teléfono (no se envían con la sesión actual). */
    pendientesDeOtros() { const u = this.usuario && this.usuario.usuario; return this.pendientes().filter(e => e.usuario !== u); }
    /* Cancela las peticiones en curso (p. ej. al cerrar sesión, para que la siguiente persona no espere una descarga ajena). */
    cancelar() { for (const c of this._ctls) { try { c.abort(); } catch (e) {} } this._ctls.clear(); }
    async cerrarSesion() { try { if (this.token) await this._req("POST", "/api/sesion/cerrar", {}); } finally { this.token = null; this.usuario = null; } }
    cambiarContrasena(actual, nueva) { return this._req("POST", "/api/contrasena", { actual, nueva }).then(r => { this.token = null; return r; }); }
    estado() { return this._req("GET", "/api/estado"); }
    /* Lealtad de una placa: {pagados, meta, disponible}. La caja fuerte vuelve a validarlo al crear el ticket. */
    lealtad(placa) { return this._req("GET", "/api/lealtad?placa=" + encodeURIComponent(String(placa || ""))); }
    /* Directorio de clientes cifrado (solo en línea; nada de esto se guarda en la bandeja del teléfono).
       Errores 409 traen err.datos.duplicado (mismo teléfono) o err.datos.conflicto (placa de otro cliente). */
    clientesBuscar(q) { return this._req("GET", "/api/clientes?q=" + encodeURIComponent(String(q || ""))).then(r => r.clientes); }
    clientePorPlaca(placa) { return this._req("GET", "/api/clientes?placa=" + encodeURIComponent(String(placa || "").slice(0, 12))).then(r => r.cliente); }
    cliente(id) { return this._req("GET", "/api/clientes?id=" + encodeURIComponent(String(id || ""))).then(r => r.cliente); }
    clienteCrear(datos, opc = {}) { return this._req("POST", "/api/clientes", Object.assign({ datos }, opc)).then(r => r.cliente); }
    clienteEditar(id, ver, datos, opc = {}) { return this._req("POST", "/api/clientes/editar", Object.assign({ id, ver, datos }, opc)).then(r => r.cliente); }
    clienteBorrar(id, motivo) { return this._req("POST", "/api/clientes/borrar", { id, motivo }); }

    /* ---------- Envío ---------- */
    /* Envía la bandeja en orden. Devuelve {enviados, rechazados, pendientes, error?}. Nunca borra algo que el servidor no confirmó. */
    sincronizar() {
      if (this._enviando) return this._enviando;
      this._enviando = this._sincronizar().finally(() => { this._enviando = null; });
      return this._enviando;
    }
    async _sincronizar() {
      let enviados = 0, rech = 0;
      while (true) {
        const todos = this.pendientes();
        if (!todos.length) break;
        if (!this.token || !this.usuario) return { enviados, rechazados: rech, pendientes: todos.length, error: "Inicia sesión para enviar." };
        /* Se respeta el orden en que se registró todo en el teléfono: se envía solo el tramo inicial de esta persona
           y se detiene en el primer registro de otra (así un cobro nunca llega antes que la apertura o el ticket de los que depende). */
        const yo = this.usuario.usuario, corte = todos.findIndex(e => e.usuario !== yo), b = corte === -1 ? todos : todos.slice(0, corte);
        if (!b.length) return { enviados, rechazados: rech, pendientes: todos.length, esperaA: todos[0].usuario, error: `Hay registros anteriores de “${todos[0].usuario}”; se enviarán cuando esa persona entre.` };
        const lote = b.slice(0, this._lote || 100).map(({ usuario, ...ev }) => ev);
        let resp;
        try { resp = await this._req("POST", "/api/eventos", { eventos: lote }); }
        catch (e) {
          if (e.status === 413 && lote.length > 1) { this._lote = Math.max(1, Math.floor(lote.length / 2)); continue; }   // lote muy grande: se parte
          if (e.status === 403 && !/cambiar tu contraseña/i.test(e.message)) {   // el rol no puede registrar: pasa a revisión, no traba la bandeja
            const ids = new Set(lote.map(x => x.id));
            this._sumarRechazados(b.slice(0, lote.length).map(ev => ({ evento: ev, error: e.message, codigo: 403, el: Date.now() })));
            this._guardar(this._kB, this.pendientes().filter(x => !ids.has(x.id))); rech += lote.length; this._avisar(); continue;
          }
          if (e.status === 413) {                                   // un solo registro demasiado grande: pasa a revisión, no traba la bandeja
            this._sumarRechazados([{ evento: b[0], error: e.message, codigo: 413, el: Date.now() }]);
            this._guardar(this._kB, this.pendientes().filter(x => x.id !== b[0].id)); rech++; this._avisar(); continue;
          }
          return { enviados, rechazados: rech, pendientes: todos.length, error: e.message, status: e.status };
        }
        const porId = new Map((resp.resultados || []).map(r => [r.id, r]));
        const confirmados = new Set(), nuevosRech = [];
        for (const e of lote) {
          const r = porId.get(e.id);
          if (!r) break;                                           // el servidor se detuvo: lo demás queda pendiente
          if (r.estado === "aceptado" || r.estado === "duplicado") { confirmados.add(e.id); enviados++; }
          else if (r.estado === "rechazado") { confirmados.add(e.id); nuevosRech.push({ evento: { ...e, usuario: yo }, error: r.error, codigo: r.codigo, el: Date.now() }); rech++; }
          else break;                                              // error interno: se reintenta después
        }
        if (nuevosRech.length) this._sumarRechazados(nuevosRech);   // primero se guardan los rechazados…
        this._guardar(this._kB, this.pendientes().filter(e => !confirmados.has(e.id)));          // …y solo después se quitan de la bandeja
        this._avisar();
        if (confirmados.size < lote.length) return { enviados, rechazados: rech, pendientes: this.pendientes().length, error: "El servidor no confirmó todos los registros; se reintentará." };
      }
      const resto = this.pendientes().length;
      return { enviados, rechazados: rech, pendientes: resto };
    }
    /* Reintento automático con espera creciente (5 s → 5 min) mientras haya pendientes. */
    iniciarSincronizacionAutomatica(baseMs = 5000) {
      this.detenerSincronizacionAutomatica();
      const tick = async () => {
        const r = await this.sincronizar().catch(e => ({ error: e.message }));
        this._espera = r && r.error ? Math.min(300000, Math.max(baseMs, this._espera * 2)) : baseMs;
        this._timer = setTimeout(tick, this._espera);
      };
      this._timer = setTimeout(tick, 0);
    }
    detenerSincronizacionAutomatica() { if (this._timer) clearTimeout(this._timer); this._timer = null; }
  }
  CajaFuerteCliente.uuid = uuid; CajaFuerteCliente.ErrorCaja = ErrorCaja;
  return CajaFuerteCliente;
});

  ];
  old.forEach(t=>{t.pay.received=ticketTotal(t);});
  /* Antecedentes anteriores a la demo (DEMO): visitas y lavados pagados desde el último canje */
  const history=[
    {plate:"DEM-221-B",cat:"suv",brand:"Toyota",client:"Cliente Demo Navarro",phone:"",visitsPrior:2,loyaltyPrior:2},

    {plate:"DEM-118-A",cat:"sedan",brand:"Honda",client:"Cliente Demo Pérez",phone:"",visitsPrior:0,loyaltyPrior:0}

  return {v:2, vehicles:[...old,...v], history, seq:6, hseq:0, npSeq:2, draft:null, theme:"system", loyaltyRule:"pkg", privacyAck:false};

function attentionList(){
  const tk=dayKey(nowMs()), out=[];
  if(S.draft) out.push({id:null,sev:"neutral",icon:"pen",title:draftLabel(),reasons:[`Recepción sin terminar · paso ${S.draft.step} de 6`],act:"Retomar",a:"resume"});

    if(v.status==="validacion"){ rs.push("Espera inspección final"); act="Inspeccionar"; a="advance"; sev="violet"; icon="shield"; }
    if(v.status==="listo"&&v.pay.status==="pendiente"&&ticketTotal(v)>0){ rs.push(`Listo · cobro pendiente de ${money(ticketTotal(v))}`); act=act||"Cobrar y entregar"; a=a||"advance"; icon=icon==="alert"?"cash":icon; }
    if(dayKey(v.createdAt)<tk){ rs.push(`Recibido ${dayLabel(dayKey(v.createdAt)).toLowerCase()} · sigue ${STAGES[v.status].label.toLowerCase()}`); act=act||"Ver expediente"; a=a||"openTicket"; icon=icon==="alert"?"clock":icon; }
    if(v.status==="listo"&&v.incidents&&v.incidents.length){ rs.push(`${v.incidents.length} ${v.incidents.length===1?"incidencia registrada":"incidencias registradas"}`); act=act||"Ver expediente"; a=a||"openTicket"; sev="err"; }
    if(rs.length) out.push({id:v.id,sev,icon,title:vName(v),cat:v.cat,reasons:rs,act,a});
  });

}

/* Actividad: eventos ya registrados (recepción, cambios de estado, cobros) */

  const ev=[];
  S.vehicles.filter(v=>!id||v.id===id).forEach(v=>{
    v.log.forEach(([st,at],i)=>{ if(k&&dayKey(at)!==k) return; ev.push({at,id:v.id,icon:i===0?"plus":"arrow",c:stageColor(st),text:i===0?`Recepción registrada · ${vName(v)}`:`${vName(v)} → ${STAGES[st].label}`}); });
    if(v.pay.status==="pagado"&&v.pay.at&&(!k||dayKey(v.pay.at)===k)) ev.push({at:v.pay.at,id:v.id,icon:v.pay.method==="efectivo"?"cash":"card",c:"var(--ok)",text:`Cobro ${v.pay.method==="tarjeta"?"con tarjeta":v.pay.method==="transferencia"?"por transferencia":"en efectivo"} · ${vName(v)} · ${money(ticketTotal(v))}`});

/* ---------- Finanzas: solo cifras calculables con los datos DEMO ---------- */
function finData(range){
  const DAY=86400000, today=startOfDay(nowMs());
  let n=range==="30"?30:7;
  if(range==="all"){ const firsts=S.vehicles.map(v=>startOfDay(v.createdAt)).concat(S.vehicles.filter(v=>v.pay.at).map(v=>startOfDay(v.pay.at))); n=Math.max(1,Math.round((today-Math.min(...firsts))/DAY)+1); }
  const keys=[]; for(let i=n-1;i>=0;i--) keys.push(dayKey(today-i*DAY+12*3600000));
  const set=new Set(keys);
  const paid=S.vehicles.filter(v=>v.pay.status==="pagado"&&v.pay.at&&set.has(dayKey(v.pay.at)));
  const byDay=keys.map(k=>{const L=paid.filter(v=>dayKey(v.pay.at)===k); return {k,amt:L.reduce((a,v)=>a+ticketTotal(v),0),n:L.length};});
  const recv=S.vehicles.filter(v=>set.has(dayKey(v.createdAt)));
  const byPkg={alaga:recv.filter(v=>v.pkg==="alaga").length,super:recv.filter(v=>v.pkg==="super").length};
  const byCat=CATS.map(c=>({c,n:recv.filter(v=>v.cat===c.id).length}));
  const tk=dayKey(nowMs()); const pendV=S.vehicles.filter(v=>v.pay.status==="pendiente");
  const total=byDay.reduce((a,d)=>a+d.amt,0);
  return {keys,byDay,total,paidN:paid.length,avg:paid.length?total/paid.length:0,recvN:recv.length,byPkg,byCat,
    pend:pendV.reduce((a,v)=>a+ticketTotal(v),0),pendV,pendToday:pendV.filter(v=>dayKey(v.createdAt)===tk),pendPrev:pendV.filter(v=>dayKey(v.createdAt)<tk)};
}
const shortDay=k=>{const [Y,M,D]=k.split("-").map(Number); return new Date(Y,M-1,D).toLocaleDateString("es-MX",{weekday:"short",day:"numeric"}).replace(".","");};
function barsSvg(byDay){
  const W=340,H=170,top=22,bot=28,left=4,right=4, n=byDay.length, max=Math.max(1,...byDay.map(d=>d.amt));
  const step=(W-left-right)/n, bw=Math.max(3,Math.min(34,step*0.62));
  const y=v=>top+(H-top-bot)*(1-v/max);
  const showVal=n<=7, every=n<=7?1:n<=14?2:5;
  const bars=byDay.map((d,i)=>{const x=left+i*step+(step-bw)/2, yy=y(d.amt), h=H-bot-yy;
    return `<g><title>${shortDay(d.k)}: ${money(d.amt)} · ${d.n} ${d.n===1?"pago":"pagos"}</title>${d.amt?`<rect class="bar" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3"></rect>`:`<rect class="bar0" x="${x.toFixed(1)}" y="${(H-bot-2).toFixed(1)}" width="${bw.toFixed(1)}" height="2" rx="1"></rect>`}
      ${showVal&&d.amt?`<text class="val" x="${(x+bw/2).toFixed(1)}" y="${(yy-6).toFixed(1)}" text-anchor="middle">${money(d.amt)}</text>`:""}
      ${(i%every===0||i===n-1)?`<text class="ax" x="${(x+bw/2).toFixed(1)}" y="${H-9}" text-anchor="middle">${esc(shortDay(d.k))}</text>`:""}</g>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas cobradas por fecha de pago: ${byDay.filter(d=>d.amt).map(d=>`${shortDay(d.k)} ${money(d.amt)}`).join(", ")||"sin cobros"}"><line class="base" x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}"></line>${bars}</svg>`;
}

function knownVehicles(){
  const map=new Map();
  S.history.forEach(h=>map.set(norm(h.plate),{plate:h.plate,cat:h.cat,brand:h.brand,client:h.client,phone:h.phone||"",visits:h.visitsPrior||0,lastAt:null}));
  S.vehicles.filter(v=>v.plate).sort((a,b)=>a.createdAt-b.createdAt).forEach(v=>{const k=norm(v.plate); const p=map.get(k); map.set(k,{plate:v.plate,cat:v.cat,brand:v.brand,client:v.client,phone:v.phone||"",visits:(p?p.visits:0)+1,lastAt:v.createdAt});});
  return [...map.values()].map(x=>Object.assign(x,{last:x.lastAt?dayLabel(dayKey(x.lastAt)):"antes de la demo"}));
}
function rx1(){
  const D=S.draft;
  CUR.dock=()=>{ const ok=D.mode==="plate"?(D.match||D.isNew):true; return `<button class="btn primary lg" data-a="rx1Next" ${ok?"":"disabled"}>${nextLabel("Continuar")}${ic("arrow")}</button>`; };

function updateResults(){
  const D=S.draft, box=$("#results"); if(!box) return;
  const q=norm(D.plate);
  if(q.length<3){ box.innerHTML=`<div class="banner neutral">${ic("search")}<div>Escribe al menos 3 caracteres para buscar.</div></div>`; return; }
  const all=knownVehicles();
  const hits=all.filter(h=>norm(h.plate).includes(q));
  const exact=all.find(h=>norm(h.plate)===q);
  const near=!exact&&q.length>=PR().min?all.filter(h=>Math.abs(norm(h.plate).length-q.length)<=1&&lev(norm(h.plate),q)===1):[];
  let h="";
  if(hits.length){ h+=`<div class="eyebrow" style="margin-bottom:8px">${hits.length===1?"Coincidencia":"Coincidencias"}</div>`+hits.slice(0,3).map(x=>{
    const sel=D.match&&norm(D.match.plate)===norm(x.plate);
    return `<button class="vrow" data-a="pickMatch" data-p="${esc(x.plate)}" aria-pressed="${!!sel}" style="${sel?"border:2px solid var(--gold);":""}margin-bottom:8px">
      <span class="vico" style="--c:var(--gold)">${vic(x.cat)}</span><span class="vmain"><span class="pl">${esc(x.plate)}</span><span class="sub">${esc(catOf(x.cat).name)} · ${esc(x.brand)} · ${esc(x.client)}</span>
      <span class="meta"><span class="badge neutral">${x.visits} ${x.visits===1?"visita":"visitas"}</span>${loyaltyBadge(x.plate)}</span></span>
      <span class="vside">${sel?`<span class="badge ok">${ic("check")}Elegido</span>`:`<span class="tm">Última: ${esc(x.last)}</span>`}</span></button>`;}).join(""); }
  if(near.length) h+=`<div class="banner warn" style="margin-bottom:8px">${ic("alert")}<div>Placa parecida registrada: <b>${near.map(n=>esc(n.plate)).join(", ")}</b>. Revisa antes de crear un registro nuevo.</div></div>`;
  if(!exact){
    const valid=q.length>=PR().min&&q.length<=PR().max;
    h+=`<button class="btn ${D.isNew?"dark":"secondary"}" data-a="newVehicle" ${valid?"":"disabled"} aria-pressed="${D.isNew}">${D.isNew?ic("check"):ic("plus")}${D.isNew?"Vehículo nuevo: "+esc(D.plate.toUpperCase()):"Registrar vehículo nuevo"}</button>
      ${valid?"":`<div class="help">Para registrar una placa nueva: entre ${PR().min} y ${PR().max} letras o números (regla provisional, D20).</div>`}`;
    if(!hits.length&&!near.length) h=`<div class="empty" style="padding:var(--sp-4)"><b>Sin registros con “${esc(D.plate.toUpperCase())}”</b>Es la primera visita de este vehículo.</div>`+h;
  }
  box.innerHTML=h;
}

  const card=(k)=>{
    const sel=D.pkg===k; const show=D.showComp[k];

      <div class="h"><div><div class="name ${k==="super"?"super":""}">${PKGS[k].name}</div><div class="help" style="margin-top:2px">${ic("lock","sm")} Precio oficial${ktCompTxt(k)}</div></div>
      <div class="price tnum">${rz?"<small>Desde</small>":""}${money(PRICES[k][c])}</div></div></button>
      <button class="togglecomp" data-a="showComp" data-k="${k}" aria-expanded="${!!show}">${show?"Ocultar componentes":"Ver componentes"}${ic(show?"back":"down","sm")}</button>

  ${rz?`<div class="banner info" style="margin-top:var(--sp-4)">${ic("info")}<div>El <b>precio final</b> de RZR se confirma en el paso 6, con la foto del nivel de suciedad como evidencia. “Desde $220 / $290” no cambia.</div></div>`:""}

  ${c==="sedan"?`<p class="help">Supuesto: un compacto paga el precio de “Sedán” (D6).</p>`:""}`
  :`<div class="banner neutral">${ic("lock")}<div>Sin precio confirmado para ${esc(catOf(c).name)} en la lona. Extras no disponibles <b>(D7)</b>.</div></div>`}`;

function loyaltyBlock(D){
  if(D.mode!=="plate"||!norm(D.plate)) return `<div class="banner neutral" style="margin-top:var(--sp-4)">${ic("info")}<div>Vehículo sin placas: esta simulación no lo cuenta para fidelización <b>(P6 / D11)</b>.</div></div>`;
  const n=loyaltyCount(D.plate);
  if(n<LOY_GOAL) return `<div class="loycard" style="margin-top:var(--sp-4)"><div class="blockh"><h3>Fidelización · simulación</h3><span class="badge pend">P6</span></div>
    <p style="display:flex;align-items:center;gap:10px;font-size:var(--fs-sm)">${stampsHtml(n)}<span><b>${n} de ${LOY_GOAL}</b> lavados pagados · ${n===LOY_GOAL-1?"el siguiente pagado completa la tarjeta":`faltan ${LOY_GOAL-n} para el 6.º gratis`}</span></p>
    <p class="help">Este ticket contará cuando se registre su pago.</p></div>`;

    <p style="display:flex;align-items:center;gap:10px;font-size:var(--fs-sm)">${stampsHtml(LOY_GOAL)}<span><b>${n} lavados pagados</b> desde el último canje</span></p><p class="help">Elige un paquete para poder aplicarlo.</p></div>`;

    <p style="display:flex;align-items:center;gap:10px;font-size:var(--fs-sm)">${stampsHtml(LOY_GOAL)}<span><b>${n} lavados pagados</b> desde el último canje</span></p>
    <button class="xrow" style="padding-left:0;padding-right:0" data-a="loyApply" role="checkbox" aria-checked="${on}"><span class="cbox">${ic("check")}</span><span class="nm">Aplicar 6.º lavado gratis en este ticket<small>Descuento simulado: ${money(-amt)} (${S.loyaltyRule==="alaga"?"precio del Paquete ALAGA":"precio del paquete elegido"})</small></span></button>
    <p class="help">Simulación con reglas no aprobadas (P6). Extras y ajuste de RZR se cobran aparte. La regla a simular se cambia en <b>Más</b>.</p></div>`;
}

/* R6 Resumen y firma */
function rx6(){

      <div class="field"><label for="reason">Motivo del ajuste <span class="opt">(obligatorio si hay ajuste)</span></label><input id="reason" class="input" data-f="reason" value="${esc(D.rzr.reason)}" placeholder="Ej. Lodo extraordinario" aria-describedby="e-reason">${errMsg("reason")}</div>
      <p class="help">${ic("camera","sm")} Evidencia: captura simulada “Nivel de suciedad” del paso 4 ${D.photos[6]?"✓ (sin imagen)":"(falta)"}</p>

  return `${priceBlock}
  ${rz&&pf?`<div class="banner info">${ic("check")}<div>Precio final confirmado: <b>${money(ticketTotal(D))}</b>. <button class="linkbtn" data-a="editPrice" style="padding:0 4px">Editar</button></div></div>`:""}

function initSig(){
  const c=$("#sig"); if(!c) return; const D=S.draft;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const g=c.getContext("2d"); g.scale(dpr,dpr); g.lineWidth=2.6; g.lineCap="round"; g.lineJoin="round"; g.strokeStyle="#1c1917";
  if(D.sig){ const im=new Image(); im.onload=()=>g.drawImage(im,0,0,r.width,r.height); im.src=D.sig; }
  let on=false,last=null,len=0;
  const pt=e=>{const b=c.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}};
  c.addEventListener("pointerdown",e=>{$("#toast").classList.remove("on");on=true;len=0;last=pt(e);try{c.setPointerCapture(e.pointerId)}catch(_){} e.preventDefault();});
  c.addEventListener("pointermove",e=>{if(!on)return;const p=pt(e);g.beginPath();g.moveTo(last.x,last.y);g.lineTo(p.x,p.y);g.stroke();len+=Math.hypot(p.x-last.x,p.y-last.y);last=p;e.preventDefault();});
  const end=()=>{ if(!on) return; on=false; if(len>30||D.sig){ D.sig=c.toDataURL("image/png"); const o=document.createElement("canvas"); o.width=360; o.height=Math.max(1,Math.round(360*c.height/c.width)); o.getContext("2d").drawImage(c,0,0,o.width,o.height); D.sigSmall=o.toDataURL("image/png"); D.sigAt=nowMs(); save(); refreshDock(); } };
  c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end); c.addEventListener("pointerleave",end);
}

function cashChange(tot,rec){
  if(!rec) return `<div class="change"><span>Cambio</span><b class="tnum">—</b></div>`;
  if(rec<tot) return `<div class="err" style="margin-top:var(--sp-3)">${ic("alert")}Faltan ${money(tot-rec)}: lo recibido es menor que el total.</div><div class="change"><span>Cambio</span><b class="tnum">—</b></div>`;
  return `<div class="change"><span>Cambio</span><b class="tnum">${money(rec-tot)}</b></div>`;
}

/* Inspección final (Por validar → Listo) */
function inspectSheet(id){
  const t=S.vehicles.find(v=>v.id===id); if(!t) return;
  const comps=catCompsT(t).filter(([k])=>applic(t.cat,k)!=="na");
  const draftInc=t._inc||(t._inc={});
  const rows=comps.map(([k,n])=>{const a=applic(t.cat,k); const on=!!draftInc[k];
    return `<div style="border-top:1px solid var(--line);padding:var(--sp-3) 0"><div style="display:flex;align-items:center;gap:var(--sp-3)"><span style="flex:1;font-size:var(--fs-sm);font-weight:600">${n}${a==="cl"?` <span class="badge pend">Por aclarar</span>`:""}</span>
      <span class="help" style="margin:0">${on?"Incidencia":"Realizado"}</span><button class="switch" role="switch" aria-checked="${on}" data-a="incToggle" data-id="${id}" data-k="${k}" aria-label="Incidencia en ${n}"></button></div>
      ${on?`<input class="input" style="margin-top:8px" data-f="incReason" data-id="${id}" data-k="${k}" value="${esc(draftInc[k].reason||"")}" placeholder="Motivo (obligatorio)">`:""}</div>`;}).join("");
  openSheet("Inspección final",`<div class="banner neutral">${ic("shield")}<div>Todos los componentes quedan como <b>Realizado</b>. Activa una incidencia solo si algo no se hizo. <span class="badge pend">D9</span></div></div><div style="margin-top:var(--sp-3)">${rows}</div><div id="incErr"></div>`,
    `<button class="btn primary lg" data-a="validate" data-id="${id}">${ic("check")}Validar · listo para entrega</button>`);
}

    <div id="pv-d"><p>ALAGA SYSTEM DEMO no es un sistema seguro para información de clientes.</p><ul class="pvlist"><li>Todo se guarda <b>sin cifrar</b> en este navegador, sin respaldo ni control de acceso.</li><li>No escribas nombres, teléfonos ni placas reales.</li><li>Firmas, fotos y cobros son simulaciones sin validez legal.</li></ul></div>
    <div class="acts"><button class="btn primary" data-x="ok">Entendido, usaré datos ficticios</button></div></div>`;

privacyGate();
/* Con el teclado abierto, iOS reduce el "visual viewport" sin mover la página: se recolocan la barra superior y la barra de acción */
function kbOffset(innerH,vvH,vvTop){ const k=Math.round(innerH-vvH-vvTop); return k>120?k:0; }
if(window.visualViewport){
  const vv=window.visualViewport;
  const upd=()=>{ const k=kbOffset(window.innerHeight,vv.height,vv.offsetTop); const root=document.documentElement.style;
    root.setProperty("--kb",k+"px"); root.setProperty("--vvtop",(k?Math.round(vv.offsetTop):0)+"px"); document.body.classList.toggle("kb-open",k>0); };
  vv.addEventListener("resize",upd); vv.addEventListener("scroll",upd);
}
/* Cambio de día: las métricas de "hoy" se recalculan solas al pasar la medianoche local */
let lastDay=dayKey(nowMs());
setInterval(()=>{ const k=dayKey(nowMs()); if(k!==lastDay){ lastDay=k; if(!layerOpen&&["home","control","history","more"].includes(R.name)) render(); } },30000);

<script>
"use strict";
/* =====================================================================
   ALAGA SYSTEM v0.4 · MODO CONECTADO A LA CAJA FUERTE
   Qué se envía: SOLO lo financiero de cada ticket (placa o folio, categoría, paquete, extras) y su cobro.
   Qué NO se envía por aquí: nombres, teléfonos, firmas, daños ni notas (siguen solo en este teléfono, como en v0.3).
   Las fotos de la recepción (v1.0) van aparte, cifradas, por camara.js (POST /api/fotos), solo con la caja fuerte conectada.
   Decisiones de Gand: formas de pago efectivo, tarjeta (terminal Clip) y transferencia; RZR como cualquier servicio, con
   ajuste por condición capturado en recepción (motivo obligatorio, sin tope); lealtad: 5 lavados pagados → el siguiente
   cubre el Paquete ALAGA (y en RZR también el ajuste); si no se usa, no se pierde. La caja fuerte lleva la cuenta y valida
   cada beneficio: se confirma al aplicarlo y otra vez al generar el ticket; queda atado a la placa.
   Cómo: cada vez que la app guarda, se concilia: tickets y cobros nuevos pasan a la bandeja de envío (idempotente).
   Para cobrar, la caja debe estar abierta en Finanzas (la caja fuerte lo exige).
   El modo DEMO (vehículos de ejemplo) sigue intacto y usa otro almacenamiento.
   ===================================================================== */
const CF_CONF_KEY="alaga-cf:config:sistema", CF_DATA_KEY="alaga-sistema-cf-v1";
const CF={on:false, url:"", cli:null, user:null, sesion:null, online:null, lastOk:0, busy:false, timer:null, err:"", rev:0, stale:false, sess:0};
function cfConf(){ try{ const o=JSON.parse(localStorage.getItem(CF_CONF_KEY)||"null"); return o&&typeof o==="object"?o:{}; }catch(e){ return {}; } }
function cfSetConf(o){ try{ localStorage.setItem(CF_CONF_KEY,JSON.stringify(o)); return true; }catch(e){ return false; } }
const cfDefaultUrl=()=>/^https?:$/.test(location.protocol)?location.origin:"";
const CF_METHOD={efectivo:"efectivo", tarjeta:"clip", transferencia:"transferencia"};   // tarjeta = terminal Clip

/* Sello corto de este teléfono: los folios sin placa (F-0001) de dos teléfonos no se confunden en la caja fuerte. */
function cfTag(){ const c=cfConf(); if(/^[A-Z0-9]{2}$/.test(c.tag||"")) return c.tag;
  const abc="ABCDEFGHJKMNPQRSTUVWXYZ23456789", b=crypto.getRandomValues(new Uint8Array(2)), tag=abc[b[0]%abc.length]+abc[b[1]%abc.length];
  cfSetConf(Object.assign(c,{tag})); return tag; }
/* Placa para la caja fuerte: letras, números y guiones (máx. 12). Sin placa → folio interno con el sello del teléfono (F-0001-K7). */
function cfPlate(t){
  if(!t.plate&&t.noPlate&&t.noPlate.folio) return (String(t.noPlate.folio).toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,9)+"-"+cfTag()).slice(0,12);
  const raw=t.plate?String(t.plate):t.folio||"";
  return raw.toUpperCase().replace(/\s+/g,"-").replace(/[^A-Z0-9-]/g,"").slice(0,12)||String(t.folio||"SIN-PLACA").toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,12);
}
/* Ajuste del RZR (decisión de Gand): capturado en recepción con motivo; va a la caja fuerte en centavos. */
const cfAdj=t=>t.cat==="rzr"&&t.rzr&&t.rzr.confirmed&&Number(t.rzr.adj)>0?{monto:Math.round(Number(t.rzr.adj)*100),motivo:String(t.rzr.reason||"").trim().slice(0,120)}:null;
/* ¿Por qué no se envía un ticket? (null = sí se envía) */
function cfOmitReason(t){
  if(t.loyalty&&t.loyalty.redeemed) return t.plate?null:"Beneficio de lealtad sin placa: no aplica.";
  if(ticketTotal(t)<=0) return "Sin saldo por cobrar.";
  return null;
}

/* ---------- Conciliación: lo nuevo pasa a la bandeja ----------
   Orden seguro: 1) se asignan folios y se GUARDA en el teléfono; 2) solo entonces se pasa a la bandeja.
   Así un ticket nunca sale hacia la caja fuerte sin estar guardado aquí. Si el paso 2 se interrumpe,
   se reintenta con el mismo folio (la caja fuerte no duplica). */
function cfAssign(){
  let changed=false;
  for(const t of S.vehicles){
    if(!t.cf){ const why=cfOmitReason(t); t.cf=why?{omitido:why}:{tid:CajaFuerteCliente.uuid()}; changed=true; }
    if(t.cf.tid&&t.pay&&t.pay.status==="pagado"&&t.cf.sesion&&!t.cf.cid){ t.cf.cid=CajaFuerteCliente.uuid(); changed=true; }
  }
  return changed;
}
function cfQueue(){
  if(!CF.on||!CF.cli||!CF.cli.token||CF.stale) return 0;
  const inBox=new Set(CF.cli.pendientes().map(e=>e.id)); let n=0, failed=0;
  const put=(type,data,at,id)=>{ if(inBox.has(id)) return true; try{ CF.cli.registrar(type,data,{at,id}); inBox.add(id); n++; return true; }
    catch(e){ if(/ya está en la bandeja/.test(e&&e.message)) return true; failed++; CF.err="No se pudo guardar en la bandeja de envío: "+(e&&e.message||e); return false; } };
  for(const t of S.vehicles){
    if(!t.cf||!t.cf.tid) continue;
    if(!t.cf.tq&&put("ticket.crear",Object.assign({plate:cfPlate(t),cat:t.cat,pkg:t.pkg,extras:[...(t.extras||[])],sinPlaca:!t.plate},cfAdj(t)?{ajuste:cfAdj(t)}:{},t.loyalty&&t.loyalty.redeemed?{beneficio:true}:{}),t.createdAt,t.cf.tid)) t.cf.tq=1;
    /* Forma de pago desconocida: no se adivina (nunca se registra como efectivo algo que no lo fue). */
    if(t.cf.tq&&t.cf.cid&&!t.cf.cq&&!CF_METHOD[t.pay.method]){ failed++; CF.err=`Forma de pago no reconocida en ${t.folio}: no se envió el cobro.`; continue; }
    if(t.cf.tq&&t.cf.cid&&!t.cf.cq&&put("cobro",{sesion:t.cf.sesion,ticket:t.cf.tid,method:CF_METHOD[t.pay.method],ref:String(t.pay.ref||"").slice(0,40)},t.pay.at||nowMs(),t.cf.cid)) t.cf.cq=1;
  }
  if(failed) setTimeout(()=>toast(CF.err),0);
  return n;
}
function cfReconcile(){
  if(!CF.on||!CF.cli||!CF.cli.token||CF.stale) return 0;
  /* Sin guardar aquí, no se envía nada (también si un guardado anterior falló: CF.unsaved). */
  if((cfAssign()||CF.unsaved)&&!cfSaveRaw()) return 0;
  const n=cfQueue(); if(n) cfSaveRaw();
  return n;
}
/* Estado de un ticket frente a la caja fuerte (para mostrarlo). */
function cfTicketState(t){
  if(!CF.on||!t.cf) return null;
  if(t.cf.omitido) return {cls:"neutral", text:"No va a la caja fuerte", why:t.cf.omitido};
  const pend=new Set(CF.cli.pendientes().map(e=>e.id)), rj=new Map(CF.cli.rechazados().map(x=>[x.evento.id,x.error]));
  for(const id of [t.cf.tid,t.cf.cid].filter(Boolean)) if(rj.has(id)) return {cls:"bad", text:"Rechazado por la caja fuerte", why:rj.get(id)};
  if(t.pay&&t.pay.status==="pagado"&&!t.cf.cid) return {cls:"bad", text:"Cobro sin enviar", why:!t.cf.sesion?"Se cobró sin una caja abierta conocida. Regístralo en Finanzas o avisa a Administración.":CF.stale?"Hay cambios en otra pestaña: recarga la página para enviarlo.":"Aún no se pudo guardar para enviarlo; se reintentará al guardar de nuevo."};
  if(t.payPrev&&t.payPrev.length&&!(t.pay&&t.pay.status==="pagado")){ const p=t.payPrev[t.payPrev.length-1]; if(p.method!=="efectivo"&&!p.rechazado) return {cls:"bad", text:"Pago previo por revisar", why:`Se pagaron ${money(p.monto)} con ${p.method==="tarjeta"?"tarjeta":"transferencia"}${p.ref?" (ref. "+p.ref+")":""} que no quedaron en la caja fuerte: Administración debe registrarlo.`}; }
  if(!t.cf.tq||pend.has(t.cf.tid)||(t.cf.cid&&(pend.has(t.cf.cid)||!t.cf.cq))) return {cls:"pend", text:"Por enviar a la caja fuerte"};
  return {cls:"ok", text:t.pay&&t.pay.status==="pagado"?"Ticket y cobro en la caja fuerte":"Ticket en la caja fuerte"};
}

/* ---------- Lealtad: la cuenta la lleva la caja fuerte (todos los teléfonos y Finanzas) ---------- */
CF.loy=new Map();   // placa normalizada → {n, disp, at} | {err, at}; mientras se consulta: loading
const CF_LOY_TTL=30000;
function cfLoy(plate){
  const k=norm(plate); if(!k) return null;
  const e=CF.loy.get(k);
  if(!e||(!e.loading&&Date.now()-e.at>CF_LOY_TTL)) cfLoyFetch(k);
  return e&&e.n!=null?e:null;
}
function cfLoyFetch(k){
  const cur=CF.loy.get(k)||{}; if(cur.loading||!CF.cli||!CF.cli.token) return;
  CF.loy.set(k,Object.assign({},cur,{loading:true})); const my=CF.sess;
  CF.cli.lealtad(k.slice(0,12)).then(r=>{ if(my===CF.sess) CF.loy.set(k,{n:r.pagados,disp:!!r.disponible,at:Date.now()}); },
    ()=>{ if(my===CF.sess) CF.loy.set(k,Object.assign({},cur,{loading:false,err:true,at:Date.now()})); })
    .finally(()=>{ const a=document.activeElement, where=R.name==="home"||R.name==="control"||(R.name==="rx"&&S.draft&&S.draft.step===3);   // nunca a media firma (paso 6)
      if(my===CF.sess&&CF.on&&where&&!layerOpen&&!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))) render(); });
}
function cfLoyBlock(D){
  if(D.mode!=="plate"||!norm(D.plate)) return `<div class="banner neutral" style="margin-top:var(--sp-4)">${ic("info")}<div>Vehículo sin placas: no acumula lealtad.</div></div>`;
  const e=cfLoy(D.plate), st=CF.loy.get(norm(D.plate))||{};
  if(!e) return `<div class="loycard" style="margin-top:var(--sp-4)"><div class="blockh"><h3>Lealtad</h3></div><p class="help">${st.err?"Sin conexión con la caja fuerte: la tarjeta de lealtad no se puede consultar ahora. El beneficio solo se aplica con conexión.":"Consultando la tarjeta de lealtad en la caja fuerte…"}</p></div>`;
  const n=e.n;
  if(!e.disp) return `<div class="loycard" style="margin-top:var(--sp-4)"><div class="blockh"><h3>Lealtad</h3></div>
    <p style="display:flex;align-items:center;gap:10px;font-size:var(--fs-sm)">${stampsHtml(n)}<span><b>${n} de ${LOY_GOAL}</b> lavados pagados · ${n===LOY_GOAL-1?"el siguiente pagado completa la tarjeta":`faltan ${LOY_GOAL-n} para el beneficio`}</span></p>
    <p class="help">Este ticket contará cuando se registre su pago y llegue a la caja fuerte.</p></div>`;
  if(!D.pkg) return `<div class="loycard ready" style="margin-top:var(--sp-4)"><div class="blockh"><h3>${ic("sparkle","sm")} Beneficio de lealtad disponible</h3></div>
    <p style="display:flex;align-items:center;gap:10px;font-size:var(--fs-sm)">${stampsHtml(LOY_GOAL)}<span><b>${n} lavados pagados</b> desde el último beneficio</span></p><p class="help">Elige un paquete para poder aplicarlo.</p></div>`;
  const on=!!(D.loyalty&&D.loyalty.redeemed), amt=promoAmount(D,"alaga");
  return `<div class="loycard ready" style="margin-top:var(--sp-4)"><div class="blockh"><h3>${ic("sparkle","sm")} Beneficio de lealtad disponible</h3></div>
    <p style="display:flex;align-items:center;gap:10px;font-size:var(--fs-sm)">${stampsHtml(LOY_GOAL)}<span><b>${n} lavados pagados</b> desde el último beneficio</span></p>
    <button class="xrow" style="padding-left:0;padding-right:0" data-a="loyApply" role="checkbox" aria-checked="${on}"><span class="cbox">${ic("check")}</span><span class="nm">Aplicar el beneficio en este ticket<small>Cubre el Paquete ALAGA: ${money(-amt)}</small></span></button>
    <p class="help">Los extras y la diferencia a Súper se cobran. La caja fuerte vuelve a validar el beneficio al recibir el ticket.</p></div>`;
}

/* ---------- Ciclo con el servidor ---------- */
async function cfRefreshCaja(){
  const e=await CF.cli.estado(); CF.sesion=e&&e.caja?e.caja.id:null; CF.turno=e&&e.caja&&e.caja.turno||null; CF.online=true; CF.lastOk=Date.now(); return CF.sesion;
}
/* La Mac asigna el folio oficial. No se modifica el folio de la DEMO hasta que
   la recepción esté confirmada y haya vuelto del libro de la caja fuerte. */
async function cfActualizarFolios(){
  if(!CF.on || CF.stale || CF.unsaved || !CF.cli || !CF.cli.token) return;
  const pend=new Set(CF.cli.pendientes().map(e=>e.id));
  const rej=new Set(CF.cli.rechazados().map(e=>e.evento.id));
  const nuestros=S.vehicles.filter(t=>t.cf && t.cf.tid && !t.cf.folio && !t.cf.legado && !pend.has(t.cf.tid) && !rej.has(t.cf.tid));
  if(!nuestros.length) return;
  const snap=await CF.cli._req("GET","/api/finanzas");
  const byId=new Map((snap.tickets||[]).map(t=>[t.id,t]));
  let changed=false;
  for(const t of nuestros){const official=byId.get(t.cf.tid);
    if(!official)continue;
    if(official.folio){t.cf.folio=official.folio;t.folio=official.folio;changed=true;}
    else{t.cf.legado=true;changed=true;}
  }
  if(changed && !cfSaveRaw()) CF.err="No se pudo guardar el folio oficial en este teléfono; el folio sigue protegido en la Mac.";
}
async function cfTick(){
  if(!CF.on||!CF.cli||!CF.cli.token||CF.busy) return;
  CF.busy=true;
  const my=CF.sess;                                 // respuestas de una sesión anterior se descartan
  try{
    cfReconcile();
    const r=await CF.cli.sincronizar();
    if(my!==CF.sess) return;
    if(r.status===401) return cfLoggedOut("La sesión expiró. Vuelve a entrar.");
    if(r.rechazados){ const last=CF.cli.rechazados().slice(-1)[0]; toast(`La caja fuerte rechazó ${r.rechazados} registro${r.rechazados>1?"s":""}: ${last?last.error:""}`); }
    await cfRefreshCaja();
    await cfActualizarFolios();
  }catch(e){ if(my!==CF.sess) return; if(e&&e.status===401) return cfLoggedOut("La sesión expiró. Vuelve a entrar."); CF.online=false; CF.err=e&&e.message||"Sin conexión"; }
  finally{ CF.busy=false; if(!layerOpen&&["home","more","control"].includes(R.name)) render(); }
}

/* ---------- Persistencia en modo conectado (almacenamiento separado del DEMO) ---------- */
function cfEmptyState(theme){ return {v:2, vehicles:[], history:[], seq:0, hseq:0, npSeq:1, draft:null, theme:theme||"system", loyaltyRule:"alaga", privacyAck:false, conectado:true}; }
function cfLoad(theme){ try{ const r=localStorage.getItem(CF_DATA_KEY); if(r){ const o=JSON.parse(r); if(o&&o.v===2&&Array.isArray(o.vehicles)){ CF.rev=Number(o.cfRev)||0; return o; } } }catch(e){} return cfEmptyState(theme); }
/* Guardado con número de revisión: si otra pestaña guardó después, no se sobrescribe (se pide recargar). */
function cfSaveRaw(){
  if(CF.stale){ toast("Hay cambios hechos en otra pestaña. Recarga la página para continuar."); return false; }
  try{
    const cur=localStorage.getItem(CF_DATA_KEY); if(cur){ let r=0; try{ r=Number(JSON.parse(cur).cfRev)||0; }catch(e){ r=Infinity; } if(r>CF.rev){ CF.unsaved=true; cfMarkStale(); return false; } }
    S.cfRev=CF.rev+1; localStorage.setItem(CF_DATA_KEY,JSON.stringify(S)); CF.rev=S.cfRev; CF.unsaved=false; return true;
  }catch(e){ S.cfRev=CF.rev; CF.unsaved=true; toast("No se pudo guardar en este teléfono (almacenamiento lleno o bloqueado). No se envió nada nuevo."); return false; }
}
function cfMarkStale(){ CF.stale=true; toast("Hay cambios hechos en otra pestaña. Recarga la página para continuar."); if(!layerOpen) render(); }
window.addEventListener("storage",e=>{ if(CF.on&&e.key===CF_DATA_KEY&&e.newValue){ let r=0; try{ r=Number(JSON.parse(e.newValue).cfRev)||0; }catch(x){ r=Infinity; } if(r>CF.rev) cfMarkStale(); } });

/* ---------- Sesión ---------- */
function cfLoggedOut(msg){ CF.sess++; clearInterval(CF.timer); CF.loy.clear(); if(CF.cli){ CF.cli.token=null; CF.cli.usuario=null; } CF.user=null; CF.sesion=null; closeLayer(true); cfRenderLogin(msg); }
function cfRenderLogin(msg, mustChange){
  const pend=CF.cli?CF.cli.pendientes().length:0, okMsg=/cambiada|cerrada/i.test(msg||"");
  $("#app").innerHTML=`<div class="view"><header class="appbar plain"><div class="row"><div class="ttl"><h1>${mustChange?"Cambia tu contraseña":"Entrar a la caja fuerte"}</h1><small>ALAGA SYSTEM · ${esc(CF.url)}</small></div></div></header>
  <main class="content cf-login">
    ${msg?`<div class="banner ${okMsg?"ok":"warn"}" role="alert">${ic(okMsg?"check":"alert")}<div>${esc(msg)}</div></div>`:""}
    <div class="card pad">
    ${mustChange?`<p class="help" style="margin-top:0">Es tu primera entrada o te la restablecieron. Elige una nueva (mínimo 10 caracteres).</p>
      <div class="field"><label for="cf-act">Contraseña actual (temporal)</label><input class="input" id="cf-act" type="password" autocomplete="current-password"></div>
      <div class="field"><label for="cf-new">Nueva contraseña</label><input class="input" id="cf-new" type="password" autocomplete="new-password"></div>
      <button class="btn dark" style="width:100%" data-a="cfChangePass">Guardar contraseña</button>`
    :`<div class="field"><label for="cf-user">Usuario</label><input class="input" id="cf-user" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(cfConf().ultimoUsuario||"")}"></div>
      <div class="field"><label for="cf-pass">Contraseña</label><input class="input" id="cf-pass" type="password" autocomplete="current-password"></div>
      <button class="btn dark" style="width:100%" data-a="cfLogin">Entrar</button>`}
    </div>
    ${pend?`<p class="help">Hay ${pend} registro${pend>1?"s":""} en este teléfono esperando envío. No se pierden.</p>`:""}
    <div class="card pad" style="margin-top:var(--sp-4)"><p class="help" style="margin:0">¿Sin conexión? Lo ya registrado está a salvo. Si no puedes entrar, anota en papel y captura al volver la conexión.</p>
    <button class="btn secondary" style="width:100%;margin-top:var(--sp-3)" data-a="cfDisconnect">Usar modo DEMO (datos ficticios)</button></div>
  </main></div>`;
  const f=$("#cf-user")&&!$("#cf-user").value?$("#cf-user"):$("#cf-pass")||$("#cf-act"); if(f) f.focus();
  document.querySelectorAll("#app .cf-login input").forEach(i=>i.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); const b=document.querySelector("#app .cf-login .btn.dark"); if(b&&!b.disabled) b.click(); } }));
}
const v=id=>{ const el=document.getElementById(id); return el?el.value:""; };
Object.assign(A,{
  async cfLogin(d,el){
    const u=v("cf-user").trim().toLowerCase(), p=v("cf-pass"); if(!u||!p) return cfRenderLogin("Escribe usuario y contraseña.");
    el.disabled=true; el.textContent="Entrando…";
    try{
      const user=await CF.cli.iniciarSesion(u,p); CF.sess++; CF.user=user; cfSetConf(Object.assign(cfConf(),{ultimoUsuario:u}));
      if(user.debeCambiarContrasena) return cfRenderLogin("",true);
      if(user.rol!=="operacion"){ await CF.cli.cerrarSesion(); return cfRenderLogin("ALAGA SYSTEM registra tickets y cobros: entra con una cuenta de Operación."); }
      await cfRefreshCaja().catch(()=>{});
      clearInterval(CF.timer); CF.timer=setInterval(cfTick,15000); cfTick();
      go({name:"home"},true); toast(`Hola, ${user.nombre}`+(CF.sesion?"":" · la caja está cerrada en Finanzas"));
    }catch(e){ cfRenderLogin(e&&e.status?e.message:"No se pudo conectar con la caja fuerte. Revisa la red del local."); }
  },
  async cfChangePass(d,el){ const a=v("cf-act"), n=v("cf-new"); if(!a||!n) return cfRenderLogin("Escribe la contraseña actual y la nueva.",true);
    el.disabled=true; try{ await CF.cli.cambiarContrasena(a,n); cfRenderLogin("Contraseña cambiada. Entra con la nueva."); }catch(e){ cfRenderLogin(e&&e.message||"No se pudo cambiar.",true); } },
  async cfLogout(){ try{ await CF.cli.cerrarSesion(); }catch(e){} cfLoggedOut("Sesión cerrada."); },
  async cfSync(){ await cfTick(); toast(CF.online?"Sincronizado con la caja fuerte":"Sin conexión con la caja fuerte"); },
  cfConnect(){ const url=v("cf-url").trim().replace(/\/+$/,""); if(!/^https?:\/\/[^\s/]+$/i.test(url)) return toast("Escribe la dirección completa, por ejemplo https://caja.local:8787");
    if(!cfSetConf(Object.assign(cfConf(),{modo:"conectado",url}))) return toast("Este navegador no permite guardar la configuración."); location.reload(); },
  async cfDisconnect(){ const ok=await confirmBox("¿Volver al modo DEMO?","Lo pendiente de envío no se borra: se enviará al volver a conectar.","Usar modo DEMO"); if(!ok) return;
    const c=cfConf(); delete c.modo; cfSetConf(c); location.reload(); }
});
/* Cobro por transferencia (solo en modo conectado; misma forma que la tarjeta: referencia obligatoria y sin repetir). */
A.confirmTransfer=function(_,btn){
  if(!CF.on) return;
  const t=S.vehicles.find(v=>v.id===R.id); if(!t) return; const ref=(R.ref||"").trim().toUpperCase();
  const rk=x=>String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,"");   // misma comparación que la caja fuerte
  if(rk(ref).length<4){ R.refErr="Escribe la referencia o folio de la transferencia (mínimo 4 letras o números)."; render(); const f=$("#ref"); if(f) f.focus(); return; }
  if(S.vehicles.some(v=>v.pay&&v.pay.status==="pagado"&&v.pay.method==="transferencia"&&rk(v.pay.ref)===rk(ref))){ R.refErr=`La referencia ${ref} ya está registrada en otra transferencia. Revísala.`; render(); const f=$("#ref"); if(f) f.focus(); return; }
  btn.classList.add("busy"); btn.innerHTML=`<span class="spin"></span>Registrando…`;
  setTimeout(()=>{ t.pay={timing:"ahora",status:"pagado",method:"transferencia",ref,at:nowMs()}; R.refErr=null; save(); go({name:"ticket",id:t.id,view:"paid",deliver:R.deliver},true); toast("Pago por transferencia registrado"); },550);
};
/* Cobrar exige caja abierta (Finanzas); se recuerda a qué apertura pertenece el cobro. */
for(const k of ["confirmCash","confirmCard","confirmTransfer"]){
  const orig=A[k];
  A[k]=async function(d,el){
    if(!CF.on) return orig.call(this,d,el);
    if(CF.stale) return toast("Hay cambios hechos en otra pestaña. Recarga la página antes de cobrar.");
    if(el&&el.dataset.cfBusy) return;
    const tid=R.id, t=S.vehicles.find(x=>x.id===tid); if(!t) return;
    if(!t.cf){ const why=cfOmitReason(t); t.cf=why?{omitido:why}:{tid:CajaFuerteCliente.uuid()}; }
    if(t.cf.omitido){ const ok=await confirmBox("Este cobro no llegará a la caja fuerte",`${t.cf.omitido} Si es efectivo, al cerrar caja aparecerá como sobrante y habrá que explicarlo.`,"Cobrar de todos modos"); if(!ok) return; return orig.call(this,d,el); }
    /* Mientras se consulta la caja, el botón queda ocupado; si al volver ya no se está en el mismo ticket, no se cobra. */
    if(el){ el.dataset.cfBusy="1"; el.disabled=true; }
    try{ await cfRefreshCaja(); }catch(e){ CF.online=false; }
    finally{ if(el){ delete el.dataset.cfBusy; el.disabled=false; } }
    if(R.name!=="ticket"||R.id!==tid) return toast("Cambiaste de ticket antes de confirmar: no se registró ningún cobro. Vuelve a confirmarlo.");
    if(!CF.sesion) return toast(CF.online===false?"Sin conexión con la caja fuerte y sin caja abierta conocida: no se puede cobrar aquí. Anota en papel.":"La caja está cerrada en Finanzas. Ábrela antes de cobrar.");
    /* Caja por turno: solo quien abrió la caja cobra en efectivo (decisión de Gand). */
    if(k==="confirmCash"&&CF.turno&&!CF.turno.esMio){ render(); return toast(`La caja la abrió ${CF.turno.responsable.nombre}: solo esa persona cobra en efectivo. Cobra con tarjeta o transferencia, o pídele que lo cobre.`); }
    t.cf.sesion=CF.sesion;
    return orig.call(this,d,el);
  };
}
/* Ajuste del RZR: sin tope de negocio, pero sí el límite técnico de captura de la caja fuerte ($999,999.99 por ticket). */
{ const orig=A.confirmPrice; A.confirmPrice=function(d,el){ const D=S.draft;
    if(CF.on&&D&&D.pkg&&/^\d+$/.test(String(D.rzr.adj||""))&&Number(D.rzr.adj)+PRICES[D.pkg].rzr>999999){ D.err={adj:"Monto fuera del límite técnico de captura ($999,999.99 por ticket)."}; return render(); }
    return orig.call(this,d,el); }; }
/* Lealtad: aplicar el beneficio exige confirmar con la caja fuerte en ese momento; queda atado a esa placa. */
{ const orig=A.loyApply;
  A.loyApply=async function(d,el){
    if(!CF.on) return orig.call(this,d,el);
    const D=S.draft; if(!D) return;
    if(D.loyalty&&D.loyalty.redeemed) return orig.call(this,d,el);          // quitarlo no requiere consulta
    if(D.mode!=="plate"||!norm(D.plate)) return toast("Vehículo sin placas: no acumula lealtad.");
    if(el&&el.dataset.cfBusy) return; if(el){ el.dataset.cfBusy="1"; el.setAttribute("aria-disabled","true"); }
    let r=null; try{ r=await CF.cli.lealtad(norm(D.plate).slice(0,12)); }catch(e){}
    finally{ if(el){ delete el.dataset.cfBusy; el.removeAttribute("aria-disabled"); } }
    if(S.draft!==D) return;
    if(!r) return toast("Sin conexión con la caja fuerte: no se puede confirmar el beneficio ahora.");
    CF.loy.set(norm(D.plate),{n:r.pagados,disp:!!r.disponible,at:Date.now()});
    if(!r.disponible){ render(); return toast(`Esta placa lleva ${r.pagados} de ${r.meta} lavados pagados en la caja fuerte: aún no tiene el beneficio.`); }
    D.loyPlate=norm(D.plate);   // antes de llamar al original: este redibuja y el control de "cambió la placa" ya debe conocerla
    return orig.call(this,d,el);
  }; }
/* Al generar el ticket con beneficio, la caja fuerte lo confirma otra vez en ese momento (otro teléfono pudo usarlo).
   Si no lo confirma (o no hay conexión), el ticket NO se crea con beneficio: se quita y el cliente vuelve a aceptar y firmar. */
{ const orig=A.generate;
  A.generate=async function(d,btn){
    if(!CF.on) return orig.call(this,d,btn);
    const D=S.draft; if(!D||!(D.loyalty&&D.loyalty.redeemed)) return orig.call(this,d,btn);
    if(btn&&btn.dataset.cfBusy) return;
    const k=norm(D.plate); let r=null, motivo="";
    if(D.mode!=="plate"||!k||k!==D.loyPlate) motivo="La placa cambió después de aplicar el beneficio.";
    else { if(btn){ btn.dataset.cfBusy="1"; btn.disabled=true; } try{ r=await CF.cli.lealtad(k.slice(0,12)); }catch(e){} finally{ if(btn){ delete btn.dataset.cfBusy; btn.disabled=false; } }
      if(S.draft!==D) return;
      motivo=!r?"Sin conexión con la caja fuerte: el beneficio solo se aplica con conexión.":!r.disponible?`La caja fuerte ya no tiene el beneficio para esta placa (${r.pagados} de ${r.meta}); pudo usarse en otro teléfono.`:""; }
    if(!motivo) return orig.call(this,d,btn);
    cfDropLoyalty(D);
    if(r) CF.loy.set(k,{n:r.pagados,disp:!!r.disponible,at:Date.now()});
    save(); render();
    await confirmBox("No se aplicó el beneficio",`${motivo} El ticket no se creó. Revisa el total y pide al cliente que acepte y firme de nuevo.`,"Entendido");
  }; }
function cfDropLoyalty(D){ D.loyalty=null; delete D.loyPlate; D.accept=false; D.sig=null; D.sigSmall=null; }
/* Si la caja fuerte rechazó un ticket con beneficio (p. ej. dos teléfonos a la vez): se quita el beneficio y se reenvía con folio nuevo. */
A.cfQuitarBeneficio=async function(d){
  const t=S.vehicles.find(v=>v.id===d.id); if(!CF.on||!t||!t.loyalty||!t.cf||!t.cf.tid) return;
  if(!CF.cli.rechazados().some(x=>x.evento.id===t.cf.tid)) return toast("Ese ticket no fue rechazado por la caja fuerte.");
  const prev=t.pay&&t.pay.status==="pagado"?Object.assign({},t.pay,{monto:ticketTotal(t)}):null;
  /* Los rechazos quedan resueltos por esta corrección explícita: el ticket se reenvía con folio nuevo. */
  for(const id of [t.cf.tid,t.cf.cid].filter(Boolean)) CF.cli.descartarRechazado(id);
  t.loyalty=null; t.cf={tid:CajaFuerteCliente.uuid()}; t.pay={timing:null,status:"pendiente"};
  if(prev) t.payPrev=(t.payPrev||[]).concat([prev]);   // el pago anterior no se borra: queda en el ticket
  save();
  const tot=ticketTotal(t);
  if(!prev){ await confirmBox("Beneficio quitado",`El ticket se reenvía sin beneficio. Registra el cobro por el total de ${money(tot)}.`,"Entendido"); return go({name:"ticket",id:t.id,view:"method"}); }
  if(prev.method==="efectivo"){
    await confirmBox("Beneficio quitado",`El cliente ya pagó ${money(prev.monto)} en efectivo. Registra el cobro <b>en efectivo</b> por el total de ${money(tot)} y cóbrale solo ${money(tot-prev.monto)} más: en caja quedará el total correcto.`,"Entendido");
    return go({name:"ticket",id:t.id,view:"cash"});
  }
  await confirmBox("Avisa a Administración",`El cliente ya pagó ${money(prev.monto)} con ${prev.method==="tarjeta"?"tarjeta (Clip)":"transferencia"}${prev.ref?` (ref. ${esc(prev.ref)})`:""}, pero ese cobro no quedó en la caja fuerte. El ticket queda pendiente por ${money(tot)}. No lo cobres aquí: Administración debe registrarlo para que cuadren Clip, banco y caja.`,"Entendido");
  go({name:"ticket",id:t.id,view:"choose"});
};
/* Cobro rechazado por su referencia (transferencia repetida o incompleta): se registra de nuevo con la referencia correcta. */
A.cfCorregirCobro=async function(d){
  const t=S.vehicles.find(v=>v.id===d.id); if(!CF.on||!t||!t.cf||!t.cf.cid) return;
  const rj=CF.cli.rechazados().find(x=>x.evento.id===t.cf.cid);
  if(!rj||!/referencia/i.test(rj.error||"")) return toast("Ese cobro no fue rechazado por su referencia.");
  CF.cli.descartarRechazado(t.cf.cid);
  t.payPrev=(t.payPrev||[]).concat([Object.assign({},t.pay,{monto:ticketTotal(t),rechazado:rj.error})]);
  delete t.cf.cid; delete t.cf.cq; delete t.cf.sesion; t.pay={timing:null,status:"pendiente"}; R.ref=""; R.refErr=null;
  save(); toast("Vuelve a registrar el cobro con la referencia correcta.");
  go({name:"ticket",id:t.id,view:t.payPrev[t.payPrev.length-1].method==="transferencia"?"transfer":"method"});
};
const CF_BLOCKED=new Set(["reset","clockPlus","clockReset","loyRule"]);
document.addEventListener("click",e=>{ const el=e.target.closest("[data-a]"); if(el&&CF.on&&CF_BLOCKED.has(el.dataset.a)){ e.stopImmediatePropagation(); e.preventDefault(); toast("No disponible en modo conectado."); } },true);

function cfHomeBanner(){

(function cfBoot(){

  CF.on=true; CF.url=conf.url||cfDefaultUrl();

  CF.cli=new CajaFuerteCliente({url:CF.url, dispositivo:"alaga-system", almacen:localStorage, espacio:"sistema"});
  S=cfLoad(S&&S.theme); S.loyaltyRule="alaga"; applyTheme();   // el beneficio cubre solo el Paquete ALAGA (decisión de Gand)
  const _lb=loyaltyBlock; loyaltyBlock=D=>CF.on?cfLoyBlock(D):_lb(D);

    const e=cfLoy(p); if(!e) return `<span class="badge neutral">Lealtad: ${(CF.loy.get(norm(p))||{}).err?"sin conexión":"consultando…"}</span>`;
    return e.disp?`<span class="badge loy">${ic("sparkle")}Beneficio disponible</span>`:`<span class="badge neutral">${stampsHtml(e.n)}<span class="sr">${e.n} de ${LOY_GOAL} lavados pagados</span><span aria-hidden="true">${e.n}/${LOY_GOAL}</span></span>`; };
  const _tl=ticketLines; ticketLines=t=>{ const L=_tl(t); if(CF.on) L.forEach(l=>{ if(l.k==="promo"){ l.label="Beneficio de lealtad"; l.note=t.cat==="rzr"&&cfAdj(t)?"cubre el Paquete ALAGA y el ajuste":"cubre el Paquete ALAGA"; } }); return L; };
  /* En RZR el beneficio cubre también el ajuste por condición (decisión de Gand); igual que en la caja fuerte. */
  const _pa=promoAmount; promoAmount=(t,rule)=>{ const v=_pa(t,rule); const a=CF.on?cfAdj(t):null; return a?v+a.monto/100:v; };
  save=()=>{ if(CF.cli&&CF.cli.token){ cfReconcile(); setTimeout(cfTick,0); } else cfSaveRaw(); };
  vMore=()=>_vMore().replace(/<div class="eyebrow" style="margin:var\(--sp-6\) 0 8px">Datos de demostración<\/div>\s*<div class="list">[^]*?<\/div>/, cfPanel())

    .replace("Ajustes del prototipo","Conectado a la caja fuerte").replace(/<b style="color:var\(--ink\)">ALAGA SYSTEM · Prototipo DEMO v0.3<\/b>/,`<b style="color:var(--ink)">ALAGA SYSTEM v0.4 · conectado</b>`);

  const _render=render; render=f=>{ if(CF.on&&!(CF.cli&&CF.cli.token)) return cfRenderLogin();

    return _render(f); };

})();

<script>
/* ALAGA SYSTEM v0.4 · Finanzas → «Ventas cobradas»: gráfica interactiva para gestión.
   SOLO LECTURA: usa los mismos datos y criterios que finData() (cobros con estado «pagado», agrupados por fecha de pago)
   y no cambia datos, precios ni reglas. Todo lo que muestra se puede volver a calcular con los registros.
   Qué agrega:
   · Ver por: Cobrado ($), Pagos (número) o Ticket promedio; y Barras, Por forma de pago (apiladas) o Acumulado.
   · Cuadrícula con escala, línea de promedio diario y comparación contra el periodo anterior de igual duración.
   · Tocar o deslizar el dedo sobre las barras: muestra el día con cobrado, pagos, ticket promedio, % contra el promedio,
     desglose por forma de pago, paquetes y la lista de cobros (cada uno abre su ticket).
   · Sin selección: resumen del periodo (mejor día, promedio diario, días con cobro, formas de pago).
   Compatibilidad con las pruebas: un <g> por día dentro del SVG y etiquetas text.val que suman el total (vista por defecto). */
(function () {
  "use strict";
  if (typeof vFinance !== "function" || typeof barsSvg !== "function" || typeof finData !== "function") return;
  var DAY = 86400000;
  var METH = [["efectivo", "Efectivo", "#E2C27E"], ["tarjeta", "Tarjeta · Clip", "#7FA8E0"], ["transferencia", "Transferencia", "#7CCFA0"]];
  var METRICS = [["amt", "Cobrado"], ["n", "Pagos"], ["avg", "Ticket prom."]];
  var VIEWS = [["bars", "Barras"], ["method", "Forma de pago"], ["cum", "Acumulado"]];
  var W = 340, H = 214, PL = 44, PR = 8, PT = 24, PB = 30;
  var cache = null;

  function keyTime(k) { var p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2], 12).getTime(); }
  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }
  function compact(v, metric) {
    if (metric === "n") return String(Math.round(v));
    if (v >= 1000) { var s = (v / 1000).toFixed(v >= 10000 ? 0 : 1).replace(/\.0$/, ""); return "$" + s + " mil"; }
    return money(v);
  }
  function fmt(v, metric) { return metric === "n" ? (Math.round(v) + (Math.round(v) === 1 ? " pago" : " pagos")) : money(v); }
  function niceMax(m) {
    if (m <= 0) return 1;
    var e = Math.pow(10, Math.floor(Math.log10(m))), f = m / e;
    var n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return n * e;
  }
  function methodOf(v) { var m = v.pay && v.pay.method; return m === "tarjeta" || m === "transferencia" ? m : m === "efectivo" ? "efectivo" : "otro"; }

  /* Datos del periodo, con el mismo criterio que finData() */
  function build(byDay) {

  /* ---------- Gráfica (reemplaza barsSvg; misma firma) ---------- */
