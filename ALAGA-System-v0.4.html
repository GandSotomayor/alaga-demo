<!doctype html>
<html lang="es">
<head><meta name="robots" content="noindex"><script>window.ALAGA_PWA=1</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALAGA SYSTEM v0.4</title>
<style>
/* =========================================================
   ALAGA SYSTEM · Prototipo DEMO v0.3 · dirección "ALAGA Command"
   Tokens provisionales: muestra fotográfica de la lona + paleta
   "Luxury/Premium" de UI/UX Pro Max. No son colores oficiales.
   ========================================================= */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-xs:13px; --fs-sm:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:22px; --fs-2xl:28px; --fs-3xl:36px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:999px;
  --t-fast:140ms; --t-base:200ms; --t-slow:280ms; --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.4,0,1,1);
  --tap:48px;
  /* Marca (provisional) */
  --carbon:#171412; --carbon-2:#221e1a; --carbon-3:#2e2924;
  --gold:#c9a45c;        /* acento sobre superficies oscuras / relleno de botón */
  --gold-hi:#e2c48a;     /* texto dorado sobre carbón */
  --gold-ink:#7a520a;    /* dorado para texto sobre claro (contraste ≥ 4.5:1) */
  --on-gold:#1a1408;
  --on-carbon:#f6f2ea; --on-carbon-2:#cdc5b8;
  --sig-bg:#ffffff; --sig-ink:#1c1917; --sig-muted:#655e56; --sig-line:#8c857b;
}
:root{
  
  --page:#e7e3dc; --bg:#f6f4f0; --surface:#ffffff; --surface-2:#f0ede7; --surface-3:#e6e2da;
  --ink:#1c1917; --ink-2:#433e39; --ink-3:#655e56; --line:#e1dcd3; --line-strong:#8c857b;
  --focus:#2f6fb3;
  --ok:#1f6f46; --ok-bg:#e7f4ec; --warn:#8a4b00; --warn-bg:#fdf0dc; --err:#b42318; --err-bg:#fdecea; --info:#245a94; --info-bg:#e8f0fa;
  --st-recibido:#2f6fb3; --st-proceso:#b7791f; --st-validacion:#7a52b3; --st-listo:#2f8a5b; --st-entregado:#8c857b;
  --shadow-1:0 1px 2px rgba(28,25,23,.06),0 1px 1px rgba(28,25,23,.04);
  --shadow-2:0 6px 18px rgba(28,25,23,.10),0 2px 4px rgba(28,25,23,.06);
  --shadow-3:0 18px 40px rgba(28,25,23,.20);
  --scrim:rgba(18,15,12,.48);
  --sel:var(--carbon); --btn-dark:var(--carbon); --chip-on-bg:var(--carbon); --chip-on-fg:var(--on-carbon);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme: dark;
  --page:#000000; --bg:#0f0d0c; --surface:#1c1917; --surface-2:#25211d; --surface-3:#302b26;
  --ink:#f5f1ea; --ink-2:#d8d1c6; --ink-3:#aca397; --line:#36312b; --line-strong:#776f65;
  --focus:#7fb0ea;
  --ok:#6fcf97; --ok-bg:#15291e; --warn:#f0b35a; --warn-bg:#2d2112; --err:#ff8a7a; --err-bg:#331a17; --info:#8ab8ee; --info-bg:#142335;
  --st-recibido:#4a86cc; --st-proceso:#b8862a; --st-validacion:#8f6cc9; --st-listo:#3a9a6a; --st-entregado:#776f65;
  --gold-ink:#e2c48a;
  --shadow-1:0 1px 2px rgba(0,0,0,.5); --shadow-2:0 8px 24px rgba(0,0,0,.55); --shadow-3:0 18px 44px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.62);
  --sel:var(--gold); --btn-dark:var(--surface-3); --chip-on-bg:var(--gold); --chip-on-fg:var(--on-gold);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#000000; --bg:#0f0d0c; --surface:#1c1917; --surface-2:#25211d; --surface-3:#302b26;
  --ink:#f5f1ea; --ink-2:#d8d1c6; --ink-3:#aca397; --line:#36312b; --line-strong:#776f65;
  --focus:#7fb0ea;
  --ok:#6fcf97; --ok-bg:#15291e; --warn:#f0b35a; --warn-bg:#2d2112; --err:#ff8a7a; --err-bg:#331a17; --info:#8ab8ee; --info-bg:#142335;
  --st-recibido:#4a86cc; --st-proceso:#b8862a; --st-validacion:#8f6cc9; --st-listo:#3a9a6a; --st-entregado:#776f65;
  --gold-ink:#e2c48a;
  --shadow-1:0 1px 2px rgba(0,0,0,.5); --shadow-2:0 8px 24px rgba(0,0,0,.55); --shadow-3:0 18px 44px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.62);
  --sel:var(--gold); --btn-dark:var(--surface-3); --chip-on-bg:var(--gold); --chip-on-fg:var(--on-gold);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--page);scroll-padding-top:110px;scroll-padding-bottom:170px}
body{margin:0;font:var(--fs-md)/1.5 var(--font);color:var(--ink);background:var(--page);min-height:100dvh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.tnum{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}
svg.i.lg{width:28px;height:28px}

/* ---------- App shell ---------- */
#app{max-width:520px;min-height:100dvh;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
.view{flex:1;display:flex;flex-direction:column;animation:enter var(--t-slow) var(--ease-out)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.content{flex:1;padding:var(--sp-4);padding-bottom:var(--sp-6)}
.content.tight{padding-top:var(--sp-3)}

/* Encabezado de marca (oscuro con acento dorado) */
.brandbar{background:var(--carbon);color:var(--on-carbon);padding:14px var(--sp-4) var(--sp-5);position:relative;overflow:hidden;border-bottom:1px solid rgba(201,164,92,.45)}
.brandbar::after{content:"";position:absolute;right:-30px;top:-20px;width:190px;height:190px;background:
  linear-gradient(135deg,transparent 47%,rgba(201,164,92,.20) 47.5%,rgba(201,164,92,.20) 49%,transparent 49.5%),
  linear-gradient(45deg,transparent 47%,rgba(201,164,92,.12) 47.5%,rgba(201,164,92,.12) 49%,transparent 49.5%);pointer-events:none}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);position:relative;z-index:1}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark b{font-size:22px;font-weight:800;letter-spacing:.22em;color:var(--gold-hi)}
.wordmark small{font-size:11.5px;font-weight:700;letter-spacing:.42em;color:var(--on-carbon-2);margin-top:5px}
.provisional{font-size:12px;font-weight:600;color:var(--on-carbon-2);border:1px dashed rgba(205,197,184,.55);border-radius:var(--r-pill);padding:1px 8px;white-space:nowrap}
.demo-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--on-gold);background:var(--gold);border-radius:var(--r-pill);padding:3px 10px}
.greet{position:relative;z-index:1;margin-top:var(--sp-5)}
.greet h1{font-size:var(--fs-2xl);font-weight:750;color:var(--on-carbon)}
.greet p{color:var(--on-carbon-2);font-size:var(--fs-sm);margin-top:4px}
.hero{position:relative;z-index:1;margin-top:var(--sp-5);display:grid;grid-template-columns:1fr auto;gap:var(--sp-3);align-items:end}
.hero .lbl{font-size:var(--fs-xs);font-weight:600;color:var(--on-carbon-2);letter-spacing:.02em}
.hero .val{font-size:var(--fs-3xl);font-weight:800;color:var(--gold-hi);letter-spacing:-.02em;line-height:1.1}
.hero .side{text-align:right}
.hero .side .val2{font-size:var(--fs-lg);font-weight:750;color:var(--on-carbon)}

/* Barra de app (pantallas internas) */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--carbon);color:var(--on-carbon);padding:4px var(--sp-2) 0;border-bottom:1px solid rgba(201,164,92,.35)}
.appbar .row{display:flex;align-items:center;gap:var(--sp-1);min-height:52px}
.appbar .ttl{flex:1;min-width:0;text-align:center}
.appbar .ttl h1{font-size:var(--fs-md);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl small{display:block;font-size:12.5px;color:var(--on-carbon-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:var(--tap);height:var(--tap);display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:var(--r-md);color:inherit;flex:none}
.iconbtn:active{background:rgba(255,255,255,.08)}
.progress{display:flex;gap:4px;padding:6px var(--sp-2) 10px}
.progress i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.16);transition:background var(--t-base)}
.progress i.on{background:var(--gold)}
.appbar.plain .ttl{text-align:left;padding-left:var(--sp-2)}
.appbar.plain .ttl h1{font-size:var(--fs-xl)}

/* Barra de acción inferior */
.dock{position:sticky;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-top:1px solid var(--line);padding:var(--sp-3) var(--sp-4) calc(env(safe-area-inset-bottom) + var(--sp-3))}
.dock .sumline{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-sm);color:var(--ink-2);margin-bottom:2px}
.dock .sumline.total{font-size:var(--fs-md);color:var(--ink);font-weight:700;margin:4px 0 var(--sp-3)}
.dock .sumline.total b{font-size:var(--fs-xl)}
.dock .row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}

/* Barra de pestañas */
.tabbar{position:sticky;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:var(--tap);font-size:12px;font-weight:600;color:var(--ink-3);padding:4px 0;border-radius:var(--r-md)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke:var(--gold-ink)}
.tab.new{color:var(--ink)}
.tab.new .fab{width:54px;height:54px;border-radius:18px;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 6px 16px rgba(122,82,10,.35);border:3px solid var(--surface)}
.tab.new .fab svg{stroke:var(--on-gold);width:26px;height:26px;stroke-width:2.2}

/* ---------- Componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:var(--tap);padding:0 var(--sp-5);border-radius:var(--r-md);border:1.5px solid transparent;font-weight:700;font-size:var(--fs-md);text-align:center;transition:transform var(--t-fast) var(--ease-out),background var(--t-fast),opacity var(--t-fast);width:100%}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary{background:var(--gold);color:var(--on-gold);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 2px 6px rgba(122,82,10,.25)}
.btn.dark{background:var(--btn-dark);color:var(--on-carbon)}
.btn.secondary{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);min-height:44px;padding:0 var(--sp-3);width:auto}
.btn.danger{background:var(--surface);border-color:var(--err);color:var(--err)}
.btn.lg{min-height:56px;font-size:var(--fs-lg);border-radius:var(--r-lg)}
.btn:disabled{background:var(--surface-3);color:var(--ink-3);border-color:transparent;box-shadow:none;cursor:not-allowed}
.btn.busy{pointer-events:none;opacity:.85}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.linkbtn{border:0;background:none;color:var(--gold-ink);font-weight:700;font-size:var(--fs-sm);min-height:44px;padding:0 var(--sp-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.card.pad{padding:var(--sp-4)}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:var(--sp-6) 0 var(--sp-3)}
.section-h h2{font-size:var(--fs-lg);font-weight:750}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.field{margin-top:var(--sp-4)}
.field:first-child{margin-top:0}
.field label,.flabel{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:650;color:var(--ink-2);margin-bottom:6px}
.req{color:var(--err);font-weight:700}
.opt{font-weight:500;color:var(--ink-3)}
.input{width:100%;min-height:52px;border:1.5px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);padding:0 var(--sp-4);font-size:var(--fs-md);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
textarea.input{padding:var(--sp-3) var(--sp-4);min-height:88px;resize:vertical;line-height:1.45}
.input::placeholder{color:var(--ink-3);opacity:1}
.input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.input.plate{font-size:26px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;min-height:62px}
.input[aria-invalid="true"]{border-color:var(--err)}
.input.ro{background:var(--surface-2);border-style:dashed;color:var(--ink)}
.help{font-size:var(--fs-xs);color:var(--ink-3);margin-top:6px;line-height:1.4}
.err{display:flex;gap:6px;align-items:flex-start;font-size:var(--fs-xs);font-weight:600;color:var(--err);margin-top:6px}
.err svg{width:16px;height:16px;margin-top:1px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-3);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:650;font-size:var(--fs-sm);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}

.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.chip{min-height:44px;padding:0 var(--sp-3);border-radius:var(--r-pill);border:1.5px solid var(--line-strong);background:var(--surface);font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:var(--chip-on-bg)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.85}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:var(--r-pill);padding:3px 9px;white-space:nowrap;line-height:1.35}
.badge svg{width:14px;height:14px;stroke-width:2.2}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.err{background:var(--err-bg);color:var(--err)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.neutral{background:var(--surface-3);color:var(--ink-2)}
.badge.lock{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.badge.pend{background:var(--warn-bg);color:var(--warn);border:1px dashed color-mix(in srgb,var(--warn) 55%,transparent)}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.stage i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}

.banner{display:flex;gap:var(--sp-3);align-items:flex-start;border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-sm);line-height:1.45}
.banner svg{margin-top:1px}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.neutral{background:var(--surface-2);color:var(--ink-2)}
.banner b{font-weight:750}

/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:calc(-1 * var(--sp-4))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4);box-shadow:var(--shadow-2);position:relative;text-align:left}
.kpi .k{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:650;color:var(--ink-3)}
.kpi .k i{width:9px;height:9px;border-radius:3px;background:var(--c,var(--gold));flex:none}
.kpi .v{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
.kpi-wrap{padding:0 var(--sp-4);position:relative;z-index:2}

.flow{margin-top:var(--sp-4);padding:var(--sp-4)}
.stackbar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-3);margin:var(--sp-3) 0}
.stackbar span{background:var(--c);min-width:6px;transition:flex-grow var(--t-slow) var(--ease-out)}
.stackbar span:first-child{border-radius:4px 0 0 4px}.stackbar span:last-child{border-radius:0 4px 4px 0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px var(--sp-3)}
.legend div{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.legend b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}

.cta{margin-top:var(--sp-4);display:flex;align-items:center;gap:var(--sp-4);width:100%;text-align:left;border:0;border-radius:var(--r-xl);padding:var(--sp-4) var(--sp-5);background:var(--carbon);color:var(--on-carbon);position:relative;overflow:hidden;box-shadow:var(--shadow-2)}
.cta::before{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(201,164,92,.5);pointer-events:none}
.cta .plus{width:52px;height:52px;border-radius:16px;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;justify-content:center;flex:none}
.cta .plus svg{stroke:var(--on-gold);stroke-width:2.3}
.cta b{display:block;font-size:var(--fs-lg)}
.cta small{color:var(--on-carbon-2);font-size:var(--fs-sm)}
.cta .chev{margin-left:auto;color:var(--gold-hi)}
.cta:active{transform:scale(.99)}

/* Lista de vehículos */
.vlist{display:flex;flex-direction:column;gap:var(--sp-3)}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-4);width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.vrow:active{background:var(--surface-2)}
.vico{width:48px;height:48px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;position:relative}
.vico svg{width:38px;height:22px}
.vico::after{content:"";position:absolute;left:6px;right:6px;bottom:4px;height:3px;border-radius:2px;background:var(--c)}
.vmain{min-width:0}
.vmain .pl,.vmain .sub{display:block}
.vmain .pl{font-weight:800;letter-spacing:.06em;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmain .sub{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmain .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px;align-items:center}
.vside{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.vside .amt{font-weight:800;font-variant-numeric:tabular-nums}
.vside .tm{font-size:12px;color:var(--ink-3)}

/* Control */
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden}
.ccard .top{display:grid;grid-template-columns:auto 1fr auto;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-4)}
.ccard .acts{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-3)}
.ccard .acts .btn{min-height:46px;font-size:var(--fs-sm)}
.ccard .acts .btn.secondary{width:auto;padding:0 var(--sp-4)}
.hscroll{display:flex;gap:var(--sp-2);overflow-x:auto;padding:var(--sp-3) var(--sp-4);margin:0 calc(-1*var(--sp-4));scrollbar-width:none;scroll-padding:var(--sp-4)}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}

/* Recepción */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
.cat{min-height:92px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:var(--fs-sm);font-weight:650;color:var(--ink-2);text-align:center;line-height:1.15;padding:var(--sp-2);transition:border-color var(--t-fast),background var(--t-fast)}
.cat svg{width:50px;height:26px;stroke-width:1.9}
.cat[aria-pressed="true"]{border:2px solid var(--sel);background:var(--surface-2);color:var(--ink)}
.cat[aria-pressed="true"] svg{stroke:var(--gold-ink)}

.pkg{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:var(--sp-4);position:relative;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.pkg + .pkg{margin-top:var(--sp-3)}
.pkg[aria-pressed="true"]{border:2px solid var(--sel);box-shadow:var(--shadow-2)}
.pkg .h{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-3)}
.pkg .name{font-size:var(--fs-lg);font-weight:800}
.pkg .name.super{color:var(--gold-ink)}
.pkg .price{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.pkg .price small{font-size:var(--fs-xs);font-weight:650;color:var(--ink-3);margin-right:4px}
.pkg .sel{position:absolute;top:-10px;right:14px}
.comp{list-style:none;padding:0;margin:var(--sp-3) 0 0;display:grid;gap:6px}
.comp li{display:flex;align-items:flex-start;gap:8px;font-size:var(--fs-sm);color:var(--ink-2)}
.comp li svg{width:18px;height:18px;margin-top:1px;stroke:var(--ok)}
.comp li.na{color:var(--ink-3)} .comp li.na svg{stroke:var(--ink-3)}
.comp li.cl svg{stroke:var(--warn)}
.comp li .tag{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.comp li.cl .tag{color:var(--warn)}
.togglecomp{margin-top:var(--sp-2);border:0;background:none;color:var(--gold-ink);font-weight:700;font-size:var(--fs-sm);min-height:44px;padding:0;display:inline-flex;align-items:center;gap:4px}

.xrow{display:flex;align-items:center;gap:var(--sp-3);min-height:60px;width:100%;padding:var(--sp-2) var(--sp-4);border:0;background:transparent;text-align:left;border-top:1px solid var(--line)}
.xrow:first-child{border-top:0}
.cbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-strong);flex:none;display:flex;align-items:center;justify-content:center;transition:background var(--t-fast),border-color var(--t-fast)}
.cbox svg{width:16px;height:16px;stroke:var(--on-gold);stroke-width:3;opacity:0;transform:scale(.6);transition:opacity var(--t-fast),transform var(--t-fast) var(--ease-out)}
[aria-checked="true"] .cbox,[aria-pressed="true"] .cbox{background:var(--gold);border-color:var(--gold)}
[aria-checked="true"] .cbox svg,[aria-pressed="true"] .cbox svg{opacity:1;transform:none}
.xrow .nm{flex:1;min-width:0;font-weight:600}
.xrow .nm small{display:block;font-weight:500;color:var(--ink-3);font-size:var(--fs-xs)}
.xrow .pr{font-weight:800;font-variant-numeric:tabular-nums}

.radio{display:flex;gap:var(--sp-3);align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4);min-height:56px}
.radio + .radio{margin-top:var(--sp-2)}
.radio .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);flex:none;margin-top:1px;transition:border-width var(--t-fast)}
.radio[aria-checked="true"]{border:2px solid var(--sel)}
.radio[aria-checked="true"] .dot{border:7px solid var(--gold)}
.radio b{display:block;font-size:var(--fs-md)}
.radio small{display:block;color:var(--ink-3);font-size:var(--fs-xs);margin-top:2px}
.radio[aria-disabled="true"]{background:var(--surface-2);border-style:dashed;color:var(--ink-3);cursor:not-allowed}

.checkrow{display:flex;gap:var(--sp-3);align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:var(--sp-2) 0;min-height:48px;font-size:var(--fs-sm);color:var(--ink)}

/* Cámara simulada */
.cam{background:#0b0a09;border-radius:var(--r-xl);overflow:hidden;position:relative;aspect-ratio:4/3.1;display:flex;align-items:center;justify-content:center;color:#cfc8bd}
.cam .frame{position:absolute;inset:12% 9%;border:2px dashed rgba(226,196,138,.75);border-radius:18px}
.cam .sil{width:62%;opacity:.55}
.cam .sil svg{width:100%;height:auto;stroke:#e2c48a;stroke-width:1.2}
.cam .hint{position:absolute;left:12px;right:12px;bottom:10px;font-size:12.5px;text-align:center;color:#e8e2d7}
.cam .tagcam{position:absolute;top:10px;left:12px;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:#0b0a09;background:#e2c48a;border-radius:6px;padding:1px 7px}
.cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam .flash.go{animation:flash 260ms ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.shot{display:flex;align-items:center;justify-content:center;gap:var(--sp-5);margin-top:var(--sp-4)}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.shutter span{width:56px;height:56px;border-radius:50%;background:var(--gold);transition:transform var(--t-fast)}
.shutter:active span{transform:scale(.9)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:var(--sp-2);margin-top:var(--sp-4)}
.thumb{aspect-ratio:1;border-radius:var(--r-md);border:1.5px dashed var(--line-strong);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--ink-3);padding:4px;text-align:center;line-height:1.15;position:relative;overflow:hidden}
.thumb.done{border:0;background:linear-gradient(160deg,#2e2924,#0f0d0c);color:#e2c48a}
.thumb.done svg.ok{position:absolute;top:4px;right:4px;width:16px;height:16px;stroke:#0f0d0c;background:#e2c48a;border-radius:50%;padding:2px;stroke-width:3}
.thumb.now{border:2px solid var(--gold);color:var(--ink)}

/* Diagrama de daños */
.dmgwrap{display:grid;grid-template-columns:1fr;gap:var(--sp-4);align-items:start}
.dmgwrap .cartop{margin:0 auto}
@media (min-width:600px){.dmgwrap{grid-template-columns:170px 1fr}.dmgwrap .cartop{margin:0}}
.cartop{position:relative;width:150px;height:240px}
.cartop svg.out{position:absolute;inset:0;width:100%;height:100%;stroke:var(--ink-3);fill:var(--surface-2);stroke-width:2}
.zone{position:absolute;border:1.5px dashed var(--line-strong);background:color-mix(in srgb,var(--surface) 60%,transparent);border-radius:10px;font-size:12px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:2px}
.zone.has{border:2px solid var(--err);background:var(--err-bg);color:var(--err)}
.zone .n{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--err);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.dlist{display:flex;flex-direction:column;gap:var(--sp-2)}
.ditem{display:flex;gap:var(--sp-2);align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);background:var(--surface)}
.ditem .t{flex:1;min-width:0;font-size:var(--fs-sm)}
.ditem .t b{display:block}
.ditem .t small{color:var(--ink-3);font-size:12.5px}

/* Firma */
.sigbox{position:relative;border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);height:170px;overflow:hidden}
.sigbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;color:var(--ink)}
.sigbox .base{position:absolute;left:18px;right:18px;bottom:40px;border-top:1px solid var(--line-strong);pointer-events:none}
.sigbox .ph{position:absolute;left:18px;bottom:14px;font-size:var(--fs-xs);color:var(--ink-3);pointer-events:none}
.sigbox .clr{position:absolute;top:6px;right:6px}
.sigbox.locked{background:var(--surface-2)}

.sum{display:flex;flex-direction:column}
.sum .r{display:flex;justify-content:space-between;gap:var(--sp-3);padding:10px 0;border-top:1px solid var(--line);font-size:var(--fs-sm)}
.sum .r:first-child{border-top:0}
.sum .r .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum .r.tot{font-size:var(--fs-lg);font-weight:800}
.sum .r.tot .a{font-size:var(--fs-xl);font-weight:800}
.blockh{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.blockh h3{font-size:var(--fs-md);font-weight:750}

/* Ticket / éxito */
.success{text-align:center;padding:var(--sp-6) var(--sp-4) var(--sp-4)}
.okmark{width:76px;height:76px;border-radius:50%;margin:0 auto;background:var(--carbon);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 30%,transparent)}
.okmark svg{width:38px;height:38px;stroke:var(--gold-hi);stroke-width:2.6;stroke-dasharray:40;stroke-dashoffset:40;animation:draw 420ms 120ms var(--ease-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.folio{font-size:var(--fs-xs);font-weight:800;letter-spacing:.14em;color:var(--ink-3);margin-top:var(--sp-4)}
.bigtotal{font-size:44px;font-weight:850;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.choice{display:flex;align-items:center;gap:var(--sp-4);width:100%;text-align:left;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:var(--r-lg);padding:var(--sp-4);min-height:76px}
.choice + .choice{margin-top:var(--sp-3)}
.choice .ci{width:46px;height:46px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--gold-ink);flex:none}
.choice b{display:block;font-size:var(--fs-md)}
.choice small{display:block;color:var(--ink-3);font-size:var(--fs-xs)}
.choice .chev{margin-left:auto;color:var(--ink-3)}
.choice:active{background:var(--surface-2)}
.sim{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:var(--r-pill);padding:3px 10px}
.change{display:flex;justify-content:space-between;align-items:baseline;margin-top:var(--sp-4);padding:var(--sp-4);border-radius:var(--r-lg);background:var(--surface-2)}
.change b{font-size:var(--fs-2xl);font-weight:850}

/* Hoja inferior / diálogo / aviso */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;opacity:0;transition:opacity var(--t-base)}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow-3);max-height:92dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform var(--t-slow) var(--ease-out)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--surface-3);margin:8px auto 0}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);border-bottom:1px solid var(--line)}
.sheet .sh h2{font-size:var(--fs-lg)}
.sheet .sb{overflow-y:auto;padding:var(--sp-4);-webkit-overflow-scrolling:touch}
.sheet .sf{padding:var(--sp-3) var(--sp-4) calc(env(safe-area-inset-bottom) + var(--sp-3));border-top:1px solid var(--line)}
.dialog{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;width:min(400px,calc(100vw - 32px));background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-3);padding:var(--sp-5);transition:transform var(--t-base) var(--ease-out),opacity var(--t-base)}
.dialog.on{opacity:1;transform:translate(-50%,-50%)}
.dialog h2{font-size:var(--fs-lg);margin-bottom:var(--sp-2)}
.dialog p{color:var(--ink-2);font-size:var(--fs-sm)}
.dialog .acts{display:grid;gap:var(--sp-2);margin-top:var(--sp-5)}
.scrim.dlg{z-index:70}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,20px);opacity:0;width:min(480px,calc(100vw - 32px));background:var(--carbon);color:var(--on-carbon);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4);display:flex;align-items:center;gap:var(--sp-3);box-shadow:var(--shadow-3);transition:transform var(--t-base) var(--ease-out),opacity var(--t-base);font-size:var(--fs-sm)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{stroke:var(--gold-hi)}
.toast .tx{flex:1}
.toast button{border:0;background:transparent;color:var(--gold-hi);font-weight:800;min-height:44px;padding:0 var(--sp-3)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;gap:var(--sp-3);min-height:56px;padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:var(--fs-md)}
.li:first-child{border-top:0}
.li .tx{flex:1;min-width:0}
.li .tx small{display:block;color:var(--ink-3);font-size:var(--fs-xs)}
.li svg.chev{color:var(--ink-3)}
.empty{text-align:center;padding:var(--sp-8) var(--sp-4);color:var(--ink-3)}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-3);color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:var(--fs-md);margin-bottom:4px}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:14px 1fr auto;gap:var(--sp-3);align-items:center;padding:6px 0;font-size:var(--fs-sm)}
.timeline li i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.timeline li span:last-child{color:var(--ink-3);font-size:var(--fs-xs)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pgrid div{aspect-ratio:1;border-radius:10px;background:linear-gradient(160deg,#2e2924,#0f0d0c);color:#e2c48a;font-size:10.5px;font-weight:700;display:flex;align-items:flex-end;padding:5px;line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px var(--sp-4);font-size:var(--fs-sm)}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;text-align:right;font-weight:600}
.cat-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line)}
.cat-row:first-of-type{border-top:0}
.cat-row .ic{width:42px;color:var(--ink-2)} .cat-row .ic svg{width:40px;height:22px}
.cat-row .p{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;min-width:64px}
.cat-row .p small{display:block;font-size:11px;font-weight:650;color:var(--ink-3)}
.thead{display:grid;grid-template-columns:auto 1fr auto auto;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4);background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.thead span:nth-child(3),.thead span:nth-child(4){min-width:64px;text-align:right}
.switch{width:52px;height:32px;border-radius:16px;background:var(--surface-3);border:0;position:relative;flex:none;transition:background var(--t-fast)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:var(--shadow-1);transition:transform var(--t-base) var(--ease-out)}
.switch[aria-checked="true"]{background:var(--gold)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* ---------- v0.2: fidelización, evidencia y avisos ---------- */
.stamps{display:inline-flex;gap:3px;vertical-align:-1px}
.stamps i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--gold-ink)}
.stamps i.on{background:var(--gold);border-color:var(--gold)}
.badge.loy{background:var(--gold);color:var(--on-gold)}
.loycard{border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:var(--sp-4)}
.loycard.ready{border:2px solid var(--gold)}
.loycard p+p{margin-top:6px}
.sigimg{display:block;width:100%;max-width:360px;height:auto;background:var(--sig-bg);border:1px solid var(--line);border-radius:var(--r-md)}
.pgrid div{flex-direction:column;align-items:flex-start;justify-content:flex-end}
.pgrid div small{display:block;font-weight:600;opacity:.85;margin-top:2px}
.pvlist{margin:var(--sp-3) 0 0;padding-left:18px;color:var(--ink-2);font-size:var(--fs-sm)}
.pvlist li{margin:4px 0}
.toast{pointer-events:none}
.toast button{pointer-events:auto}
.toast.top{top:calc(env(safe-area-inset-top,0px) + 72px);bottom:auto;transform:translate(-50%,-16px)}
.toast.top.on{transform:translate(-50%,0)}
.sigbox{background:var(--sig-bg);scroll-margin-bottom:120px}
.sigbox .ph{color:var(--sig-muted)}
.sigbox .base{border-top-color:var(--sig-line)}
.sigbox .clr{color:var(--sig-ink)}
.sigbox.locked{background:var(--surface-2)}
.sigbox.locked .ph{color:var(--ink-3)}

/* ---------- v0.2.1: saldo pendiente, reloj visible y teclado ---------- */
.prevline{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid rgba(205,197,184,.25);font-size:var(--fs-sm);color:var(--on-carbon-2)}
.prevline small{font-size:12px}
.prevline b{color:var(--on-carbon)}
.clockstrip{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:var(--sp-4);padding:8px 8px 8px 12px;border-radius:var(--r-md);background:var(--gold);color:var(--on-gold);font-size:var(--fs-sm)}
.clockstrip svg{stroke:var(--on-gold)}
.clockstrip span{flex:1;min-width:0}
.clockback{min-height:44px;border:0;border-radius:10px;background:var(--carbon);color:var(--on-carbon);font-weight:700;padding:0 14px}
body.kb-open .dock{transform:translateY(calc(-1 * var(--kb,0px)))}
body.kb-open .appbar{transform:translateY(var(--vvtop,0px))}

/* =====================================================================
   v0.3 · ALAGA Command — capa visual (estructura Operations Pro + acabado Executive)
   Niveles: L0 página · L1 superficie · L2 elevado (indicadores, elegido) · L3 capas (hojas, diálogos)
   ===================================================================== */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface-2:#f3f0ea; --surface-3:#e8e4dc; --line:#e3ded5;
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --shadow-1:0 1px 0 rgba(28,25,23,.03),0 1px 2px rgba(28,25,23,.06);
  --shadow-2:0 1px 2px rgba(28,25,23,.05),0 12px 28px -14px rgba(28,25,23,.22);
  --shadow-3:0 28px 56px -18px rgba(28,25,23,.38);
  --pk-alaga:#2f6fb3; --pk-super:#b7791f; --bar:#7a520a; --bar-0:#d8d2c7;
  --violet-bg:#f1ebfa; --violet:#5b3c8f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0c0b; --surface:#191614; --surface-2:#221e1b; --surface-3:#2d2824; --line:#332e29;
  --shadow-1:0 0 0 1px rgba(255,255,255,.02); --shadow-2:0 0 0 1px rgba(255,255,255,.03),0 14px 30px -16px rgba(0,0,0,.8); --shadow-3:0 28px 60px -18px rgba(0,0,0,.9);

/* =====================================================================
   ALAGA · Tema Lux (cristal + oro líquido). Capa visual: no cambia lógica, textos ni botones de las pruebas.
   Se inyecta al final del <head> de ALAGA SYSTEM v0.4 y Finanzas v0.4 al armarlas (tema/aplicar.js).
   Equivalencias exactas de las clases pedidas (sin Tailwind: la caja fuerte bloquea recursos externos):
     bg-zinc-950 #09090b · bg-zinc-900/40 rgba(24,24,27,.4) · backdrop-blur-xl 24px · border-zinc-800/60 rgba(39,39,42,.6)
     oro líquido: linear-gradient(to right, #DFBA73, #F5E3B5, #C29B53) · brillo 0 0 25px rgba(223,186,115,.15)
     curva Apple: cubic-bezier(0.16, 1, 0.3, 1), 0.6 s · scale-95 al presionar · títulos tracking 0.15em, font-light
   ===================================================================== */

/* ---------- Paleta (aplica con cualquier tema elegido) ---------- */
:root, :root[data-theme="light"], :root[data-theme="dark"], :root:not([data-theme="light"]) {
  color-scheme: dark;
  --lux-bg: #09090b;
  --lux-glass: rgba(24,24,27,.4);
  --lux-glass-strong: rgba(24,24,27,.72);
  --lux-border: rgba(39,39,42,.6);
  --lux-blur: blur(24px);
  --lux-gold: linear-gradient(to right, #DFBA73, #F5E3B5, #C29B53);
  --lux-gold-text: linear-gradient(110deg, #C29B53 0%, #DFBA73 28%, #F5E3B5 50%, #DFBA73 72%, #C29B53 100%);
  --lux-gold-soft: #DFBA73;
  --lux-glow: 0 0 25px rgba(223,186,115,.15);
  --lux-ease: cubic-bezier(0.16, 1, 0.3, 1);
  --lux-ink-on-gold: #1f1607;
  --lux-display: -apple-system, "SF Pro Display", BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --serif: var(--lux-display);   /* las cifras grandes usaban una letra con remates: ahora todo es SF Pro */

  --page: #09090b; --bg: #09090b;
  --surface: #18181b; --surface-2: #1f1f23; --surface-3: #27272a;
  --line: rgba(39,39,42,.6); --line-2: #3f3f46; --line-strong: #3f3f46;
  --ink: #f4f4f5; --ink-2: #d4d4d8; --ink-3: #a1a1aa;
  --carbon: #09090b; --carbon-2: #18181b; --carbon-3: #27272a;
  --on-carbon: #f4f4f5; --on-carbon-2: #a1a1aa;
  --gold: #DFBA73; --gold-hi: #DFBA73; --gold-ink: #DFBA73; --gold-bg: rgba(223,186,115,.09);
  --on-gold: #1f1607; --pri-bg: #DFBA73; --pri-ink: #1f1607;
  --btn-dark: rgba(39,39,42,.7); --sel: #27272a; --chip-on-bg: rgba(223,186,115,.14); --chip-on-fg: #F5E3B5;
  --focus: #DFBA73;
  --ok: #6fcf97; --ok-bg: rgba(34,197,94,.12); --warn: #f0b35a; --warn-bg: rgba(245,158,11,.12);
  --err: #ff8a7a; --err-bg: rgba(239,68,68,.12); --info: #8ab8ee; --info-bg: rgba(59,130,246,.12);
  --violet: #c4a8f0; --violet-bg: rgba(139,92,246,.12);
  --st-recibido: #4a86cc; --st-proceso: #b8862a; --st-validacion: #8f6cc9; --st-listo: #3a9a6a; --st-entregado: #71717a;
  --shadow-1: 0 0 0 1px rgba(255,255,255,.02);
  --shadow-2: 0 0 0 1px rgba(255,255,255,.03), 0 18px 40px -20px rgba(0,0,0,.85);
  --shadow-3: 0 30px 70px -20px rgba(0,0,0,.92);
  --scrim: rgba(0,0,0,.6);
}
/* Fondo con profundidad: dos halos dorados muy tenues para que el cristal tenga algo que desenfocar */
html, body {
  background-color: var(--lux-bg);
  background-image: radial-gradient(60% 40% at 85% -5%, rgba(223,186,115,.10), transparent 70%),
                    radial-gradient(50% 35% at -10% 45%, rgba(194,155,83,.06), transparent 70%);
  background-attachment: fixed;
}

/* ---------- 1. Cristal: ningún contenedor sólido ---------- */
.card, .ccard, .kpi, .fkpi, .panel, .acct, .loycard, .choice, .qa button, .opt-card, .dockbar, .xrow, .li, .cta, .hero, .seg {
  background-color: var(--lux-glass) !important;
  -webkit-backdrop-filter: var(--lux-blur) saturate(1.15); backdrop-filter: var(--lux-blur) saturate(1.15);
  border: 1px solid var(--lux-border);
}
.hero { background-image: radial-gradient(120% 140% at 100% 0%, rgba(223,186,115,.09), transparent 55%) !important; }
.cta::before { border-color: rgba(223,186,115,.38) !important; }
.cta small { color: var(--ink-3); }
.cta .chev { color: var(--lux-gold-soft); }
.loycard.ready { border-color: rgba(223,186,115,.4); box-shadow: var(--lux-glow); }
/* Barras fijas: cristal más denso (85 %) para que el contenido que pasa por debajo nunca estorbe la lectura */
.appbar, .tabbar, .dock {
  background: rgba(9,9,11,.85) !important;
  -webkit-backdrop-filter: var(--lux-blur) saturate(1.2); backdrop-filter: var(--lux-blur) saturate(1.2);
  border-color: var(--lux-border);
}
.appbar { border-bottom: 1px solid var(--lux-border); }
.sheet, .dialog { background: var(--lux-glass-strong); -webkit-backdrop-filter: var(--lux-blur); backdrop-filter: var(--lux-blur); border: 1px solid var(--lux-border); }
.toast { background: var(--lux-glass-strong); -webkit-backdrop-filter: var(--lux-blur); backdrop-filter: var(--lux-blur); border: 1px solid var(--lux-border); color: var(--ink); }
input.input, input.inp, .input, .inp, textarea, select { background: rgba(24,24,27,.55); border-color: var(--lux-border); color: var(--ink); }
input:focus, textarea:focus, select:focus { border-color: rgba(223,186,115,.55); box-shadow: var(--lux-glow); }

/* ---------- 2. Oro líquido ---------- */
.btn.primary, .btn.pri, .fab:not(.tab), .fabc, .qa button.pri, .qa3 button.pri, .cta .plus {
  background-image: var(--lux-gold) !important;
  background-color: #DFBA73 !important;
  color: var(--lux-ink-on-gold) !important; border-color: transparent !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(120,85,30,.25), var(--lux-glow);
}
.fab:not(.tab) svg, .fabc svg, .cta .plus svg { stroke: var(--lux-ink-on-gold); }
:root .qa button.pri .ic, :root .qa3 button.pri .ic { background: rgba(31,22,7,.12) !important; color: var(--lux-ink-on-gold) !important; }
:root .qa button.pri small, :root .qa3 button.pri small { color: rgba(31,22,7,.78) !important; opacity: 1; }
.btn.dark { background: rgba(39,39,42,.7); color: var(--ink); border: 1px solid #3f3f46; }
.btn.secondary, .btn:not(.primary):not(.pri):not(.dark) { border-color: var(--lux-border); }
/* Texto destacado con oro recortado */
.wordmark b, .logo b {
  background-image: var(--lux-gold-text); background-size: 250% 100%; background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
}
/* Detalles pequeños */
.eyebrow, .lnk, .linkbtn, .qa button .ic, .acct .an .i { color: var(--lux-gold-soft); }
/* Elementos activos: oro + brillo externo */
.tab[aria-current="page"], .tab.on, .tab[aria-selected="true"] { color: #F5E3B5; text-shadow: 0 0 18px rgba(223,186,115,.35); }
.seg [aria-pressed="true"], .seg [aria-selected="true"], .seg .on, .seg input:checked + span {
  background: rgba(223,186,115,.12) !important; color: #F5E3B5 !important;
  box-shadow: inset 0 0 0 1px rgba(223,186,115,.4), var(--lux-glow);
}
.choice[aria-pressed="true"], .xrow[aria-checked="true"], .kpi.on, .chip[aria-pressed="true"] { border-color: rgba(223,186,115,.45); box-shadow: var(--lux-glow); }
:focus-visible { outline-color: #DFBA73; }

/* ---------- 3. Títulos: escala tipográfica estricta (seguimiento óptico tipo Apple: grande = apretado, pequeño = abierto) ---------- */
.vhead h1, .greet h1 {
  font-family: var(--lux-display); font-weight: 650; letter-spacing: -.022em; line-height: 1.12;
  background-image: var(--lux-gold-text); background-size: 250% 100%; background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
}
.appbar .ttl h1 { font-family: var(--lux-display); font-weight: 600; letter-spacing: -.012em; }
.section-h h2, .panel-h h2, .sh-h h2, .sheet .sh h2, .dialog h2 { font-family: var(--lux-display); font-weight: 600; letter-spacing: -.008em; line-height: 1.25; }
.eyebrow { font-weight: 600; letter-spacing: .12em; }

/* ---------- 4. Físicas de animación ---------- */
.btn, button, a, .card, .ccard, .kpi, .fkpi, .panel, .acct, .choice, .chip, .tab, .row, .mrow, .li, .xrow, .badge, .cta, .seg button, input, select, textarea {
  transition: all .6s var(--lux-ease);
}
/* Microinteracción: se encoge al presionar (rápido) y se expande al soltar (curva de 0.6 s) */
button:active, .btn:active, .choice:active, .cta:active, .kpi:active, .ccard:active, .row:active, .mrow:active, .chip:active, .tab:active {
  transform: scale(.95); transition-duration: .14s;
}
@media (hover: hover) {
  .btn.primary:hover, .btn.pri:hover, .fab:not(.tab):hover, .tab.fab:hover .fabc, .qa button.pri:hover, .qa3 button.pri:hover, .cta:hover, .cta:hover .plus {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 25px rgba(223,186,115,.28);
  }
  .card:hover, .ccard:hover, .kpi:hover, .panel:hover, .choice:hover, .qa button:hover { border-color: rgba(82,82,91,.75); }
  .btn.dark:hover, .btn.secondary:hover { border-color: rgba(223,186,115,.4); }
}
.btn:disabled, .btn[disabled] { box-shadow: none !important; filter: saturate(.35); opacity: .5; }
.sheet, .dialog, .toast, .scrim { transition-duration: .6s !important; transition-timing-function: var(--lux-ease) !important; }

/* Cascada de entrada (la activa tema/lux-dark.js al cambiar de pantalla; 0.05 s entre elementos) */
@keyframes lux-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.lux-rise { animation: lux-rise .6s var(--lux-ease) backwards; }

/* Destello que cruza el logo y los botones dorados cada 4 s */
@keyframes lux-text-shimmer { 0% { background-position: 100% 0; } 30%, 100% { background-position: 0 0; } }
.wordmark b, .logo b { animation: lux-text-shimmer 4s var(--lux-ease) infinite; }
@keyframes lux-sweep { 0% { transform: translateX(-180%) skewX(-20deg); } 30%, 100% { transform: translateX(320%) skewX(-20deg); } }
.btn.primary, .btn.pri, .fab:not(.tab), .fabc, .qa button.pri, .qa3 button.pri, .cta .plus { position: relative; overflow: hidden; isolation: isolate; }
.btn.primary::after, .btn.pri::after, .fab:not(.tab)::after, .fabc::after, .qa button.pri::after, .qa3 button.pri::after, .cta .plus::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; pointer-events: none; z-index: 1;
  background: linear-gradient(90deg, transparent, rgba(255,250,235,.55), transparent);
  transform: translateX(-180%) skewX(-20deg);
  animation: lux-sweep 4s var(--lux-ease) infinite;
}
.btn:disabled::after, .btn[disabled]::after { animation: none; opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* =====================================================================
   5. Marca ALAGA: emblema oficial, nombre tipográfico de lujo, entrada 3D y sello de registro.
   --lux-logo y --lux-logo-sm los inyecta tema/aplicar.js (imagen incrustada; la caja fuerte no permite imágenes externas).
   ===================================================================== */
/* ---------- Nombre ALAGA (encabezados): tipografía de alta moda + oro metálico grabado ---------- */
.wordmark, .logo { position: relative; padding-left: 56px; min-height: 46px; justify-content: center; }
.wordmark::before, .logo::before {
  content: ""; position: absolute; left: 0; top: 50%; width: 46px; height: 46px; transform: translateY(-50%);
  background: var(--lux-logo-sm) center / contain no-repeat;

}
.wordmark b, .logo b {
  font-family: "Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", "Times New Roman", serif;
  font-weight: 700; font-size: 25px; line-height: 1; letter-spacing: .26em; margin-right: -.26em;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-kerning: normal;

    linear-gradient(105deg, transparent 38%, rgba(255,251,240,.95) 50%, transparent 62%),
    linear-gradient(180deg, #FFF4D6 0%, #F1D9A0 22%, #DFBA73 45%, #9C7536 58%, #E7C988 74%, #C29B53 100%);
  background-size: 260% 100%, 100% 100%; background-position: 140% 0, 0 0; background-repeat: no-repeat;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 14px rgba(223,186,115,.18));
  animation: lux-word-shine 4s var(--lux-ease) infinite;
}
.wordmark small, .logo small {
  display: flex; align-items: center; gap: 9px; margin-top: 6px;
  font-family: "Avenir Next", "Avenir", "Helvetica Neue", system-ui, sans-serif; font-weight: 500; font-size: 9.5px; line-height: 1;
  letter-spacing: .48em; margin-right: -.48em; text-transform: uppercase;
  color: #d9dade; -webkit-font-smoothing: antialiased;
  text-shadow: 0 1px 0 rgba(0,0,0,.6);
}
.wordmark small::before, .wordmark small::after, .logo small::before, .logo small::after {
  content: ""; width: 14px; height: 1px; flex: none; background: linear-gradient(90deg, transparent, #DFBA73, transparent); opacity: .85;
}
@keyframes lux-word-shine { 0% { background-position: 140% 0, 0 0; } 32%, 100% { background-position: -40% 0, 0 0; } }
.provisional { display: none !important; }   /* ya hay logo oficial */

/* ---------- Logo ALAGA 3D: el logo ORIGINAL separado en dos planos (logo/separar-capas.py) ----------
   Fondo: anillo, auto y salpicadura. Frente: la A, las estrellas y ALAGA · CAR WASH, 34 px más cerca.
   Cada plano tiene canto metálico (copias oscurecidas apiladas hacia atrás) y un reflejo de luz que solo toca el metal. */
.lg3 { position: relative; width: var(--sz, 340px); height: var(--sz, 340px); transform-style: preserve-3d; }
.lg3 .pl { position: absolute; inset: 0; transform-style: preserve-3d; }
.lg3 .pl > i { position: absolute; inset: 0; display: block; background: center / 100% 100% no-repeat; transform: translateZ(var(--z, 0px)); }
.lg3 .back > i { background-image: var(--lux-capa-fondo); }
.lg3 .front > i { background-image: var(--lux-capa-frente); }
.lg3 .pl > i.e { filter: brightness(var(--b, .4)) saturate(1.25); }
.lg3 .pl > i.sh {   /* reflejo: degradado claro recortado con la forma exacta del metal */
  background: linear-gradient(112deg, transparent 38%, rgba(255,250,232,.85) 50%, transparent 62%) 130% 0 / 320% 100% no-repeat;
  mix-blend-mode: screen; opacity: .9;
  -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat;
}
.lg3 .back > i.sh { --m: var(--lux-capa-fondo); }
.lg3 .front > i.sh { --m: var(--lux-capa-frente); }
.lg3 .front { transform: translateZ(34px); }

/* ---------- Partículas doradas ---------- */
.lux-particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.lux-particles i {
  position: absolute; bottom: -10px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%;
  background: radial-gradient(circle, #FFF6DC, #DFBA73 55%, transparent 70%); opacity: 0;
  animation: lux-rise-p var(--dur) cubic-bezier(.2,.7,.3,1) var(--del) forwards;
}
@keyframes lux-rise-p { 0% { opacity: 0; transform: translate3d(0,0,0) scale(.6); } 15% { opacity: .95; } 100% { opacity: 0; transform: translate3d(var(--dx), var(--dy), 0) scale(1.1); } }

/* ---------- Entrada al iniciar la app (~7 s, no se puede saltar) ---------- */
.lux-intro {
  position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(70% 50% at 50% 44%, rgba(70,50,18,.5), transparent 72%), #030304;

.lux-intro .spark {
  position: absolute; top: 44%; left: 50%; width: 140vw; height: 2px; margin: -1px 0 0 -70vw;
  background: linear-gradient(90deg, transparent, rgba(245,227,181,0) 22%, #FFF3D1 50%, rgba(245,227,181,0) 78%, transparent);
  box-shadow: 0 0 34px 8px rgba(223,186,115,.45); transform: scaleX(0); opacity: 0; animation: lux-flare 1.4s var(--lux-ease) .1s forwards;
}
@keyframes lux-flare { 0% { transform: scaleX(0); opacity: 0; } 35% { opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
.lux-intro .halo {
  position: absolute; top: 44%; left: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%;
  background: radial-gradient(circle, rgba(223,186,115,.24), rgba(223,186,115,.05) 46%, transparent 68%);
  opacity: 0; animation: lux-halo 5.8s ease-in-out .6s forwards;
}
@keyframes lux-halo { 0% { opacity: 0; transform: scale(.6); } 35% { opacity: 1; transform: scale(1); } 65% { opacity: .6; transform: scale(1.06); } 100% { opacity: .9; transform: scale(1); } }
.lux-intro .scene { position: relative; transform-style: preserve-3d; animation: lux-scene 6.2s cubic-bezier(.45,.05,.25,1) .2s both; }
.lux-intro .lg3 { --sz: min(88vw, 360px); }
@keyframes lux-scene {   /* de frente mientras se traza; después un giro sobrio que revela la profundidad y vuelve al centro */
  0%, 40% { transform: none; }
  68% { transform: rotateX(6deg) rotateY(-14deg); }
  86% { transform: rotateX(-2deg) rotateY(8deg); }
  100% { transform: none; }
}
/* Arranque preciso: el anillo y el auto se TRAZAN en un barrido circular (como un instrumento que se calibra),
   con un punto de luz que recorre el anillo y una escala de marcas finas; luego el frente emerge desde la profundidad. */
@property --lux-sweep { syntax: "<angle>"; inherits: true; initial-value: 360deg; }
.lux-intro .back { --lux-sweep: 0deg; animation: lux-trace 1.9s cubic-bezier(.65,0,.25,1) .55s both; }
.lux-intro .back > i:not(.sh) {
  -webkit-mask-image: conic-gradient(from 0deg at 49% 50.4%, #000 var(--lux-sweep), transparent var(--lux-sweep));
          mask-image: conic-gradient(from 0deg at 49% 50.4%, #000 var(--lux-sweep), transparent var(--lux-sweep));
}
@keyframes lux-trace { from { --lux-sweep: 0deg; } to { --lux-sweep: 361deg; } }
.lux-intro .comet { position: absolute; left: 49%; top: 50.4%; width: 0; height: 0; transform: translateZ(1px) rotate(0deg); opacity: 0;
  animation: lux-comet 1.9s cubic-bezier(.65,0,.25,1) .55s both; }
.lux-intro .comet::before { content: ""; position: absolute; left: -5px; top: calc(var(--sz, 340px) * -.462 - 5px); width: 10px; height: 10px; border-radius: 50%;
  background: radial-gradient(circle, #FFFBEF 0 30%, #F5E3B5 45%, rgba(223,186,115,0) 72%); box-shadow: 0 0 18px 6px rgba(245,227,181,.55); }
@keyframes lux-comet { 0% { opacity: 0; transform: translateZ(1px) rotate(0deg); } 8% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; transform: translateZ(1px) rotate(361deg); } }
.lux-intro .dial { position: absolute; left: 49%; top: 50.4%; width: calc(var(--sz, 340px) * 1.04); height: calc(var(--sz, 340px) * 1.04); border-radius: 50%;
  transform: translate(-50%, -50%) rotate(-24deg); opacity: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(233,211,160,.7) 0 .5deg, transparent .5deg 6deg);
  -webkit-mask-image: radial-gradient(closest-side, transparent 93.5%, #000 94.5%, #000 98.5%, transparent 99.5%);
          mask-image: radial-gradient(closest-side, transparent 93.5%, #000 94.5%, #000 98.5%, transparent 99.5%);
  animation: lux-dial 2.9s cubic-bezier(.45,0,.25,1) .3s both; }
@keyframes lux-dial { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-24deg) scale(.96); } 30% { opacity: .55; } 70% { opacity: .55; transform: translate(-50%, -50%) rotate(0deg) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(0deg) scale(1.02); } }
.lux-intro .front { animation: lux-front 1.4s cubic-bezier(.16,1,.3,1) 2.05s both; }
@keyframes lux-front { 0% { opacity: 0; transform: translateZ(-140px); } 45% { opacity: 1; } 100% { opacity: 1; transform: translateZ(34px); } }
.lux-intro .pl > i.sh { animation: lux-sheen 1.6s cubic-bezier(.5,0,.3,1) 4.1s forwards; }
.lux-intro .front > i.sh { animation-delay: 4.25s; }
@keyframes lux-sheen { from { background-position: 130% 0; } to { background-position: -30% 0; } }
.lux-intro .mirror {   /* reflejo en el piso brillante, como en el logo original */
  position: relative; width: min(88vw, 360px); height: calc(min(88vw, 360px) * .22); margin-top: -2px; overflow: hidden; opacity: 0;
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 90%); mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 90%);
  animation: lux-mirror 2.4s var(--lux-ease) 2.6s forwards;
}
.lux-intro .mirror i { position: absolute; left: 0; right: 0; top: 0; height: min(88vw, 360px); transform: scaleY(-1); transform-origin: 50% 50%;
  background: var(--lux-capa-frente) center / 100% 100% no-repeat, var(--lux-capa-fondo) center / 100% 100% no-repeat; filter: blur(2px) brightness(.9); }
@keyframes lux-mirror { to { opacity: .8; } }
.lux-intro .tag { display: flex; align-items: center; gap: 14px; margin-top: 6px; height: 18px; }
.lux-intro .tag i { width: 0; height: 1px; background: linear-gradient(90deg, transparent, #DFBA73); animation: lux-rule .9s var(--lux-ease) 4.5s forwards; }
.lux-intro .tag i:last-child { background: linear-gradient(90deg, #DFBA73, transparent); }
@keyframes lux-rule { to { width: 38px; } }
.lux-intro .tag span { font: 500 11.5px/1 "Avenir Next", "Avenir", "Helvetica Neue", system-ui, sans-serif; letter-spacing: .5em; margin-right: -.5em; text-transform: uppercase; color: #E9D3A0; white-space: nowrap; }
.lux-intro .tag span b { font-weight: 500; display: inline-block; opacity: 0; transform: translateY(8px); filter: blur(4px);
  animation: lux-letter .7s var(--lux-ease) forwards; animation-delay: calc(4.4s + var(--i) * .045s); }
@keyframes lux-letter { to { opacity: 1; transform: none; filter: blur(0); } }
.lux-intro .lux-particles i { --dy: -62vh; }
.lux-intro.out .scene { transform: translateZ(160px); opacity: 0; transition: transform 1s var(--lux-ease), opacity 1s var(--lux-ease); animation: none; }
.lux-intro.out .mirror, .lux-intro.out .tag { opacity: 0; transition: opacity .6s; }

/* ---------- Sello de registro (anotación o movimiento: ~3.2 s, no bloquea el resto de la pantalla) ---------- */
.lux-seal {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 9500; width: min(94vw, 440px);
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px; padding: 14px 18px 14px 14px;
  border-radius: 24px; overflow: hidden; cursor: pointer;
  background: radial-gradient(120% 140% at 0% 0%, rgba(223,186,115,.16), transparent 55%), rgba(16,16,19,.94);
  -webkit-backdrop-filter: blur(24px) saturate(1.2); backdrop-filter: blur(24px) saturate(1.2);
  border: 1px solid rgba(223,186,115,.35); box-shadow: 0 0 25px rgba(223,186,115,.18), 0 24px 60px -18px rgba(0,0,0,.9);
  transform: translate(-50%, -130%) scale(.96); opacity: 0;
  transition: transform .7s var(--lux-ease), opacity .6s var(--lux-ease);
}
.lux-seal.on { transform: translate(-50%, 0) scale(1); opacity: 1; }
.lux-seal.bottom { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); transform: translate(-50%, 130%) scale(.96); }
.lux-seal.bottom.on { transform: translate(-50%, 0) scale(1); }
.lux-seal .ring { position: relative; width: 84px; height: 84px; display: grid; place-items: center; }
.lux-seal .ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.lux-seal .ring > svg circle { fill: none; stroke-width: 2.5; }
.lux-seal .ring .trk { stroke: rgba(63,63,70,.7); }
.lux-seal .ring .prg { stroke: url(#luxGold); stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289; }
.lux-seal.on .ring .prg { animation: lux-ring var(--dur) var(--lux-sync-ease) forwards; }
@keyframes lux-ring { to { stroke-dashoffset: 0; } }
.lux-seal .ring .em {   /* emblema real dentro de un círculo: nada se sale del anillo */
  position: relative; width: 66px; height: 66px; border-radius: 50%; overflow: hidden; isolation: isolate;
  box-shadow: inset 0 0 0 1px rgba(223,186,115,.25);
  animation: lux-em-in .7s var(--lux-ease) .05s both;
}
/* Giro del logotipo SOLO con transformaciones planas (2D). Antes era un giro 3D con caras ocultas por el reverso,
   y Safari/iPhone lo ocultaba dentro del círculo recortado. Ahora una sola cara se angosta y se ensancha (|cos θ|),
   como una moneda que gira, con sombra de canto; nunca se ve al revés y termina completa. La anima tema/lux-dark.js
   con la misma duración y curva que el relleno del anillo (--lux-sync-ease): avanzan igual y terminan juntos. */
.lux-seal { --lux-sync-ease: cubic-bezier(.45, 0, .25, 1); }
.lux-seal .ring .lux-giro { position: absolute; inset: 0; border-radius: 50%; transform-origin: 50% 50%;
  background: var(--lux-logo) center / 112% 112% no-repeat; }
.lux-seal .ring .lux-giro .lux-sombra { position: absolute; inset: 0; border-radius: 50%; opacity: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.65), rgba(0,0,0,.15) 45%, rgba(0,0,0,.65)); }
@keyframes lux-em-in { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: scale(1); } }
.lux-seal .ring .em::after {   /* destello que cruza el emblema dos veces */
  content: ""; position: absolute; inset: -10%; background: linear-gradient(112deg, transparent 45%, rgba(255,248,226,.42) 50%, transparent 55%) 140% 0 / 320% 100% no-repeat;
  mix-blend-mode: screen; z-index: 1; animation: lux-em-sweep 1.1s cubic-bezier(.5,0,.3,1) .5s 1 both;
}
@keyframes lux-em-sweep { from { background-position: 140% 0; } to { background-position: -40% 0; } }
.lux-seal .ring .ok { position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, #F5E3B5, #DFBA73 55%, #C29B53); box-shadow: 0 0 0 3px rgba(16,16,19,.95), 0 0 16px rgba(223,186,115,.45);
  transform: scale(0); animation: lux-ok-pop .5s cubic-bezier(.34,1.56,.64,1) calc(var(--dur) - .05s) forwards; }
.lux-seal .ring .ok svg { width: 14px; height: 14px; stroke: #1f1607; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: lux-ok-draw .35s ease-out calc(var(--dur) + .2s) forwards; }
@keyframes lux-ok-pop { to { transform: scale(1); } }
@keyframes lux-ok-draw { to { stroke-dashoffset: 0; } }
.lux-seal .txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.lux-seal .txt b {
  font-family: "Avenir Next", "Avenir", "Helvetica Neue", system-ui, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
  background-image: linear-gradient(90deg, #C29B53, #F5E3B5, #DFBA73); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
}
.lux-seal .txt .msg { font-size: 15px; font-weight: 600; color: #f4f4f5; line-height: 1.3; overflow-wrap: anywhere; }
.lux-seal .txt small { font-size: 12.5px; color: #a1a1aa; display: flex; align-items: center; gap: 6px; }
.lux-seal .txt small.ok { color: #8fdcae; }
.lux-seal .txt small.wait { color: #f0c27a; }
.lux-seal .lux-particles i { --dy: -120px; bottom: -6px; }
.lux-seal::after {   /* destello al aparecer */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 35%, rgba(255,248,226,.18) 50%, transparent 65%); background-size: 300% 100%; background-position: 130% 0;
}
.lux-seal.on::after { animation: lux-seal-sweep 1.6s var(--lux-ease) .25s forwards; }
@keyframes lux-seal-sweep { to { background-position: -30% 0; } }

/* ---------- Envío a la caja fuerte cuando no hay sello en pantalla (píldora discreta) ---------- */
.lux-sync { position: fixed; left: 0; right: 0; top: 0; z-index: 9000; pointer-events: none; }
.lux-sync .bar { height: 2px; width: 100%; transform-origin: left; transform: scaleX(0); opacity: 0;
  background: linear-gradient(90deg, #C29B53, #F5E3B5, #DFBA73, #C29B53); background-size: 300% 100%;
  transition: transform .6s var(--lux-ease), opacity .5s var(--lux-ease); }
.lux-sync .pill {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; align-items: center; gap: 9px;
  padding: 7px 14px 7px 7px; border-radius: 999px; font-size: 13px; font-weight: 500; letter-spacing: .02em; color: #F5E3B5; white-space: nowrap;
  background: rgba(18,18,21,.94); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  border: 1px solid rgba(223,186,115,.28); box-shadow: 0 0 25px rgba(223,186,115,.15);
  opacity: 0; transform: translate(-50%, -14px) scale(.96); transition: opacity .5s var(--lux-ease), transform .6s var(--lux-ease);
}
.lux-sync .em { width: 24px; height: 24px; border-radius: 50%; background: var(--lux-logo-sm) center / contain no-repeat; flex: none; }
.lux-sync.on .pill { opacity: 1; transform: translate(-50%, 0) scale(1); }
.lux-sync.sending .bar { opacity: 1; transform: scaleX(.85); animation: lux-sync-flow 1.2s linear infinite; }
.lux-sync.sending .em { animation: lux-sync-spin 1.4s var(--lux-ease) infinite; }
.lux-sync.ok .bar { opacity: 1; transform: scaleX(1); }
.lux-sync.ok .pill { border-color: rgba(111,207,151,.35); }
.lux-sync.wait .pill { color: #d4d4d8; border-color: rgba(161,161,170,.3); box-shadow: none; }
@keyframes lux-sync-flow { from { background-position: 0 0; } to { background-position: 300% 0; } }
@keyframes lux-sync-spin { 0% { transform: rotate(0); } 60%, 100% { transform: rotate(360deg); } }

/* Aviso de registro exitoso: palomita dorada */
.toast.lux-ok { border-color: rgba(223,186,115,.45) !important; box-shadow: 0 0 25px rgba(223,186,115,.18), var(--shadow-3); }
.toast.lux-ok svg, .toast.lux-ok .i { color: #DFBA73; stroke: #DFBA73; animation: lux-check .6s var(--lux-ease) both; }
@keyframes lux-check { from { transform: scale(.4) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .lux-intro { display: none !important; }
  .lux-seal .ring .em, .lux-seal .ring .em::after, .wordmark b, .logo b { animation: none !important; }
  .lux-seal .ring .ok { transform: none; } .lux-seal .ring .ok svg { stroke-dashoffset: 0; }
}

/* =====================================================================
   6. Lectura: tipografía estricta, cifras claras, botones corregidos y transiciones fluidas entre pantallas
   ===================================================================== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  font-kerning: normal; font-variant-numeric: tabular-nums lining-nums;   /* cifras del mismo ancho: las cantidades no "bailan" */
}
/* Cifras grandes: SF Pro Display semibold, sin remates, color sólido de alto contraste */
.kpi .v, .fkpi .v, .hero .val, .hero .side .val2, .flowtop .big, .cs .n, .pkg .price, .bigtotal, .pendsplit b,
.acct .av, .wf li.tot .wv, .amt span, .amt input, .dockbar .dv b, .cmp b {
  font-family: var(--lux-display) !important; font-weight: 600; letter-spacing: -.028em;
  font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1, "lnum" 1;
}
.kpi .v, .fkpi .v, .acct .av, .pendsplit b, .cmp b, .dockbar .dv b, .hero .side .val2, .cs .n { color: #FAFAFA; }
.hero .val, .bigtotal, .flowtop .big { color: #F4DDA6 !important; -webkit-text-fill-color: #F4DDA6; background: none !important;
  text-shadow: 0 0 22px rgba(223,186,115,.22); }
.pkg .price { color: #F4DDA6; }

/* Obturador de fotos: siempre círculo perfecto (el botón vecino lo aplastaba) */
.shot { gap: 18px; }
.shot .btn { white-space: nowrap; flex: 0 1 auto; font-size: 15px; letter-spacing: -.01em; padding: 0 14px; border: 1px solid rgba(63,63,70,.8); border-radius: 14px; }
.shutter { flex: none !important; width: 76px !important; height: 76px !important; aspect-ratio: 1; border: 4px solid rgba(244,244,245,.95) !important;
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 25px rgba(223,186,115,.18); }
.shutter span { flex: none; width: 58px; height: 58px; background-image: radial-gradient(circle at 35% 30%, #FFF1CC, #DFBA73 55%, #B88A3E) !important; }
.shot .tnum { min-width: 48px; text-align: center; font-family: var(--lux-display); font-weight: 600; font-size: 19px; letter-spacing: -.01em; }

/* Botón principal deshabilitado: gris limpio y legible (antes era oro desteñido) */

  background-image: none !important; background-color: rgba(39,39,42,.92) !important; color: #b4b4bb !important;
  box-shadow: inset 0 0 0 1px rgba(63,63,70,.9) !important; filter: none; opacity: 1;
}

/* Transiciones entre pantallas: las barras fijas no se mueven; el contenido nuevo entra deslizándose
   (adelante → desde la derecha, atrás → desde la izquierda, otra sección → sube) y el anterior se desvanece encima. */
.view { animation: none !important; }
.lux-nav { animation: lux-nav-up .56s var(--lux-ease) both; }
.lux-nav.fwd { animation-name: lux-nav-fwd; }
.lux-nav.back { animation-name: lux-nav-back; }
.lux-nav.fade { animation-name: lux-nav-fade; }
@keyframes lux-nav-up { from { opacity: 0; transform: translate3d(0, 18px, 0) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes lux-nav-fwd { from { opacity: 0; transform: translate3d(34px, 0, 0); } to { opacity: 1; transform: none; } }
@keyframes lux-nav-back { from { opacity: 0; transform: translate3d(-34px, 0, 0); } to { opacity: 1; transform: none; } }
@keyframes lux-nav-fade { from { opacity: 0; } to { opacity: 1; } }
.lux-ghost { position: fixed; z-index: 6; pointer-events: none; overflow: hidden; animation: lux-ghost-out .38s var(--lux-ease) forwards; }
.lux-ghost.fwd { --gx: -26px; } .lux-ghost.back { --gx: 26px; } .lux-ghost.up { --gy: -10px; }
.lux-ghost .appbar, .lux-ghost .tabbar, .lux-ghost .dock, .lux-ghost .brandbar, .lux-ghost header, .lux-ghost .dockbar, .lux-ghost .toast { visibility: hidden !important; }
.lux-ghost * { animation: none !important; transition: none !important; }
@keyframes lux-ghost-out { from { opacity: 1; } to { opacity: 0; transform: translate3d(var(--gx, 0), var(--gy, 0), 0) scale(.985); } }
@media (prefers-reduced-motion: reduce) { .lux-ghost { display: none; } }

/* =====================================================================
   7. Encabezado de Finanzas Pro: dos niveles que no dependen del ancho de la letra
      Fila 1: marca ALAGA (todo el ancho que necesite, sin encogerse) + ajustes.
      Fila 2: fecha y hora + rol y DEMO; si no caben juntos, el rol y DEMO bajan a su propia línea (nunca se enciman).
   ===================================================================== */
.brandbar .bb-row { gap: 10px; }
.brandbar .logo { flex: 1 0 auto; min-width: max-content; padding-left: 50px; min-height: 42px; margin-right: auto; }
.brandbar .logo::before { width: 42px; height: 42px; }
.brandbar .logo b { font-size: 22px; letter-spacing: .22em; margin-right: -.22em; }
.brandbar .logo small { font-size: 9px; letter-spacing: .34em; margin-right: -.34em; gap: 7px; margin-top: 5px; }
.brandbar .bb-row > .demo-badge { display: none !important; }
.brandbar .iconbtn { flex: 0 0 auto; margin-left: auto; }
.brandbar .clockline { flex-wrap: wrap; row-gap: 10px; column-gap: 12px; align-items: center; margin-top: 12px; }
.brandbar .bb-when { display: inline-flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; }
.brandbar .bb-when > span { white-space: nowrap; }
.brandbar .bb-acts { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; flex: 0 0 auto; }
.brandbar .bb-acts .demo-badge { display: inline-block !important; margin-left: 0; }
.brandbar .rolebtn { flex: 0 0 auto; gap: 6px; min-height: 40px; padding: 4px 10px 4px 9px; border-radius: 12px; }
.brandbar .rolebtn b { font-size: 13.5px; letter-spacing: -.005em; white-space: nowrap; }
@media (max-width: 520px) {   /* teléfono: rol a la izquierda y DEMO a la derecha; debajo, fecha y hora */
  .brandbar .bb-acts { order: -1; flex: 1 1 100%; margin-left: 0; justify-content: space-between; }
  .brandbar .bb-when { flex: 1 1 100%; }
}
@media (max-width: 359px) {
  .brandbar .logo b { font-size: 19px; letter-spacing: .18em; margin-right: -.18em; }
  .brandbar .logo small { font-size: 8px; letter-spacing: .26em; margin-right: -.26em; }
}

/* =====================================================================
   8. Fondo «Acabado espejo» (canvas fijo detrás de todo el contenido; lo dibuja tema/lux-dark.js)
   ===================================================================== */
html { background-color: var(--lux-bg); }
body, #app { background: transparent !important; }    /* el fondo vive en <html>, así el fondo animado queda entre el fondo y el contenido */
#lux-fondo { position: fixed; inset: 0; z-index: -1; pointer-events: none; display: block; }

/* =====================================================================
   9. Encabezado: respiración entre marca, ícono de perfil y texto del rol (sin encimados 320–430 px)
   ===================================================================== */
.brandbar .bb-row { gap: 10px; }
.brandbar .rolebtn { gap: 10px; padding: 4px 10px 4px 11px; }
.brandbar .rolebtn > .i:first-child { flex: none; }

@media (max-width: 430px) {

  .brandbar .logo small { letter-spacing: .2em; margin-right: -.2em; }

}

}
.brandbar .rolebtn b em { font-style: normal; }
.brandbar .rolebtn b .rl-s { display: none; }
@media (max-width: 374px) {
  .brandbar .rolebtn { padding: 4px 11px; }
  .brandbar .rolebtn b .rl-l { display: none; }
  .brandbar .rolebtn b .rl-s { display: inline; }
}

/* =====================================================================
   10. LUX CLARO — marfil y champaña con el mismo oro (más profundo para que se lea sobre claro).
   Se activa con la clase html.lux-light, que pone el script del <head> (tema/aplicar.js) según:
   la elección Claro/Oscuro de ALAGA SYSTEM o, en «Sistema», la apariencia del teléfono.
   La entrada, el sello de registro y la píldora de envío siguen oscuros a propósito (son superposiciones de marca).
   ===================================================================== */
:root.lux-light {
  color-scheme: light;
  --lux-bg: #F5F0E6;
  --lux-glass: rgba(255,255,255,.66);
  --lux-glass-strong: rgba(255,253,248,.9);

  --lux-glow: 0 0 22px rgba(166,124,52,.16);
  --page: #F5F0E6; --bg: #F5F0E6;
  --surface: #FFFFFF; --surface-2: #FBF8F2; --surface-3: #F1EBDF;
  --line: rgba(120,95,50,.18); --line-2: #DDD3C2; --line-strong: #CFC3AE;
  --ink: #1C1913; --ink-2: #3B352B; --ink-3: #6A6152;
  --carbon: #FBF8F2; --carbon-2: #FFFFFF; --carbon-3: #F1EBDF;
  --on-carbon: #1C1913; --on-carbon-2: #6A6152;
  --gold: #8F6A2C; --gold-hi: #7A5A20; --gold-ink: #7A5A20; --gold-bg: rgba(166,124,52,.10);
  --on-gold: #1f1607; --pri-bg: #DFBA73; --pri-ink: #1f1607;
  --btn-dark: #2B261D; --sel: #F1EBDF; --chip-on-bg: rgba(166,124,52,.14); --chip-on-fg: #6E5019;
  --focus: #8F6A2C;
  --ok: #1E7D4A; --ok-bg: rgba(30,125,74,.11); --warn: #A35F00; --warn-bg: rgba(200,130,20,.13);
  --err: #B3261E; --err-bg: rgba(179,38,30,.09); --info: #2A62A8; --info-bg: rgba(42,98,168,.10);
  --violet: #5E3FA8; --violet-bg: rgba(94,63,168,.10);
  --st-entregado: #8A8476;
  --shadow-1: 0 1px 2px rgba(60,45,20,.06);
  --shadow-2: 0 1px 2px rgba(60,45,20,.05), 0 14px 32px -20px rgba(60,45,20,.38);
  --shadow-3: 0 30px 60px -24px rgba(60,45,20,.45);
  --scrim: rgba(30,25,15,.32);
}
:root.lux-light, :root.lux-light body {
  background-color: var(--lux-bg);
  background-image: radial-gradient(60% 40% at 85% -5%, rgba(223,186,115,.22), transparent 70%),

}

:root.lux-light .loycard, :root.lux-light .choice, :root.lux-light .qa button, :root.lux-light .opt-card, :root.lux-light .xrow, :root.lux-light .li, :root.lux-light .cta, :root.lux-light .hero {
  box-shadow: var(--shadow-2);
}
:root.lux-light .appbar, :root.lux-light .tabbar, :root.lux-light .dock { background: rgba(251,248,242,.9) !important; }
:root.lux-light .brandbar { background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(251,248,242,.7)) !important; border-bottom: 1px solid var(--lux-border); }
:root.lux-light input.input, :root.lux-light input.inp, :root.lux-light .input, :root.lux-light .inp, :root.lux-light textarea, :root.lux-light select { background: rgba(255,255,255,.88); }
:root.lux-light .btn.dark { background: #2B261D; color: #F6F2EA; border-color: #2B261D; }
:root.lux-light .tab[aria-current="page"], :root.lux-light .tab.on, :root.lux-light .tab[aria-selected="true"] { color: #7A5A20; text-shadow: none; }
:root.lux-light .seg [aria-pressed="true"], :root.lux-light .seg [aria-selected="true"], :root.lux-light .seg .on, :root.lux-light .seg input:checked + span {
  background: rgba(166,124,52,.14) !important; color: #6E5019 !important; box-shadow: inset 0 0 0 1px rgba(166,124,52,.45);

  background-image: linear-gradient(105deg, transparent 38%, rgba(255,252,240,.9) 50%, transparent 62%),
                    linear-gradient(180deg, #B8914A 0%, #9C7536 35%, #6E5019 60%, #A9823F 80%, #7A5A20 100%);

:root.lux-light .kpi .v, :root.lux-light .fkpi .v, :root.lux-light .acct .av, :root.lux-light .pendsplit b, :root.lux-light .cmp b,
:root.lux-light .dockbar .dv b, :root.lux-light .hero .side .val2, :root.lux-light .cs .n { color: #1C1913; }

  background-color: #E8E1D3 !important; color: #7D7362 !important; box-shadow: inset 0 0 0 1px #D6CCB9 !important;
