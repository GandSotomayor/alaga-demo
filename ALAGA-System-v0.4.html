<script id="catalogo-js">
"use strict";
/* =====================================================================
   v0.9 · Catálogo configurable — decisiones de Gand (nov-2026)
   - Lo cambian Administración y encargado. Cada versión vale desde una fecha y hora (se puede programar).
   - Un auto ya recibido conserva los precios del catálogo vigente cuando entró (también al cambiarle el servicio).
   - Precios por tipo de vehículo, paquetes y extras nuevos o desactivados, con sus componentes. Tipos de vehículo fijos.
   - Ningún paquete es fijo: todos se activan y desactivan. En el catálogo se marca qué paquete cubre el lavado gratis
     de lealtad; si ese paquete está desactivado o no aplica al vehículo, cubre el paquete activo más barato.
   Conectado: la caja fuerte guarda las versiones en el libro y valida todo. DEMO: versiones en este navegador.
   Las tablas de siempre (PKGS, PRICES, EXTRAS, COMP_ALAGA, COMP_SUPER) se llenan desde aquí.
   ===================================================================== */
const KT_BASE="alaga";   // solo para agrupar componentes («Todo lo del Paquete ALAGA»); ya no es fijo
const KT_COMPONENTES={lavado:"Lavado exterior",aspirado:"Aspirado general",rines:"Rines y llantas",gel:"Gel para llantas",cristales:"Cristales",marcos:"Marcos de puertas",molduras:"Acabado de molduras",tolvas:"Lavado de tolvas",limpPlast:"Limpieza de plásticos interiores",acondPlast:"Acondicionamiento de plásticos interiores"};
const KT_COMP_BASE=["lavado","aspirado","rines","gel","cristales","marcos","molduras"];
/* Versión 0 = la lona (idéntica a la de la caja fuerte). */
const KT_INICIAL=Object.freeze({version:0,desde:0,lealtad:"alaga",
  paquetes:[{id:"alaga",nombre:"Paquete ALAGA",activo:true,precios:{sedan:140,suv:160,pickup:180,moto:80,rzr:220},componentes:KT_COMP_BASE},
    {id:"super",nombre:"Súper ALAGA",activo:true,precios:{sedan:180,suv:210,pickup:240,moto:110,rzr:290},componentes:[...KT_COMP_BASE,"tolvas","limpPlast","acondPlast"]}],
  extras:[{id:"cera",nombre:"Cera en pasta",activo:true,precios:{sedan:250,suv:300,pickup:350}},
    {id:"restaurador",nombre:"Restaurador de molduras",activo:true,precios:{sedan:180,suv:200,pickup:260}},
    {id:"descont",nombre:"Descontaminación de vidrios",activo:true,precios:{sedan:180,suv:220,pickup:260}},
    {id:"asientos",nombre:"Acondicionador de asientos",activo:true,precios:{sedan:200,suv:250,pickup:300}}]});
const KT={E:null, fetchedAt:0, key:"", busy:false};
const ktCats=()=>CATS.map(c=>c.id);
const ktCopy=o=>JSON.parse(JSON.stringify(o));
/* ---------- Versiones ---------- */
function ktLista(){ return CFON()?((S.catRemote&&S.catRemote.versiones)||[]):(Array.isArray(S.catalogos)?S.catalogos:[]); }
function ktVigente(t){ let c=KT_INICIAL; for(const v of ktLista()) if(!v.cancelado&&v.desde<=t&&(v.desde>c.desde||(v.desde===c.desde&&v.version>c.version))) c=v; return c; }
const ktProgramados=()=>ktLista().filter(v=>!v.cancelado&&v.desde>nowMs()).sort((a,b)=>a.desde-b.desde);
/* Tablas de la app a partir de una versión. Los nombres de paquetes incluyen todos los que existieron (para el historial). */
function ktTablas(c){
  const pk={}, pr={};
  for(const v of [KT_INICIAL,...ktLista()]) for(const p of v.paquetes) pk[p.id]={name:p.nombre};
  for(const p of c.paquetes){ pk[p.id]={name:p.nombre}; pr[p.id]=Object.assign({},p.precios); }
  const pair=k=>[k,KT_COMPONENTES[k]||k], base=c.paquetes.find(p=>p.id===KT_BASE), sup=c.paquetes.find(p=>p.id==="super");
  return deepFreeze({PKGS:pk, PRICES:pr, EXTRAS:c.extras.filter(x=>x.activo).map(x=>({id:x.id,name:x.nombre,p:Object.assign({},x.precios)})),
    COMP_ALAGA:(base?base.componentes:KT_COMP_BASE).map(pair), COMP_SUPER:(sup?sup.componentes.filter(k=>!base||!base.componentes.includes(k)):[]).map(pair)});   // congeladas: nadie las altera desde la página
}
function ktUsar(T){ PKGS=T.PKGS; PRICES=T.PRICES; EXTRAS=T.EXTRAS; COMP_ALAGA=T.COMP_ALAGA; COMP_SUPER=T.COMP_SUPER; }
/* Las tablas «actuales» siguen al catálogo vigente ahora (cambia solo a la hora programada). */
function ktSync(){ const c=ktVigente(nowMs()), k=c.version+"|"+ktLista().length; if(k!==KT.key){ KT.key=k; KT.cur=c; ktUsar(ktTablas(c)); } return c; }
/* Ejecuta fn con las tablas del catálogo con que entró un auto (por su hora de recepción). */
function ktCon(t,fn){ if(!t||!t.createdAt) return fn(); ktSync(); const c=ktVigente(t.createdAt), prevCtx=KT.ctx; KT.ctx=c;
  if(c===KT.cur){ try{ return fn(); } finally{ KT.ctx=prevCtx; } }
  const save={PKGS,PRICES,EXTRAS,COMP_ALAGA,COMP_SUPER}; ktUsar(ktTablas(c)); try{ return fn(); } finally{ ktUsar(save); KT.ctx=prevCtx; } }
/* Paquete que cubre la lealtad (mismas reglas que la caja fuerte): el marcado si está activo y aplica; si no, el activo más barato. */
function ktLeal(c,cat){ const m=c.paquetes.find(p=>p.id===(c.lealtad||"alaga"));
  if(m&&m.activo&&m.precios[cat]!=null) return m;
  return c.paquetes.filter(p=>p.activo&&p.precios[cat]!=null).sort((a,b)=>a.precios[cat]-b.precios[cat])[0]||null; }
/* Precio que cubre el beneficio para un tipo de vehículo, con el catálogo del auto en curso (o el vigente). */
function ktCubre(cat){ const c=KT.ctx||ktSync(), p=ktLeal(c,cat); return p?p.precios[cat]:Infinity; }
/* Paquetes que se ofrecen en recepción para un tipo de vehículo (activos y con precio para ese tipo). */
function catPkgIds(cat){ const c=ktSync(); return c.paquetes.filter(p=>p.activo&&p.precios[cat]!=null).map(p=>p.id); }
function catComps(k){ const c=ktSync(), p=c.paquetes.find(x=>x.id===k); if(!p) return [];
  const base=c.paquetes.find(x=>x.id===KT_BASE), all=k!==KT_BASE&&base&&base.componentes.every(x=>p.componentes.includes(x));
  return all?[["_all","Todo lo del "+base.nombre],...p.componentes.filter(x=>!base.componentes.includes(x)).map(x=>[x,KT_COMPONENTES[x]||x])]:p.componentes.map(x=>[x,KT_COMPONENTES[x]||x]); }
function ktCompTxt(k){ const l=catComps(k); return l[0]&&l[0][0]==="_all"?` · ${l[0][1].replace("Todo lo del ","")} + ${l.length-1} componente${l.length-1===1?"":"s"}`:` · ${l.length} componente${l.length===1?"":"s"}`; }
/* Componentes de un auto según el catálogo con que entró. */
function catCompsT(t){ return ktCon(t,()=>{ const c=ktVigente(t.createdAt||nowMs()), p=c.paquetes.find(x=>x.id===t.pkg); return (p?p.componentes:KT_COMP_BASE).map(x=>[x,KT_COMPONENTES[x]||x]); }); }

/* ---------- Precios de cada auto: los de su catálogo ---------- */
{ const _tl=ticketLines; ticketLines=t=>ktCon(t,()=>_tl(t)); }
{ const _pa=promoAmount; promoAmount=(t,rule)=>ktCon(t,()=>_pa(t,rule)); }
{ const _r=render; render=f=>{ ktSync(); return _r(f); }; }
ktSync();

/* ---------- Conectado: el catálogo viene de la caja fuerte ---------- */
async function ktFetch(force){
  if(!CFON()||!CF.cli||!CF.cli.token||KT.busy) return;
  if(!force&&Date.now()-KT.fetchedAt<60000) return;
  KT.busy=true;
  try{ const r=await CF.cli._req("GET","/api/catalogo"); KT.fetchedAt=Date.now();
    const n=JSON.stringify(r.versiones||[]); if(n!==JSON.stringify((S.catRemote||{}).versiones||[])){ S.catRemote={versiones:r.versiones||[]}; save(); KT.key=""; ktSync(); if(!layerOpen&&["catalog","home"].includes(R.name)) render(); } }
  catch(e){} finally{ KT.busy=false; }
}
if(typeof cfRefreshCaja==="function"){ const _rc=cfRefreshCaja; cfRefreshCaja=async function(){ const r=await _rc.apply(this,arguments); ktFetch(); return r; }; }

/* ---------- Vista del catálogo ---------- */
const ktFecha=t=>new Date(t).toLocaleString("es-MX",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function vCatalog(){
  const c=ktSync(), prog=ktProgramados(), cats=CATS;
  const pk=c.paquetes.filter(p=>p.activo), off=c.paquetes.filter(p=>!p.activo&&!p.retirado);
  const exOn=c.extras.filter(x=>x.activo), exOff=c.extras.filter(x=>!x.activo&&!x.retirado);
  const precio=(v,c2)=>v[c2]!=null?`${c2==="rzr"?"<small>Desde&nbsp;</small>":""}${money(v[c2])}`:`<span class="kt-na">—</span>`;
  return `<div class="view kt-view">
  <header class="appbar plain"><div class="row"><div class="ttl"><h1>Catálogo</h1><small>${c.version?`Versión ${c.version} · vigente desde ${esc(ktFecha(c.desde))}`:"Precios de la lona · versión inicial"}${CFON()?"":" · DEMO"}</small></div></div></header>
  <main class="content">
    ${prog.length?`<div class="section-h"><h2>Cambios programados</h2></div><div class="list kt-prog">${prog.map(v=>`<div class="li"><span class="tx"><b>Versión ${v.version} · desde ${esc(ktFecha(v.desde))}</b><small>${esc(v.byName||v.por||"")}${v.nota?" · "+esc(v.nota):""}</small></span><button class="btn secondary kt-sm" data-a="ktCancelar" data-v="${v.version}">Cancelar</button></div>`).join("")}</div>`:""}
    <div class="section-h"><h2>Paquetes</h2></div>
    <div class="card kt-tabla"><div class="kt-row kt-h"><span>Tipo</span>${pk.map(p=>`<span>${esc(p.nombre)}</span>`).join("")}</div>
      ${cats.map(k=>`<div class="kt-row"><span class="kt-cat">${vic(k.id)}<b>${esc(k.name.replace(" / compacto",""))}</b></span>${pk.map(p=>`<span class="tnum">${precio(p.precios,k.id)}</span>`).join("")}</div>`).join("")}</div>
    ${pk.map(p=>`<details class="card pad kt-comp"><summary><b>${esc(p.nombre)}</b> · ${p.componentes.length} componentes${p.id===(c.lealtad||"alaga")?' <span class="badge neutral">Cubre lealtad</span>':""}</summary><ul class="comp">${catComps(p.id).map(([,n])=>`<li>${ic("check")}${esc(n)}</li>`).join("")}</ul></details>`).join("")}
    ${off.length?`<p class="help">Desactivados: ${off.map(p=>esc(p.nombre)).join(", ")}.</p>`:""}
    <div class="section-h"><h2>Servicios extra</h2></div>
    <div class="card kt-tabla"><div class="kt-row kt-h"><span>Servicio</span>${["sedan","suv","pickup","moto"].map(k=>`<span>${esc(catOf(k).name.replace(" / compacto",""))}</span>`).join("")}</div>
      ${exOn.map(x=>`<div class="kt-row"><b class="kt-x">${esc(x.nombre)}</b>${["sedan","suv","pickup","moto"].map(k=>`<span class="tnum">${precio(x.precios,k)}</span>`).join("")}</div>`).join("")||`<p class="help kt-pad">Sin extras activos.</p>`}</div>
    ${exOff.length?`<p class="help">Desactivados: ${exOff.map(x=>esc(x.nombre)).join(", ")}.</p>`:""}
    <p class="help">Un auto ya recibido conserva los precios con que entró. ${(()=>{ const m=c.paquetes.find(p=>p.id===(c.lealtad||"alaga")); return m&&m.activo?`El lavado gratis de lealtad cubre el ${esc(m.nombre)}.`:`El paquete marcado para lealtad${m?` (${esc(m.nombre)})`:""} está desactivado: el lavado gratis cubre el paquete activo más barato.`; })()}</p>
  </main>
  <div class="dock" id="dock"><button class="btn primary lg" data-a="ktEditar">${ic("edit")}Cambiar precios y paquetes</button></div>
  ${tabbar("catalog")}</div>`;
}

/* ---------- Editor ---------- */
const ktPad=n=>String(n).padStart(2,"0");
const ktLocal=t=>{ const d=new Date(t); return `${d.getFullYear()}-${ktPad(d.getMonth()+1)}-${ktPad(d.getDate())}T${ktPad(d.getHours())}:${ktPad(d.getMinutes())}`; };
function vCatEdit(){
  const E=KT.E; if(!E) return vCatalog();
  const cats=ktCats(), pin=(scope,i,k,v,ph)=>`<label class="kt-in"><span>${esc(catOf(k).name.replace(" / compacto",""))}</span><input class="input tnum" inputmode="numeric" data-kt="${scope}.${i}.${k}" value="${v!=null?v:""}" placeholder="${ph}" autocomplete="off"></label>`;
  const paq=(p,i)=>`<div class="card kt-ed ${p.activo?"":"kt-off"}">
    <div class="kt-edh"><input class="input" data-kt="pn.${i}" value="${esc(p.nombre)}" maxlength="40" placeholder="Nombre del paquete" aria-label="Nombre del paquete">
      <button class="chip kt-tog" data-a="ktAct" data-t="p" data-i="${i}" aria-pressed="${p.activo}">${p.activo?"Activo":"Desactivado"}</button></div>
    ${p.nuevo?`<p class="help kt-new">Nuevo · aún no publicado</p>`:""}
    <div class="kt-grid">${cats.map(k=>pin("pp",i,k,p.precios[k],"—")).join("")}</div>
    <p class="help kt-h2">Deja vacío un tipo de vehículo si el paquete no aplica.</p>
    <button class="xrow kt-leal" data-a="ktLealSel" data-i="${i}" role="radio" aria-checked="${E.lealtadIdx===i}"><span class="cbox">${ic("check")}</span><span class="nm">Cubre el lavado gratis de lealtad<small>${E.lealtadIdx===i?(p.activo?"Este paquete cubre el beneficio":"Desactivado: cubrirá el paquete activo más barato"):"Toca para que este paquete cubra el beneficio"}</small></span></button>
    <div class="eyebrow kt-eb">Componentes</div>
    <div class="chips kt-chips">${Object.entries(KT_COMPONENTES).map(([k,n])=>`<button class="chip" data-a="ktComp" data-i="${i}" data-c="${k}" aria-pressed="${p.componentes.includes(k)}">${esc(n)}</button>`).join("")}</div>
    ${quitar("p",i,p)}</div>`;
  /* Lo nuevo (sin publicar) se quita sin rastro; lo que ya existió se retira (descontinuado para siempre, restaurable). */
  const quitar=(t,i,o)=>`<div class="kt-foot">${o.nuevo
    ?`<button class="btn ghost kt-del" data-a="ktQuitar" data-t="${t}" data-i="${i}">${ic("trash","sm")}Quitar ${t==="p"?"este paquete":"este extra"}</button>`
    :`<button class="btn ghost kt-del" data-a="ktRetirar" data-t="${t}" data-i="${i}">${ic("trash","sm")}Retirar para siempre</button>`}</div>`;
  const retirados=(t,l)=>{ const r=l.map((o,i)=>[o,i]).filter(([o])=>o.retirado); return r.length?`<details class="card kt-ret"><summary>Retirados (${r.length})</summary>
    <p class="help">Descontinuados: no aparecen en recepción ni en el catálogo. Siguen en el historial de los tickets que los usaron.</p>
    ${r.map(([o,i])=>`<div class="kt-retrow"><span>${esc(o.nombre)}</span><button class="btn secondary kt-sm" data-a="ktRestaurar" data-t="${t}" data-i="${i}">Restaurar</button></div>`).join("")}</details>`:""; };
  const ext=(x,i)=>`<div class="card kt-ed ${x.activo?"":"kt-off"}">
    <div class="kt-edh"><input class="input" data-kt="xn.${i}" value="${esc(x.nombre)}" maxlength="40" placeholder="Nombre del extra" aria-label="Nombre del extra">
      <button class="chip kt-tog" data-a="ktAct" data-t="x" data-i="${i}" aria-pressed="${x.activo}">${x.activo?"Activo":"Desactivado"}</button></div>
    ${x.nuevo?`<p class="help kt-new">Nuevo · aún no publicado</p>`:""}
    <div class="kt-grid">${["sedan","suv","pickup","moto"].map(k=>pin("xp",i,k,x.precios[k],"—")).join("")}</div>
    ${quitar("x",i,x)}</div>`;
  return `<div class="view kt-view">
  <header class="appbar"><div class="row"><button class="iconbtn" data-a="ktSalir" aria-label="Volver al catálogo">${ic("back")}</button><div class="ttl"><h1>Cambiar catálogo</h1><small>Precios en pesos · ${CFON()?"se guarda en la caja fuerte":"DEMO"}</small></div></div></header>
  <main class="content"><div class="rxwrap">
    ${E.err?`<div class="banner warn" role="alert">${ic("alert")}<div>${esc(E.err)}</div></div>`:""}
    <div class="section-h"><h2>Paquetes</h2></div>
    ${E.paquetes.map((p,i)=>p.retirado?"":paq(p,i)).join("")}
    <button class="btn secondary" data-a="ktAdd" data-t="p">${ic("plus")}Agregar paquete</button>
    ${retirados("p",E.paquetes)}
    <div class="section-h"><h2>Servicios extra</h2></div>
    ${E.extras.map((x,i)=>x.retirado?"":ext(x,i)).join("")}
    <button class="btn secondary" data-a="ktAdd" data-t="x">${ic("plus")}Agregar extra</button>
    ${retirados("x",E.extras)}
    <p class="help">Los extras no aplican a RZR (lleva ajuste por condición). Lo nuevo que aún no publicas se quita sin dejar rastro; lo que ya se publicó se retira (deja de verse, pero sigue en el historial de sus tickets).</p>
    <div class="section-h"><h2>¿Desde cuándo?</h2></div>
    <div class="seg" role="group" aria-label="Cuándo aplica"><button data-a="ktCuando" data-v="ahora" aria-pressed="${E.cuando==="ahora"}">Ahora</button><button data-a="ktCuando" data-v="prog" aria-pressed="${E.cuando==="prog"}">Programar</button></div>
    ${E.cuando==="prog"?`<div class="field kt-when"><label for="kt-fecha">Fecha y hora de inicio</label><input id="kt-fecha" class="input" type="datetime-local" data-kt="fecha" value="${esc(E.fecha)}"></div>`:""}
    <div class="field"><label for="kt-nota">Nota <span class="opt">(opcional)</span></label><input id="kt-nota" class="input" data-kt="nota" value="${esc(E.nota)}" maxlength="200" placeholder="Ej. ajuste de precios de diciembre"></div>
    <p class="help">Los autos ya recibidos conservan sus precios. El lavado gratis de lealtad cubre el paquete marcado; si está desactivado o no aplica, el paquete activo más barato.</p>
  </div></main>
  <div class="dock" id="dock"><div class="rxwrap"><button class="btn primary lg" data-a="ktRevisar">${ic("check")}Revisar y publicar</button></div></div></div>`;
}
document.addEventListener("input",e=>{ const k=e.target&&e.target.dataset&&e.target.dataset.kt, E=KT.E; if(!k||!E) return; const v=e.target.value;
  const m=/^(pp|xp)\.(\d+)\.(\w+)$/.exec(k);
  if(m){ const o=(m[1]==="pp"?E.paquetes:E.extras)[Number(m[2])]; if(!o) return; const t=v.replace(/[^\d]/g,""); if(t==="") delete o.precios[m[3]]; else o.precios[m[3]]=Number(t); return; }
  const n=/^(pn|xn)\.(\d+)$/.exec(k); if(n){ const o=(n[1]==="pn"?E.paquetes:E.extras)[Number(n[2])]; if(o) o.nombre=v; return; }
  E[k]=v; });

/* Validación (las mismas reglas que la caja fuerte; allá se vuelve a validar). */
function ktValidar(E){
  const ids=new Set(), slug=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,16)||"item";
  const uid=(pre,s)=>{ let b=slug(s), id=b, n=2; while(ids.has(pre+id)) id=(b.slice(0,14)+"_"+n++); return id; };
  E.paquetes.forEach(p=>{ if(!p.nuevo) ids.add("p:"+p.id); }); E.extras.forEach(x=>{ if(!x.nuevo) ids.add("x:"+x.id); });
  const nom=(s,l)=>{ s=String(s||"").replace(/\s+/g," ").trim(); if(s.length<2||s.length>40) throw new Error(`${l}: el nombre debe tener entre 2 y 40 caracteres.`); return s; };
  const pr=(o,l,todos)=>{ const r={}; for(const k of Object.keys(o)){ const v=o[k]; if(!Number.isInteger(v)||v<1||v>99999) throw new Error(`${l} (${catOf(k).name}): precio entre $1 y $99,999.`); r[k]=v; }
    if(todos) for(const k of ktCats()) if(r[k]==null) throw new Error(`${l}: falta el precio para ${catOf(k).name}.`);
    if(!Object.keys(r).length) throw new Error(`${l}: indica al menos un precio.`); return r; };
  const paquetes=E.paquetes.map((p,i)=>{ const L=p.nombre||`Paquete ${i+1}`; const id=p.nuevo?uid("p:",p.nombre):p.id; ids.add("p:"+id);
    if(!p.componentes.length) throw new Error(`${L}: elige al menos un componente.`);
    return {id, nombre:nom(p.nombre,`Paquete ${i+1}`), activo:!p.retirado&&!!p.activo, ...(p.retirado?{retirado:true}:{}), precios:pr(p.precios,L,false), componentes:p.componentes.slice()}; });
  if(!paquetes.some(p=>p.activo)) throw new Error("Deja al menos un paquete activo.");
  const lp=paquetes[E.lealtadIdx]||{}, lealtad=lp.id; if(!lealtad||lp.retirado) throw new Error("Marca qué paquete cubre el lavado gratis de lealtad.");
  const extras=E.extras.map((x,i)=>{ const L=x.nombre||`Extra ${i+1}`; const id=x.nuevo?uid("x:",x.nombre):x.id; ids.add("x:"+id);
    return {id, nombre:nom(x.nombre,`Extra ${i+1}`), activo:!x.retirado&&!!x.activo, ...(x.retirado?{retirado:true}:{}), precios:pr(x.precios,L,false)}; });
  let desde=nowMs();
  if(E.cuando==="prog"){ const t=new Date(E.fecha).getTime(); if(!Number.isFinite(t)) throw new Error("Elige la fecha y hora de inicio."); if(t<nowMs()-60000) throw new Error("La fecha de inicio ya pasó."); if(t>nowMs()+366*864e5) throw new Error("Máximo un año a futuro."); desde=t; }
  return {desde, paquetes, extras, lealtad, nota:String(E.nota||"").trim().slice(0,200)};
}
/* Resumen de cambios para confirmar (contra la última versión: la vigente o la programada más reciente). */
function ktResumen(nv){
  const prev=ktUltima(), out=[], cn=k=>catOf(k).name.replace(" / compacto","");
  const cmp=(a,b,tipo)=>{ for(const n of b){ const o=a.find(x=>x.id===n.id);
    if(!o){ out.push(`${tipo} nuevo: <b>${esc(n.nombre)}</b>`); continue; }
    if(o.nombre!==n.nombre) out.push(`${esc(o.nombre)} → <b>${esc(n.nombre)}</b>`);
    if(!!o.retirado!==!!n.retirado){ out.push(`${esc(n.nombre)}: <b>${n.retirado?"retirado para siempre":"restaurado"+(n.activo?" y activado":" (desactivado)")}</b>`); continue; }
    if(o.activo!==n.activo) out.push(`${esc(n.nombre)}: <b>${n.activo?"activado":"desactivado"}</b>`);
    for(const k of ktCats()) if(o.precios[k]!==n.precios[k]) out.push(`${esc(n.nombre)} · ${cn(k)}: ${o.precios[k]!=null?money(o.precios[k]):"—"} → <b>${n.precios[k]!=null?money(n.precios[k]):"no aplica"}</b>`);
    if(n.componentes&&o.componentes&&JSON.stringify(o.componentes)!==JSON.stringify(n.componentes)) out.push(`${esc(n.nombre)}: componentes cambiados`); } };
  cmp(prev.paquetes,nv.paquetes,"Paquete"); cmp(prev.extras,nv.extras,"Extra");
  if((prev.lealtad||"alaga")!==nv.lealtad){ const n=nv.paquetes.find(p=>p.id===nv.lealtad); out.push(`Lealtad: el lavado gratis cubre <b>${esc(n?n.nombre:nv.lealtad)}</b>`); }
  return out;
}
/* Si el paquete de lealtad se quita o se retira: el primero activo (o el primero no retirado). */
function ktLealDefault(E){ let i=E.paquetes.findIndex(p=>p.activo&&!p.retirado); if(i<0) i=E.paquetes.findIndex(p=>!p.retirado); return Math.max(i,0); }
function ktUltima(){ let u=ktSync(); for(const v of ktProgramados()) if(v.desde>=u.desde) u=v; return u; }

Object.assign(A,{
  ktEditar(){ const b=ktUltima(), li=b.paquetes.findIndex(p=>p.id===(b.lealtad||"alaga"));
    KT.E={paquetes:ktCopy(b.paquetes), extras:ktCopy(b.extras), lealtadIdx:li<0?0:li, cuando:"ahora", fecha:ktLocal(nowMs()+3600e3), nota:"", err:""}; go({name:"catedit"}); },
  ktLealSel(d){ KT.E.lealtadIdx=Number(d.i); render(); },
  ktSalir(){ KT.E=null; go({name:"catalog"},true); },
  ktAct(d){ const o=(d.t==="p"?KT.E.paquetes:KT.E.extras)[Number(d.i)]; if(o){ o.activo=!o.activo; render(); } },
  ktComp(d){ const p=KT.E.paquetes[Number(d.i)]; if(!p) return; const i=p.componentes.indexOf(d.c); i<0?p.componentes.push(d.c):p.componentes.splice(i,1);
    p.componentes.sort((a,b)=>Object.keys(KT_COMPONENTES).indexOf(a)-Object.keys(KT_COMPONENTES).indexOf(b)); render(); },
  ktAdd(d){ if(d.t==="p") KT.E.paquetes.push({id:"",nuevo:true,nombre:"",activo:true,precios:{},componentes:KT_COMP_BASE.slice()});
    else KT.E.extras.push({id:"",nuevo:true,nombre:"",activo:true,precios:{}}); render();
    setTimeout(()=>{ const l=document.querySelectorAll(`[data-kt^="${d.t==="p"?"pn":"xn"}."]`); const el=l[l.length-1]; el&&(el.focus(),el.scrollIntoView({block:"center"})); },60); },
  ktCuando(d){ KT.E.cuando=d.v; render(); },
  /* Quitar: solo lo agregado en esta edición (no existe en ninguna versión publicada). */
  ktQuitar(d){ const E=KT.E, l=d.t==="p"?E.paquetes:E.extras, i=Number(d.i), o=l[i]; if(!o||!o.nuevo) return;
    l.splice(i,1);
    if(d.t==="p"){ if(E.lealtadIdx===i) E.lealtadIdx=ktLealDefault(E); else if(E.lealtadIdx>i) E.lealtadIdx--; }
    render(); toast(`${d.t==="p"?"Paquete":"Extra"} quitado`); },
  async ktRetirar(d){ const E=KT.E, l=d.t==="p"?E.paquetes:E.extras, i=Number(d.i), o=l[i]; if(!o||o.nuevo) return;
    const ok=await confirmBox(`¿Retirar ${String(o.nombre||"este "+(d.t==="p"?"paquete":"extra")).trim()}?`,`Deja de aparecer en recepción y en el catálogo. Los tickets que ya lo usaron lo conservan en su historial.<br><br>Si fue un error, podrás restaurarlo en «Retirados». El cambio se aplica al publicar.`,"Retirar",true);
    if(!ok) return; o.retirado=true; o.activo=false;
    if(d.t==="p"&&E.lealtadIdx===i) E.lealtadIdx=ktLealDefault(E);
    render(); },
  ktRestaurar(d){ const o=(d.t==="p"?KT.E.paquetes:KT.E.extras)[Number(d.i)]; if(!o) return; delete o.retirado; o.activo=false; render(); toast("Restaurado · queda desactivado hasta que lo actives"); },
  async ktRevisar(){ const E=KT.E; let nv; E.err="";
    try{ nv=ktValidar(E); }catch(e){ E.err=e.message; render(); window.scrollTo(0,0); return; }
    const res=ktResumen(nv);
    if(!res.length){ E.err="No hay cambios respecto al catálogo actual."; render(); window.scrollTo(0,0); return; }
    const ok=await confirmBox("¿Publicar el catálogo?",`<span class="kt-res">${res.slice(0,12).map(x=>"• "+x).join("<br>")}${res.length>12?`<br>… y ${res.length-12} cambios más`:""}</span><br><br>Aplica: <b>${E.cuando==="prog"?esc(ktFecha(nv.desde)):"desde ahora"}</b>. Los autos ya recibidos conservan sus precios.`,"Publicar");
    if(!ok) return;
    if(!CFON()){ const l=Array.isArray(S.catalogos)?S.catalogos:(S.catalogos=[]); l.push(Object.assign({version:l.length+1,byName:"Operador DEMO",at:nowMs()},nv)); save(); KT.key=""; KT.E=null; go({name:"catalog"},true); return toast(`Catálogo publicado · versión ${l.length}`); }
    try{ const r=await CF.cli._req("POST","/api/eventos",{eventos:[{id:CajaFuerteCliente.uuid(),type:"catalogo.publicar",data:nv,at:nowMs()}]}); const x=r.resultados[0];
      if(x.estado!=="aceptado") throw new Error(x.error||"La caja fuerte no lo aceptó.");
      await ktFetch(true); KT.E=null; go({name:"catalog"},true); toast(`Catálogo publicado · versión ${x.resultado.version}`); }
    catch(e){ E.err=e&&e.message||"Sin conexión con la caja fuerte: el catálogo se publica con conexión."; render(); window.scrollTo(0,0); } },
  async ktCancelar(d){ const v=Number(d.v);
    if(!(await confirmBox("¿Cancelar este cambio programado?",`La versión ${v} no se aplicará. Queda registrado.`,"Cancelar cambio",true))) return;
    if(!CFON()){ const c=ktLista().find(x=>x.version===v); if(c){ c.cancelado={at:nowMs(),by:"Operador DEMO"}; save(); KT.key=""; render(); toast("Cambio programado cancelado"); } return; }
    try{ const r=await CF.cli._req("POST","/api/eventos",{eventos:[{id:CajaFuerteCliente.uuid(),type:"catalogo.cancelar",data:{version:v},at:nowMs()}]}); const x=r.resultados[0];
      if(x.estado!=="aceptado") throw new Error(x.error); await ktFetch(true); render(); toast("Cambio programado cancelado"); }
    catch(e){ toast(e&&e.message||"Sin conexión con la caja fuerte."); } },
});
</script>
<script id="modo-patio-js">
"use strict";
/* =====================================================================
   v0.5 · Modo patio — la pestaña «Patio» reemplaza a «Control» como pantalla de trabajo.
   Reutiliza el estado y las reglas de la app: S.vehicles, STAGES, ticketLines/ticketTotal, applic, toast, ticketSheet.
   Datos de Gand: 45 a 60 min por auto, 2 o 3 lavadores, UN auto a la vez; «Listo» sin aviso.
   Cobro dentro de la tarjeta SOLO en modo DEMO (mismas reglas que las pantallas de cobro).
   En modo conectado, «Cobrar» abre las pantallas de cobro ya probadas con la caja fuerte.
   ===================================================================== */
const PT_AVG=50, PT_WARN=45, PT_CRIT=60;
const PT_GRP={recibido:"esp",proceso:"lav",validacion:"lav",listo:"lis"};
const PT={f:"todos", open:null, selecting:false, sel:new Set(), when:0, inc:{}, prob:false, late:false, pay:{}, suppress:false};
const PT_STEPS=[["recibido","Recibido"],["lav","Lavando"],["listo","Listo"],["entregado","Entregado"]];

function ptSince(t,stages){ for(let i=t.log.length-1;i>=0;i--){ if(stages.includes(t.log[i][0])) return t.log[i][1]; } return t.createdAt; }
function ptStageSince(t){ return t.status==="recibido"?ptSince(t,["recibido"]):t.status==="listo"?ptSince(t,["listo"]):ptSince(t,["proceso","validacion"]); }
function ptMin(ms){ return Math.max(0,Math.floor((nowMs()-ms)/60000)); }
function ptNeedsPay(t){ return !!(t.pay&&t.pay.status==="pendiente"&&ticketTotal(t)>0); }
function ptQueue(list){
  const now=nowMs();
  const busy=list.filter(v=>PT_GRP[v.status]==="lav").reduce((s,v)=>s+Math.max(0,PT_AVG-ptMin(ptSince(v,["proceso"]))),0);
  const w=list.filter(v=>v.status==="recibido").sort((a,b)=>ptStageSince(a)-ptStageSince(b));
  const q={}; w.forEach((v,i)=>{ q[v.id]={turn:i+1, eta:now+(busy+i*PT_AVG)*60000}; });
  q.last=now+(busy+w.length*PT_AVG)*60000; return q;
}
function ptAct(t){
  const g=PT_GRP[t.status];
  if(g==="esp") return {label:"Iniciar", long:"Iniciar lavado", icon:"drop", cls:"dark"};
  if(g==="lav") return {label:"Revisar", long:"Inspeccionar", icon:"search", cls:"rev"};
  return ptNeedsPay(t)?{label:"Cobrar", long:"Cobrar y entregar", icon:"cash", cls:"primary"}:{label:"Entregar", long:"Entregar", icon:"key", cls:"primary"};
}
/* Componentes del paquete con que entró el auto (catálogo configurable, v0.9). */
function ptComps(t){ return catCompsT(t).filter(([k])=>applic(t.cat,k)!=="na"); }
function ptCompName(k){ return KT_COMPONENTES[k]||k; }

/* Cambios de etapa: se registran como en setStatus; «hace X min» guarda también la hora real de captura. */
function ptSnap(t){ return {status:t.status, log:t.log.map(x=>x.slice()), incidents:t.incidents?t.incidents.map(x=>Object.assign({},x)):t.incidents}; }
function ptRestore(t,s){ t.status=s.status; t.log=s.log; t.incidents=s.incidents; save(); render(); }
function ptMove(t,stages,minsAgo){
  const cap=nowMs(), lastAt=t.log.length?t.log[t.log.length-1][1]:t.createdAt;
  const at=Math.min(cap,Math.max(cap-(minsAgo||0)*60000,lastAt+1000));
  stages.forEach(s=>t.log.push(at<cap-30000?[s,at,cap]:[s,at]));
  t.status=stages[stages.length-1];
}

/* ---------- Vista ---------- */
function vPatio(){
  const list=S.vehicles.filter(v=>v.status!=="entregado");
  if(PT.open){ const o=S.vehicles.find(v=>v.id===PT.open.id); if(!o||o.status==="entregado") PT.open=null; }
  const Q=ptQueue(list), cnt={lis:0,lav:0,esp:0}; list.forEach(v=>cnt[PT_GRP[v.status]]++);
  const owed=list.filter(v=>v.status==="listo"&&ptNeedsPay(v)).reduce((s,v)=>s+ticketTotal(v),0);
  const st=stats(), ord={lis:0,lav:1,esp:2};
  const shown=list.filter(v=>PT.f==="todos"||PT_GRP[v.status]===PT.f).sort((a,b)=>(ord[PT_GRP[a.status]]-ord[PT_GRP[b.status]])||(ptStageSince(a)-ptStageSince(b)));
  const GH={lis:["Listos para entregar","var(--st-listo)"],lav:["Lavando","var(--st-proceso)"],esp:["Esperan lavado","var(--st-recibido)"]};
  let rows="", last=null;
  shown.forEach(t=>{ const g=PT_GRP[t.status];
    if(PT.f==="todos"&&g!==last){ rows+=`<h2 class="pt-group" style="--c:${GH[g][1]}">${GH[g][0]} · ${cnt[g]}${g==="esp"?` · el último termina aprox. ${hhmm(Q.last)}`:""}</h2>`; last=g; }
    rows+=ptCard(t,Q); });
  const tabs=[["todos","Todos",list.length,""],["lis","Entregar",cnt.lis,"lis"],["lav","Lavando",cnt.lav,"lav"],["esp","Esperan",cnt.esp,"esp"]];
  CUR.after=ptAfter;
  return `<div class="view pt-view ${PT.open?"pt-focus":""} ${PT.selecting?"pt-selecting":""}">
  <header class="pt-top"><div class="pt-bar"><h1>Patio</h1><span class="pt-clock tnum">${hhmm(nowMs())}</span>${CFON()?"":`<span class="demo-pill">DEMO</span>`}<span class="sp"></span>
    <button class="pt-ghost" data-a="ptSelMode" aria-pressed="${PT.selecting}">${PT.selecting?"Cancelar":"Seleccionar"}</button></div>
    <div class="pt-money"><span class="l">Por cobrar</span><b class="tnum">${money(owed)}</b><span class="r tnum">Cobrado hoy ${money(st.paid)}</span></div>
    <div class="pt-tabs" role="tablist" aria-label="Filtrar por etapa">${tabs.map(([id,l,n,c])=>`<button role="tab" class="${c}" data-a="ptF" data-f="${id}" aria-selected="${PT.f===id}"><b class="tnum">${n}</b>${l}</button>`).join("")}</div></header>

/* ---------- Abrir, cerrar y acciones ---------- */
function ptOpen(t,mode){
  PT.open={id:t.id,mode}; PT.when=0; PT.late=false; PT.prob=false; PT.inc={}; PT.pay={};
  if(mode==="insp"&&t._inc){ PT.inc=JSON.parse(JSON.stringify(t._inc)); PT.prob=Object.keys(PT.inc).length>0; }
  $("#toast").classList.remove("on"); render();
  const w=document.getElementById("pt-"+t.id);
  if(w){ w.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}); const f=w.querySelector(".pt-panel button, .pt-panel input"); if(f) f.focus({preventScroll:true}); }
}
function ptClose(){ const id=PT.open&&PT.open.id; PT.open=null; render(); const b=id&&document.querySelector(`[data-a="ptGo"][data-id="${id}"]`); if(b) b.focus({preventScroll:true}); }
function ptPrimary(t){
  if(!t||t.status==="entregado") return;
  const g=PT_GRP[t.status];
  if(g==="esp"){
    const busy=S.vehicles.filter(v=>PT_GRP[v.status]==="lav").length, snap=ptSnap(t);
    ptMove(t,["proceso"],0); PT.open=null; save(); render();
    return toast(`${vName(t)} → Lavando${busy?` · ojo: ya había ${busy} lavándose`:""}`,()=>{ ptRestore(t,snap); toast("Cambio deshecho"); });
  }
  if(g==="lav") return ptOpen(t,"insp");
  if(ptNeedsPay(t)){
    if(CFON()){ PT.open=null; return go({name:"ticket",id:t.id,view:"method",deliver:true}); }   // pantallas de cobro probadas con la caja fuerte
    return ptOpen(t,"pay");
  }
  return ptOpen(t,"deliver");
}
Object.assign(A,{
  ptF(d){ PT.f=d.f; PT.open=null; render(); },
  ptSelMode(){ PT.selecting=!PT.selecting; PT.sel.clear(); PT.when=0; PT.open=null; render(); },
  ptPick(d){ if(!PT.selecting) return; if(PT.sel.has(d.id)) PT.sel.delete(d.id); else PT.sel.add(d.id); render(); },
  ptWhen(d){ PT.when=Number(d.m)||0; document.querySelectorAll('[data-a="ptWhen"]').forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.m)===PT.when))); },
  ptLate(){ PT.late=!PT.late; if(!PT.late) PT.when=0; render(); },
  ptGo(d){ const t=S.vehicles.find(v=>v.id===d.id); if(d.from==="detail") PT.open=null; ptPrimary(t); },
  ptDetail(d){ if(PT.suppress||PT.selecting) return; const t=S.vehicles.find(v=>v.id===d.id); if(!t) return;
    if(PT.open&&PT.open.id===t.id&&PT.open.mode==="detail") return ptClose(); ptOpen(t,"detail"); },
  ptClose(){ ptClose(); },
  ptExp(d){ ticketSheet(d.id); },
  ptOld(){ PT.open=null; go({name:"control",filter:"activos"}); },
  ptDone(){ PT.open=null; go({name:"control",filter:"entregado"}); },
  ptProb(){ PT.prob=!PT.prob; render(); },
  ptInc(d){ if(PT.inc[d.k]) delete PT.inc[d.k]; else PT.inc[d.k]={reason:""}; render(); const f=document.getElementById("pti-"+d.k); if(f) f.focus({preventScroll:true}); },
  ptInspGo(d){
    const t=S.vehicles.find(v=>v.id===d.id); if(!t||PT_GRP[t.status]!=="lav") return;
    const bad=Object.entries(PT.inc).filter(([,v])=>!v.reason||v.reason.trim().length<3);
    if(bad.length){ const e=$("#ptIncErr"); if(e) e.innerHTML=`<div class="err">${ic("alert")}Escribe el motivo de cada incidencia (mínimo 3 letras).</div>`; const f=document.getElementById("pti-"+bad[0][0]); if(f) f.focus(); return; }
    const snap=ptSnap(t), n=Object.keys(PT.inc).length;
    t.incidents=Object.entries(PT.inc).map(([key,v])=>({key,reason:v.reason.trim()})); delete t._inc;
    ptMove(t,t.status==="proceso"?["validacion","listo"]:["listo"],PT.when);
    PT.open=null; save(); render();
    toast(`${vName(t)} → Listo${n?` · ${n} ${n===1?"incidencia":"incidencias"}`:""}`,()=>{ ptRestore(t,snap); toast("Cambio deshecho"); });
  },
  ptM(d){ PT.pay={m:d.m}; render(); const f=$("#ptRec")||$("#ptRef"); if(f) f.focus({preventScroll:true}); },
  ptQ(d){ PT.pay.rec=String(d.q); const i=$("#ptRec"); if(i) i.value=PT.pay.rec; ptReady(); },
  ptDeliverGo(d){
    const t=S.vehicles.find(v=>v.id===d.id); if(!t||t.status!=="listo"||ptNeedsPay(t)) return;
    const snap=ptSnap(t); ptMove(t,["entregado"],PT.when); PT.open=null; save(); render();
    toast(`${vName(t)} entregado`,()=>{ ptRestore(t,snap); toast("Entrega deshecha"); });
  },
  ptBatch(){
    const sel=S.vehicles.filter(v=>PT.sel.has(v.id)&&v.status!=="entregado"); const gs=[...new Set(sel.map(v=>PT_GRP[v.status]))];
    if(!sel.length||gs.length!==1||gs[0]==="lis") return;
    const snaps=sel.map(t=>[t,ptSnap(t)]);
    sel.forEach(t=>{ if(gs[0]==="esp") ptMove(t,["proceso"],PT.when); else { t.incidents=[]; delete t._inc; ptMove(t,t.status==="proceso"?["validacion","listo"]:["listo"],PT.when); } });
    PT.selecting=false; PT.sel.clear(); PT.when=0; save(); render();
    toast(`${gs[0]==="esp"?"Lavado iniciado":"Listos"} · ${sel.length} ${sel.length===1?"auto":"autos"}`,()=>{ snaps.forEach(([t,s])=>{ t.status=s.status; t.log=s.log; t.incidents=s.incidents; }); save(); render(); toast("Cambio deshecho"); });
  }
});

/* ---------- Cobro (solo DEMO): mismas validaciones que confirmCash / confirmCard ---------- */
function ptReady(){
  const t=PT.open&&S.vehicles.find(v=>v.id===PT.open.id); const sl=$("#ptSlide"); if(!t||!sl) return false;
  const P=PT.pay, tot=ticketTotal(t); let ok=false, why="";
  if(P.m==="efectivo"){ const raw=String(P.rec||"").trim(), r=Number(raw);
    ok=raw!==""&&/^\d+$/.test(raw)&&r>=tot; why=!raw?"Escribe cuánto recibiste (paso 2)":!/^\d+$/.test(raw)?"Escribe solo números enteros":"El monto no alcanza el total";
    const c=$("#ptChg"); if(c) c.innerHTML=!raw?"":ok?`<div class="pt-chg"><span>Cambio</span><b class="tnum">${money(r-tot)}</b></div>`:`<div class="pt-err">${/^\d+$/.test(raw)?`Faltan ${money(tot-r)}`:"Solo números enteros"}</div>`; }
  else if(P.m==="tarjeta"){ const ref=String(P.ref||"").trim().toUpperCase(), dup=ref&&S.vehicles.some(v=>v.pay&&v.pay.ref===ref);
    ok=ref.length>=4&&!dup; why=ref.length<4?"Escribe la referencia (paso 2)":"Referencia repetida";
    const e=$("#ptRefErr"); if(e) e.innerHTML=dup?`<div class="pt-err">La referencia ${esc(ref)} ya está registrada en otro ticket. Revisa el voucher.</div>`:""; }
  const n2=$("#ptN2"); if(n2){ n2.classList.toggle("ok",ok); n2.textContent=ok?"✓":"2"; }
  sl.classList.toggle("off",!ok); $("#ptSlideLbl").textContent=ok?`Desliza para cobrar ${money(tot)}`:why;
  return ok;
}
function ptCharge(){
  const t=PT.open&&S.vehicles.find(v=>v.id===PT.open.id); if(!t||t.status!=="listo"||!ptNeedsPay(t)) return;
  if(CFON()){ PT.open=null; return go({name:"ticket",id:t.id,view:"method",deliver:true}); }   // nunca cobra aquí con caja fuerte
  if(!ptReady()) return;
  const P=PT.pay, tot=ticketTotal(t);
  if(P.m==="efectivo"){ const r=Number(String(P.rec).trim()); t.pay={timing:"ahora",status:"pagado",method:"efectivo",received:r,change:r-tot,at:nowMs()}; }
  else { t.pay={timing:"ahora",status:"pagado",method:"tarjeta",ref:String(P.ref).trim().toUpperCase(),at:nowMs()}; }
  ptMove(t,["entregado"],0); PT.open=null; PT.pay={}; save(); render();
  toast(`${vName(t)} cobrado y entregado${t.pay.method==="efectivo"?` · cambio ${money(t.pay.change)}`:""}`);
}
function ptSlider(track,thumb,done){
  let x0=0,x=0,max=0,on=false; const fill=track.querySelector(".fill");
  const set=v=>{ thumb.style.left=(4+v)+"px"; fill.style.width=(64+v)+"px"; };
  thumb.addEventListener("pointerdown",e=>{ if(track.classList.contains("off")) return; on=true; x0=e.clientX-x; max=track.clientWidth-64; track.classList.remove("anim"); thumb.setPointerCapture(e.pointerId); });
  thumb.addEventListener("pointermove",e=>{ if(!on) return; x=Math.min(max,Math.max(0,e.clientX-x0)); set(x); });
  const end=()=>{ if(!on) return; on=false; track.classList.add("anim"); if(x>=max*.88){ set(max); setTimeout(done,180); } else { x=0; set(0); } };
  thumb.addEventListener("pointerup",end); thumb.addEventListener("pointercancel",end);
  thumb.addEventListener("click",e=>e.preventDefault());
  thumb.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&!track.classList.contains("off")){ e.preventDefault(); max=track.clientWidth-64; track.classList.add("anim"); set(max); setTimeout(done,200); } });
}

/* ---------- Después de dibujar: gestos y campos ---------- */
function ptAfter(){
  document.querySelectorAll(".pt-card").forEach(el=>{
    const id=el.dataset.id; let x0=0,y0=0,dx=0,drag=false,decided=false;
    el.addEventListener("click",e=>{ if(PT.open&&PT.open.id!==id&&!PT.selecting){ e.stopPropagation(); ptClose(); } },true);
    el.addEventListener("pointerdown",e=>{ if(PT.selecting||PT.open||e.target.closest(".pt-act")) return; x0=e.clientX; y0=e.clientY; dx=0; drag=true; decided=false; });
    el.addEventListener("pointermove",e=>{ if(!drag) return; const mx=e.clientX-x0, my=e.clientY-y0;
      if(!decided){ if(Math.abs(mx)<8&&Math.abs(my)<8) return; decided=true; if(Math.abs(my)>Math.abs(mx)||mx<0){ drag=false; return; } el.setPointerCapture(e.pointerId); el.classList.add("drag"); }
      dx=Math.max(0,mx); el.style.transform=`translateX(${dx}px)`; });
    el.addEventListener("pointerup",()=>{ if(!drag) return; drag=false; el.classList.remove("drag"); el.style.transform="";
      if(decided){ PT.suppress=true; setTimeout(()=>{ PT.suppress=false; },400); if(dx>el.offsetWidth*.38) ptPrimary(S.vehicles.find(v=>v.id===id)); } });
    el.addEventListener("pointercancel",()=>{ drag=false; el.classList.remove("drag"); el.style.transform=""; });
  });
  document.querySelectorAll("[data-pk]").forEach(inp=>inp.addEventListener("input",()=>{ const k=inp.dataset.pk; if(PT.inc[k]) PT.inc[k].reason=inp.value; }));
  const rec=$("#ptRec"); if(rec) rec.addEventListener("input",()=>{ const v=rec.value.replace(/\D/g,""); if(v!==rec.value) rec.value=v; PT.pay.rec=v; ptReady(); });
  const ref=$("#ptRef"); if(ref) ref.addEventListener("input",()=>{ PT.pay.ref=ref.value; ptReady(); });
  const sl=$("#ptSlide"); if(sl){ ptReady(); ptSlider(sl,$("#ptThumb"),ptCharge); }
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&R.name==="patio"&&PT.open&&!layerOpen) ptClose(); });
setInterval(()=>{ const a=document.activeElement;
  if(R.name==="patio"&&!PT.open&&!layerOpen&&!PT.selecting&&!document.querySelector(".pt-card.drag")&&!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))) render(); },30000);
</script>
<script id="clientes-js">
"use strict";
/* =====================================================================
   v0.6 · Directorio de clientes — pantalla «Clientes» (en Más) y enlace con la recepción.
   Decisiones de Gand (nov-2026):
   - Se puede modificar cualquier dato del cliente. Operación (encargado) y Administración pueden borrar, con motivo.
   - Una persona puede tener sedán y SUV: mismo nombre, mismo teléfono. El sistema NO se bloquea: agrega el vehículo a su ficha.
   - Las visitas pagadas de todos sus vehículos suman; el lavado gratis se usa con cualquiera de sus autos.
   Conectado: el directorio vive CIFRADO en la caja fuerte (cada cliente con su propia llave). Nada se guarda en el teléfono.
   DEMO: directorio ficticio en este navegador (sin cifrar), con las mismas reglas, para revisar el flujo en el teléfono.
   ===================================================================== */
const CL={q:"", res:null, busy:false, err:null, f:null, base:null, del:false, motivo:"", loy:null, sug:[], sugQ:"", rx:null, rxQ:"", loyV:new Map(), timer:null, saving:false};
const CL_VMAX=10;

/* ---------- Directorio DEMO (ficticio) ---------- */
function clSeed(){
  const v=(placa,cat,marca,modelo,color)=>({placa,cat,marca,modelo:modelo||"",color:color||"",notas:""});
  return [
    {id:"c1",ver:1,nombre:"Cliente Demo Navarro",telefono:"5500000001",correo:"",notas:"Ejemplo: dos vehículos, una sola tarjeta de lealtad.",aviso:true,vehiculos:[v("DEM-221-B","suv","Toyota","RAV4","Blanco"),v("DEM-905-N","sedan","Mazda","3","Rojo")]},
    {id:"c2",ver:1,nombre:"Cliente Demo Herrera",telefono:"5500000002",correo:"",notas:"Ejemplo: beneficio disponible, se puede usar con la moto.",aviso:true,vehiculos:[v("DEM-330-C","pickup","Chevrolet","S10","Gris"),v("DEM-77-H","moto","Italika","FT150","Negra")]},
    {id:"c3",ver:1,nombre:"Cliente Demo Pérez",telefono:"",correo:"",notas:"",aviso:false,vehiculos:[v("DEM-118-A","sedan","Honda","City","")]},
  ];
}
function clDemo(){ if(!Array.isArray(S.dir)){ S.dir=clSeed(); S.dirSeq=4; save(); } return S.dir; }
function clErr(status,msg,datos){ const e=new Error(msg); e.status=status; e.datos=datos||null; return e; }
const clPlano=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const clCopy=o=>JSON.parse(JSON.stringify(o));
function clResumen(c){ return {id:c.id,nombre:c.nombre,telefono:c.telefono,vehiculos:c.vehiculos.map(v=>({placa:v.placa,cat:v.cat,marca:v.marca,modelo:v.modelo,color:v.color}))}; }
/* Mismas reglas que la caja fuerte (src/clientes.js), para que la DEMO se comporte igual. */
function clValidar(x){
  const t=(v,max,label,req,min)=>{ v=String(v??"").replace(/\s+/g," ").trim(); if(req&&!v) throw clErr(422,`${label}: es obligatorio.`); if(v&&min&&v.length<min) throw clErr(422,`${label}: mínimo ${min} caracteres.`); if(v.length>max) throw clErr(422,`${label}: máximo ${max} caracteres.`); return v; };
  const nombre=t(x.nombre,60,"Nombre",true,2);
  let telefono=t(x.telefono,20,"Teléfono"); if(telefono){ const d=telefono.replace(/[\s().-]/g,""); if(!/^\+?\d{10,13}$/.test(d)) throw clErr(422,"Teléfono: escribe 10 dígitos (puede llevar lada internacional)."); telefono=d; }
  const correo=t(x.correo,80,"Correo").toLowerCase(); if(correo&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) throw clErr(422,"Correo: formato inválido.");
  const notas=t(x.notas,300,"Notas"); const seen=new Set();
  if((x.vehiculos||[]).length>CL_VMAX) throw clErr(422,`Máximo ${CL_VMAX} vehículos por cliente.`);
  const vehiculos=(x.vehiculos||[]).map((v,i)=>{ const L=`Vehículo ${i+1}`;
    const placa=t(v.placa,12,L+" · placa").toUpperCase();
    if(placa){ if(!/^[A-Z0-9-]{1,12}$/.test(placa)) throw clErr(422,`${L} · placa: solo letras, números y guiones.`); if(/^F-\d+$/.test(placa)) throw clErr(422,`${L} · placa: «${placa}» es un folio interno; deja la placa vacía si no tiene placas.`);
      const k=norm(placa); if(seen.has(k)) throw clErr(422,`La placa ${placa} está repetida en este cliente.`); seen.add(k); }
    const r={placa,cat:v.cat||"",marca:t(v.marca,30,L+" · marca"),modelo:t(v.modelo,30,L+" · modelo"),color:t(v.color,20,L+" · color"),notas:t(v.notas,120,L+" · notas")};
    if(!placa&&!r.marca&&!r.modelo) throw clErr(422,`${L}: indica al menos la placa o la marca.`); return r; });
  return {nombre,telefono,correo,notas,vehiculos,aviso:x.aviso===true};
}
function clDemoPlacas(id,datos,transferir){
  const mover=new Set((transferir||[]).map(norm));
  for(const v of datos.vehiculos){ if(!v.placa) continue; const k=norm(v.placa);
    const o=clDemo().find(c=>c.id!==id&&c.vehiculos.some(x=>norm(x.placa)===k));
    if(!o) continue;
    if(!mover.has(k)) throw clErr(409,`La placa ${v.placa} ya está registrada con otro cliente. Si el auto cambió de dueño, confirma que quieres moverla.`,{conflicto:{placa:v.placa,cliente:o.id}});
    o.vehiculos=o.vehiculos.filter(x=>norm(x.placa)!==k); o.ver++; }
}

/* ---------- Acceso al directorio (DEMO o caja fuerte) ---------- */
const DIR={
  async buscar(q){ if(CFON()) return CF.cli.clientesBuscar(q);
    const p=clPlano(q).trim(), w=p.split(/\s+/).filter(Boolean), dig=String(q).replace(/\D/g,""), pk=norm(q);
    if(p.replace(/\s/g,"").length<2) throw clErr(400,"Escribe al menos 2 caracteres para buscar.");
    return clDemo().filter(c=>w.every(x=>clPlano(c.nombre).includes(x))||(dig.length>=3&&c.telefono.includes(dig))||(pk.length>=2&&c.vehiculos.some(v=>norm(v.placa).includes(pk)))).slice(0,20).map(clResumen); },
  async porPlaca(p){ if(CFON()) return CF.cli.clientePorPlaca(p); const k=norm(p); const c=k&&clDemo().find(c=>c.vehiculos.some(v=>norm(v.placa)===k)); return c?clCopy(c):null; },
  async obtener(id){ if(CFON()) return CF.cli.cliente(id); const c=clDemo().find(c=>c.id===id); if(!c) throw clErr(404,"Cliente no encontrado."); return clCopy(c); },
  async crear(datos,o={}){ if(CFON()) return CF.cli.clienteCrear(datos,o);
    const d=clValidar(datos);
    if(d.telefono&&o.forzar!==true){ const dup=clDemo().find(c=>c.telefono===d.telefono); if(dup) throw clErr(409,`Ya existe un cliente con ese teléfono (${dup.nombre}). Agrega el vehículo a ese cliente o confirma que es otra persona.`,{duplicado:clResumen(dup)}); }
    const id="c"+(S.dirSeq=(S.dirSeq||clDemo().length+1)+1); clDemoPlacas(id,d,o.transferir);
    const c=Object.assign({id,ver:1},d); clDemo().unshift(c); save(); return clCopy(c); },
  async editar(id,ver,datos,o={}){ if(CFON()) return CF.cli.clienteEditar(id,ver,datos,o);
    const c=clDemo().find(c=>c.id===id); if(!c) throw clErr(404,"Cliente no encontrado."); if(c.ver!==ver) throw clErr(409,"Otro dispositivo modificó este cliente. Vuelve a abrirlo.");
    const d=clValidar(datos); clDemoPlacas(id,d,o.transferir); Object.assign(c,d,{ver:c.ver+1}); save(); return clCopy(c); },
  async borrar(id,motivo){ if(CFON()) return CF.cli.clienteBorrar(id,motivo);
    if(String(motivo||"").trim().length<5) throw clErr(422,"Motivo: mínimo 5 caracteres.");
    const i=clDemo().findIndex(c=>c.id===id); if(i<0) throw clErr(404,"Cliente no encontrado."); clDemo().splice(i,1); save(); return {ok:true}; },
};
const clMsg=e=>e&&e.status?e.message:(e&&/conexi|respondi/i.test(e.message||"")?"Sin conexión con la caja fuerte. El directorio solo funciona con conexión.":(e&&e.message)||"No se pudo completar.");
const clTel=t=>{ const d=String(t||""); return d.length===10?`${d.slice(0,2)} ${d.slice(2,6)} ${d.slice(6)}`:d; };
const clIni=n=>String(n||"?").trim().split(/\s+/).filter(w=>!/^(cliente|demo)$/i.test(w)).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
function clLoyClear(){ try{ if(typeof CF!=="undefined"&&CF.loy) CF.loy.clear(); }catch(e){} CL.loyV.clear(); }

/* ---------- Lealtad por cliente ---------- */
/* DEMO: suma las visitas pagadas de todos los vehículos del cliente en orden; un beneficio en cualquiera reinicia la cuenta. */
function clPlacasDe(plate){ const k=norm(plate); if(!k||CFON()) return null; const c=clDemo().find(c=>c.vehiculos.some(v=>norm(v.placa)===k)); return c?c.vehiculos.map(v=>norm(v.placa)).filter(Boolean):null; }
{ const _lc=loyaltyCount;
  loyaltyCount=p=>{ if(CFON()||!p) return _lc(p); const keys=clPlacasDe(p); if(!keys||keys.length<2) return _lc(p);
    const set=new Set(keys); let n=0;
    (S.history||[]).forEach(h=>{ if(set.has(norm(h.plate))) n+=h.loyaltyPrior||0; });
    S.vehicles.filter(t=>t.plate&&set.has(norm(t.plate))).sort((a,b)=>a.createdAt-b.createdAt).forEach(t=>{ if(t.loyalty&&t.loyalty.redeemed) n=0; else if(t.pay.status==="pagado") n+=1; });
    return n; }; }
/* Conectado: la caja fuerte responde cuántos vehículos suman ({vehiculos}); se recuerda para la nota de la tarjeta. */
if(typeof CajaFuerteCliente==="function"){ const _l=CajaFuerteCliente.prototype.lealtad;
  CajaFuerteCliente.prototype.lealtad=function(placa){ return _l.call(this,placa).then(r=>{ CL.loyV.set(norm(placa),r&&r.vehiculos||1); return r; }); }; }
function clLoyN(plate){ const k=norm(plate); if(!k) return 1; return CFON()?(CL.loyV.get(k)||1):((clPlacasDe(k)||[]).length||1); }
{ const _lb=loyaltyBlock;
  loyaltyBlock=D=>{ const h=_lb(D); const n=D&&D.mode==="plate"?clLoyN(D.plate):1; if(n<2) return h;
    const nm=CL.rx&&CL.rx.plate===norm(D.plate)?CL.rx.cli.nombre:"";
    return h.replace(/(<div class="blockh">[^]*?<\/div>)/,`$1<p class="cl-loynote">${ic("user","sm")}<span>Suma los lavados de ${n} vehículos${nm?` de <b>${esc(nm)}</b>`:" del mismo cliente"}. El beneficio se puede usar con cualquiera.</span></p>`); }; }

/* ---------- Pantalla: lista y búsqueda ---------- */
function vClientes(){
  CUR.after=()=>{ const i=$("#cl-q"); if(i&&!CL.q) i.focus({preventScroll:true}); };
  const r=CL.res;
  let body="";
  if(CL.err) body=`<div class="banner warn" role="alert">${ic("alert")}<div>${esc(CL.err)}</div></div>`;
  else if(CL.busy&&!r) body=`<p class="help cl-pad">Buscando…</p>`;
  else if(!r) body=`<div class="cl-empty">${ic("search")}<b>Busca por nombre, teléfono o placa</b><span>Mínimo 2 caracteres. ${CFON()?"Los datos se descifran en la caja fuerte solo para mostrarlos.":"DEMO: prueba con «Navarro», «0002» o «DEM-77»."}</span></div>`;
  else if(!r.length) body=`<div class="cl-empty">${ic("user")}<b>Sin clientes con «${esc(CL.q)}»</b><span>Puedes darlo de alta con el botón de abajo.</span></div>`;
  else body=`<div class="list cl-list">${r.map(c=>`<button class="li cl-row" data-a="clOpen" data-id="${esc(c.id)}"><span class="cl-av" aria-hidden="true">${esc(clIni(c.nombre))}</span>
    <span class="tx"><b>${esc(c.nombre)}</b><small>${c.telefono?esc(clTel(c.telefono)):"Sin teléfono"} · ${c.vehiculos.length} ${c.vehiculos.length===1?"vehículo":"vehículos"}</small>
    <span class="cl-plates">${c.vehiculos.slice(0,4).map(v=>`<span class="cl-plate">${vic(v.cat||"sedan")}${esc(v.placa||v.marca||"Sin placas")}</span>`).join("")}${c.vehiculos.length>4?`<span class="cl-plate">+${c.vehiculos.length-4}</span>`:""}</span></span>${ic("chev","chev")}</button>`).join("")}</div>`;
  return `<div class="view cl-view">
  <header class="appbar plain"><div class="row"><button class="iconbtn" data-a="tab" data-to="more" aria-label="Volver a Más">${ic("back")}</button><div class="ttl"><h1>Clientes</h1><small>${CFON()?"Directorio cifrado · caja fuerte":"DEMO · datos ficticios en este navegador"}</small></div></div></header>
  <main class="content">
    <div class="cl-search">${ic("search")}<input id="cl-q" class="input" type="search" value="${esc(CL.q)}" placeholder="Nombre, teléfono o placa" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar cliente"></div>
    <div id="cl-res" aria-live="polite">${body}</div>
  </main>
  <div class="dock" id="dock"><button class="btn primary lg" data-a="clNew">${ic("plus")}Nuevo cliente</button></div>
  ${tabbar("more")}</div>`;
}
function clSearchSoon(){ clearTimeout(CL.timer); CL.timer=setTimeout(clSearch,260); }
async function clSearch(){
  const q=CL.q.trim(); CL.err=null;
  if(clPlano(q).replace(/\s/g,"").length<2){ CL.res=null; return clPaintRes(); }
  CL.busy=true; const my=q;
  try{ const r=await DIR.buscar(q); if(my!==CL.q.trim()) return; CL.res=r; }catch(e){ if(my!==CL.q.trim()) return; CL.res=null; CL.err=clMsg(e); }
  finally{ CL.busy=false; }
  clPaintRes();
}
function clPaintRes(){ if(R.name!=="clientes") return; const box=$("#cl-res"); if(!box) return; const tmp=document.createElement("div"); tmp.innerHTML=vClientes(); const n=tmp.querySelector("#cl-res"); if(n) box.innerHTML=n.innerHTML; }

/* ---------- Pantalla: ficha del cliente (alta y edición) ---------- */
const clVacio=()=>({placa:"",cat:"",marca:"",modelo:"",color:"",notas:""});
function vCliente(){
  const f=CL.f; if(!f) return vClientes();
  const nuevo=!f.id, e=CL.err;
  CUR.after=()=>{ if(nuevo&&!f.nombre){ const i=$("#cl-nombre"); i&&i.focus({preventScroll:true}); } };
  const fld=(k,label,o={})=>`<div class="field"><label for="cl-${k}">${label}${o.req?` <span class="req" aria-hidden="true">*</span>`:` <span class="opt">(opcional)</span>`}</label>${o.area?`<textarea id="cl-${k}" class="input" data-cl="${k}" maxlength="${o.max}" placeholder="${o.ph||""}">${esc(f[k])}</textarea>`:`<input id="cl-${k}" class="input ${o.cls||""}" data-cl="${k}" value="${esc(f[k])}" maxlength="${o.max}" ${o.attrs||""} placeholder="${o.ph||""}" autocomplete="off">`}</div>`;
  const veh=(v,i)=>`<div class="card cl-veh" data-i="${i}">
    <div class="cl-vh"><span class="vico" style="--c:var(--gold)">${vic(v.cat||"sedan")}</span><b class="cl-vp">${esc(v.placa||"Sin placas")}</b><span class="sp"></span><button class="iconbtn" data-a="clVehDel" data-i="${i}" aria-label="Quitar vehículo ${i+1}">${ic("trash")}</button></div>
    <div class="field cl-pfield"><label for="cl-v${i}-placa">Placa</label><input id="cl-v${i}-placa" class="input plate" data-cl="v.${i}.placa" value="${esc(v.placa)}" maxlength="14" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="ABC123D"></div>
    <div class="cl-g2">
      <div class="field"><label for="cl-v${i}-marca">Marca</label><input id="cl-v${i}-marca" class="input" data-cl="v.${i}.marca" value="${esc(v.marca)}" maxlength="30" autocomplete="off" placeholder="Nissan"></div>
      <div class="field"><label for="cl-v${i}-modelo">Modelo</label><input id="cl-v${i}-modelo" class="input" data-cl="v.${i}.modelo" value="${esc(v.modelo)}" maxlength="30" autocomplete="off" placeholder="Versa"></div>
      <div class="field"><label for="cl-v${i}-color">Color</label><input id="cl-v${i}-color" class="input" data-cl="v.${i}.color" value="${esc(v.color)}" maxlength="20" autocomplete="off" placeholder="Gris"></div>
    </div>
    <div class="chips cl-cats" role="radiogroup" aria-label="Tipo del vehículo ${i+1}">${CATS.map(c=>`<button class="chip" role="radio" data-a="clVehCat" data-i="${i}" data-c="${c.id}" aria-checked="${v.cat===c.id}" aria-pressed="${v.cat===c.id}">${esc(c.name.replace(" / compacto",""))}</button>`).join("")}</div>
    <div class="field" style="margin-bottom:0"><label for="cl-v${i}-notas">Notas del vehículo <span class="opt">(opcional)</span></label><input id="cl-v${i}-notas" class="input" data-cl="v.${i}.notas" value="${esc(v.notas)}" maxlength="120" autocomplete="off" placeholder="Ej. rin delantero rayado"></div>
  </div>`;
  const conf=e&&e.datos&&e.datos.conflicto, dup=e&&e.datos&&e.datos.duplicado;
  const errBox=!e?"":`<div class="banner warn" role="alert">${ic("alert")}<div>${esc(e.message)}

    ${fld("notas","Notas",{area:true,max:300,ph:"Preferencias, indicaciones…"})}
    <div class="card" style="overflow:hidden"><button class="xrow" data-a="clAviso" role="checkbox" aria-checked="${!!f.aviso}"><span class="cbox">${ic("check")}</span><span class="nm">Aviso de privacidad entregado<small>El cliente conoce para qué se guardan sus datos</small></span></button></div>

/* ---------- Caja fuerte: cancelaciones, cambios y diferencias van a la bandeja en orden ---------- */
function cxQueue(){
  if(!CFON()||!CF.cli||!CF.cli.token||CF.stale) return 0;
  const inBox=new Set(CF.cli.pendientes().map(e=>e.id)); let n=0, dirty=false;
  const put=(type,data,at,id)=>{ if(inBox.has(id)) return true; try{ CF.cli.registrar(type,data,{at,id}); inBox.add(id); n++; return true; }
    catch(e){ if(/ya está en la bandeja/.test(e&&e.message)) return true; CF.err="No se pudo guardar en la bandeja de envío: "+(e&&e.message||e); return false; } };
  for(const t of [...S.vehicles,...cxCancelados()]){
    const c=t.cx; if(!c||!t.cf||!t.cf.tid||!t.cf.tq) continue;
    if(t.cf.cid&&!t.cf.cq) continue;   // primero debe ir el cobro principal
    for(const x of c.cambios){ if(x.local||x.q) continue; if(!put("ticket.cambiar",{ticket:t.cf.tid,cat:x.a.cat,pkg:x.a.pkg,extras:x.a.extras,razon:x.razon,nota:x.nota},x.at,x.id)) return n; x.q=1; dirty=true; }
    for(const x of c.difs){ if(x.q) continue; if(!x.sesion||!CF_METHOD[x.method]) continue;
      if(!put("cobro",{sesion:x.sesion,ticket:t.cf.tid,method:CF_METHOD[x.method],ref:String(x.ref||"").slice(0,40)},x.at,x.id)) return n; x.q=1; dirty=true; }
    if(c.cancel&&!c.cancel.local&&!c.cancel.q){ if(put("ticket.cancelar",{ticket:t.cf.tid,razon:c.cancel.razon,nota:c.cancel.nota},c.cancel.at,c.cancel.id)){ c.cancel.q=1; dirty=true; } }
  }
  if(dirty) cfSaveRaw();
  return n;
}

<script id="camara-js">
/* =====================================================================
   ALAGA SYSTEM v1.0 · Cámara en la recepción (decisiones de Gand, nov-2026)
   - Solo cámara en vivo: las fotos se toman dentro del sistema (no hay botón de galería ni de archivo).
   - Todas son reales: recorrido del vehículo (según su tipo), foto de cerca de cada daño y foto de objetos de valor.
   - Cada foto lleva un sello impreso en la imagen: placa, qué foto es, fecha y hora.
   - En el teléfono se guardan en IndexedDB solo hasta subirlas. Con la caja fuerte conectada se envían cifradas a la Mac
     (POST /api/fotos) en cuanto el ticket ya llegó; ahí se conservan 90 días. Al subirse, se borra la copia del teléfono.
   - Modo DEMO sin cámara (o pruebas automáticas sin cámara): se conserva la simulación anterior.
   ===================================================================== */
const CAM={stream:null, pidiendo:null, error:"", db:null, urls:[], subiendo:false, errSubida:""};
const CAM_MAX=1600, CAM_Q=.72;

/* ---------- Almacén local (IndexedDB) ---------- */
function camIDB(){
  if(CAM.db) return CAM.db;
  CAM.db=new Promise((ok,mal)=>{ if(!window.indexedDB) return mal(new Error("Este navegador no permite guardar fotos."));
    const r=indexedDB.open("alaga-fotos",1);
    r.onupgradeneeded=()=>{ const s=r.result.createObjectStore("fotos",{keyPath:"id"}); s.createIndex("clave","clave"); };
    r.onsuccess=()=>ok(r.result); r.onerror=()=>mal(r.error); });
  return CAM.db;
}
function camTx(modo,fn){ return camIDB().then(db=>new Promise((ok,mal)=>{ const tx=db.transaction("fotos",modo), st=tx.objectStore("fotos"); let out; const r=fn(st); if(r) r.onsuccess=()=>{ out=r.result; }; tx.oncomplete=()=>ok(out); tx.onerror=()=>mal(tx.error); tx.onabort=()=>mal(tx.error); })); }
const camGuardar=rec=>camTx("readwrite",st=>st.put(rec));
const camObtener=id=>camTx("readonly",st=>st.get(id));
const camBorrar=id=>id?camTx("readwrite",st=>st.delete(id)).catch(()=>{}):Promise.resolve();
const camDeClave=clave=>camTx("readonly",st=>st.index("clave").getAll(clave)).then(l=>l||[]);
const camTodas=()=>camTx("readonly",st=>st.getAll()).then(l=>l||[]);
const camUuid=()=>crypto.randomUUID?crypto.randomUUID():CajaFuerteCliente.uuid();

/* ---------- Cámara ---------- */
function camDisponible(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)&&window.isSecureContext!==false; }
function camMensaje(e){
  const n=e&&e.name||"";
  if(n==="NotAllowedError"||n==="SecurityError") return "Permiso de cámara negado. En iPhone: Ajustes › Safari › Cámara › Permitir. En Chrome: toca el candado junto a la dirección › Cámara › Permitir.";
  if(n==="NotFoundError"||n==="OverconstrainedError") return "No se encontró una cámara en este equipo.";
  if(n==="NotReadableError") return "La cámara está ocupada por otra app. Ciérrala e intenta de nuevo.";
  return "No se pudo abrir la cámara"+(e&&e.message?": "+e.message:".");
}
function camEncender(){
  if(CAM.stream&&CAM.stream.active) return Promise.resolve(CAM.stream);
  if(CAM.pidiendo) return CAM.pidiendo;
  if(!camDisponible()){ CAM.error="Este navegador no permite la cámara aquí (se necesita la conexión segura de la caja fuerte)."; return Promise.reject(new Error(CAM.error)); }
  CAM.pidiendo=navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false})
    .then(s=>{ CAM.stream=s; CAM.error=""; return s; })
    .catch(e=>{ CAM.error=camMensaje(e); throw e; })
    .finally(()=>{ CAM.pidiendo=null; });
  return CAM.pidiendo;
}
function camApagar(){ if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; } if(CAM.video){ CAM.video.srcObject=null; } }
/* ¿Se usa la cámara real? Con caja fuerte: siempre (si falla, no se puede seguir). En DEMO: solo si hay cámara. */
const camReal=()=>CFON()||!CAM.error;
function camSello(D,etiqueta){
  const id=D.mode==="noplate"?(D.noPlate&&D.noPlate.folio||"Sin placa"):(D.plate||"").toUpperCase();
  return `${id} · ${etiqueta} · ${new Date().toLocaleString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}`;
}
/* Espera (máx. 2 s) a que el video tenga imagen: justo después de conectarlo, su tamaño todavía es 0. */
function camListo(v){ if(v.videoWidth&&v.videoHeight) return Promise.resolve(); return new Promise(ok=>{ const t0=Date.now(), k=()=>v.videoWidth&&v.videoHeight||Date.now()-t0>2000?ok():setTimeout(k,50); k(); }); }
async function camCapturar(v,sello){
  await camListo(v);
  const w=v.videoWidth,h=v.videoHeight; if(!w||!h) throw new Error("La cámara aún no está lista.");
  const k=Math.min(1,CAM_MAX/Math.max(w,h)), c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
  const x=c.getContext("2d"); x.drawImage(v,0,0,c.width,c.height);
  const fs=Math.max(14,Math.round(c.width*.022)), band=Math.round(fs*1.9);
  x.fillStyle="rgba(0,0,0,.58)"; x.fillRect(0,c.height-band,c.width,band);
  x.fillStyle="#fff"; x.font=`600 ${fs}px -apple-system,"Segoe UI",Roboto,sans-serif`; x.textBaseline="middle"; x.fillText(sello,Math.round(fs*.6),c.height-band/2,c.width-fs);
  const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",CAM_Q));

async function camAlmacenar(D,tipo,slot,etiqueta,blob){

function camVideoFijo(){ if(!CAM.video){ const v=document.createElement("video"); v.className="camvid"; v.playsInline=true; v.muted=true; v.autoplay=true; v.setAttribute("playsinline",""); v.setAttribute("muted",""); v.setAttribute("aria-hidden","true"); CAM.video=v; } return CAM.video; }

{ const _r=render; render=function(){ const out=_r.apply(this,arguments); try{ camDespues(); }catch(e){} return out; }; }

function camVentana(titulo,sello){

/* ---------- Subida a la caja fuerte (cifrada allá) ---------- */
const camB64=blob=>new Promise((ok,mal)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]||""); r.onerror=()=>mal(r.error); r.readAsDataURL(blob); });
async function camSubir(){
  if(CAM.subiendo||!CFON()||!CF.cli||!CF.cli.token||!S||!Array.isArray(S.vehicles)) return;
  CAM.subiendo=true;
  try{
    for(const t of S.vehicles){
      if(!t.fotoKey||!t.cf||!t.cf.tid) continue;
      const recs=(await camDeClave(t.fotoKey)).filter(r=>!r.subida&&r.blob);
      for(const r of recs){
        try{
          await CF.cli._req("POST","/api/fotos",{id:r.id,ticket:t.cf.tid,tipo:r.tipo,slot:r.slot,etiqueta:r.etiqueta,tomadaAt:r.tomadaAt,imagen:await camB64(r.blob)});
          r.subida=Date.now(); r.blob=null; await camGuardar(r);   // ya está cifrada en la caja fuerte: se libera el teléfono
          t.fotosSubidas=(t.fotosSubidas||0)+1; CAM.errSubida="";
        }catch(e){ CAM.errSubida=e.message||"Error al subir fotos"; break; }   // el ticket aún no llega, o sin conexión: se reintenta
      }
    }
  }finally{ CAM.subiendo=false; }
}
setInterval(()=>{ camSubir().catch(()=>{}); },8000);

  for(const r of l) if(!vivas.has(r.clave)&&Date.now()-r.tomadaAt>3*864e5) camBorrar(r.id); }).catch(()=>{}); },15000);

/* ---------- Expediente: fotos reales ---------- */
async function camImagenes(t){
  const out=[];
  for(const r of (t.fotoKey?await camDeClave(t.fotoKey):[])) if(r.blob) out.push({id:r.id,tipo:r.tipo,slot:r.slot,etiqueta:r.etiqueta,tomadaAt:r.tomadaAt,url:URL.createObjectURL(r.blob),local:true});
  if(CFON()&&CF.cli&&CF.cli.token&&t.cf&&t.cf.tid){
    const ya=new Set(out.map(x=>x.id));
    try{
      const l=await CF.cli._req("GET","/api/fotos?ticket="+encodeURIComponent(t.cf.tid));
      for(const f of l.fotos||[]){ if(ya.has(f.id)) continue;
        const r=await fetch(CF.cli.url+"/api/fotos/imagen?id="+encodeURIComponent(f.id),{headers:{Authorization:"Bearer "+CF.cli.token,"X-Dispositivo":CF.cli.dispositivo||"telefono"},cache:"no-store"});
        if(r.ok) out.push({id:f.id,tipo:f.tipo,slot:f.slot,etiqueta:f.etiqueta,tomadaAt:f.tomadaAt,url:URL.createObjectURL(await r.blob()),venceAt:f.venceAt}); }
    }catch(e){ out.error=e.message; }
  }
  out.forEach(x=>CAM.urls.push(x.url));
  /* Orden del expediente: recorrido (1, 2, 3…), luego daños, luego objetos; empates por hora de toma */
  const rango={recorrido:0,dano:1,objetos:2}, num=x=>{ const m=/^r:(\d+)$/.exec(x.slot||""); return m?Number(m[1]):0; };
  out.sort((a,b)=>(rango[a.tipo]??3)-(rango[b.tipo]??3)||num(a)-num(b)||a.tomadaAt-b.tomadaAt);
  return out;
}
const _camTicketSheet=ticketSheet;
ticketSheet=function(id){
  CAM.urls.splice(0).forEach(u=>URL.revokeObjectURL(u));
  const out=_camTicketSheet.apply(this,arguments);
  const t=S.vehicles.find(v=>v.id===id); if(!t||!t.fotoKey) return out;
  const sec=[...document.querySelectorAll("#layer section.dsec")].find(s=>/Fotograf/.test((s.querySelector("h3")||{}).textContent||""));

  camImagenes(t).then(l=>{
    const g=sec.querySelector(".camgal"), st=sec.querySelector("#cam-exp-estado"); if(!g) return;
    st.textContent=l.length?`${l.length} foto${l.length>1?"s":""}${l.some(x=>x.local)?(CFON()?" · algunas aún en este teléfono (se subirán solas)":" · guardadas solo en este teléfono (DEMO)"):""}${l.error?" · no se pudo consultar la caja fuerte: "+l.error:""}`:(l.error?"No se pudieron cargar las fotos: "+l.error:"Sin fotos guardadas.");
    g.innerHTML=l.map((x,k)=>`<button role="listitem" class="camfoto" data-k="${k}" style="background-image:url('${x.url}')" aria-label="${esc(x.etiqueta)}"><span>${esc(x.etiqueta)}</span></button>`).join("");
    g.addEventListener("click",e=>{ const b=e.target.closest(".camfoto"); if(!b) return; const x=l[Number(b.dataset.k)]; camVer(x); });
  });
  return out;
};
function camVer(x){
  const el=document.createElement("div"); el.className="camov camver"; el.setAttribute("role","dialog"); el.setAttribute("aria-label",x.etiqueta);
  el.innerHTML=`<div class="camov-top"><b>${esc(x.etiqueta)}</b><button class="btn ghost" data-x="cerrar">Cerrar</button></div><img alt="${esc(x.etiqueta)}" src="${x.url}"><p class="help">Tomada ${esc(new Date(x.tomadaAt).toLocaleString("es-MX"))}${x.venceAt?` · se conserva hasta ${esc(new Date(x.venceAt).toLocaleDateString("es-MX"))}`:""}</p>`;
  el.addEventListener("click",e=>{ if(e.target.closest('[data-x="cerrar"]')||e.target===el) el.remove(); });

/* Clave del modo explicación (decisión de Gand): 4 dígitos. Solo se guarda su huella SHA-256, no la clave.
   Es un candado de cortesía (evita que cualquiera lo abra en el teléfono), no protección contra alguien técnico. */
const EX_HUELLA="fc2f100c1f5d62d634aea2c3e3a679f8bf6f7bce2b7af815f318d68dff79e6bc", EX_SAL="ALAGA-explicacion|";
let exFallos=0, exBloqueo=0;
async function exClaveOk(c){
  if(!(window.crypto&&crypto.subtle)) throw new Error("Este navegador no permite verificar la clave.");
  const h=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(EX_SAL+c)));
  return Array.from(h,b=>b.toString(16).padStart(2,"0")).join("")===EX_HUELLA;
}
function exPedirClave(){
  return new Promise(res=>{
    const el=document.createElement("div"); el.className="ex-clave"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-label","Clave del modo explicación");
    el.innerHTML=`<form class="ex-clave-box"><h2>Modo explicación</h2><p class="help">Escribe la clave de 4 dígitos.</p>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Clave" class="input ex-clave-in">
      <p class="ex-clave-err" role="alert"></p>
      <div class="ex-acc"><button type="button" class="btn secondary" data-c="no">Cancelar</button><button type="submit" class="btn primary">Entrar</button></div></form>`;
    document.body.appendChild(el);
    const inp=el.querySelector("input"), err=el.querySelector(".ex-clave-err"), fin=v=>{ el.remove(); res(v); };
    setTimeout(()=>inp.focus(),50);
    el.querySelector('[data-c="no"]').onclick=()=>fin(false);
    el.querySelector("form").onsubmit=async e=>{ e.preventDefault();
      if(Date.now()<exBloqueo){ err.textContent="Demasiados intentos. Espera 30 segundos."; return; }
      const v=inp.value.replace(/\D/g,"");
      if(v.length!==4){ err.textContent="La clave tiene 4 dígitos."; return; }
      try{ if(await exClaveOk(v)){ exFallos=0; return fin(true); } }catch(x){ err.textContent=x.message; return; }
      exFallos++; inp.value=""; if(exFallos>=5){ exBloqueo=Date.now()+30000; exFallos=0; err.textContent="Clave incorrecta. Espera 30 segundos."; } else err.textContent="Clave incorrecta.";
    };
  });
}
A.exIniciar=async function(){

/* ALAGA · Tema Lux: fondo «Acabado espejo» (sin partículas: ni gotas, ni círculos, ni estelas).
   Como pintura negra pulida bajo las lámparas de un túnel de lavado: bandas amplias de luz que cruzan despacio
