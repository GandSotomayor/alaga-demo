  {id:"restaurador", name:"Restaurador de molduras", p:{sedan:180, suv:200, pickup:260}, flag:"D14"},
  {id:"descont", name:"Descontaminación de vidrios", p:{sedan:180, suv:220, pickup:260}},
  {id:"asientos", name:"Acondicionador de asientos", p:{sedan:200, suv:250, pickup:300}}
]);

/* Denominaciones MXN en circulación usadas en caja (centavos). */
const DENOMS = deepFreeze([
  {k:"b1000",v:100000,l:"$1,000",t:"Billete"},{k:"b500",v:50000,l:"$500",t:"Billete"},{k:"b200",v:20000,l:"$200",t:"Billete"},
  {k:"b100",v:10000,l:"$100",t:"Billete"},{k:"b50",v:5000,l:"$50",t:"Billete"},{k:"b20",v:2000,l:"$20",t:"Billete"},
  {k:"m20",v:2000,l:"$20",t:"Moneda"},{k:"m10",v:1000,l:"$10",t:"Moneda"},{k:"m5",v:500,l:"$5",t:"Moneda"},
  {k:"m2",v:200,l:"$2",t:"Moneda"},{k:"m1",v:100,l:"$1",t:"Moneda"},{k:"m050",v:50,l:"50¢",t:"Moneda"}
]);
/* Conceptos de gasto PROVISIONALES (decisión FP-1). Sin conceptos de nómina ni remuneraciones. */
const CONCEPTS = deepFreeze([
  {id:"insumos",n:"Insumos de limpieza"},{id:"quimicos",n:"Químicos y ceras"},{id:"agua",n:"Agua"},{id:"luz",n:"Energía eléctrica"},
  {id:"mant",n:"Mantenimiento y refacciones"},{id:"papeleria",n:"Papelería y tickets"},{id:"transporte",n:"Transporte y combustible"},{id:"otro",n:"Otro (especificar)"}
]);
const BUCKETS = deepFreeze({
  caja:{n:"Caja operativa",s:"Efectivo físico en la caja del local",icon:"i-cash",phys:true},
  transito:{n:"En tránsito",s:"Efectivo enviado a administración sin confirmar",icon:"i-hourglass",phys:true},
  resguardo:{n:"Resguardo administración",s:"Efectivo físico en poder de administración",icon:"i-vault",phys:true},
  clip:{n:"Clip por liquidar",s:"Cobros con tarjeta aún no depositados",icon:"i-card",phys:false},
  banco:{n:"Banco DEMO",s:"Transferencias, liquidaciones Clip y depósitos",icon:"i-bank",phys:false},
  dif:{n:"Diferencias registradas",s:"Faltantes/sobrantes y diferencias por conciliar",icon:"i-alert",phys:false}
});
const METHODS = deepFreeze({efectivo:"Efectivo",clip:"Clip (tarjeta)",transferencia:"Transferencia"});
const ROLES = deepFreeze({
  op:{n:"Operación",user:"Operador DEMO",home:"caja"},
  admin:{n:"Administración financiera",user:"Administración DEMO",home:"revisiones"}
});
const ROUTES = deepFreeze({
  caja:{t:"Caja",icon:"i-cash",roles:["op","admin"]},
  movs:{t:"Movimientos",s:"Movs.",icon:"i-list",roles:["op","admin"]},
  revisiones:{t:"Revisiones",s:"Revisión",icon:"i-checkc",roles:["op","admin"]},
  arqueo:{t:"Cierre",icon:"i-coins",roles:["op","admin"]},
  resguardo:{t:"Resguardo",s:"Resguardo",icon:"i-vault",roles:["admin"]},
  reportes:{t:"Reportes",icon:"i-chart",roles:["admin"]},
  mas:{t:"Ajustes DEMO",icon:"i-more",roles:["op","admin"]}
});
const TYPE_LABEL = deepFreeze({fondo:"Fondo fijo inicial",cobro:"Cobro",gasto:"Gasto",entrada:"Aportación de efectivo",
  traslado:"Traslado a administración",recepcion:"Recepción en administración",deposito:"Depósito bancario",liquidacion:"Liquidación Clip",
  ajuste:"Ajuste por arqueo",reverso:"Corrección (reverso)"});
const REVIEW_LABEL = deepFreeze({pendiente:"Pendiente",revisado:"Revisado",aclaracion:"Requiere aclaración"});

/* ---------- Utilidades ---------- */
const DAY = 864e5;
let S;                       // estado persistente
let FORCE_AT = null;            // solo para construir los datos DEMO con horas fijas
const nowMs = () => FORCE_AT!=null ? FORCE_AT : Date.now() + ((S&&S.clock)||0);
const pad = n => String(n).padStart(2,"0");
const dayKey = t => { const d=new Date(t); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const startOfDay = t => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const keyToMs = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d,12).getTime(); };
const hhmm = t => new Date(t).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:false});
const dLong = t => new Date(t).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
const dShort = t => new Date(t).toLocaleDateString("es-MX",{day:"numeric",month:"short"});
function dayLabel(t){ const k=dayKey(t), today=dayKey(nowMs()), y=dayKey(startOfDay(nowMs())-DAY/2);
  if(k===today) return "Hoy"; if(k===y) return "Ayer"; const s=dLong(t); return s.charAt(0).toUpperCase()+s.slice(1); }
const when = t => dayLabel(t)+" · "+hhmm(t);
const MXN = new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:2,maximumFractionDigits:2});
const money = c => (c<0?"−":"")+MXN.format(Math.abs(c)/100).replace("MX","");
const smoney = c => (c>0?"+":c<0?"−":"")+MXN.format(Math.abs(c)/100).replace("MX","");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const ico = (id,cls="") => `<svg class="i ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
/* Captura de importes: acepta "87.5", "87,50", "$1,200.00". Formato: hasta 7 enteros y 2 decimales (validación de formato, no límite de gasto). */
function parseMoney(str){
  let s=String(str==null?"":str).trim().replace(/[$\s]/g,"");
  if(!s) return {err:"Escribe un importe."};
  if(s.includes(",")&&s.includes(".")) s=s.replace(/,/g,"");
  else if(s.includes(",")){ const p=s.split(","); s = (p.length===2&&p[1].length<=2) ? p[0]+"."+p[1] : s.replace(/,/g,""); }
  if(!/^\d{1,7}(\.\d{0,2})?$/.test(s)) return {err:"Usa solo números, con hasta 2 decimales (ej. 85.50)."};
  const [e,d=""]=s.split("."); const c=Number(e)*100+Number((d+"00").slice(0,2));
  if(c<=0) return {err:"El importe debe ser mayor que $0.00."};
  return {c};
}
const toInput = c => (c/100).toFixed(2);

/* ---------- Tickets DEMO (importe calculado SIEMPRE desde el catálogo) ---------- */
function ticketLines(t){
  /* v0.9 · catálogo configurable: si la caja fuerte manda las líneas del ticket (nombres y precios del catálogo con que entró), se usan tal cual. */
  if(Array.isArray(t.lineas)&&t.lineas.length) return t.lineas.map(l=>({label:l.label, amount:l.amount}));
  const L=[{label:PKGS[t.pkg].name, amount:PRICES[t.pkg][t.cat]*100}];
  (t.extras||[]).forEach(id=>{const e=EXTRAS.find(x=>x.id===id); if(e&&e.p[t.cat]!=null) L.push({label:e.name,amount:e.p[t.cat]*100})});
  if(t.ajuste&&t.ajuste.monto>0) L.push({label:`Ajuste por condición (${t.ajuste.motivo})`, amount:t.ajuste.monto});   // RZR, capturado en recepción
  if(t.beneficio>0) L.push({label:"Beneficio de lealtad", amount:-t.beneficio});   // lo valida y fija la caja fuerte (cubre el Paquete ALAGA)
  return L;
}
/* Nombre del paquete: el que guardó la caja fuerte con el ticket (catálogo configurable) o el de la lona. */
const pkgName = t => (Array.isArray(t.lineas)&&t.lineas[0]&&t.lineas[0].label) || (PKGS[t.pkg]&&PKGS[t.pkg].name) || String(t.pkg||"");
const ticketTotal = t => ticketLines(t).reduce((s,l)=>s+l.amount,0);
const catName = id => (CATS.find(c=>c.id===id)||{}).name||id;
const tLabel = t => `${t.plate} · ${catName(t.cat)}`;
const tService = t => ticketLines(t).map(l=>l.label).join(" + ");
const ticketById = id => S.tickets.find(t=>t.id===id);

/* ---------- Libro de movimientos ---------- */
const movById = id => S.movs.find(m=>m.id===id);
const isActive = m => !m.reversedBy && m.type!=="reverso";
function zero(){return {caja:0,transito:0,resguardo:0,clip:0,banco:0,dif:0}}
function zeroC(){return {aporte:0,venta:0,gasto:0,entrada:0}}
/* Efecto de un movimiento por cuenta (E) y su clasificación económica (C). */
function baseEff(m){
  const a=m.amount, E=zero(), C=zeroC();
  switch(m.type){
    case "fondo": E.caja+=a; C.aporte+=a; break;
    case "cobro": E[m.method==="efectivo"?"caja":m.method==="clip"?"clip":"banco"]+=a; C.venta+=a; break;
    case "gasto": E[m.origin]-=a; C.gasto+=a; break;
    case "entrada": if(m.origin==="admin"){E.resguardo-=a; E.caja+=a;} else {E.caja+=a; C.entrada+=a;} break;
    case "traslado": E.caja-=a; E.transito+=a; break;
    case "recepcion": E.transito-=m.sent; E.resguardo+=a; E.dif+=a-m.sent; break;
    case "deposito": E.resguardo-=a; E.banco+=a; break;
    case "liquidacion": E.clip-=m.gross; E.banco+=a; E.dif+=a-m.gross; break;
    case "ajuste": E.caja+=m.sign*a; E.dif+=m.sign*a; break;
  }
  return {E,C};
}
function eff(m){
  if(m.type!=="reverso") return baseEff(m);
  const o=movById(m.reverses), r=baseEff(o);
  Object.keys(r.E).forEach(k=>r.E[k]=-r.E[k]); Object.keys(r.C).forEach(k=>r.C[k]=-r.C[k]);
  return r;
}
function sumEff(list){
  const E=zero(), C=zeroC();
  list.forEach(m=>{const r=eff(m); for(const k in E)E[k]+=r.E[k]; for(const k in C)C[k]+=r.C[k];});
  return {E,C};
}
const balances = () => sumEff(S.movs).E;

/* ---------- Sesiones de caja ---------- */
const openSession = () => S.sessions.find(s=>!s.closedAt) || null;
const sessById = id => S.sessions.find(s=>s.id===id);
const sessMovs = s => S.movs.filter(m=>m.sid===s.id);
const corteById = id => S.cortes.find(c=>c.id===id);
const lastCorte = () => S.cortes.length ? S.cortes[S.cortes.length-1] : null;
/* Esperado = fondo inicial + cobros en efectivo + aportaciones − gastos en efectivo − retiros anteriores ± correcciones.
   Los movimientos generados DURANTE el cierre (ajuste de arqueo, entrega de excedente, reposición de fondo) llevan cierre:true
   y no alteran el esperado congelado en el conteo. final = efectivo que debe quedar en caja tras el cierre. */
function sessionBreakdown(s){
  const B={opening:s.opening, fondo:0, cobros:0, nCobros:0, entradas:0, nEntradas:0, gastos:0, nGastos:0, traslados:0, nTraslados:0, correcciones:0, nCorr:0,
    ajuste:0, entregaCierre:0, reposicion:0, clip:0, nClip:0, transf:0, nTransf:0};
  sessMovs(s).forEach(m=>{
    if(m.cierre){ if(m.type==="ajuste") B.ajuste+=m.sign*m.amount; else if(m.type==="traslado") B.entregaCierre+=m.amount; else if(m.type==="entrada") B.reposicion+=m.amount; return; }
    const dc=eff(m).E.caja;
    if(m.type==="reverso"){ B.correcciones+=dc; B.nCorr++; const o=movById(m.reverses);
      if(o.type==="cobro"&&o.method==="clip"){B.clip-=o.amount;} if(o.type==="cobro"&&o.method==="transferencia"){B.transf-=o.amount;} return; }
    switch(m.type){
      case "fondo": B.fondo+=m.amount; break;
      case "cobro": if(m.method==="efectivo"){B.cobros+=m.amount;B.nCobros++;} else if(m.method==="clip"){B.clip+=m.amount;B.nClip++;} else {B.transf+=m.amount;B.nTransf++;} break;
      case "entrada": B.entradas+=m.amount; B.nEntradas++; break;
      case "gasto": if(m.origin==="caja"){B.gastos+=m.amount; B.nGastos++;} break;
      case "traslado": B.traslados+=m.amount; B.nTraslados++; break;
    }
  });
  B.expected = B.opening + B.fondo + B.cobros + B.entradas - B.gastos - B.traslados + B.correcciones;
  B.final = B.expected + B.ajuste + B.reposicion - B.entregaCierre;
  return B;
}
const sessionExpected = s => sessionBreakdown(s).expected;

/* ---------- Tickets: cobros ---------- */
const activeCobro = tid => S.movs.find(m=>m.type==="cobro"&&m.ticket===tid&&isActive(m)) || null;
/* Saldo de un ticket (v0.8): lo cobrado suma el cobro principal y los cobros de diferencia (subió de servicio ya cobrado).
   Un ticket cancelado no tiene saldo. */
const pagadoT = tid => S.movs.filter(m=>m.type==="cobro"&&m.ticket===tid&&isActive(m)).reduce((s,m)=>s+m.amount,0);
const saldoT = t => t.cancelado ? 0 : Math.max(0, ticketTotal(t)-pagadoT(t.id));
const pendingTickets = () => S.tickets.filter(t=>saldoT(t)>0).sort((a,b)=>a.at-b.at);   // $0 (beneficio) o cancelado: nada que cobrar
const pendingTotal = () => pendingTickets().reduce((s,t)=>s+saldoT(t),0);
const clipPending = () => S.movs.filter(m=>m.type==="cobro"&&m.method==="clip"&&isActive(m)&&!m.liquidatedBy);

/* ---------- Revisión administrativa (no toca importes ni cuentas) ---------- */
const reviewables = () => [
  ...S.movs.filter(m=>m.type==="gasto").map(m=>({kind:"gasto",id:m.id,obj:m,at:m.at})),
  ...S.cortes.map(c=>({kind:"corte",id:c.id,obj:c,at:c.at}))
].sort((a,b)=>b.at-a.at);

/* ---------- Permisos simulados ---------- */
const PERMS = deepFreeze({
  op:   ["abrirCaja","cobrar","gastoCaja","entrada","traslado","arqueo","corte","reposicion","responder","reversoOp","crearTicket"],
  admin:["revisar","confirmarTraslado","deposito","liquidacion","gastoAdmin","reversoAdmin","reportes","resguardo","exportar","bitacora"]
});
const can = p => PERMS[S.role].includes(p);
const canRoute = r => ROUTES[r] && ROUTES[r].roles.includes(S.role);

/* ---------- Persistencia protegida (localStorage: temporal y NO cifrado) ----------
   Reglas para no perder datos:
   1. Si lo guardado no se puede leer o validar, se copia intacto a una clave de respaldo ANTES de cargar datos DEMO.
   2. Cada guardado lleva un número de revisión; si otra pestaña guardó después, no se sobrescribe (se pide recargar).
   3. Si el guardado falla (almacenamiento lleno o bloqueado) se avisa en pantalla; nunca se calla.
   4. Restablecer o restaurar un respaldo conserva primero una copia de lo anterior. */
const BK_PREFIX = KEY+":respaldo:";
const PREV_KEY = KEY+":anterior";
const STORE = {ok:true, err:"", stale:false, readonly:false, recovered:null, rev:0};
function validateState(o){
  const e=[];
  if(!o||typeof o!=="object"||Array.isArray(o)) return ["El contenido no es un estado válido."];
  if(o.v!==3) e.push(`Versión de datos ${o.v===undefined?"desconocida":o.v} (se esperaba 3).`);
  ["tickets","sessions","movs","cortes","audit"].forEach(k=>{ if(!Array.isArray(o[k])) e.push(`Falta la lista “${k}”.`); });
  if(!o.seq||typeof o.seq!=="object") e.push("Falta el contador de folios.");
  if(!e.length){
    o.movs.forEach((m,i)=>{ if(!m||typeof m.id!=="string"||!TYPE_LABEL[m.type]||!Number.isInteger(m.amount)||!Number.isFinite(m.at)) e.push(`Movimiento ${i+1} incompleto.`); });
    const ids=new Set(); o.movs.forEach(m=>{ if(ids.has(m.id)) e.push(`Folio repetido ${m.id}.`); ids.add(m.id); });
    o.sessions.forEach((x,i)=>{ if(!x||typeof x.id!=="string"||!Number.isInteger(x.opening)) e.push(`Sesión ${i+1} incompleta.`); });
  }
  return e.slice(0,6);
}
function storageUsage(){ try{ let n=0; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); n+=k.length+(localStorage.getItem(k)||"").length; } return n*2; }catch(e){ return 0; } }
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){ STORE.ok=false; STORE.readonly=true; STORE.err="Este navegador bloquea el almacenamiento: nada se guardará al cerrar."; return null; }
  if(raw==null) return null;
  let o=null, errs;
  try{ o=JSON.parse(raw); errs=validateState(o); }catch(e){ errs=["El contenido guardado está dañado (no es JSON válido)."]; }
  if(errs.length){
    const bk=BK_PREFIX+new Date().toISOString();
    try{ localStorage.setItem(bk, raw); STORE.recovered={key:bk, errs, at:Date.now()}; }
    catch(e){ STORE.readonly=true; STORE.ok=false; STORE.recovered={key:null, errs, at:Date.now()}; STORE.err="No se pudo respaldar la información dañada; no se guardará nada para no sobrescribirla."; }
    return null;
  }
  STORE.rev=Number(o.rev)||0;
  return o;
}
function save(){
  if(STORE.stale||STORE.readonly){ STORE.ok=false; if(!STORE.err) STORE.err="No se guardó."; return false; }
  try{
    const cur=localStorage.getItem(KEY);
    if(cur){ let r=0; try{ r=Number(JSON.parse(cur).rev)||0; }catch(e){ r=Infinity; } if(r>STORE.rev){ STORE.stale=true; STORE.ok=false; STORE.err="Otra pestaña o ventana guardó cambios. Recarga antes de seguir."; return false; } }
    const next=(STORE.rev||0)+1; S.rev=next;
    localStorage.setItem(KEY, JSON.stringify(S));
    STORE.rev=next; STORE.ok=true; STORE.err="";
    return true;
  }catch(e){
    S.rev=STORE.rev; STORE.ok=false;
    STORE.err=(e&&(e.name==="QuotaExceededError"||/quota/i.test(e.message||"")))?"Almacenamiento lleno: el último cambio no se guardó. Descarga un respaldo.":"No se pudo guardar el último cambio. Descarga un respaldo.";
    return false;
  }
}
/* Copia de seguridad previa a restablecer o restaurar */
function keepPrevious(){ try{ const cur=localStorage.getItem(KEY); if(cur) localStorage.setItem(PREV_KEY, cur); return true; }catch(e){ return false; } }
function backupKeys(){ try{ const out=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k===PREV_KEY||k.startsWith(BK_PREFIX)) out.push(k); } return out.sort().reverse(); }catch(e){ return []; } }
/* Reemplaza todo el estado por uno validado (restaurar respaldo). Conserva la versión actual como “anterior”. */
function replaceState(o){
  const errs=validateState(o); if(errs.length) return {ok:false, err:errs.join(" ")};
  if(!keepPrevious()) return {ok:false, err:"No se pudo guardar una copia de la información actual; no se restauró nada."};
  const role=S.role; S=o; S.role=ROLES[role]?role:"op"; STORE.rev=Number(o.rev)||0;
  try{ const cur=localStorage.getItem(KEY); if(cur){ STORE.rev=Math.max(STORE.rev, Number(JSON.parse(cur).rev)||0); } }catch(e){}
  const ok=save(); return ok?{ok:true}:{ok:false, err:STORE.err};
}

/* ---------- Altas (únicas funciones que crean dinero en el libro) ---------- */
function nextId(kind){ S.seq[kind]=(S.seq[kind]||0)+1; const n=S.seq[kind];
  return kind==="m" ? "M-"+String(n).padStart(4,"0") : kind==="t" ? "T-"+String(n).padStart(4,"0") : kind==="s" ? "S-"+n : "A-"+String(n).padStart(5,"0"); }
/* Nombre de quien registra: en modo conectado, el de la cuenta de la caja fuerte (nunca el texto de la DEMO). */
const whoName = () => (S.conectado && typeof CF !== "undefined" && CF.user && CF.user.nombre) ? CF.user.nombre : ROLES[S.role].user;
function audit(action, ref, detail){ S.audit.push({id:nextId("a"), at:nowMs(), by:S.role, user:whoName(), action, ref, detail}); }
function addMov(m){
  const mv = Object.assign({id:nextId("m"), at:nowMs(), by:S.role, user:whoName()}, m);
  if(TYPE_LABEL[mv.type]==null) throw new Error("Tipo inválido");
  if(mv.type!=="ajuste"&&mv.type!=="recepcion"&&mv.type!=="liquidacion"&&!(Number.isInteger(mv.amount)&&mv.amount>0)) throw new Error("Importe inválido");
  S.movs.push(mv);
  audit("alta", mv.id, `${TYPE_LABEL[mv.type]} ${money(mv.amount)}`);
  return mv;
}
</script>
<script>
"use strict";
/* =====================================================================
   Operaciones de dominio. Cada una valida, crea movimientos nuevos y registra bitácora.
   Devuelven {ok:true,...} o {ok:false, err:"mensaje claro"}.
   ===================================================================== */
const fail = err => ({ok:false, err});
function guardCaja(){
  const s=openSession();
  if(!s) return fail("La caja está cerrada. Ábrela para registrar movimientos.");
  if(S.cierre && S.cierre.sid===s.id) return fail("El cierre de jornada está en curso. Termínalo antes de registrar más movimientos.");
  return {ok:true, s};
}

/* Apertura: la primera vez se confirma físicamente el fondo fijo de $500.
   Después, la caja abre con el fondo que el cierre anterior CONFIRMÓ físicamente (nunca se supone $500). */
function opAbrirCaja({confirmFondo=false}={}){
  if(!can("abrirCaja")) return fail("Sin permiso: solo Operación abre la caja (simulado).");
  if(openSession()) return fail("Ya hay una caja abierta.");
  const lc=lastCorte();
  if(!lc && !confirmFondo) return fail(`Confirma que hay ${money(FONDO_FIJO)} físicos en la caja.`);
  const s={id:nextId("s"), openedAt:nowMs(), by:S.role, user:whoName(),
    openKind: lc?"arrastre":"fondo", opening: lc?lc.fondoFinal:0, fromCorte: lc?lc.id:null,
    fondoInicial: lc?lc.fondoFinal:FONDO_FIJO,
    excepcion: lc&&lc.excepcion&&lc.excepcion.status==="pendiente" ? lc.id : null};
  s.fondoCompleto = s.fondoInicial===FONDO_FIJO;
  S.sessions.push(s);
  audit("apertura", s.id, lc?`Fondo inicial ${money(s.opening)} confirmado en el corte ${lc.id}${s.fondoCompleto?"":" · INSUFICIENTE"}`:`Fondo fijo inicial ${money(FONDO_FIJO)} confirmado físicamente`);
  if(!lc) addMov({type:"fondo", sid:s.id, amount:FONDO_FIJO, note:"Fondo fijo de caja confirmado físicamente en la primera apertura"});
  return {ok:true, s};
}

function opCobrar(tid, method, ref=""){
  if(!can("cobrar")) return fail("Sin permiso: los cobros los registra Operación (simulado).");
  const g=guardCaja(); if(!g.ok) return g;
  const t=ticketById(tid); if(!t) return fail("Ticket no encontrado.");
  if(!METHODS[method]) return fail("Elige un método de pago.");
  if(t.cancelado) return fail("Este ticket está cancelado: no se cobra.");
  const dup=activeCobro(tid), dif=dup?saldoT(t):0;
  if(dup&&dif<=0) return fail(`Este ticket ya tiene un cobro registrado (${dup.id}). No se duplicó.`);
  if(ticketTotal(t)<=0) return fail("Este ticket no tiene saldo por cobrar (lo cubre el beneficio de lealtad).");
  /* Conectado (decisión de Gand): la transferencia lleva referencia obligatoria y sin repetirse, igual que exige la caja fuerte. */
  const rk=x=>String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(S.conectado&&method==="transferencia"){
    if(rk(ref).length<4) return fail("Transferencia: escribe la referencia o folio (mínimo 4 letras o números).");
    if(S.movs.some(m=>m.type==="cobro"&&m.method==="transferencia"&&isActive(m)&&rk(m.ref)===rk(ref))) return fail(`La referencia ${String(ref).trim()} ya está registrada en otra transferencia. Revísala.`);
  }
  const m=addMov(Object.assign({type:"cobro", sid:g.s.id, ticket:tid, method, ref:String(ref).trim().slice(0,40), amount:dup?dif:ticketTotal(t)}, dup?{complemento:true}:{}));
  return {ok:true, mov:m};
}

function opGasto({amount, concept, receipt=false, vendor="", note="", origin="caja"}){
  const isAdmin = S.role==="admin";
  if(isAdmin ? !can("gastoAdmin") : !can("gastoCaja")) return fail("Sin permiso (simulado).");
  if(isAdmin && !["resguardo","banco"].includes(origin)) return fail("Administración registra gastos desde resguardo o banco.");
  if(!isAdmin && origin!=="caja") return fail("Operación registra gastos desde la caja.");
  let sid=null;
  if(!isAdmin){ const g=guardCaja(); if(!g.ok) return g; sid=g.s.id; }
  if(!Number.isInteger(amount)||amount<=0) return fail("Escribe un importe mayor que $0.00.");
  if(!CONCEPTS.some(c=>c.id===concept)) return fail("Elige un concepto.");
  note=String(note).trim(); vendor=String(vendor).trim();
  if(concept==="otro" && !note) return fail("Para “Otro”, describe el gasto en la nota.");
  const m=addMov({type:"gasto", sid, origin, amount, concept, receipt:!!receipt, vendor:vendor.slice(0,60), note:note.slice(0,240),
    review:{status:"pendiente", history:[]}});
  return {ok:true, mov:m};
}

function opEntrada({amount, origin, note=""}){
  if(!can("entrada")) return fail("Sin permiso (simulado).");
  const g=guardCaja(); if(!g.ok) return g;
  if(!["admin","otra"].includes(origin)) return fail("Elige el origen de la entrada.");
  if(!Number.isInteger(amount)||amount<=0) return fail("Escribe un importe mayor que $0.00.");
  note=String(note).trim(); if(origin==="otra"&&!note) return fail("Describe el origen de la entrada.");
  const m=addMov({type:"entrada", sid:g.s.id, origin, amount, note:note.slice(0,240)});
  return {ok:true, mov:m};
}

function opTraslado({amount, note=""}){
  if(!can("traslado")) return fail("Sin permiso (simulado).");
  const g=guardCaja(); if(!g.ok) return g;
  if(!Number.isInteger(amount)||amount<=0) return fail("Escribe un importe mayor que $0.00.");
  const m=addMov({type:"traslado", sid:g.s.id, amount, note:String(note).trim().slice(0,240), status:"enviado"});
  return {ok:true, mov:m};
}
const trasladosEnTransito = () => S.movs.filter(m=>m.type==="traslado"&&isActive(m)&&m.status==="enviado");

function opConfirmarTraslado(mid, received, note=""){
  if(!can("confirmarTraslado")) return fail("Sin permiso: solo Administración confirma recepciones (simulado).");
  const t=movById(mid);
  if(!t||t.type!=="traslado") return fail("Traslado no encontrado.");
  if(!isActive(t)) return fail("Este traslado fue anulado.");
  if(t.status!=="enviado") return fail("Este traslado ya fue confirmado.");
  if(!Number.isInteger(received)||received<0) return fail("Escribe el importe recibido.");
  note=String(note).trim();
  const r=addMov({type:"recepcion", sid:null, amount:received, sent:t.amount, traslado:t.id, note:note.slice(0,240)});
  t.status="recibido"; t.recepcion=r.id;
  audit("confirmación", t.id, `Recibido ${money(received)} de ${money(t.amount)} enviados`);
  return {ok:true, mov:r};
}

function opDeposito({amount, ref=""}){
  if(!can("deposito")) return fail("Sin permiso (simulado).");
  if(!Number.isInteger(amount)||amount<=0) return fail("Escribe un importe mayor que $0.00.");
  const m=addMov({type:"deposito", sid:null, amount, ref:String(ref).trim().slice(0,40)});
  return {ok:true, mov:m};
}

function opLiquidacion({cobros, net, ref=""}){
  if(!can("liquidacion")) return fail("Sin permiso (simulado).");
  if(!Array.isArray(cobros)||!cobros.length) return fail("Selecciona al menos un cobro Clip.");
  const list=cobros.map(movById);
  for(const c of list){
    if(!c||c.type!=="cobro"||c.method!=="clip") return fail("Solo se pueden liquidar cobros Clip.");
    if(!isActive(c)) return fail(`El cobro ${c.id} fue anulado.`);
    if(c.liquidatedBy) return fail(`El cobro ${c.id} ya está en la liquidación ${c.liquidatedBy}. No se contabiliza dos veces.`);
  }
  if(!Number.isInteger(net)||net<=0) return fail("Escribe el importe depositado por Clip.");
  const gross=list.reduce((s,c)=>s+c.amount,0);
  const m=addMov({type:"liquidacion", sid:null, amount:net, gross, cobros:list.map(c=>c.id), ref:String(ref).trim().slice(0,40)});
  list.forEach(c=>c.liquidatedBy=m.id);
  return {ok:true, mov:m};
}

/* Correcciones: nunca se borra ni se edita el importe original. */
function canReverse(m){
  if(!m) return [false,"Movimiento no encontrado."];
  if(m.type==="reverso") return [false,"Un reverso no se puede revertir; registra un movimiento nuevo."];
  if(m.reversedBy) return [false,`Ya fue anulado por ${m.reversedBy}.`];
  if(m.type==="cobro"){ const t=ticketById(m.ticket); if(t&&t.usadoEn) return [false,"Este cobro contó para un beneficio de lealtad ya aplicado: no se anula (dejaría un lavado gratis sin respaldo). Avísale a Administración."]; }
  if(S.role==="op"){
    if(!can("reversoOp")) return [false,"Sin permiso (simulado)."];
    if(m.by!=="op"||!["cobro","gasto","entrada","traslado"].includes(m.type)) return [false,"Operación solo corrige sus cobros, gastos, aportaciones y retiros."];
    const s=sessById(m.sid); if(!s||s.closedAt) return [false,"Pertenece a un corte cerrado. Corrección posterior: decisión FP-4."];
    if(cierreOf(s)) return [false,"El cierre de jornada está en curso."];
  } else {
    if(!can("reversoAdmin")) return [false,"Sin permiso (simulado)."];
    if(!((m.type==="gasto"&&m.by==="admin")||m.type==="deposito")) return [false,"Administración solo corrige sus gastos desde resguardo/banco y sus depósitos."];
  }
  if(m.type==="cobro"&&m.liquidatedBy) return [false,`El cobro ya está en la liquidación Clip ${m.liquidatedBy}.`];
  if(m.type==="traslado"&&m.status!=="enviado") return [false,"Administración ya confirmó la recepción."];
  if(m.cierre) return [false,"Es parte de un cierre de jornada; no se anula."];
  if(m.fondo) return [false,"Es una reposición de fondo; no se anula."];
  return [true,""];
}
function opReverso(mid, motivo){
  const m=movById(mid); const [ok,why]=canReverse(m); if(!ok) return fail(why);
  motivo=String(motivo||"").trim(); if(!motivo) return fail("Escribe el motivo de la corrección.");
  const r=addMov({type:"reverso", sid:m.sid||null, reverses:m.id, amount:m.amount, note:motivo.slice(0,240)});
  m.reversedBy=r.id;
  audit("anulación", m.id, `Anulado por ${r.id}: ${motivo}`);
  return {ok:true, mov:r};
}

/* Revisión administrativa: cambia SOLO el estado de revisión. */
function reviewTarget(kind,id){ return kind==="gasto" ? movById(id) : kind==="corte" ? corteById(id) : null; }
function opRevisar(kind, id, status, note=""){
  if(!can("revisar")) return fail("Sin permiso: solo Administración revisa (simulado).");
  const o=reviewTarget(kind,id); if(!o||!o.review) return fail("Registro no encontrado.");
  if(!["revisado","aclaracion"].includes(status)) return fail("Estado inválido.");
  if(o.review.status==="revisado") return fail("Ya está revisado.");
  note=String(note).trim(); if(status==="aclaracion"&&!note) return fail("Escribe qué necesitas que se aclare.");
  o.review.history.push({at:nowMs(), by:S.role, user:whoName(), status, note:note.slice(0,300)});
  o.review.status=status;
  audit("revisión", id, `${REVIEW_LABEL[status]}${note?": "+note:""}`);
  return {ok:true};
}
function opResponder(kind, id, text){
  if(!can("responder")) return fail("Sin permiso (simulado).");
  const o=reviewTarget(kind,id); if(!o||!o.review) return fail("Registro no encontrado.");
  if(o.review.status!=="aclaracion") return fail("Este registro no tiene una aclaración pendiente.");
  text=String(text||"").trim(); if(!text) return fail("Escribe tu respuesta.");
  o.review.history.push({at:nowMs(), by:S.role, user:whoName(), status:"pendiente", note:text.slice(0,300), response:true});
  o.review.status="pendiente";
  audit("respuesta", id, text);
  return {ok:true};
}

/* =====================================================================
   CIERRE DE JORNADA CON FONDO FIJO
   1 Arqueo (conteo ciego) → 2 Diferencia (registro obligatorio) → 3 Excedente / fondo insuficiente
   → 4 Confirmación física del fondo que queda → 5 Cierre del corte. La entrega se confirma después en Administración.
   ===================================================================== */
const countTotal = count => DENOMS.reduce((s,d)=>s+(count[d.k]||0)*d.v,0);
const cierreOf = s => (s && S.cierre && S.cierre.sid===s.id) ? S.cierre : null;
const CIERRE_STEPS = deepFreeze([["conteo","Arqueo"],["diferencia","Diferencia"],["excedente","Excedente"],["fondo","Fondo"],["cerrar","Cierre"]]);
function cleanCount(count){
  const clean={};
  for(const d of DENOMS){ const q=count[d.k]||0; if(!Number.isInteger(q)||q<0||q>9999) return {err:`Cantidad inválida en ${d.t.toLowerCase()} de ${d.l}.`}; if(q) clean[d.k]=q; }
  return {clean};
}
function guardCierre(step){
  if(!can("corte")) return fail("Sin permiso: el cierre lo realiza Operación (simulado).");
  const s=openSession(), C=cierreOf(s);
  if(!s) return fail("La caja está cerrada.");
  if(!C) return fail("Primero confirma el conteo del arqueo.");
  if(C.step!==step) return fail("Este paso no corresponde al estado actual del cierre.");
  return {ok:true, s, C};
}
/* Paso 1: el esperado se congela al confirmar el conteo. */
function opConfirmarConteo(count){
  if(!can("arqueo")) return fail("Sin permiso: el arqueo lo realiza Operación (simulado).");
  const s=openSession(); if(!s) return fail("La caja está cerrada.");
  if(cierreOf(s)) return fail("El conteo ya fue confirmado.");
  const cc=cleanCount(count); if(cc.err) return fail(cc.err);
  const counted=countTotal(cc.clean), expected=sessionExpected(s);
  S.cierre={sid:s.id, step: counted===expected?"excedente":"diferencia", count:cc.clean, counted, expected, at:nowMs(), by:S.role, user:whoName()};
  S.draft=null;
  audit("conteo", s.id, `Conteo confirmado ${money(counted)} · esperado ${money(expected)} · diferencia ${smoney(counted-expected)}`);
  return {ok:true, cierre:S.cierre};
}
/* Paso 2: toda diferencia se registra como ajuste ANTES de calcular la entrega; nada posterior la puede ocultar. */
function opRegistrarDiferencia(note){
  const g=guardCierre("diferencia"); if(!g.ok) return g; const {s,C}=g, d=C.counted-C.expected;
  note=String(note||"").trim(); if(!note) return fail(`Explica el ${d<0?"faltante":"sobrante"}: el registro es obligatorio.`);
  const aj=addMov({type:"ajuste", sid:s.id, amount:Math.abs(d), sign:d>0?1:-1, cierre:true, note:(d>0?"Sobrante en arqueo: ":"Faltante en arqueo: ")+note.slice(0,240)});
  C.ajuste=aj.id; C.diffNote=note.slice(0,240); C.step="excedente";
  return {ok:true, mov:aj};
}
/* Paso 3: excedente = contado − fondo fijo. Se calcula sobre el efectivo FÍSICO contado. */
function cierreCalc(C){ const ex=C.counted-FONDO_FIJO; return {excedente:Math.max(0,ex), faltaFondo:Math.max(0,-ex)}; }
function opEntregar(){
  const g=guardCierre("excedente"); if(!g.ok) return g; const {s,C}=g, k=cierreCalc(C);
  if(k.faltaFondo>0) return fail(`Fondo insuficiente: faltan ${money(k.faltaFondo)}. Registra la reposición o deja el cierre como excepción.`);
  if(k.excedente>0){
    const t=addMov({type:"traslado", kind:"cierre", sid:s.id, amount:k.excedente, status:"enviado", cierre:true, note:`Entrega de cierre: excedente sobre el fondo fijo de ${money(FONDO_FIJO)}`});
    C.entrega=t.id;
  }
  C.decision="completo"; C.step="fondo";
  return {ok:true, excedente:k.excedente};
}
function opReponerFondo(){
  if(!can("reposicion")) return fail("Sin permiso (simulado).");
  const g=guardCierre("excedente"); if(!g.ok) return g; const {s,C}=g, k=cierreCalc(C);
  if(!k.faltaFondo) return fail("El fondo no es insuficiente.");
  const e=addMov({type:"entrada", origin:"admin", fondo:true, cierre:true, sid:s.id, amount:k.faltaFondo, note:"Reposición del fondo fijo al cierre (aportación de administración; no es venta)"});
  C.reposicion=e.id; C.decision="reposicion"; C.step="fondo";
  return {ok:true, mov:e};
}
function opExcepcionFondo(note){
  const g=guardCierre("excedente"); if(!g.ok) return g; const {C}=g, k=cierreCalc(C);
  if(!k.faltaFondo) return fail("El fondo no es insuficiente.");
  note=String(note||"").trim(); if(!note) return fail("Explica por qué el fondo queda incompleto.");
  C.decision="excepcion"; C.excNote=note.slice(0,240); C.step="fondo";
  audit("excepción", C.sid, `Fondo insuficiente (${money(C.counted)}): ${note}`);
  return {ok:true};
}
/* Paso 4: el fondo que queda se cuenta por denominación y debe coincidir exactamente. */
const fondoDebeQuedar = s => sessionBreakdown(s).final;
function opConfirmarFondo(count){
  const g=guardCierre("fondo"); if(!g.ok) return g; const {s,C}=g;
  const cc=cleanCount(count); if(cc.err) return fail(cc.err);
  const total=countTotal(cc.clean), need=fondoDebeQuedar(s);
  if(total!==need) return fail(`El fondo contado (${money(total)}) no coincide con el que debe quedar (${money(need)}). Revisa la separación del efectivo y vuelve a contar.`);
  C.fondoCount=cc.clean; C.fondoAt=nowMs(); C.step="cerrar"; S.draftFondo=null;
  audit("fondo", s.id, `Fondo que permanece confirmado físicamente: ${money(total)}`);
  return {ok:true};
}
function corteFolio(t){ const k=dayKey(t).replace(/-/g,""); const n=S.cortes.filter(c=>c.id.startsWith("CC-"+k)).length+1; return `CC-${k}-${pad(n)}`; }
/* Paso 5 */
function opCerrarCorte(note=""){
  const g=guardCierre("cerrar"); if(!g.ok) return g; const {s,C}=g, B=sessionBreakdown(s);
  if(B.expected!==C.expected) return fail("El esperado cambió después del conteo. Revisa los movimientos.");
  const at=nowMs(), id=corteFolio(at), k=cierreCalc(C), ent=C.entrega?movById(C.entrega):null, rep=C.reposicion?movById(C.reposicion):null;
  const c={id, sid:s.id, at, by:S.role, user:whoName(), openedAt:s.openedAt, opening:s.opening, openKind:s.openKind, fondoInicial:s.fondoInicial, fromCorte:s.fromCorte,
    count:Object.assign({},C.count), counted:C.counted, countAt:C.at, expected:C.expected, diff:C.counted-C.expected, diffNote:C.diffNote||"", ajuste:C.ajuste||null,
    excedente:k.excedente, entrega:ent?ent.id:null, entregaAmount:ent?ent.amount:0, reposicion:rep?rep.id:null, reposicionAmount:rep?rep.amount:0, decision:C.decision,
    fondoFinal:B.final, fondoCount:Object.assign({},C.fondoCount), fondoAt:C.fondoAt, fondoStatus:B.final===FONDO_FIJO?"completo":"insuficiente",
    excepcion: C.decision==="excepcion" ? {status:"pendiente", note:C.excNote} : null,
    breakdown:B, note:String(note).trim().slice(0,300), review:{status:"pendiente", history:[]}};
  S.cortes.push(c); s.closedAt=at; s.corte=id; S.cierre=null;
  if(c.fondoStatus==="completo") S.cortes.forEach(x=>{ if(x!==c&&x.excepcion&&x.excepcion.status==="pendiente"){ x.excepcion.status="resuelta"; x.excepcion.resolvedBy=id; x.excepcion.at=at; audit("excepción resuelta", x.id, `Fondo completo confirmado en el corte ${id}`); } });
  audit("corte", id, `Arqueo ${smoney(c.diff)} · entrega ${money(c.entregaAmount)} · fondo final ${money(c.fondoFinal)} (${c.fondoStatus})`);
  return {ok:true, corte:c};
}
/* Excepción de fondo: la siguiente jornada abre con el fondo real (incompleto) hasta registrar la reposición. */
function opResolverExcepcion(){
  if(!can("reposicion")) return fail("Sin permiso (simulado).");
  const g=guardCaja(); if(!g.ok) return g; const s=g.s;
  if(!s.excepcion) return fail("No hay excepción de fondo pendiente.");
  const c=corteById(s.excepcion); if(!c.excepcion||c.excepcion.status!=="pendiente") return fail("La excepción ya está resuelta.");
  const amount=FONDO_FIJO-s.fondoInicial; if(amount<=0) return fail("El fondo ya está completo.");
  const e=addMov({type:"entrada", origin:"admin", fondo:true, sid:s.id, amount, excepcion:c.id, note:`Reposición del fondo fijo (excepción del corte ${c.id}; aportación de administración, no es venta)`});
  c.excepcion.status="resuelta"; c.excepcion.resolvedBy=e.id; c.excepcion.at=nowMs(); s.fondoRepuesto=e.id;
  audit("excepción resuelta", c.id, `Reposición ${money(amount)} con ${e.id}`);
  return {ok:true, mov:e};
}
/* Tres resultados independientes del corte (nunca un solo indicador). */
function corteIndicators(c){
  const a = c.diff===0 ? {cls:"ok",icon:"i-checkc",t:"Arqueo cuadrado",c:"Arqueo cuadrado",s:"Contado = esperado"}
          : c.diff<0 ? {cls:"err",icon:"i-alert",t:`Faltante ${money(-c.diff)}`,c:`Faltante ${money(-c.diff)}`,s:"Registrado"}
          : {cls:"warn",icon:"i-alert",t:`Sobrante ${money(c.diff)}`,c:`Sobrante ${money(c.diff)}`,s:"Registrado"};
  const f = c.fondoStatus==="completo" ? {cls:"ok",icon:"i-lock",t:`Fondo completo ${money(c.fondoFinal)}`,c:"Fondo completo",s:c.reposicion?`Con reposición de ${money(c.reposicionAmount)}`:"Contado en caja"}
          : {cls:"err",icon:"i-alert",t:`Fondo insuficiente ${money(c.fondoFinal)}`,c:"Fondo incompleto",s:`Faltan ${money(FONDO_FIJO-c.fondoFinal)} · excepción ${c.excepcion&&c.excepcion.status==="resuelta"?"resuelta":"pendiente"}`};
  const t=c.entrega&&movById(c.entrega), r=t&&t.recepcion&&movById(t.recepcion);
  const e = !t ? {cls:"neutral",icon:"i-minus",t:"Sin entrega",c:"Sin entrega",s:"No hubo excedente"}
          : !r ? {cls:"pend",icon:"i-hourglass",t:`Entrega pendiente ${money(t.amount)}`,c:"Entrega pendiente",s:"Falta que administración confirme"}
          : r.amount===t.amount ? {cls:"ok",icon:"i-checkc",t:`Entrega recibida ${money(r.amount)}`,c:"Entrega recibida",s:`Confirmada ${hhmm(r.at)}`}
          : {cls:"warn",icon:"i-alert",t:`Recibida ${money(r.amount)} de ${money(t.amount)}`,c:"Recibida con diferencia",s:`Diferencia ${smoney(r.amount-t.amount)}`};
  return [["Arqueo",a],["Fondo final",f],["Entrega",e]];
}

function opCrearTicket({cat, pkg, extras=[], plate}){
  if(!can("crearTicket")) return fail("Sin permiso (simulado).");
  if(!CATS.some(c=>c.id===cat)||!PKGS[pkg]) return fail("Elige categoría y paquete.");
  if(cat==="rzr") return fail("RZR requiere precio final confirmado en ALAGA SYSTEM; no se crea desde Finanzas.");
  const ex=extras.filter(id=>{const e=EXTRAS.find(x=>x.id===id); return e&&e.p[cat]!=null;});
  const t={id:nextId("t"), plate:String(plate||"").trim().toUpperCase().slice(0,10)||"DEMO-"+S.seq.t, cat, pkg, extras:ex, at:nowMs(), demo:true};
  S.tickets.push(t); audit("ticket", t.id, `${tLabel(t)} · ${money(ticketTotal(t))}`);
  return {ok:true, ticket:t};
}

/* Verificación de integridad del libro (se muestra en Reportes y se usa en pruebas). */
function ledgerChecks(){
  const out=[], {E,C}=sumEff(S.movs);
  const left=E.caja+E.transito+E.resguardo+E.clip+E.banco;
  const right=C.aporte+C.venta-C.gasto+C.entrada+E.dif;
  out.push({n:"Cuadre global: cuentas = fondo + ventas − gastos + aportaciones ± diferencias", ok:left===right, d:`${money(left)} = ${money(right)}`});
  const s=openSession();
  if(s){ const B=sessionBreakdown(s), ci=cierreOf(s); const want=ci?B.final:B.expected;
    out.push({n:ci?"Caja global = efectivo físico del cierre en curso":"Caja global = esperado de la sesión abierta", ok:E.caja===want, d:`${money(E.caja)} vs ${money(want)}`}); }
  else { const lc=lastCorte(); out.push({n:"Caja cerrada = fondo final confirmado", ok:!lc||E.caja===lc.fondoFinal, d:lc?money(lc.fondoFinal):"—"}); }
  let arr=true; S.sessions.forEach((x,i)=>{ if(i>0){ const prev=corteById(S.sessions[i-1].corte); if(!prev||x.opening!==prev.fondoFinal) arr=false; }});
  out.push({n:"Cada apertura usa el fondo confirmado en el cierre anterior", ok:arr, d:`${S.sessions.length} sesiones`});
  let f500=true; S.sessions.forEach(x=>{ if(x.fondoCompleto&&x.fondoInicial!==FONDO_FIJO) f500=false; if(x.fromCorte){ const p=corteById(x.fromCorte); if(x.fondoCompleto!==(p.fondoStatus==="completo")) f500=false; } });
  out.push({n:`Solo se abre con fondo completo (${money(FONDO_FIJO)}) si el cierre anterior lo confirmó`, ok:f500, d:`${S.sessions.filter(x=>x.fondoCompleto).length} aperturas con fondo completo`});
  /* v0.8: un ticket puede tener además cobros de DIFERENCIA (subió de servicio ya cobrado); lo cobrado nunca supera su total. */
  let one=true; S.tickets.forEach(t=>{ const c=S.movs.filter(m=>m.type==="cobro"&&m.ticket===t.id&&isActive(m)); if(c.filter(m=>!m.complemento).length>1||c.reduce((s,m)=>s+m.amount,0)>Math.max(0,ticketTotal(t))) one=false; });
  out.push({n:"Ningún ticket tiene más de un cobro principal ni se cobra de más", ok:one, d:`${S.tickets.length} tickets`});
  const liq={}; let once=true; S.movs.filter(m=>m.type==="liquidacion"&&isActive(m)).forEach(l=>l.cobros.forEach(id=>{ if(liq[id]) once=false; liq[id]=1; }));
  out.push({n:"Cada cobro Clip aparece en una sola liquidación", ok:once, d:`${Object.keys(liq).length} cobros liquidados`});
  let cortesOk=true; S.cortes.forEach(c=>{
    if(countTotal(c.count)!==c.counted||c.counted-c.expected!==c.diff) cortesOk=false;
    const aj=c.ajuste&&movById(c.ajuste); if((c.diff!==0)!==(!!aj)||(aj&&aj.sign*aj.amount!==c.diff)) cortesOk=false;
    if(c.fondoFinal!==c.counted-c.entregaAmount+c.reposicionAmount||countTotal(c.fondoCount)!==c.fondoFinal) cortesOk=false;
    if(c.entrega&&movById(c.entrega).type!=="traslado") cortesOk=false;
    if(c.fondoStatus==="insuficiente"&&!c.excepcion) cortesOk=false; });
  out.push({n:"Cortes: conteo original intacto, diferencia registrada aparte, fondo = contado − entrega + reposición", ok:cortesOk, d:`${S.cortes.length} cortes`});
  let entOk=true; S.movs.filter(m=>m.kind==="cierre").forEach(m=>{ const r=eff(m); if(r.C.gasto!==0) entOk=false; });
  out.push({n:"Ninguna entrega de cierre se registra como gasto", ok:entOk, d:`${S.movs.filter(m=>m.kind==="cierre").length} entregas`});
  let revOk=true; S.movs.forEach(m=>{ if(m.reverses){ const o=movById(m.reverses); if(!o||o.reversedBy!==m.id) revOk=false; }});
  out.push({n:"Cada corrección enlaza con su original (nada se borró)", ok:revOk, d:`${S.movs.filter(m=>m.type==="reverso").length} correcciones`});
  return out;
}
</script>

<script>
"use strict";
/* =====================================================================
   Interfaz: vistas, hojas y acciones. La UI nunca calcula dinero por su cuenta:

const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const R = {route:null, prevRoute:null, movScope:"turno", movType:"todos", revTab:"pendiente", period:"hoy", from:"", to:"", showAudit:false};

  traslado:["i-out","gold"],recepcion:["i-vault","gold"],deposito:["i-bank","info"],liquidacion:["i-card","info"],ajuste:["i-alert","err"],reverso:["i-reset","violet"]};

  }

}
const BORDER=["caja","clip","banco","resguardo","transito","dif"];
const DEST={recepcion:"resguardo",deposito:"banco",liquidacion:"banco"};
function movPrimary(m){ const E=eff(m).E, base=m.type==="reverso"?movById(m.reverses):m; let b=DEST[base.type]; if(!b||E[b]===0) b=BORDER.find(k=>E[k]!==0)||"caja"; return {b, v:E[b]}; }
function flowText(m){
  switch(m.type){

function reviewBadge(rv){

function keyBadge(m){
  if(m.reversedBy) return `<span class="badge b-void">Anulado</span>`;

function mrow(m, showDay=false){
  const [ic,c]=TYPE_ICON[m.type], p=movPrimary(m), t=m.ticket&&ticketById(m.ticket), kb=keyBadge(m);

  </button>`;

function dayGroups(list, rowFn=mrow){
  if(!list.length) return "";

}
const empty = (icon,t,s="") => `<div class="empty">${ico(icon)}<b>${t}</b>${s}</div>`;

/* ---------- Estructura ---------- */
function header(){
  const r=ROLES[S.role], days=Math.round((S.clock||0)/DAY);
  return `<header class="brandbar"><div class="bb-row">
    <div class="logo" aria-label="ALAGA Finanzas Pro"><b>ALAGA</b><small>FINANZAS PRO</small></div>

/* ---------- Caja ---------- */
function waterfall(B, s){
  const startV=B.opening+B.fondo, full=startV===FONDO_FIJO;
  const rows=[{l:"Fondo inicial", tag:full?"completo":"incompleto", v:startV, start:true},
    {l:"Cobros en efectivo", v:B.cobros}, {l:"Aportaciones", v:B.entradas}, {l:"Gastos", v:-B.gastos, neg:true},
{l:"Retiros a administración", v:-B.traslados, neg:true}, {l:"Correcciones", v:B.correcciones}]
    .filter(r=>r.start||r.v!==0||r.l==="Cobros en efectivo");
  let run=0, lo=0, hi=0; const seg=rows.map(r=>{ const a=r.start?0:run, b=r.start?r.v:run+r.v; run=b; lo=Math.min(lo,a,b); hi=Math.max(hi,a,b); return [a,b]; });
  const span=Math.max(hi-lo,1), pos=x=>((x-lo)/span*100).toFixed(2);
  const li=rows.map((r,i)=>{ const [a,b]=seg[i], cls=r.start?"":r.v>0?"pos":r.v<0?"neg":"";
    const col=r.start?"var(--gold-ink)":r.v>=0?"var(--ok)":"var(--err)";
    return `<li><span class="wl"><span class="sgn ${r.start?"eq":cls}" aria-hidden="true">${r.start?"·":(r.v<0||r.neg)?"−":"+"}</span><span>${esc(r.l)}${r.tag?` <span class="badge ${full?"b-rev":"b-void"}">${r.tag}</span>`:""}</span></span>
      <span class="wv tnum ${cls}">${r.start?money(r.v):smoney(r.v)}</span>
      <span class="trk" aria-hidden="true"><i style="--c:${col};left:${pos(Math.min(a,b))}%;width:${Math.max(.8,Math.abs(b-a)/span*100).toFixed(2)}%"></i></span></li>`; }).join("");
  return `<ul class="wf" aria-label="Cálculo del efectivo esperado">${li}<li class="tot"><span class="wl"><span class="sgn eq" aria-hidden="true">=</span>Esperado</span><span class="wv tnum">${money(B.expected)}</span></li></ul><p class="note formula">Fondo + cobros en efectivo + aportaciones − gastos − retiros</p>`;
}

}

function periodRange(){
  const n=nowMs(), t0=startOfDay(n);
  switch(R.period){
    case "hoy": return [t0, t0+DAY-1, "Hoy"];
    case "ayer": return [t0-DAY, t0-1, "Ayer"];
    case "7d": return [t0-6*DAY, t0+DAY-1, "Últimos 7 días"];
    case "mes": { const d=new Date(n); return [new Date(d.getFullYear(),d.getMonth(),1).getTime(), t0+DAY-1, "Este mes"]; }
    case "rango": { if(!R.from||!R.to) return [t0,t0+DAY-1,"Rango (elige fechas)"]; const a=startOfDay(keyToMs(R.from)), b=startOfDay(keyToMs(R.to))+DAY-1; return a<=b?[a,b,`${dShort(a)} – ${dShort(b)}`]:[b-DAY+1,a+DAY-1,"Rango"]; }
    default: return [0, Infinity, "Todo"];
  }
}
function reportData(){
  const [a,b,label]=periodRange(), inR=t=>t>=a&&t<=b;
  const movs=S.movs.filter(m=>inR(m.at)), {E,C}=sumEff(movs);
  const meth={efectivo:{c:0,n:0},clip:{c:0,n:0},transferencia:{c:0,n:0}};
  movs.forEach(m=>{
    if(m.type==="cobro"){ meth[m.method].c+=m.amount; meth[m.method].n++; }
    if(m.type==="reverso"){ const o=movById(m.reverses); if(o.type==="cobro"){meth[o.method].c-=o.amount; meth[o.method].n--;} }
  });
  const conc={};
  movs.forEach(m=>{ let g=null,sign=1; if(m.type==="gasto") g=m; else if(m.type==="reverso"&&movById(m.reverses).type==="gasto"){ g=movById(m.reverses); sign=-1; }
    if(!g) return; const k=g.concept; conc[k]=conc[k]||{t:0,n:0,pend:0,rev:0,acl:0};
    conc[k].t+=sign*g.amount; conc[k].n+=sign; if(sign>0) conc[k][g.review.status==="revisado"?"rev":g.review.status==="aclaracion"?"acl":"pend"]++; });
  const cortes=S.cortes.filter(c=>inR(c.at));
  const difs=[...cortes.filter(c=>c.diff!==0).map(c=>({k:"Arqueo",id:c.id,at:c.at,v:c.diff,d:c.diff<0?"Faltante":"Sobrante",go:"corteDetail"})),
    ...movs.filter(m=>m.type==="recepcion"&&m.amount!==m.sent).map(m=>({k:"Traslado",id:m.id,at:m.at,v:m.amount-m.sent,d:`Recibido ${money(m.amount)} de ${money(m.sent)}`,go:"movDetail"})),
    ...movs.filter(m=>m.type==="liquidacion"&&m.amount!==m.gross).map(m=>({k:"Liquidación Clip",id:m.id,at:m.at,v:m.amount-m.gross,d:"Por conciliar (FP-7)",go:"movDetail"}))];
  const pend=pendingTickets();
  return {a,b,label,movs,E,C,meth,conc,cortes,difs,pend};
}

function backupPanel(){
  const used=storageUsage(), keys=backupKeys(), admin=can("exportar");
  const row=k=>{ let raw=""; try{ raw=localStorage.getItem(k)||""; }catch(e){}
    const isPrev=k===PREV_KEY, when=isPrev?"Antes del último restablecimiento o restauración":"Datos ilegibles · "+k.slice(BK_PREFIX.length).replace("T"," ").slice(0,16);
    return `<div class="row trow"><span class="rmain"><span class="rt">${isPrev?"Copia anterior":"Copia de recuperación"}</span><span class="rs">${esc(when)} · ${(raw.length*2/1024).toFixed(1)} KB</span></span>
      ${admin?`<button class="btn sm" data-a="downloadRaw" data-k="${esc(k)}" aria-label="Descargar copia">${ico("i-download")}</button><button class="btn sm pri" data-a="restoreKey" data-k="${esc(k)}">Restaurar</button>`:""}</div>`; };
  return `<section class="panel span2" aria-labelledby="bk-h"><div class="panel-h"><h2 id="bk-h">${ico("i-shield")}Respaldo y recuperación</h2><span class="count">${(used/1024).toFixed(0)} KB usados</span></div>
    ${admin?`<div class="btnrow"><button class="btn" data-a="exportJSON">${ico("i-download")}Descargar respaldo</button><label class="btn" for="imp-file">${ico("i-folder")}Restaurar desde archivo</label><input type="file" id="imp-file" accept="application/json,.json" data-f="importFile" class="sr"></div>
      <p class="note">El respaldo contiene información financiera. Compártelo solo con administración.</p>`:`<p class="note">Los respaldos los descarga y restaura Administración.</p>`}
    ${keys.length?`<div class="list" style="margin-top:8px">${keys.map(row).join("")}</div>`:`<p class="note">No hay copias guardadas en este navegador.</p>`}
    <p class="note">Se guarda solo en este navegador y sin cifrar. Borrar los datos del sitio elimina todo.</p></section>`;
}
const VIEWS = {caja:vCaja, movs:vMovs, revisiones:vRev, arqueo:vArqueo, resguardo:vResguardo, reportes:vReportes, mas:vMas};

/* ---------- Render ---------- */
function render(){
  if(!ROUTES[R.route]) R.route=ROLES[S.role].home;
  const same=R.prevRoute===R.route, y=window.scrollY;
  let body;
  try{ body=storeBanner()+(canRoute(R.route)?VIEWS[R.route]():vPerm(R.route)); $("#app").innerHTML=header()+`<main id="main" tabindex="-1">${body}</main>`+tabbar(); }
  catch(e){ $("#app").innerHTML=crashView(e); R.prevRoute=null; return; }
  document.title=`${ROUTES[R.route].t} · ALAGA Finanzas Pro · DEMO`;
  if(same) window.scrollTo(0,y); else { window.scrollTo(0,0); if(R.prevRoute) $("#main").focus({preventScroll:true}); }
  R.prevRoute=R.route;
}
function go(route){ if(location.hash!=="#/"+route) location.hash="#/"+route; else { R.route=route; render(); } }
function routeFromHash(){ const m=location.hash.match(/^#\/(\w+)/); return m?m[1]:null; }
window.addEventListener("hashchange",()=>{ R.route=routeFromHash()||ROLES[S.role].home; closeSheet(true); render(); });

/* ---------- Avisos de almacenamiento y pantalla de recuperación ---------- */
function storeBanner(){
  let h="";
  if(STORE.stale) h+=`<div class="banner err" role="alert">${ico("i-alert")}<span><b>Hay cambios hechos en otra pestaña o ventana.</b> Para no borrarlos, aquí ya no se guarda nada.</span><button class="btn sm" data-a="reloadPage">Recargar</button></div>`;
  else if(!STORE.ok) h+=`<div class="banner err" role="alert">${ico("i-alert")}<span><b>${esc(STORE.err||"No se pudo guardar.")}</b></span>${can("exportar")?`<button class="btn sm" data-a="exportJSON">Respaldo</button>`:""}</div>`;
  if(STORE.recovered) h+=`<div class="banner warn" role="status">${ico("i-shield")}<span>Había datos guardados que no se pudieron leer. ${STORE.recovered.key?"Se guardó una copia intacta antes de cargar los datos DEMO.":"No se pudieron copiar; no se sobrescribirán."}</span><button class="btn sm" data-go="mas">Ver</button></div>`;
  return h;
}
function crashView(e){
  return `<main id="main" style="max-width:640px;margin:0 auto;padding:24px 16px"><div class="panel">${ico("i-alert")}<h1 style="font-size:20px;margin:8px 0">No se pudo mostrar la información</h1>
    <p class="note">Los datos guardados no se borraron. Elige una opción:</p>
    <div class="grid" style="margin-top:12px"><button class="btn block" data-a="downloadRaw" data-k="${esc(KEY)}">${ico("i-download")}Descargar los datos guardados</button>
    ${(()=>{ try{ return localStorage.getItem(PREV_KEY)?`<button class="btn block" data-a="restoreKey" data-k="${esc(PREV_KEY)}">Restaurar la copia anterior</button>`:""; }catch(x){ return ""; } })()}
    <button class="btn danger block" data-a="crashReset">Cargar datos DEMO (guarda copia)</button></div>
    <p class="note" style="margin-top:12px">Detalle técnico: ${esc(String(e&&e.message||e).slice(0,160))}</p></div></main>`;
}
window.addEventListener("storage", e=>{ if(e.key===KEY&&e.newValue!==null){ let r=0; try{ r=Number(JSON.parse(e.newValue).rev)||0; }catch(x){ r=Infinity; } if(r>STORE.rev){ STORE.stale=true; STORE.ok=false; STORE.err="Otra pestaña o ventana guardó cambios. Recarga antes de seguir."; render(); } } });

/* ---------- Toast ---------- */
let toastT=null;
function toast(msg, err=false){
  if(!err&&(!STORE.ok||STORE.stale)){ msg=STORE.err||"No se guardó."; err=true; }
  const t=$("#toast"); $("#toast-t").textContent=msg; t.classList.toggle("err",err);
  t.querySelector("use").setAttribute("href", err?"#i-alert":"#i-check");
  t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"), err?5200:3600);
}

<script>
"use strict";
/* =====================================================================
   Exportación a Excel (.xlsx) sin librerías ni internet.
   Genera un libro Office Open XML con una TABLA de Excel por hoja (encabezado, filtros,
   filas alternadas), formato de moneda MXN y fechas reales. Los textos se guardan como texto
   (nunca como fórmula), así que una nota que empiece con "=" no se ejecuta.
   ===================================================================== */
const XL = (()=>{
  const enc = new TextEncoder();
  const CRC = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
  const crc32 = b => { let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  /* ZIP sin compresión (método “stored”), suficiente y compatible con Excel, Numbers y Google Sheets */
  function zip(files){
    const parts=[], cd=[]; let off=0;
    const d=new Date(), dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF, dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
    files.forEach(f=>{
      const nm=enc.encode(f.name), data=typeof f.data==="string"?enc.encode(f.data):f.data, crc=crc32(data);
      const h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,dt,true); h.setUint16(12,dd,true);
      h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
      parts.push(new Uint8Array(h.buffer),nm,data);
      const c=new DataView(new ArrayBuffer(46));
      c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,dt,true); c.setUint16(14,dd,true);
      c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nm.length,true);
      c.setUint16(30,0,true); c.setUint16(32,0,true); c.setUint16(34,0,true); c.setUint16(36,0,true); c.setUint32(38,0,true); c.setUint32(42,off,true);
      cd.push(new Uint8Array(c.buffer),nm);
      off+=30+nm.length+data.length;
    });
    const cdSize=cd.reduce((s,a)=>s+a.length,0), e=new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
    const all=[...parts,...cd,new Uint8Array(e.buffer)], len=all.reduce((s,a)=>s+a.length,0), out=new Uint8Array(len); let p=0;
    all.forEach(a=>{ out.set(a,p); p+=a.length; });
    return out;
  }
  const x = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const col = n => { let s=""; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; };
  /* Fecha/hora local → número de serie de Excel, calculado en segundos enteros para que 08:00 no salga como 07:59:59 */
  const parts = ms => { const secs=Math.round((ms - new Date(ms).getTimezoneOffset()*60000)/1000), day=Math.floor(secs/86400); return {day:day+25569, sod:secs-day*86400}; };
  const serial = ms => { const p=parts(ms); return p.day + p.sod/86400; };
  const num = (day, sod) => (day + (sod+0.0005)/86400).toFixed(10);
  const STYLE = {s:0, head:1, money:2, date:3, time:4, datetime:5, int:6};
  const NS = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
  const NSR = 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const XMLH = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';

  /* sheets: [{name, table, cols:[{h, t, w}], rows:[[...]]}] → Uint8Array (.xlsx) */
  function build(sheets, meta={}){
    const sst=[], sIdx=new Map();
    const si = v => { v=String(v); if(!sIdx.has(v)){ sIdx.set(v,sst.length); sst.push(v); } return sIdx.get(v); };
    const files=[];
    sheets.forEach((sh,i)=>{
      const n=i+1, rows=sh.rows.length?sh.rows:[[`Sin registros en el periodo`]];
      const last=col(sh.cols.length-1)+(rows.length+1), ref="A1:"+last;
      let xml=XMLH+`<worksheet ${NS} ${NSR}><dimension ref="${ref}"/><sheetViews><sheetView workbookViewId="0"${i===0?' tabSelected="1"':""}><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`;
      xml+=`<sheetFormatPr defaultRowHeight="15"/><cols>${sh.cols.map((c,j)=>`<col min="${j+1}" max="${j+1}" width="${c.w||14}" customWidth="1"/>`).join("")}</cols><sheetData>`;
      xml+=`<row r="1">${sh.cols.map((c,j)=>`<c r="${col(j)}1" t="s" s="${STYLE.head}"><v>${si(c.h)}</v></c>`).join("")}</row>`;
      rows.forEach((r,ri)=>{
        const rn=ri+2; let cells="";
        sh.cols.forEach((c,j)=>{
          const v=r[j]; if(v===null||v===undefined||v==="") return;
          const a=col(j)+rn;
          if(c.t==="money"){ if(typeof v!=="number") return; cells+=`<c r="${a}" s="${STYLE.money}"><v>${Math.round(v)/100}</v></c>`; }
          else if(c.t==="int"){ if(typeof v!=="number") return; cells+=`<c r="${a}" s="${STYLE.int}"><v>${v}</v></c>`; }
          else if(c.t==="date"){ cells+=`<c r="${a}" s="${STYLE.date}"><v>${parts(v).day}</v></c>`; }
          else if(c.t==="time"){ const p=parts(v); cells+=`<c r="${a}" s="${STYLE.time}"><v>${num(0,p.sod)}</v></c>`; }
          else if(c.t==="datetime"){ const p=parts(v); cells+=`<c r="${a}" s="${STYLE.datetime}"><v>${num(p.day,p.sod)}</v></c>`; }
          else cells+=`<c r="${a}" t="s"><v>${si(v)}</v></c>`;
        });
        xml+=`<row r="${rn}">${cells}</row>`;
      });
      xml+=`</sheetData><tableParts count="1"><tablePart r:id="rId1"/></tableParts></worksheet>`;
      files.push({name:`xl/worksheets/sheet${n}.xml`, data:xml});
      files.push({name:`xl/worksheets/_rels/sheet${n}.xml.rels`, data:XMLH+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/table" Target="../tables/table${n}.xml"/></Relationships>`});
      files.push({name:`xl/tables/table${n}.xml`, data:XMLH+`<table ${NS} id="${n}" name="${sh.table}" displayName="${sh.table}" ref="${ref}" totalsRowShown="0"><autoFilter ref="${ref}"/><tableColumns count="${sh.cols.length}">${sh.cols.map((c,j)=>`<tableColumn id="${j+1}" name="${x(c.h)}"/>`).join("")}</tableColumns><tableStyleInfo name="TableStyleMedium2" showFirstColumn="0" showLastColumn="0" showRowStripes="1" showColumnStripes="0"/></table>`});
    });
    const N=sheets.length;
    files.unshift(
      {name:"[Content_Types].xml", data:XMLH+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>`+
        `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`+
        sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/tables/table${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.table+xml"/>`).join("")+
        `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>`+
        `<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`},
      {name:"_rels/.rels", data:XMLH+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`},
      {name:"docProps/core.xml", data:XMLH+`<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${x(meta.title||"ALAGA Finanzas")}</dc:title><dc:creator>${x(meta.author||"ALAGA Finanzas Pro")}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().replace(/\.\d+Z$/,"Z")}</dcterms:created></cp:coreProperties>`},
      {name:"docProps/app.xml", data:XMLH+`<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>ALAGA Finanzas Pro</Application></Properties>`},
      {name:"xl/workbook.xml", data:XMLH+`<workbook ${NS} ${NSR}><bookViews><workbookView firstSheet="0" activeTab="0" showSheetTabs="1"/></bookViews><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`},
      {name:"xl/_rels/workbook.xml.rels", data:XMLH+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${N+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId${N+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/></Relationships>`},
      {name:"xl/styles.xml", data:XMLH+`<styleSheet ${NS}><numFmts count="4"><numFmt numFmtId="164" formatCode="&quot;$&quot;#,##0.00;[Red]\\-&quot;$&quot;#,##0.00"/><numFmt numFmtId="165" formatCode="dd/mm/yyyy"/><numFmt numFmtId="166" formatCode="hh:mm"/><numFmt numFmtId="167" formatCode="dd/mm/yyyy hh:mm"/></numFmts>`+
        `<fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>`+
        `<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`+
        `<cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="167" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="1" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>`+
        `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`}
    );
    files.push({name:"xl/sharedStrings.xml", data:XMLH+`<sst ${NS} count="${sst.length}" uniqueCount="${sst.length}">${sst.map(s=>`<si><t xml:space="preserve">${x(s)}</t></si>`).join("")}</sst>`});
    return zip(files);
  }
  return {build, zip, crc32, serial, col};
})();

/* ---------- Contenido del libro de ALAGA Finanzas ---------- */
const yesNo = b => b?"Sí":"No";
function classify(m){ const {E,C}=eff(m); return C.venta>0?"Venta":C.venta<0?"Venta revertida":C.gasto>0?"Gasto":C.gasto<0?"Gasto revertido":C.entrada?"Aportación":C.aporte?"Fondo":E.dif?"Diferencia":"Entre cuentas"; }
function excelSheets(){
  const D=reportData(), bal=balances(), inP=t=>t>=D.a&&t<=D.b, movs=D.movs.slice().sort((a,b)=>a.at-b.at);
  const resumen=[];
  const add=(sec,con,imp=null,cant=null)=>resumen.push([sec,con,imp,cant]);
  add("Información",`Periodo: ${D.label}`); add("Información",`Generado: ${new Date(nowMs()).toLocaleString("es-MX")}`); add("Información","Datos ficticios DEMO · no aprobado para operar");
  const nC=Object.values(D.meth).reduce((s,x)=>s+x.n,0);
  add("Ventas","Ventas cobradas",D.C.venta,nC);
  Object.entries(D.meth).forEach(([k,v])=>add("Ventas",METHODS[k],v.c,v.n));
