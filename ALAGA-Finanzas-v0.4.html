   - Cada operación se valida aquí (respuesta inmediata) y se guarda en la bandeja de envío con el MISMO folio (UUID)
     que verá la caja fuerte. Al confirmar, la pantalla se reconstruye con el estado oficial.
   - Si la caja fuerte rechaza algo, desaparece de la pantalla y queda en “rechazados” con el motivo (no se pierde).
   - Si guardar en la bandeja falla, la operación se deshace: nunca queda en pantalla algo que no se vaya a enviar.
   - Privacidad: en modo conectado no se guarda copia de los datos en el teléfono, solo la bandeja de envío.
   - El modo DEMO (datos ficticios en este navegador) sigue disponible y no se mezcla con el conectado.
   ===================================================================== */
const CF_CONF_KEY = "alaga-cf:config:finanzas";
const UUID_RE_CF = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;
const ROLE_FROM_SERVER = {operacion:"op", administracion:"admin"};
const TYPE_FROM_SERVER = {retiro:"traslado", aportacion:"entrada"};
const CF = {on:false, url:"", cli:null, user:null, online:null, err:"", lastOk:0, busy:false, again:false, gen:0, sess:0, waitFor:null, timer:null, paused:false, lastSnap:""};
/* Pendientes de la persona con sesión (los de otras personas no bloquean la actualización). */
const cfMine = () => { const u=CF.user&&CF.user.usuario; return CF.cli?CF.cli.pendientes().filter(e=>e.usuario===u).length:0; };

function cfConf(){ try{ const o=JSON.parse(localStorage.getItem(CF_CONF_KEY)||"null"); return o&&typeof o==="object"?o:{}; }catch(e){ return {}; } }
function cfSetConf(o){ try{ localStorage.setItem(CF_CONF_KEY, JSON.stringify(o)); return true; }catch(e){ return false; } }
function cfDefaultUrl(){ return /^https?:$/.test(location.protocol) ? location.origin : ""; }
const cfRole = r => ROLE_FROM_SERVER[r] || "op";

/* ---------- Estado oficial → formato de la app ---------- */
function cfReview(rv){ return rv ? {status:rv.status, history:(rv.history||[]).map(h=>({at:h.at, by:cfRole(h.byRole), user:h.by, status:h.status, note:h.note||"", response:!!h.response}))} : undefined; }
function cfBuildState(snap, prev){
  const movs=snap.movimientos.map(m=>{ const o=Object.assign({}, m, {type:TYPE_FROM_SERVER[m.type]||m.type, by:cfRole(m.byRole), user:m.byName});
    delete o.byRole; delete o.byName; if(m.review) o.review=cfReview(m.review); return o; });
  const sessions=snap.sesiones.map(s=>({id:s.id, openedAt:s.openedAt, by:cfRole(s.byRole), user:s.byName, openKind:s.fromCorte?"arrastre":"fondo", opening:s.opening,
    fromCorte:s.fromCorte, fondoInicial:s.fondoInicial, fondoCompleto:s.fondoCompleto, excepcion:s.excepcion, closedAt:s.closedAt||undefined, corte:s.corte||undefined, fondoRepuesto:s.fondoRepuesto}));
  const tickets=snap.tickets.map(t=>Object.assign({id:t.id, folio:t.folio||null, plate:t.plate, cat:t.cat, pkg:t.pkg, extras:t.extras||[], at:t.at}, t.ajuste?{ajuste:{monto:t.ajuste.monto, motivo:t.ajuste.motivo}}:{}, t.beneficio>0?{beneficio:t.beneficio}:{}, t.cancelado?{cancelado:t.cancelado}:{}, Array.isArray(t.lineas)?{lineas:t.lineas}:{}, t.cambios?{cambios:t.cambios}:{}, t.usadoEn?{usadoEn:t.usadoEn}:{}));
  const next={v:3, rev:0, role:cfRole(snap.usuario.rol), clock:0, seq:(prev&&prev.seq)||{}, tickets, sessions, movs, cortes:[], audit:[], conectado:true,
    cierre:null, draft:prev?prev.draft:null, draftFondo:prev?prev.draftFondo:null, corteNote:prev?prev.corteNote:""};
  const old=S; S=next;
  try{
    S.cortes=snap.cortes.map(c=>{ const s=sessById(c.sid)||{}; return Object.assign({}, c, {by:"op", user:c.by, openedAt:s.openedAt, opening:s.opening, openKind:s.openKind, fromCorte:s.fromCorte,
      countAt:c.at, fondoAt:c.at, excedente:Math.max(0,c.counted-FONDO_FIJO), decision:c.reposicionAmount>0?"reposicion":c.excepcion?"excepcion":"completo",
      review:cfReview(c.review), breakdown:s.id?sessionBreakdown(s):null}); });
    /* Bitácora (consulta): se arma con lo confirmado. La bitácora oficial e inalterable está en la caja fuerte. */
    const ev=[...S.movs.map(m=>({at:m.at, by:m.by, user:m.user, action:"alta", ref:m.id, detail:`${TYPE_LABEL[m.type]} ${money(m.amount)}`})),
      ...S.cortes.map(c=>({at:c.at, by:"op", user:c.user, action:"corte", ref:c.id, detail:`Arqueo ${smoney(c.diff)} · entrega ${money(c.entregaAmount)} · fondo final ${money(c.fondoFinal)}`}))];
    S.audit=ev.sort((a,b)=>a.at-b.at).map((x,i)=>Object.assign({id:"A-"+String(i+1).padStart(5,"0")}, x));
  }catch(e){ S=old; throw e; }
  return S;
}

/* ---------- Operación local → registro para la caja fuerte ---------- */
const CF_MAP = {
  opAbrirCaja:(r,[o={}])=>[{type:"caja.abrir", id:r.s.id, at:r.s.openedAt, data:{confirmFondo:!!o.confirmFondo}}],
  opCrearTicket:r=>[{type:"ticket.crear", id:r.ticket.id, at:r.ticket.at, data:{plate:r.ticket.plate, cat:r.ticket.cat, pkg:r.ticket.pkg, extras:r.ticket.extras}}],
  opCobrar:(r,[tid,method])=>[{type:"cobro", id:r.mov.id, at:r.mov.at, data:{sesion:r.mov.sid, ticket:tid, method, ref:r.mov.ref||""}}],
  opGasto:r=>{ const m=r.mov, d={origin:m.origin, amount:m.amount, concept:m.concept, receipt:!!m.receipt, vendor:m.vendor||"", note:m.note||""}; if(m.sid) d.sesion=m.sid; return [{type:"gasto", id:m.id, at:m.at, data:d}]; },
  opEntrada:r=>[{type:"aportacion", id:r.mov.id, at:r.mov.at, data:{sesion:r.mov.sid, origin:r.mov.origin, amount:r.mov.amount, note:r.mov.note||""}}],
  opTraslado:r=>[{type:"retiro", id:r.mov.id, at:r.mov.at, data:{sesion:r.mov.sid, amount:r.mov.amount, note:r.mov.note||""}}],
  opConfirmarTraslado:(r,[mid])=>[{type:"recepcion", id:r.mov.id, at:r.mov.at, data:{traslado:mid, amount:r.mov.amount, note:r.mov.note||""}}],
  opDeposito:r=>[{type:"deposito", id:r.mov.id, at:r.mov.at, data:{amount:r.mov.amount, ref:r.mov.ref||""}}],
  opLiquidacion:r=>[{type:"liquidacion", id:r.mov.id, at:r.mov.at, data:{cobros:r.mov.cobros, net:r.mov.amount, ref:r.mov.ref||""}}],
  opReverso:(r,[mid])=>[{type:"reverso", id:r.mov.id, at:r.mov.at, data:{reverses:mid, note:r.mov.note}}],
  opRevisar:(r,[kind,id,status,note])=>[{type:"revision", data:{target:id, status, note:String(note||"").trim().slice(0,300)}}],
  opResponder:(r,[kind,id,text])=>[{type:"respuesta", data:{target:id, note:String(text||"").trim().slice(0,300)}}],
  opCerrarCorte:r=>{ const c=r.corte; return [{type:"cierre", at:c.at, data:{sesion:c.sid, count:c.count, diffNote:c.diffNote||"", decision:c.decision,
    excNote:c.excepcion?c.excepcion.note:"", fondoCount:c.fondoCount, note:c.note||"", esperado:c.expected}}]; },
  opResolverExcepcion:r=>[{type:"excepcion.reponer", id:r.mov.id, at:r.mov.at, data:{sesion:r.mov.sid}}]
};
/* Validaciones previas que la caja fuerte exige y la demo no (para avisar antes, no después). */
const CF_PRE = {
  opCrearTicket:([o={}])=>{ const p=String(o.plate||"").trim().toUpperCase().replace(/\s+/g,"-");
    if(!/^[A-Z0-9-]{1,10}$/.test(p)) return "Escribe la placa (letras, números y guiones; máximo 10)."; o.plate=p; return null; }
};
function cfWrapOps(){
  Object.keys(CF_MAP).forEach(name=>{
    const orig=window[name]; if(typeof orig!=="function") throw new Error("Falta la operación "+name);
    window[name]=function(...args){
      if(!CF.on) return orig.apply(this,args);
      if(!CF.cli||!CF.cli.token) return fail("Inicia sesión con la caja fuerte para registrar.");
      /* Si en este teléfono hay registros sin enviar de otra persona, no se registra más: así nada propio queda atrapado detrás. */
      const otros=CF.cli.pendientes().filter(e=>e.usuario!==(CF.user&&CF.user.usuario));
      if(otros.length) return fail(`En este teléfono hay ${otros.length} registro${otros.length>1?"s":""} sin enviar de “${otros[0].usuario}”. Para conservar el orden, ${S.role==="admin"?"apártalo"+(otros.length>1?"s":"")+" desde la cuenta (arriba)":"pide a Administración que los revise"} antes de registrar más.`);
      const pre=CF_PRE[name]&&CF_PRE[name](args); if(pre) return fail(pre);
      const before=JSON.stringify(S);
      const res=orig.apply(this,args);
      if(!res||!res.ok) return res;
      try{
        for(const e of CF_MAP[name](res,args)) CF.cli.registrar(e.type, e.data, {at:Number.isFinite(e.at)?e.at:nowMs(), id:e.id&&UUID_RE_CF.test(e.id)?e.id:undefined});
      }catch(err){
        S=JSON.parse(before);   // se deshace: no puede quedar en pantalla algo que no se enviará
        return fail("No se pudo guardar en este teléfono para enviarlo (“"+(err&&err.message||err)+"”). No se registró nada.");
      }
      CF.gen++;               // hubo un cambio local: una consulta en curso no debe reemplazar la pantalla
      CF.lastSnap="";         // y la próxima consulta debe reconstruirla aunque la caja fuerte no haya cambiado (p. ej. si lo rechaza)
      setTimeout(()=>cfTick(true), 0);
      return res;
    };
  });
}

/* ---------- Ciclo: enviar pendientes y traer el estado oficial ---------- */
async function cfTick(force, fromLogin){
  if(!CF.on||!CF.cli||!CF.cli.token) return;
  if(CF.busy){ CF.again=true; return; }          // se repite al terminar la consulta en curso
  CF.busy=true;
  const my=CF.sess;                                 // respuestas de una sesión anterior se descartan
  try{
    const r=await CF.cli.sincronizar();
    if(my!==CF.sess) return;
    if(r.status===401){ cfLoggedOut("La sesión expiró. Vuelve a entrar."); return; }
    if(r.rechazados){ CF.lastSnap=""; const last=CF.cli.rechazados().slice(-1)[0]; toast(`La caja fuerte rechazó ${r.rechazados} registro${r.rechazados>1?"s":""}: ${last?last.error:""}`, true); }
    CF.online = !(r.error && !r.status && !r.esperaA);
    CF.err = r.esperaA ? "" : (r.error||""); CF.waitFor = r.esperaA||null;
    CF.paused = !!S.cierre;
    /* Se trae el estado oficial si: es la entrada, o no tengo pendientes propios, no hay cierre en curso y no hay una hoja abierta. */
    if(fromLogin || (cfMine()===0 && !S.cierre && (force || !SH))){
      const gen=CF.gen;
      /* “Sin cambios”: si la pantalla ya muestra la versión oficial vigente (lastSnap), solo se pregunta si cambió. */
      const useTag=!fromLogin&&CF.lastSnap&&CF.etag;
      const res=await CF.cli._req("GET","/api/finanzas",undefined,{completo:true, headers:useTag?{"If-None-Match":CF.etag}:{}});
      if(my!==CF.sess) return;
      CF.online=true; CF.lastOk=Date.now(); CF.err=CF.err||"";
      if(res.status===304){
        if(!S.conectado){ CF.lastSnap=""; CF.again=true; return; }   // la pantalla no es la oficial: se trae completa
        cfRefreshView(false); return;
      }
      const snap=res.json;
      CF.printStats=snap.impresionResumen||null;
      /* Si mientras llegaba hubo un cambio local, aún sin confirmar, no se reemplaza la pantalla: se vuelve a consultar. */
      if(fromLogin || (gen===CF.gen && cfMine()===0 && !S.cierre)){
        const sig=JSON.stringify([snap.tickets,snap.sesiones,snap.movimientos,snap.cortes,snap.impresionResumen]);
        CF.etag=res.etag||null;   // solo se recuerda la versión que de verdad quedó en pantalla
        if(sig!==CF.lastSnap || !S.conectado || fromLogin){ const ref=cfSheetRef(); cfBuildState(snap, fromLogin?null:S); CF.lastSnap=sig; cfCloseOrphanSheet(ref); cfRefreshView(true); }
        else cfRefreshView(false);
      } else CF.again=true;
    } else cfRefreshView(false);
  }catch(e){
    if(my!==CF.sess) return;
    if(e&&e.status===401){ cfLoggedOut("La sesión expiró. Vuelve a entrar."); return; }
    CF.online=false; CF.err=e&&e.message||"Sin conexión"; cfRefreshView(false);
  }finally{
    CF.busy=false;
    if(CF.again&&CF.on&&CF.cli&&CF.cli.token){ CF.again=false; setTimeout(()=>cfTick(true), 60); }
  }
}
/* Si la hoja abierta muestra un movimiento, corte o ticket que ya no existe (p. ej. un cierre rechazado), se cierra. */
function cfSheetRef(){ if(!SH||!SH.args||!["corte","mov","cobro","reverse","confirmTr"].includes(SH.kind)) return null;
  const id=SH.args.id||SH.args.tid; if(typeof id!=="string") return null;
  return {id, sid:SH.kind==="corte"?(corteById(id)||{}).sid:null}; }
function cfCloseOrphanSheet(ref){
  if(!ref||!SH) return;
  if(movById(ref.id)||corteById(ref.id)||ticketById(ref.id)) return;
  /* Un corte aceptado puede tener otro folio oficial (zona horaria del servidor): se muestra el oficial. */
  const same=ref.sid&&S.cortes.find(c=>c.sid===ref.sid);
  if(same){ SH.args.id=same.id; renderSheet(); return; }
  closeSheet(true); toast("Ese registro no quedó en la caja fuerte (fue rechazado). Revisa los avisos.", true);
}
/* Redibuja sin perder lo que se está escribiendo en la pantalla principal ni el foco. */
function cfRenderKeep(){
  const vals={}, act=document.activeElement;
  $$("#app input,#app textarea,#app select").forEach(el=>{ if(el.id&&el.type!=="password") vals[el.id]=el.type==="checkbox"||el.type==="radio"?el.checked:el.value; });
  let sel=null, caret=null;
  if(act&&act!==document.body){ if(act.id) sel="#"+CSS.escape(act.id); else if(act.dataset&&act.dataset.a) sel=`[data-a="${CSS.escape(act.dataset.a)}"]`+(act.dataset.id?`[data-id="${CSS.escape(act.dataset.id)}"]`:"");
    try{ caret=[act.selectionStart, act.selectionEnd]; }catch(e){} }
  render();
  Object.entries(vals).forEach(([id,v])=>{ const el=document.getElementById(id); if(!el) return; if(el.type==="checkbox"||el.type==="radio") el.checked=v; else if(el.value!==v) el.value=v; });
  if(sel){ const el=$("#app "+sel)||$(sel); if(el&&document.activeElement!==el){ try{ el.focus({preventScroll:true}); if(caret&&caret[0]!=null) el.setSelectionRange(caret[0],caret[1]); }catch(e){} } }
}
/* Se redibuja solo si cambió algo visible; un formulario abierto nunca se redibuja (no se pierde lo que se escribe). */
function cfRefreshView(dataChanged){
  const v=JSON.stringify([CF.online, CF.cli.pendientes().length, CF.cli.rechazados().length, CF.waitFor, CF.paused, !!S.cierre]);
  if(!dataChanged && v===CF.lastView) return;
  CF.lastView=v;
  if(SH){ CF.viewPending=true; if(SH.kind==="cfCuenta") renderSheet(); return; }   // al cerrar la hoja se redibuja (ver cfBoot)
  CF.viewPending=false; cfRenderKeep();
}
function cfStartTimer(){ clearInterval(CF.timer); CF.timer=setInterval(()=>cfTick(false), 15000); }

/* ---------- Sesión ---------- */
function cfLoggedOut(msg){ CF.sess++; clearInterval(CF.timer); CF.etag=null; CF.lastSnap=""; if(CF.cli) CF.cli.cancelar(); if(CF.cli){ CF.cli.token=null; CF.cli.usuario=null; } CF.user=null; S=blankState(); S.conectado=true; closeSheet(true); cfRenderLogin(msg); }
function cfRenderLogin(msg, mustChange){
  document.title="Entrar · ALAGA Finanzas Pro";
  const pend=CF.cli?CF.cli.pendientes().length:0;
  $("#app").innerHTML=`<main id="main" class="cf-login" style="max-width:440px;margin:0 auto;padding:28px 16px">
    <div class="logo" aria-label="ALAGA Finanzas Pro" style="margin-bottom:14px"><b>ALAGA</b><small>FINANZAS PRO</small></div>
    <section class="panel"><h1 style="font-size:20px;margin:0 0 4px">${mustChange?"Cambia tu contraseña":"Entrar a la caja fuerte"}</h1>
    <p class="note" style="margin-top:0">${mustChange?"Es tu primera entrada o te la restablecieron. Elige una nueva (mínimo 10 caracteres).":`Servidor: <b>${esc(CF.url)}</b>`}</p>
    ${msg?`<div class="callout ${/correct|cambiada/i.test(msg)?"ok":"err"}" role="alert">${ico(/correct|cambiada/i.test(msg)?"i-checkc":"i-alert")}<span>${esc(msg)}</span></div>`:""}
    ${mustChange?`<div class="field"><label for="cf-act">Contraseña actual (temporal)</label><input class="inp" id="cf-act" type="password" autocomplete="current-password"></div>
      <div class="field"><label for="cf-new">Nueva contraseña</label><input class="inp" id="cf-new" type="password" autocomplete="new-password" minlength="10"></div>
      <button class="btn pri block" data-a="cfChangePass" style="margin-top:12px">Guardar contraseña</button>`
    :`<div class="field"><label for="cf-user">Usuario</label><input class="inp" id="cf-user" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(cfConf().ultimoUsuario||"")}"></div>
      <div class="field"><label for="cf-pass">Contraseña</label><input class="inp" id="cf-pass" type="password" autocomplete="current-password"></div>
      <button class="btn pri block" data-a="cfLogin" style="margin-top:12px">Entrar</button>`}
    ${pend?`<p class="note">${ico("i-hourglass","sm")} Hay <b>${pend}</b> registro${pend>1?"s":""} guardado${pend>1?"s":""} en este teléfono esperando envío. No se pierden.</p>`:""}
    </section>
    <section class="panel" style="margin-top:12px"><p class="note" style="margin:0">¿Sin conexión? Lo ya registrado está a salvo en este teléfono. Si no puedes entrar, anota en papel y captura al volver la conexión.</p>
    <button class="btn block" style="margin-top:10px" data-a="cfDisconnectAsk">Usar modo DEMO (datos ficticios)</button></section></main>`;
  const f=$("#cf-user")&&!$("#cf-user").value?$("#cf-user"):$("#cf-pass")||$("#cf-act"); if(f) f.focus();
  $$("#app .cf-login input").forEach(i=>i.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); const b=$("#app .cf-login .btn.pri"); if(b&&!b.disabled) b.click(); } }));
}
const CF_ACTIONS = {
  async cfLogin(d,el){
    const u=val("cf-user").trim().toLowerCase(), p=val("cf-pass");
    if(!u||!p) return cfRenderLogin("Escribe usuario y contraseña.");
    el.disabled=true; el.textContent="Entrando…";
    try{
      const user=await CF.cli.iniciarSesion(u,p); CF.sess++; CF.user=user; cfSetConf(Object.assign(cfConf(), {ultimoUsuario:u}));
      if(user.debeCambiarContrasena) return cfRenderLogin("", true);
      if(!ROLE_FROM_SERVER[user.rol]){ await CF.cli.cerrarSesion(); return cfRenderLogin("Tu cuenta es de consulta: Finanzas es para Operación y Administración."); }
      S=blankState(); S.conectado=true; S.role=cfRole(user.rol);
      R.route=routeFromHash()&&canRoute(routeFromHash())?routeFromHash():ROLES[S.role].home;
      CF.lastOk=0; CF.lastSnap=""; CF.lastView="";
      for(let i=0;i<170&&CF.busy;i++) await new Promise(r=>setTimeout(r,100));   // espera a que termine una consulta anterior (máx. ~17 s)
      await cfTick(true, true);
      if(!CF.lastOk){ const why=String(CF.err||"sin conexión").replace(/\.$/,""); try{ await CF.cli.cerrarSesion(); }catch(e){ CF.cli.token=null; } return cfRenderLogin("Entraste, pero no se pudo traer la información: "+why+". Intenta de nuevo."); }
      cfStartTimer(); render(); toast(`Hola, ${user.nombre}`);
    }catch(e){ cfRenderLogin(e&&e.status?e.message:"No se pudo conectar con la caja fuerte. Revisa la red del local."); }
  },
  async cfChangePass(d,el){
    const a=val("cf-act"), n=val("cf-new");
    if(!a||!n) return cfRenderLogin("Escribe la contraseña actual y la nueva.", true);
    el.disabled=true;
    try{ await CF.cli.cambiarContrasena(a,n); cfRenderLogin("Contraseña cambiada. Entra con la nueva."); }
    catch(e){ cfRenderLogin(e&&e.message||"No se pudo cambiar.", true); }
  },
  async cfLogout(){ closeSheet(true); try{ await CF.cli.cerrarSesion(); }catch(e){} cfLoggedOut("Sesión cerrada."); },
  async cfSyncNow(d,el){ if(el) el.disabled=true; await cfTick(true); if(!SH) render(); else renderSheet(); toast(CF.online?"Sincronizado con la caja fuerte":"Sin conexión con la caja fuerte", !CF.online); },
  cfAccount(){ openSheet("cfCuenta"); },
  cfConnectAsk(){ openSheet("cfConectar"); },
  cfConnect(){
    const url=val("cf-url").trim().replace(/\/+$/,"");
    if(!/^https?:\/\/[^\s/]+$/i.test(url)) return showErrors([{f:"cf-url",m:"Escribe la dirección completa, por ejemplo https://caja.local:8787"}]);
    if(!cfSetConf(Object.assign(cfConf(), {modo:"conectado", url}))) return showErrors([{m:"Este navegador no permite guardar la configuración."}]);
    location.reload();
  },
  cfDisconnectAsk(){ openSheet("confirm",{title:"Volver al modo DEMO", ok:"Usar modo DEMO", body:`<p>La app mostrará otra vez los datos ficticios de este navegador.</p>
    <div class="callout info">${ico("i-shield")}<span>Lo pendiente de envío <b>no se borra</b>: se enviará cuando vuelvas a conectar y entre quien lo registró.</span></div>`,
    fn:()=>{ const c=cfConf(); delete c.modo; cfSetConf(c); location.reload(); }}); },
  cfDismissRejected(d){ if(S.role!=="admin") return toast("Solo Administración descarta registros rechazados.",true); CF.cli.descartarRechazado(d.id); renderSheet(); render(); toast("Registro rechazado descartado (queda en la caja fuerte solo lo aceptado)"); },
  cfSetAside(d){ if(S.role!=="admin") return toast("Solo Administración aparta pendientes de otra persona.",true);
    if(CF.asideBusy) return; CF.asideBusy=true;
    CF.cli.apartarPendientesDe(d.u, "Apartado por administración: no llegó a la caja fuerte y la cuenta ya no podrá enviarlo").then(r=>{
      CF.lastSnap=""; renderSheet(); render(); cfTick(true);
      const p=(n,s)=>`${n} registro${n===1?"":"s"} ${s}${n===1?"":"s"}`;
      toast(r.yaAplicados?`${p(r.yaAplicados,"ya aplicado")} en la caja fuerte (no se recaptura${r.yaAplicados===1?"":"n"}); ${p(r.apartados,"apartado")} para revisión`:`${p(r.apartados,"apartado")} para revisión`);

/* Folios largos (UUID) se muestran cortos en pantalla; el valor completo se conserva para el sistema y el Excel. */
const CF_UUID_TXT=/\b([0-9a-f]{8})-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}(?::([a-z]+))?\b/g;
function cfShorten(root){
  if(!CF.on||!root) return;
  const has=new RegExp(CF_UUID_TXT.source);   // sin bandera g: test() no arrastra posición entre nodos
  const nodes=root.nodeType===3?[root]:(()=>{ const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT), l=[]; while(w.nextNode()) l.push(w.currentNode); return l; })();
  nodes.forEach(n=>{ if(n.parentNode&&n.parentNode.tagName==="TEXTAREA") return; if(has.test(n.nodeValue)) n.nodeValue=n.nodeValue.replace(CF_UUID_TXT,(m,a,suf)=>a.toUpperCase()+(suf?"·"+suf.charAt(0).toUpperCase():"")); });
}

/* ---------- Arranque en modo conectado ---------- */
function cfBoot(){
  const conf=cfConf();
  if(conf.modo!=="conectado") return false;

  CF.on=true; CF.url=conf.url||cfDefaultUrl();
  CF.cli=new CajaFuerteCliente({url:CF.url, dispositivo:"finanzas", almacen:localStorage, espacio:"finanzas"});
  /* En modo conectado no se guarda copia local de los datos (privacidad); la bandeja de envío sí persiste. */
  save=()=>true;
  const _nextId=nextId; nextId=kind=>["m","t","s"].includes(kind)?CajaFuerteCliente.uuid():_nextId(kind);
  const _header=header; header=()=>_header().replace(/<button class="rolebtn" data-a="roleSheet"[^]*?<\/button>/, `<button class="rolebtn" data-a="cfAccount" aria-label="Cuenta y conexión">${ico("i-user")}<span><b>${esc(CF.user?CF.user.nombre:"")}</b><small>${CF.online===false?"Sin conexión":"Caja fuerte"} · ${esc(ROLES[S.role].n==="Administración financiera"?"Administración":ROLES[S.role].n)}</small></span>${ico("i-down","sm")}</button>`).replace(/<span class="demo-badge(?: demo-inline)?">DEMO<\/span>/g,`<span class="demo-badge" style="background:var(--ok,#1d7a46)">EN VIVO</span>`).replace(/<button class="iconbtn" data-go="mas" aria-label="Ajustes DEMO">/,`<button class="iconbtn" data-go="mas" aria-label="Ajustes">`);
  const _render=render; render=()=>{ CF.renders=(CF.renders||0)+1; if(CF.on&&!(CF.cli&&CF.cli.token)) return cfRenderLogin(); return _render(); };
  /* Respaldos y restauración de la DEMO no aplican en modo conectado (los respaldos reales los hace la caja fuerte). */
  F.importFile=()=>toast("No disponible en modo conectado: los respaldos los hace la caja fuerte.",true);
  A.restoreKey=()=>toast("No disponible en modo conectado: los respaldos los hace la caja fuerte.",true);
  backupPanel=()=>"";
  const _closeSheet=closeSheet; closeSheet=force=>{ _closeSheet(force); if(SH) return;
    /* Se redibuja después, y solo si nadie más redibujó (p. ej. un cambio de pantalla), para no perder el foco. */
    if(CF.viewPending){ const n=CF.renders; setTimeout(()=>{ if(!SH&&CF.viewPending&&CF.renders===n){ CF.viewPending=false; cfRenderKeep(); } else CF.viewPending=false; },0); }
    if(CF.on&&CF.cli&&CF.cli.token&&CF.lastSnap==="") setTimeout(()=>cfTick(true),0); };   // tras un rechazo, se actualiza al cerrar
  const _storeBanner=storeBanner; storeBanner=()=>cfBanner()+_storeBanner();
  /* El aviso es informativo: jamás bloquea el corte ni altera los importes. */
  const _vArqueo=vArqueo;
  vArqueo=()=>{const h=_vArqueo(),st=CF.printStats;
    if(!st)return h;
    const pend=st.porEnviar||0,fallos=(st.fallidos||0)+(st.inciertos||0)+(st.enProceso||0),sinVer=st.enviadoSinVerificar||0;
    const banner=`<div class="callout ${pend||fallos?"warn":"info"}" style="margin:12px 0" role="status">${ico("i-receipt")}<span><b>Control de tickets.</b> Por enviar: ${pend} · Revisar: ${fallos} · Enviados sin verificar en papel: ${sinVer}. El cierre no se bloquea. La estación de impresión está en Chrome de la Mac.</span></div>`;
    return h.replace('<div class="vhead"><h1>Cierre</h1></div>','<div class="vhead"><h1>Cierre</h1></div>'+banner);
  };
  const _vMas=vMas; vMas=()=>_vMas().replace(/<section class="panel" aria-labelledby="ro-h">[^]*?<\/section>\s*<section class="panel" aria-labelledby="rl-h">[^]*?<\/section>/, cfPanelMas())
    .replace(/<section class="panel" aria-labelledby="dd-h">[^]*?<\/section>/,"").replace("Ajustes DEMO","Ajustes").replace("Simulación: sin usuarios, pagos ni base de datos reales.","Conectado a la caja fuerte del local.");
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>cfShorten(n)))).observe(document.body,{childList:true,subtree:true});
  S=blankState(); S.conectado=true;
  cfRenderLogin(CF.url?"":"Falta la dirección de la caja fuerte.");
  return true;
}

function cfDemoHooks(){ const _vMas=vMas; vMas=()=>_vMas().replace(/(<section class="panel span2" aria-labelledby="av-h">)/, cfPanelMas()+"$1"); }
window.addEventListener("online", ()=>cfTick(true));

<script>
"use strict";
/* =====================================================================
   CAJA POR TURNO (v0.7) — decisiones de Gand (nov-2026)
   1. Una caja por día, como hoy. Quien la abre es el RESPONSABLE del efectivo.
   2. Cierre a ciegas total: Operación no ve el efectivo esperado. Cuenta billetes y monedas y DESPUÉS ve la diferencia.
      Conectado: el conteo se registra en la caja fuerte (evento «arqueo») antes de mostrar la diferencia,
      así no se puede ajustar el conteo después de verla.
   3. Solo el responsable (y Administración) mueve efectivo. Otro encargado recibe autos y cobra con tarjeta o transferencia.
   4. El cierre se firma volviendo a escribir la contraseña (la caja fuerte la verifica; nunca se guarda).
   DEMO: mismas pantallas; la firma es simulada (no hay contraseñas en la DEMO).
   ===================================================================== */
const TURNO = {me:null, firma:null, cuentas:null};
const turnoDe = s => s && CF.on ? (s.turno || null) : null;
/* Ciego: en DEMO siempre (regla vigente); conectado, solo en cajas abiertas con la regla (las anteriores siguen como eran). */
const esCiego = s => !!s && (CF.on ? !!s.turno : true);
const conteoHecho = s => !!(S.cierre && s && S.cierre.sid===s.id);
const ocultaEsperado = s => S.role==="op" && esCiego(s) && !conteoHecho(s);
const turnoAjeno = s => { const t=turnoDe(s); return !!t && S.role==="op" && TURNO.me!=null && t.responsable.id!==TURNO.me; };
const turnoMsg = s => `La caja la abrió ${turnoDe(s).responsable.nombre}: solo ${turnoDe(s).responsable.nombre} maneja el efectivo. Tú puedes recibir autos y cobrar con tarjeta o transferencia.`;
const MUEVE_EFECTIVO = m => (m.type==="cobro"&&m.method==="efectivo")||(m.type==="gasto"&&m.origin==="caja")||m.type==="entrada"||m.type==="traslado";

function turnoInstall(){
  /* ---------- Estado oficial: responsable del turno y mi número de cuenta ---------- */
  const _b=cfBuildState;
  cfBuildState=(snap,prev)=>{ TURNO.me=snap&&snap.usuario&&Number.isInteger(snap.usuario.id)?snap.usuario.id:null;
    const r=_b(snap,prev); (snap.sesiones||[]).forEach(o=>{ if(o.turno){ const x=r.sessions.find(y=>y.id===o.id); if(x) x.turno=o.turno; } }); return r; };

  /* ---------- Pantalla Caja: sin esperado para Operación; aviso de responsable ---------- */
  const _vCaja=vCaja;
  vCaja=()=>{ let h=_vCaja(); const s=openSession(); if(!s) return h;
    const t=turnoDe(s);
    if(ocultaEsperado(s)){
      const B=sessionBreakdown(s), full=B.opening+B.fondo===FONDO_FIJO;
      h=h.replace(/<section class="hero" aria-label="Efectivo esperado">[^]*?<\/section>/,
        `<section class="hero tn-hero" aria-label="Caja abierta, conteo a ciegas"><div class="lbl">Caja abierta</div><div class="val">Conteo a ciegas</div>
         <div class="sub">El efectivo esperado se muestra después de contar, al cerrar.</div>
         <div class="chips"><span class="hchip fchip ${full?"":"bad"}">${ico(full?"i-lock":"i-alert")}Fondo ${money(B.opening+B.fondo)} · ${full?"completo":"incompleto"}</span><span class="hchip">${ico("i-clock")}Abierta ${hhmm(s.openedAt)}</span>${t?`<span class="hchip">${ico("i-user")}${esc(t.responsable.nombre)}</span>`:""}</div></section>`)
        .replace(/<section class="panel" aria-labelledby="wf-h">[^]*?<\/section>/, `<section class="panel" aria-labelledby="wf-h"><div class="panel-h"><h2 id="wf-h">${ico("i-lock")}Conteo a ciegas</h2></div>
         <p class="note" style="margin-top:0">Para que el arqueo sea confiable, el total esperado no se muestra durante el día. Al cerrar cuentas billetes y monedas; la caja registra tu conteo y entonces te muestra si cuadra.</p>
         ${(B.clip||B.transf)?`<p class="note">${ico("i-card","sm")} Clip ${money(B.clip)} · Transferencias ${money(B.transf)}. No entran a la caja.</p>`:""}</section>`);
    }
    if(t&&S.role==="op"){
      if(turnoAjeno(s)){
        h=h.replace(/(<section class="hero)/, `<div class="banner warn tn-ajeno" role="status">${ico("i-user")}<span>${esc(turnoMsg(s))}</span></div>$1`);
        h=h.replace(/<button class="([^"]*)" data-a="(gastoSheet|trasladoSheet|entradaSheet)"[^>]*>/g,(m,c,a)=>`<button class="${c}" data-a="${a}" disabled aria-disabled="true">`)
           .replace(/<button class="([^"]*)" data-go="arqueo">/,'<button class="$1" disabled aria-disabled="true">');
      }
    }
    if(t&&S.role==="admin") h=h.replace(/(<section class="hero)/, `<div class="banner tn-resp">${ico("i-user")}<span>Responsable del efectivo: <b>${esc(t.responsable.nombre)}</b>${t.relevos&&t.relevos.length?` · ${t.relevos.length} cambio${t.relevos.length>1?"s":""}`:""}</span><button class="btn sm" data-a="tnPasarSheet">Pasar la caja</button></div>$1`);
    return h; };
  VIEWS.caja=vCaja;

  /* ---------- Cierre: aviso de conteo a ciegas; otro encargado no cierra ---------- */
  const _vArq=vArqueo;
  vArqueo=()=>{ let h=_vArq(); const s=openSession(); if(!s||S.role!=="op") return h;
    if(turnoAjeno(s)) return h.replace(/<ol class="stepper"[^]*?<div class="dockbar">[^]*?<\/div>/, `<div class="callout warn">${ico("i-user")}<span>${esc(turnoMsg(s))} El cierre también lo hace ${esc(turnoDe(s).responsable.nombre)}.</span></div>`);
    if(esCiego(s)&&!cierreOf(s)) h=h.replace(`<span>Cuenta todo el efectivo de la caja, incluido el fondo.</span>`,`<span><b>Conteo a ciegas.</b> Cuenta todo el efectivo de la caja, incluido el fondo. Verás si cuadra hasta confirmar el conteo${CF.on?"; se registra en la caja fuerte tal como lo cuentes":""}.</span>`);
    return h; };
  VIEWS.arqueo=vArqueo;

  /* ---------- Hojas: sin esperado; efectivo bloqueado para quien no es responsable ---------- */
  for(const k of ["gasto","traslado"]){ const _s=SHEETS[k];
    SHEETS[k]=a=>{ const r=_s(a), s=openSession(); if(ocultaEsperado(s)) r.body=r.body.replace(/Efectivo esperado en caja: \$[\d.,]+/,"Conteo a ciegas: el esperado se ve al cerrar"); return r; }; }
  const _amt=F.amt; F.amt=el=>{ _amt(el); const s=openSession(); if(ocultaEsperado(s)) for(const id of ["#g-warn","#t-warn"]){ const w=$(id); if(w) w.innerHTML=""; } };
  const _cobro=SHEETS.cobro;
  SHEETS.cobro=a=>{ const r=_cobro(a), s=openSession(); if(!turnoAjeno(s)) return r;
    r.body=r.body.replace(/<input type="radio" name="c-m" value="efectivo"([^>]*)>/,'<input type="radio" name="c-m" value="efectivo" disabled$1>')
      .replace(/(<div class="ferr" id="c-method-err"><\/div>)/,`$1<p class="note">${ico("i-user","sm")} Efectivo: solo ${esc(turnoDe(s).responsable.nombre)} (responsable de la caja).</p>`);
    return r; };

  /* Validación previa (antes de guardar en la bandeja): mismo mensaje que daría la caja fuerte. */
  const pre=(fn)=>args=>{ const s=openSession(); return turnoAjeno(s)&&fn(args,s)?turnoMsg(s):null; };
  CF_PRE.opCobrar=pre(([,method])=>method==="efectivo");
  CF_PRE.opGasto=pre(()=>true); CF_PRE.opEntrada=pre(()=>true); CF_PRE.opTraslado=pre(()=>true); CF_PRE.opResolverExcepcion=pre(()=>true);
  CF_PRE.opReverso=pre(([mid])=>{ const m=movById(mid); return !!m&&MUEVE_EFECTIVO(m); });

  /* ---------- Paso 1 del cierre: conteo a ciegas registrado en la caja fuerte ---------- */
  const _cc=A.confirmCountAsk;
  A.confirmCountAsk=function(d,el){ _cc.call(this,d,el); const s=openSession();
    if(!SH||!CF.on||!turnoDe(s)) return;
    SH.args.body=SH.args.body.replace(/Se calculará el esperado y, si hay diferencia,/,"Se registrará en la caja fuerte tal como lo contaste; después verás el esperado y, si hay diferencia,");
    SH.args.fn=()=>tnRegistrarConteo(s); renderSheet(false); };
  /* Paso 5: firma con contraseña */
  const _close=A.closeCorteAsk;
  A.closeCorteAsk=function(d,el){ _close.call(this,d,el); const s=openSession(); if(!SH||!s||!esCiego(s)) return;
    const orig=SH.args.fn;
    SH.args.body+=`<div class="field tn-firma"><label for="k-pass">${ico("i-lock","sm")} Firma: tu contraseña</label><input class="inp" id="k-pass" type="password" autocomplete="current-password" maxlength="200" data-autofocus aria-describedby="k-pass-h k-pass-err">
      <p class="help" id="k-pass-h">${CF.on?"La caja fuerte verifica que eres tú. No se guarda en el teléfono ni en el libro.":"DEMO: firma simulada; escribe cualquier texto."}</p><div class="ferr" id="k-pass-err" role="alert"></div></div>`;
    SH.args.ok="Firmar y cerrar corte";
    SH.args.fn=async()=>{ const inp=$("#k-pass"), p=inp?inp.value:""; if(inp) inp.value="";
      if(!p){ $("#k-pass-err").textContent="Escribe tu contraseña para firmar el cierre."; $("#k-pass").setAttribute("aria-invalid","true"); $("#k-pass").focus(); return; }
      if(!CF.on||!turnoDe(s)){ TURNO.firma={demo:true}; try{ orig(); }finally{ TURNO.firma=null; } return; }
      let f=null;
      try{ f=await CF.cli._req("POST","/api/firma",{sesion:s.id, contrasena:p}); }
      catch(e){ const m=e&&e.status===403?(e.message||"Contraseña incorrecta."):e&&e.status===429?"Demasiados intentos. Espera unos minutos.":"Sin conexión con la caja fuerte: la firma necesita conexión. "+(e&&e.message||"");
        const er=$("#k-pass-err"); if(er) er.textContent=m; const i=$("#k-pass"); if(i){ i.setAttribute("aria-invalid","true"); i.focus(); } return; }
      TURNO.firma=f.firma; try{ orig(); }finally{ TURNO.firma=null; } };
    renderSheet(false); };
  const _cc2=opCerrarCorte;
  opCerrarCorte=function(...a){ const r=_cc2.apply(this,a); if(r&&r.ok&&TURNO.firma){ r.corte.firma=TURNO.firma.demo?{por:whoName(), at:r.corte.at, simulada:true}:{por:(CF.user&&CF.user.nombre)||whoName(), at:r.corte.at}; } return r; };
  const _map=CF_MAP.opCerrarCorte;
  CF_MAP.opCerrarCorte=(r,a)=>_map(r,a).map(e=>TURNO.firma&&!TURNO.firma.demo?Object.assign(e,{data:Object.assign({},e.data,{firma:TURNO.firma})}):e);

  /* ---------- Detalle del corte: firma, conteos a ciegas y cambios de responsable ---------- */
  const _corte=SHEETS.corte;
  SHEETS.corte=a=>{ const r=_corte(a), c=corteById(a.id); if(!c||!(c.firma||c.ciego||(c.arqueos&&c.arqueos.length))) return r;
    const extra=`<div class="sec tn-sec"><h3>Turno y firma</h3><dl class="kv">
      ${c.responsable?`<dt>Responsable</dt><dd>${esc(c.responsable)}</dd>`:""}
      ${c.firma?`<dt>Firma</dt><dd>${ico("i-lock","sm")} ${esc(c.firma.por)}${c.firma.simulada?" · simulada (DEMO)":" · con contraseña"} · ${when(c.firma.at)}</dd>`:""}
      ${c.arqueos&&c.arqueos.length?`<dt>Conteos a ciegas</dt><dd>${c.arqueos.map((x,i)=>`${i+1}. ${money(x.total)} (${smoney(x.total-x.expected)}) · ${hhmm(x.at)} · ${esc(x.by)}`).join("<br>")}</dd>`:""}
      ${c.relevos&&c.relevos.length?`<dt>Cambios de responsable</dt><dd>${c.relevos.map(x=>`${esc(x.de)} → ${esc(x.a)} · ${hhmm(x.at)} · ${esc(x.motivo)}`).join("<br>")}</dd>`:""}</dl></div>`;
    r.body=r.body.replace(/(<div class="sec"><h3>Arqueo<\/h3>)/, extra+"$1"); return r; };

  /* ---------- Administración: pasar la caja a otro encargado ---------- */
  SHEETS.tnPasar=a=>({title:"Pasar la caja", body:`${errBox()}
    <p style="margin-top:0">Responsable actual: <b>${esc(a.actual)}</b>. La persona nueva vuelve a contar al cerrar.</p>
    ${a.cuentas?`<div class="field"><label for="tn-u">Nuevo responsable</label><select class="inp" id="tn-u">${a.cuentas.filter(x=>x.nombre!==a.actual).map(x=>`<option value="${esc(x.usuario)}">${esc(x.nombre)} (${esc(x.usuario)})</option>`).join("")}</select></div>`:`<p class="note">Cargando cuentas de Operación…</p>`}
    <div class="field"><label for="tn-m">Motivo (obligatorio)</label><input class="inp" id="tn-m" maxlength="160" placeholder="Ej. cambio de turno de la tarde"></div><div class="ferr" id="tn-m-err" role="alert"></div>
    <div class="callout gold">${ico("i-shield")}<span>Queda en el libro: quién, a quién, cuándo y por qué.</span></div>`,
    foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="tnPasar" ${a.cuentas?"":"disabled"}>Pasar la caja</button>`});
  Object.assign(A,{
    async tnPasarSheet(){ const s=openSession(), t=turnoDe(s); if(!t) return;
      openSheet("tnPasar",{actual:t.responsable.nombre, cuentas:null});
      try{ const r=await CF.cli._req("GET","/api/operacion/cuentas"); if(SH&&SH.kind==="tnPasar"){ SH.args.cuentas=r.cuentas; renderSheet(false); } }
      catch(e){ if(SH&&SH.kind==="tnPasar") showErrors([{m:"No se pudieron cargar las cuentas: "+(e&&e.message||"")}]); } },
    tnPasar(d,el){ const s=openSession(), u=($("#tn-u")||{}).value, m=val("tn-m").trim();
      if(!u) return showErrors([{m:"No hay otra cuenta de Operación activa."}]);
      if(m.length<5){ $("#tn-m-err").textContent="Escribe el motivo (mínimo 5 caracteres)."; $("#tn-m").focus(); return; }
      if(!guardBtn(el)) return;
      try{ CF.cli.registrar("caja.responsable",{sesion:s.id, usuario:u, motivo:m},{at:nowMs()}); }catch(e){ return showErrors([{m:"No se pudo guardar para enviar: "+(e&&e.message||e)}]); }
      CF.gen++; CF.lastSnap=""; setTimeout(()=>cfTick(true),0); closeSheet(true); toast("Se envió el cambio de responsable"); }
  });
}

/* Registrar el conteo en la caja fuerte (necesita conexión) y solo entonces mostrar la diferencia. */
async function tnRegistrarConteo(s){
  const D=draftFor("den",s), cc=cleanCount(D.count); if(cc.err) return showErrors([{m:cc.err}]);
  if(cfMine()>0){ try{ await CF.cli.sincronizar(); }catch(e){} if(cfMine()>0) return showErrors([{m:"Primero deben enviarse tus registros pendientes. Revisa la conexión e intenta de nuevo."}]); }
  let r;
  try{ r=await CF.cli._req("POST","/api/eventos",{eventos:[{id:CajaFuerteCliente.uuid(), type:"arqueo", data:{sesion:s.id, count:cc.clean}, at:nowMs()}]}); }
  catch(e){ return showErrors([{m:"Sin conexión con la caja fuerte: el conteo a ciegas se registra allá antes de mostrar la diferencia. "+(e&&e.message||"")}]); }
  const x=r&&r.resultados&&r.resultados[0];
  if(!x||x.estado!=="aceptado") return showErrors([{m:(x&&x.error)||"La caja fuerte no aceptó el conteo."}]);
  const res=opConfirmarConteo(D.count); if(!res.ok) return showErrors([{m:res.err}]);
  /* El esperado oficial es el de la caja fuerte (por si este teléfono no tenía algo al día). */
  S.cierre.expected=x.resultado.esperado; S.cierre.step=S.cierre.counted===S.cierre.expected?"excedente":"diferencia"; S.cierre.numero=x.resultado.numero;
  save(); closeSheet(true); render();
  toast(x.resultado.diferencia===0?"Conteo registrado · arqueo cuadrado":`Conteo registrado · ${x.resultado.diferencia<0?"faltante":"sobrante"} de ${money(Math.abs(x.resultado.diferencia))}`);
}
</script>
<script>
"use strict";
/* =====================================================================
   Hojas (diálogos), formularios y acciones
   ===================================================================== */
function openSheet(kind, args={}){ const prev=SH&&SH.prev||document.activeElement; SH={kind,args,prev,dirty:false,warnClose:false}; renderSheet(true); }
function renderSheet(first=false){
  const L=$("#layer");
  if(!SH){ L.innerHTML=""; document.body.style.overflow=""; return; }
  const {title, body, foot=""}=SHEETS[SH.kind](SH.args);
  L.innerHTML=`<div class="scrim" data-a="closeSheet"></div>
   <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" data-sheet="${SH.kind}">
    <div class="sh-h"><h2 id="sh-title" tabindex="-1">${title}</h2><button class="x" data-a="closeSheet" aria-label="Cerrar">${ico("i-close")}</button></div>
    <div class="sh-b" id="sh-b">${SH.warnClose?`<div class="callout warn" role="alert">${ico("i-alert")}<span>Tienes datos sin guardar. Toca <b>Cerrar</b> otra vez para descartarlos.</span></div>`:""}${body}</div>
    ${foot?`<div class="sh-f">${foot}</div>`:""}</div>`;
  document.body.style.overflow="hidden";
  if(first){ const af=$("#layer [data-autofocus]"); (af||$("#sh-title")).focus({preventScroll:true}); }
}
function closeSheet(force=false){
  if(!SH) return;
  if(!force && SH.dirty && !SH.warnClose){ SH.warnClose=true; const vals=snapshotInputs(); renderSheet(); restoreInputs(vals); return; }
  const prev=SH.prev; SH=null; renderSheet();
  if(prev&&document.contains(prev)) try{prev.focus({preventScroll:true})}catch(e){}
}
function snapshotInputs(){ const o={}; $$("#layer input,#layer textarea,#layer select").forEach(el=>{ if(!el.id) return; o[el.id]=el.type==="radio"||el.type==="checkbox"?el.checked:el.value; }); return o; }
function restoreInputs(o){ Object.entries(o).forEach(([id,v])=>{ const el=document.getElementById(id); if(!el) return; if(el.type==="radio"||el.type==="checkbox") el.checked=v; else el.value=v; }); }
const val = id => { const el=document.getElementById(id); return el?el.value:""; };
const radio = name => { const el=$(`#layer input[name="${name}"]:checked`); return el?el.value:""; };
/* Errores: resumen enfocable arriba + mensaje junto al campo (UI/UX Pro Max: Focusable Error Summary). */
function showErrors(errs){
  $$("#layer [aria-invalid]").forEach(el=>el.removeAttribute("aria-invalid"));
  $$("#layer .ferr").forEach(el=>el.textContent="");
  const box=$("#sh-errs"); if(!box) return;
  if(!errs.length){ box.innerHTML=""; return; }
  errs.forEach(e=>{ if(!e.f) return; const f=document.getElementById(e.f); if(f) f.setAttribute("aria-invalid","true"); const m=document.getElementById(e.f+"-err"); if(m) m.textContent=e.m; });
  box.innerHTML=`<div class="errsum" role="alert" tabindex="-1" aria-labelledby="es-t"><h3 id="es-t">Revisa antes de guardar</h3><ul>${errs.map(e=>`<li>${e.f?`<a href="#${e.f}" data-a="focusField" data-id="${e.f}">${esc(e.m)}</a>`:esc(e.m)}</li>`).join("")}</ul></div>`;
  box.firstChild.focus(); $("#sh-b").scrollTop=0;
}
const errBox = () => `<div id="sh-errs"></div>`;
const amountField = (id,label,valueC,help="") => `<div class="field"><label for="${id}">${label}</label>
  <div class="amt"><span aria-hidden="true">$</span><input id="${id}" data-f="amt" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0.00" value="${valueC?toInput(valueC):""}" aria-describedby="${id}-err ${id}-help" data-autofocus></div>
  <div class="ferr" id="${id}-err"></div>${help?`<div class="help" id="${id}-help">${help}</div>`:`<div id="${id}-help" hidden></div>`}</div>`;
const corrBanner = a => a.corrects?`<div class="callout gold">${ico("i-reset")}<span>Registrando el movimiento correcto que sustituye a <b>${a.corrects}</b> (ya anulado).</span></div>`:"";
function guardBtn(el){ if(el.dataset.busy) return false; el.dataset.busy="1"; el.disabled=true; setTimeout(()=>{ if(document.contains(el)){ el.disabled=false; delete el.dataset.busy; } },600); return true; }
function done(res, msg){ if(!res.ok){ showErrors([{m:res.err}]); return false; } save(); closeSheet(true); render(); toast(msg); return true; }
function markCorrects(res, a){ if(res.ok&&a.corrects){ res.mov.corrects=a.corrects; audit("corrige", res.mov.id, `Sustituye a ${a.corrects}`); } }

const SHEETS = {};

/* ---- Rol ---- */
SHEETS.role = () => ({title:"Cambiar rol (simulado)", body:`<p class="note">Sin contraseña ni autenticación real. Sirve para probar qué ve y qué puede hacer cada rol.</p>
  <div class="list" style="margin-top:8px">${Object.entries(ROLES).map(([k,r])=>`<button class="mrow" data-a="setRole" data-v="${k}" aria-pressed="${S.role===k}">
    <span class="ricon ${S.role===k?"gold":""}">${ico(k==="op"?"i-cash":"i-shield")}</span>
    <span class="rmain"><span class="rt">${r.n}</span><span class="rs">${k==="op"?"Caja, cobros, gastos, traslados, arqueo y corte.":"Revisiones, resguardo, depósitos, liquidaciones Clip y reportes."}</span></span>
    <span class="ramt">${S.role===k?`<span class="badge b-gold">${ico("i-check")}Actual</span>`:ico("i-chev")}</span></button>`).join("")}</div>`});

/* ---- Abrir caja ---- */
SHEETS.abrir = () => { const lc=lastCorte();
  if(lc){ const ok=lc.fondoStatus==="completo";
    return {title:"Abrir caja", body:`${errBox()}
    <div class="cmp" style="margin-top:6px;grid-template-columns:1fr"><div><small>Fondo confirmado en el cierre ${lc.id}</small><b class="tnum">${money(lc.fondoFinal)}</b></div></div>
    ${ok?`<div class="callout ok">${ico("i-lock")}<span><b>Fondo completo.</b> El cierre anterior confirmó físicamente ${money(FONDO_FIJO)}.</span></div>`
        :`<div class="callout err">${ico("i-alert")}<span><b>Fondo insuficiente.</b> El cierre anterior dejó ${money(lc.fondoFinal)}; faltan ${money(FONDO_FIJO-lc.fondoFinal)}. La caja abrirá así y la excepción quedará visible hasta registrar la reposición.</span></div>`}
    <p class="note">La apertura usa exactamente el fondo confirmado; no se supone ${money(FONDO_FIJO)}.</p>`,
    foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doAbrir">Abrir con ${money(lc.fondoFinal)}</button>`}; }
  return {title:"Primera apertura · fondo fijo", body:`${errBox()}
    <div class="cmp" style="margin-top:6px;grid-template-columns:1fr"><div><small>Fondo fijo de caja</small><b class="tnum">${money(FONDO_FIJO)}</b></div></div>
    <label class="row" style="cursor:pointer;margin-top:10px"><input type="checkbox" id="a-ok" style="width:22px;height:22px;accent-color:#7a520a"><span class="rmain"><span class="rt">Confirmo que hay ${money(FONDO_FIJO)} físicos en la caja</span><span class="rs">El fondo no es venta ni ganancia.</span></span></label><div class="ferr" id="a-ok-err"></div>`,
    foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doAbrir">Abrir caja</button>`}; };

/* ---- Cobro ---- */
SHEETS.cobro = a => { const t=ticketById(a.tid), tot=ticketTotal(t), dif=saldoT(t), dup=activeCobro(t.id)&&dif<=0?activeCobro(t.id):null, pag=pagadoT(t.id);
  return {title:a.corrects?`Cobro correcto · ${esc(t.plate)}`:`Cobrar ${esc(t.plate)}`, body:`${errBox()}${corrBanner(a)}
    ${dup?`<div class="callout err">${ico("i-alert")}<span>Este ticket ya tiene el cobro ${dup.id}. No se puede cobrar dos veces.</span></div>`:""}
    <div class="sec"><h3>${S.conectado?"Ticket":"Ticket DEMO"} ${S.conectado?esc(t.id.slice(0,8)):t.id}</h3><div class="tw"><table><tbody>${ticketLines(t).map(l=>`<tr><td>${esc(l.label)}</td><td class="n">${money(l.amount)}</td></tr>`).join("")}<tr class="tot"><td>Total</td><td class="n">${money(tot)}</td></tr>${pag>0&&dif>0?`<tr><td>Ya cobrado</td><td class="n">${money(-pag)}</td></tr><tr class="tot"><td>Diferencia por cobrar</td><td class="n">${money(dif)}</td></tr>`:""}</tbody></table></div>
    ${pag>0&&dif>0?`<div class="callout gold">${ico("i-swap")}<span>Se cambió a un servicio mayor después de cobrar: se cobra solo la <b>diferencia</b>.</span></div>`:""}
    <p class="note">${esc(catName(t.cat))} · recibido ${when(t.at).toLowerCase()}. Importe del catálogo oficial; no se edita aquí.</p></div>
    <fieldset class="field" style="border:0;padding:0;margin:14px 0 0"><legend class="flabel">Forma de pago</legend>
      <div class="seg" id="c-method">${Object.entries(METHODS).map(([k,l])=>`<label><input type="radio" name="c-m" value="${k}" data-f="method" ${a.method===k?"checked":""}><span>${l}</span></label>`).join("")}</div>
      <div class="ferr" id="c-method-err"></div></fieldset>
    <div id="c-dest">${methodNote(a.method)}</div>
    <div class="field"><label for="c-ref">Referencia <span class="opt">${S.conectado?"(obligatoria en transferencia; opcional en Clip)":"(opcional, Clip o transferencia)"}</span></label><input class="inp" id="c-ref" autocomplete="off" maxlength="40" value="${esc(a.ref||"")}"></div>`,
    foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doCobro" ${dup?"disabled":""}>Registrar cobro · ${money(pag>0&&dif>0?dif:tot)}</button>`}; };
function methodNote(m){
  if(m==="efectivo") return `<div class="callout ok">${ico("i-cash")}<span>Entra a la <b>caja física</b> y suma al efectivo esperado.</span></div>`;
  if(m==="clip") return `<div class="callout info">${ico("i-card")}<span><b>No entra a la caja.</b> Queda en “Clip por liquidar” hasta que administración registre el depósito.</span></div>`;
  if(m==="transferencia") return `<div class="callout info">${ico("i-bank")}<span><b>No entra a la caja.</b> Se registra en el Banco DEMO.</span></div>`;
  return `<p class="help">Elige cómo pagó el cliente.</p>`;
}

/* ---- Gasto ---- */
SHEETS.gasto = a => { const admin=S.role==="admin", p=a.prefill||{}, s=openSession(), exp=s?sessionExpected(s):0;
  return {title:a.corrects?"Gasto correcto":admin?"Gasto de administración":"Registrar gasto", body:`${errBox()}${corrBanner(a)}
    ${amountField("g-amt","Importe",p.amount, admin?"":`Efectivo esperado en caja: ${money(exp)}`)}
    <div id="g-warn"></div>
    <fieldset class="field" style="border:0;padding:0;margin:14px 0 0"><legend class="flabel">Concepto</legend>
      <div class="cgrid" id="g-concept">${CONCEPTS.map(c=>`<label><input type="radio" name="g-c" value="${c.id}" data-f="concept" ${p.concept===c.id?"checked":""}><span>${c.n}</span></label>`).join("")}</div>
      <div class="ferr" id="g-concept-err"></div><p class="help">Conceptos provisionales (FP-1).</p></fieldset>
    <fieldset class="field" style="border:0;padding:0;margin:14px 0 0"><legend class="flabel">Comprobante</legend>
      <div class="seg">${[["1","Con foto (simulada)"],["0","Sin comprobante"]].map(([v,l])=>`<label><input type="radio" name="g-r" value="${v}" ${String(p.receipt?1:0)===v&&p.amount?"checked":""}><span>${v==="1"?ico("i-camera","sm"):""}${l}</span></label>`).join("")}</div>
      <div class="ferr" id="g-r-err"></div><p class="help">La demo no guarda imágenes.</p></fieldset>
    ${admin?`<fieldset class="field" style="border:0;padding:0;margin:14px 0 0"><legend class="flabel">Sale de</legend><div class="seg">${[["resguardo","Resguardo"],["banco","Banco DEMO"]].map(([v,l])=>`<label><input type="radio" name="g-o" value="${v}" ${p.origin===v?"checked":""}><span>${l}</span></label>`).join("")}</div><div class="ferr" id="g-o-err"></div></fieldset>`
      :`<div class="callout gold">${ico("i-cash")}<span>Sale de la <b>caja operativa</b> en cuanto lo registras, aunque quede pendiente de revisión.</span></div>`}
    <div class="field"><label for="g-vendor">Proveedor <span class="opt">(opcional)</span></label><input class="inp" id="g-vendor" maxlength="60" autocomplete="off" value="${esc(p.vendor||"")}"></div>
    <div class="field"><label for="g-note">Nota <span class="opt" id="g-note-req">(opcional; obligatoria si eliges “Otro”)</span></label><textarea class="inp" id="g-note" maxlength="240">${esc(p.note||"")}</textarea><div class="ferr" id="g-note-err"></div></div>
    <p class="note">Administración lo revisará después. La revisión no cambia el importe.</p>`,
    foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doGasto" id="g-submit">Registrar gasto</button>`}; };

/* ---- Entrada ---- */
SHEETS.entrada = a => ({title:a.corrects?"Entrada correcta":"Entrada de efectivo", body:`${errBox()}${corrBanner(a)}
  <fieldset class="field" style="border:0;padding:0;margin:4px 0 0"><legend class="flabel">Origen</legend>
    <div class="seg">${[["admin","Reposición de administración"],["otra","Otra entrada"]].map(([v,l])=>`<label><input type="radio" name="e-o" value="${v}" data-f="entO" ${a.origin===v?"checked":""}><span>${l}</span></label>`).join("")}</div><div class="ferr" id="e-o-err"></div></fieldset>
  <div id="e-dest">${entradaNote(a.origin)}</div>
  ${amountField("e-amt","Importe",a.amount)}
  <div class="field"><label for="e-note">Nota <span class="opt">(obligatoria para “Otra entrada”)</span></label><textarea class="inp" id="e-note" maxlength="240">${esc(a.note||"")}</textarea><div class="ferr" id="e-note-err"></div></div>`,
  foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doEntrada">Registrar entrada</button>`});
function entradaNote(o){
  if(o==="admin") return `<div class="callout info">${ico("i-in")}<span>Mueve efectivo del <b>resguardo de administración</b> a la caja. No es venta.</span></div>`;
  if(o==="otra") return `<div class="callout info">${ico("i-in")}<span>Suma a la caja como “otra entrada”. <b>No es venta.</b> Describe el origen.</span></div>`;
  return "";
}

/* ---- Traslado ---- */
SHEETS.traslado = a => { const s=openSession(), exp=s?sessionExpected(s):0;
  return {title:a.corrects?"Traslado correcto":"Traslado a administración", body:`${errBox()}${corrBanner(a)}
  ${amountField("t-amt","Importe enviado",a.amount,`Efectivo esperado en caja: ${money(exp)}`)}<div id="t-warn"></div>
  <div class="field"><label for="t-note">Nota <span class="opt">(opcional)</span></label><input class="inp" id="t-note" maxlength="240" value="${esc(a.note||"")}"></div>
  <div class="callout gold">${ico("i-out")}<span>Sale de la caja al enviarlo y queda <b>En tránsito</b> hasta que administración confirme cuánto recibió. <b>No es un gasto.</b></span></div>`,
  foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doTraslado">Enviar traslado</button>`}; };

/* ---- Confirmar traslado (Administración) ---- */
SHEETS.confirmTr = a => { const t=movById(a.id);
  return {title:`Confirmar recepción · ${t.id}`, body:`${errBox()}
    <dl class="kv"><dt>Enviado</dt><dd class="tnum">${money(t.amount)}</dd><dt>Por</dt><dd>${esc(t.user)}</dd><dt>Cuándo</dt><dd>${when(t.at)}</dd>${t.note?`<dt>Nota</dt><dd>${esc(t.note)}</dd>`:""}</dl>
    ${amountField("r-amt","Importe recibido (contado por administración)",0)}
    <button class="btn sm" data-a="fillReceived" data-v="${t.amount}" style="margin-top:8px">Recibí exactamente ${money(t.amount)}</button>
    <div id="r-diff"></div>
    <div class="field"><label for="r-note">Nota <span class="opt">(opcional)</span></label><input class="inp" id="r-note" maxlength="240"></div>
    <p class="note">Se conserva lo enviado y lo recibido. Si no coinciden, la diferencia se registra aparte para su revisión.</p>`,
    foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doConfirmTr">Confirmar recepción</button>`}; };

/* ---- Depósito ---- */
SHEETS.deposito = () => ({title:"Depósito bancario", body:`${errBox()}${amountField("p-amt","Importe depositado",0,`Efectivo en resguardo: ${money(balances().resguardo)}`)}<div id="p-warn"></div>
  <div class="field"><label for="p-ref">Referencia o ficha <span class="opt">(opcional)</span></label><input class="inp" id="p-ref" maxlength="40" autocomplete="off"></div>
  <div class="callout info">${ico("i-bank")}<span>Mueve efectivo del resguardo al Banco DEMO. <b>No es venta ni gasto.</b></span></div>`,
  foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doDeposito">Registrar depósito</button>`});

/* ---- Liquidación Clip ---- */
SHEETS.liq = () => { const cp=clipPending();
  return {title:"Liquidación Clip", body:`${errBox()}
    ${cp.length?`<fieldset class="field" style="border:0;padding:0;margin:4px 0 0"><legend class="flabel">Cobros incluidos en el depósito</legend><div class="list" id="l-list">
      ${cp.map(m=>{const t=ticketById(m.ticket); return `<label class="row" style="cursor:pointer"><input type="checkbox" id="l-${m.id}" value="${m.id}" data-f="liqCk" style="width:22px;height:22px;accent-color:#7a520a"><span class="rmain"><span class="rt">${esc(t.plate)} · ${m.id}</span><span class="rs">${when(m.at)}${m.ref?" · "+esc(m.ref):""}</span></span><span class="ramt"><b class="tnum">${money(m.amount)}</b></span></label>`;}).join("")}
      </div><div class="ferr" id="l-list-err"></div></fieldset>
      <div class="cmp" style="margin-top:12px;grid-template-columns:1fr"><div><small>Bruto seleccionado</small><b class="tnum" id="l-gross">${money(0)}</b></div></div>
      ${amountField("l-net","Importe depositado por Clip",0,"Escribe lo que llegó al banco según el estado de cuenta DEMO.")}
      <button class="btn sm" data-a="fillNet" style="margin-top:8px">Igual al bruto</button><div id="l-diff"></div>
      <div class="field"><label for="l-ref">Referencia <span class="opt">(opcional)</span></label><input class="inp" id="l-ref" maxlength="40" autocomplete="off"></div>
      <div class="callout info">${ico("i-card")}<span>Pasa saldo de Clip al banco. <b>No es una venta nueva</b>: el ingreso se contó al cobrar. Cada cobro solo puede liquidarse una vez.</span></div>`
    :empty("i-checkc","No hay cobros Clip por liquidar")}`,
    foot:cp.length?`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doLiq">Registrar liquidación</button>`:`<button class="btn" data-a="closeSheet">Cerrar</button>`}; };

/* ---- Detalle de movimiento ---- */
function effTable(m){ const {E,C}=eff(m); const rows=Object.keys(E).filter(k=>E[k]!==0);
  const cls = C.venta?"Venta"+(C.venta<0?" (revertida)":""):C.gasto?"Gasto"+(C.gasto<0?" (revertido)":""):C.entrada?"Otra entrada (no es venta)":C.aporte?"Aporte de fondo (no es venta)":E.dif?"Diferencia registrada (no es venta ni gasto)":"Movimiento entre cuentas (no es venta ni gasto)";
  return `<div class="tw"><table><thead><tr><th>Cuenta</th><th class="n">Efecto</th></tr></thead><tbody>${rows.map(k=>`<tr><td>${BUCKETS[k].n}</td><td class="n ${E[k]>0?"pos":"neg"}">${smoney(E[k])}</td></tr>`).join("")||`<tr><td colspan="2">Sin efecto en cuentas</td></tr>`}</tbody></table></div><p class="note">Clasificación: <b>${cls}</b>.</p>`; }
function revHistory(rv){ if(!rv) return "";
  return `<div class="sec"><h3>Revisión administrativa</h3><p style="margin:0 0 8px">${reviewBadge(rv)}</p>${rv.history.length?`<ol class="hist">${rv.history.map(h=>`<li style="--c:${h.status==="revisado"?"var(--ok)":h.status==="aclaracion"?"var(--violet)":"var(--warn)"}"><b>${h.response?"Respuesta de Operación":REVIEW_LABEL[h.status]}</b>${h.note?" · "+esc(h.note):""}<small>${when(h.at)} · ${esc(h.user)}</small></li>`).join("")}</ol>`:`<p class="note">Aún sin revisión.</p>`}</div>`; }
const linkBtn = (id,a="movDetail") => `<button class="btn ghost sm" style="padding:0 4px" data-a="${a}" data-id="${id}">${id}</button>`;
SHEETS.mov = a => { const m=movById(a.id), t=m.ticket&&ticketById(m.ticket), s=m.sid&&sessById(m.sid);
  const kv=[["Folio",m.id],["Tipo",TYPE_LABEL[m.type]],["Fecha y hora",when(m.at)],["Registró",`${m.user} · ${ROLES[m.by].n}`],["Importe",money(m.amount)]];
  if(s) kv.push(["Sesión de caja",`${s.id}${s.corte?" · corte "+s.corte:" · abierta"}`]);
  if(t) kv.push(["Ticket",`${t.plate} · ${t.id} · ${tService(t)} · ${money(ticketTotal(t))}`]);
  if(m.method) kv.push(["Forma de pago",METHODS[m.method]]);
  if(m.ref) kv.push(["Referencia",m.ref]);
  if(m.concept) kv.push(["Concepto",conceptName(m.concept)]);
  if(m.type==="gasto"){ kv.push(["Sale de",BUCKETS[m.origin].n]); kv.push(["Comprobante",m.receipt?"Foto simulada (no se guarda imagen)":"Sin comprobante"]); if(m.vendor) kv.push(["Proveedor",m.vendor]); }
  if(m.type==="entrada") kv.push(["Origen",m.origin==="admin"?"Reposición desde administración":"Otra entrada"]);
  if(m.type==="recepcion"){ kv.push(["Enviado",money(m.sent)]); kv.push(["Recibido",money(m.amount)]); kv.push(["Diferencia",smoney(m.amount-m.sent)]); }
  if(m.type==="liquidacion"){ kv.push(["Bruto (cobros)",money(m.gross)]); kv.push(["Depositado",money(m.amount)]); kv.push(["Diferencia por conciliar",smoney(m.amount-m.gross)]); }
  if(m.type==="ajuste") kv.push(["Origen","Diferencia de arqueo registrada en el cierre"]);
  if(m.kind==="cierre") kv.push(["Tipo de traslado",`Entrega de cierre: excedente sobre el fondo fijo de ${money(FONDO_FIJO)}`]);
  if(m.type==="traslado"&&m.kind!=="cierre") kv.push(["Tipo de traslado","Retiro anterior al cierre"]);
  if(m.fondo) kv.push(["Uso","Reposición del fondo fijo (no es venta)"]);
  if(m.note) kv.push(["Nota",m.note]);
  const links=[];
  if(m.reverses) links.push(`Anula a ${linkBtn(m.reverses)}`);
  if(m.reversedBy) links.push(`Anulado por ${linkBtn(m.reversedBy)}`);
  if(m.corrects) links.push(`Sustituye a ${linkBtn(m.corrects)}`);
  const sub=S.movs.find(x=>x.corrects===m.id); if(sub) links.push(`Sustituido por ${linkBtn(sub.id)}`);
  if(m.recepcion) links.push(`Recepción ${linkBtn(m.recepcion)}`);
  if(m.traslado) links.push(`Traslado ${linkBtn(m.traslado)}`);
  if(m.liquidatedBy) links.push(`Liquidación ${linkBtn(m.liquidatedBy)}`);
  if(m.cobros) links.push(`Cobros: ${m.cobros.map(id=>linkBtn(id)).join(" ")}`);
  if(m.corte) links.push(`Corte ${linkBtn(m.corte,"corteDetail")}`);
  const au=S.audit.filter(x=>x.ref===m.id);
  const [canR]=canReverse(m), op=S.role==="op";
  const foot=[];
  if(m.review&&S.role==="admin"&&m.review.status!=="revisado"){ foot.push(`<button class="btn" data-a="reviewSheet" data-k="gasto" data-id="${m.id}" data-v="aclaracion">Pedir aclaración</button>`); foot.push(`<button class="btn pri" data-a="reviewSheet" data-k="gasto" data-id="${m.id}" data-v="revisado">Marcar revisado</button>`); }
  if(m.review&&op&&m.review.status==="aclaracion") foot.push(`<button class="btn pri" data-a="respondSheet" data-k="gasto" data-id="${m.id}">Responder aclaración</button>`);
  if(canR){ foot.push(`<button class="btn danger" data-a="reverseSheet" data-id="${m.id}" data-v="anular">Anular</button>`); if(m.type!=="deposito") foot.push(`<button class="btn" data-a="reverseSheet" data-id="${m.id}" data-v="corregir">Corregir</button>`); }
  return {title:esc(movTitle(m)), body:`
    ${m.reversedBy?`<div class="callout err">${ico("i-reset")}<span>Este movimiento fue <b>anulado</b> por ${m.reversedBy}. Se conserva para auditoría.</span></div>`:""}
    <div class="sec"><h3>Datos</h3><dl class="kv">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>
    ${links.length?`<div class="sec"><h3>Relacionados</h3><p style="margin:0;line-height:2">${links.join(" · ")}</p></div>`:""}
    <div class="sec"><h3>Efecto en cuentas</h3>${effTable(m)}</div>
    ${revHistory(m.review)}
    <div class="sec"><h3>Bitácora</h3><ol class="hist">${au.map(x=>`<li><b>${esc(x.action)}</b> · ${esc(x.detail)}<small>${when(x.at)} · ${esc(x.user)}</small></li>`).join("")}</ol></div>`,
    foot:foot.join("")}; };

/* ---- Detalle de corte ---- */
SHEETS.corte = a => { const c=corteById(a.id), B=c.breakdown, s=sessById(c.sid);
  const foot=[];
  if(S.role==="admin"&&c.review.status!=="revisado"){ foot.push(`<button class="btn" data-a="reviewSheet" data-k="corte" data-id="${c.id}" data-v="aclaracion">Pedir aclaración</button>`); foot.push(`<button class="btn pri" data-a="reviewSheet" data-k="corte" data-id="${c.id}" data-v="revisado">Marcar revisado</button>`); }
  if(S.role==="op"&&c.review.status==="aclaracion") foot.push(`<button class="btn pri" data-a="respondSheet" data-k="corte" data-id="${c.id}">Responder aclaración</button>`);
  return {title:`Corte ${c.id}`, body:`
    <div class="sec"><h3>Resultado del cierre</h3>${indicators(c)}</div>
    ${c.excepcion?`<div class="callout ${c.excepcion.status==="pendiente"?"err":"ok"}">${ico(c.excepcion.status==="pendiente"?"i-alert":"i-checkc")}<span><b>Excepción de fondo ${c.excepcion.status}.</b> ${esc(c.excepcion.note)}${c.excepcion.resolvedBy?` · Resuelta con ${c.excepcion.resolvedBy}`:""}</span></div>`:""}
    <div class="sec"><h3>Resumen</h3><dl class="kv"><dt>Folio</dt><dd>${c.id}</dd><dt>Sesión</dt><dd>${c.sid}</dd><dt>Apertura</dt><dd>${when(c.openedAt)}</dd><dt>Conteo confirmado</dt><dd>${when(c.countAt)}</dd><dt>Cierre</dt><dd>${when(c.at)}</dd><dt>Responsable</dt><dd>${esc(c.user)} · ${ROLES[c.by].n}</dd><dt>Fondo inicial</dt><dd>${money(c.fondoInicial)}</dd>${c.note?`<dt>Nota</dt><dd>${esc(c.note)}</dd>`:""}</dl></div>
    <div class="sec"><h3>Arqueo</h3>${cmpBlock(c.expected,c.counted)}${c.ajuste?`<p class="note">Diferencia registrada aparte con ${linkBtn(c.ajuste)}: ${esc(c.diffNote)}. El conteo original no se modifica.</p>`:""}</div>
    <div class="sec"><h3>Entrega y fondo</h3><div class="tw"><table><tbody>
      <tr><td>Efectivo contado</td><td class="n">${money(c.counted)}</td></tr>
      <tr><td>− Entrega a administración (traslado, no gasto)</td><td class="n">${c.entrega?`${money(c.entregaAmount)} · ${linkBtn(c.entrega)}`:money(0)}</td></tr>
      ${c.reposicion?`<tr><td>+ Reposición del fondo (aportación, no venta)</td><td class="n">${money(c.reposicionAmount)} · ${linkBtn(c.reposicion)}</td></tr>`:""}
      <tr class="tot"><td>Fondo que permanece (contado físicamente ${hhmm(c.fondoAt)})</td><td class="n">${money(c.fondoFinal)}</td></tr></tbody></table></div></div>
    <div class="sec"><h3>Cálculo del esperado</h3>${waterfall(B,{openKind:c.openKind,fromCorte:s.fromCorte})}</div>
    <div class="sec"><h3>Fuera de la caja física (informativo)</h3><dl class="kv"><dt>Clip</dt><dd>${money(B.clip)} · ${B.nClip}</dd><dt>Transferencias</dt><dd>${money(B.transf)} · ${B.nTransf}</dd></dl></div>
    <div class="sec"><h3>Conteo original por denominación</h3>${countTable(c.count)}</div>
    <div class="sec"><h3>Conteo del fondo que permanece</h3>${countTable(c.fondoCount)}</div>
    ${revHistory(c.review)}`, foot:foot.join("")}; };

/* ---- Revisión / respuesta / reverso ---- */
SHEETS.review = a => { const ok=a.status==="revisado", o=reviewTarget(a.kind,a.id);
  return {title:ok?"Marcar como revisado":"Pedir aclaración", body:`${errBox()}
    <p style="margin:6px 0 0"><b>${a.kind==="gasto"?esc(conceptName(o.concept))+" · "+money(o.amount):"Corte "+o.id+" · diferencia "+smoney(o.diff)}</b><br><span class="note">${a.id} · ${when(o.at)}</span></p>
    <div class="callout gold">${ico("i-shield")}<span>La revisión <b>no modifica importes ni saldos</b>.</span></div>
    <div class="field"><label for="v-note">${ok?'Nota <span class="opt">(opcional)</span>':"¿Qué necesitas que se aclare?"}</label><textarea class="inp" id="v-note" maxlength="300" data-autofocus></textarea><div class="ferr" id="v-note-err"></div></div>`,
    foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doReview">${ok?"Marcar revisado":"Enviar solicitud"}</button>`}; };
SHEETS.respond = a => { const o=reviewTarget(a.kind,a.id), q=o.review.history.filter(h=>h.status==="aclaracion").pop();
  return {title:"Responder aclaración", body:`${errBox()}
    <div class="callout warn">${ico("i-msg")}<span><b>Administración pregunta:</b> ${esc(q?q.note:"")}</span></div>
    <div class="field"><label for="w-note">Tu respuesta</label><textarea class="inp" id="w-note" maxlength="300" data-autofocus></textarea><div class="ferr" id="w-note-err"></div></div>
    <p class="note">Responder no cambia el importe. Si el importe está mal y el turno sigue abierto, usa “Corregir” en el movimiento.</p>`,
    foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doRespond">Enviar respuesta</button>`}; };
SHEETS.reverse = a => { const m=movById(a.id), {E}=eff(m);
  return {title:a.mode==="corregir"?`Corregir ${m.id}`:`Anular ${m.id}`, body:`${errBox()}
    <p style="margin:6px 0 0"><b>${esc(movTitle(m))}</b> · ${money(m.amount)}<br><span class="note">${when(m.at)}</span></p>
    <div class="callout info">${ico("i-reset")}<span>Se registrará un <b>movimiento nuevo</b> que revierte el efecto: ${Object.keys(E).filter(k=>E[k]).map(k=>`${BUCKETS[k].n} ${smoney(-E[k])}`).join(", ")}. El original se conserva marcado como anulado.</span></div>
    ${a.mode==="corregir"?`<p class="note">Después podrás registrar el movimiento correcto, enlazado a este.</p>`:""}
    <div class="field"><label for="x-note">Motivo</label><textarea class="inp" id="x-note" maxlength="240" data-autofocus></textarea><div class="ferr" id="x-note-err"></div></div>`,
    foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn ${a.mode==="corregir"?"pri":"danger"}" data-a="doReverse">${a.mode==="corregir"?"Anular y registrar el correcto":"Anular movimiento"}</button>`}; };

/* ---- Confirmaciones genéricas ---- */
SHEETS.confirm = a => ({title:a.title, body:`${errBox()}${a.body}`, foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn ${a.danger?"danger":"pri"}" data-a="confirmOk">${a.ok}</button>`});

/* ---- Ticket DEMO ---- */
SHEETS.ticket = a => { const cat=a.cat||"sedan", pkg=a.pkg||"alaga", ex=(a.extras||[]).filter(id=>{const e=EXTRAS.find(x=>x.id===id); return e&&e.p[cat]!=null;});
  const t={cat,pkg,extras:ex};
  return {title:"Crear ticket DEMO", body:`${errBox()}<p class="note">Solo para probar cobros. Precios del catálogo oficial (sin cambios). RZR se omite porque su precio final se confirma en ALAGA SYSTEM.</p>
    <div class="field"><label for="k-plate">Placa DEMO <span class="opt">(opcional)</span></label><input class="inp" id="k-plate" maxlength="10" autocapitalize="characters" autocomplete="off" value="${esc(a.plate||"")}"></div>
    <fieldset class="field" style="border:0;padding:0"><legend class="flabel">Categoría</legend><div class="chips">${CATS.filter(c=>c.id!=="rzr").map(c=>`<button type="button" class="chip" data-a="tkSet" data-k="cat" data-v="${c.id}" aria-pressed="${cat===c.id}">${c.name.replace(" / compacto","")}</button>`).join("")}</div></fieldset>
    <fieldset class="field" style="border:0;padding:0"><legend class="flabel">Paquete</legend><div class="chips">${Object.entries(PKGS).map(([k,p])=>`<button type="button" class="chip" data-a="tkSet" data-k="pkg" data-v="${k}" aria-pressed="${pkg===k}">${p.name} · ${money(PRICES[k][cat]*100)}</button>`).join("")}</div></fieldset>
    <fieldset class="field" style="border:0;padding:0"><legend class="flabel">Extras</legend>${EXTRAS.filter(e=>e.p[cat]!=null).length?`<div class="chips">${EXTRAS.filter(e=>e.p[cat]!=null).map(e=>`<button type="button" class="chip" data-a="tkSet" data-k="extra" data-v="${e.id}" aria-pressed="${ex.includes(e.id)}">${e.name} · ${money(e.p[cat]*100)}</button>`).join("")}</div>`:`<p class="note">Sin extras publicados para esta categoría (D7).</p>`}</fieldset>
    <div class="cmp" style="margin-top:14px;grid-template-columns:1fr"><div><small>Total del ticket</small><b class="tnum">${money(ticketTotal(t))}</b></div></div>`,
    foot:`<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doTicket">Crear ticket</button>`}; };

/* =====================================================================
   Acciones
   ===================================================================== */
const parseField = (id, label="el importe") => { const r=parseMoney(val(id)); return r.err?{err:{f:id,m:r.err}}:{c:r.c}; };
const A = {
  closeSheet(){ closeSheet(); },
  focusField(d){ const el=document.getElementById(d.id); if(el) el.focus(); },
  roleSheet(){ openSheet("role"); },
  setRole(d){ if(!ROLES[d.v]) return; S.role=d.v; save(); closeSheet(true); toast(`Rol: ${ROLES[d.v].n} (simulado)`); if(!canRoute(R.route)) go(ROLES[S.role].home); else render(); },
  movDetail(d){ openSheet("mov",{id:d.id}); },
  corteDetail(d){ openSheet("corte",{id:d.id}); },
  scrollCobros(){ const el=$("#porcobrar"); if(el){ el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}); const b=el.querySelector("button"); if(b) setTimeout(()=>b.focus({preventScroll:true}),300); } },
  movScope(d){ R.movScope=d.v; render(); }, movType(d){ R.movType=d.v; R.showAudit=false; render(); }, toggleAudit(){ R.showAudit=!R.showAudit; render(); },
  revTab(d){ R.revTab=d.v; render(); }, period(d){ R.period=d.v; render(); },

  abrirSheet(){ openSheet("abrir"); },
  doAbrir(d,el){ const first=!lastCorte(); if(first&&!$("#a-ok").checked) return showErrors([{f:"a-ok",m:`Confirma que hay ${money(FONDO_FIJO)} físicos en la caja.`}]);
    if(!guardBtn(el)) return; const res=opAbrirCaja({confirmFondo:first}); done(res, res.ok?(res.s.fondoCompleto?`Caja abierta con fondo completo de ${money(FONDO_FIJO)}`:`Caja abierta con fondo insuficiente (${money(res.s.fondoInicial)})`):""); },

  cobrarSheet(d){ openSheet("cobro",{tid:d.id}); },
  doCobro(d,el){ const a=SH.args, method=radio("c-m"); if(!method) return showErrors([{f:"c-method",m:"Elige la forma de pago."}]);
    if(!guardBtn(el)) return; const res=opCobrar(a.tid, method, val("c-ref")); markCorrects(res,a);
    done(res, `Cobro registrado · ${money(res.ok?res.mov.amount:0)} · ${METHODS[method]}`); },

  gastoSheet(){ if(S.role==="op"){ const g=guardCaja(); if(!g.ok) return toast(g.err,true); } else if(!can("gastoAdmin")) return toast("Sin permiso (simulado).",true); openSheet("gasto",{}); },
  doGasto(d,el){ const a=SH.args, admin=S.role==="admin", errs=[];
    const p=parseField("g-amt"); if(p.err) errs.push(p.err);
    const concept=radio("g-c"); if(!concept) errs.push({f:"g-concept",m:"Elige un concepto."});
    const r=radio("g-r"); if(!r) errs.push({f:"g-r",m:"Indica si hay comprobante."});
    const origin=admin?radio("g-o"):"caja"; if(admin&&!origin) errs.push({f:"g-o",m:"Elige de dónde sale el gasto."});
    if(concept==="otro"&&!val("g-note").trim()) errs.push({f:"g-note",m:"Para “Otro”, describe el gasto en la nota."});
    if(errs.length) return showErrors(errs);
    if(!guardBtn(el)) return;
    const res=opGasto({amount:p.c, concept, receipt:r==="1", vendor:val("g-vendor"), note:val("g-note"), origin}); markCorrects(res,a);
    done(res, admin?`Gasto registrado · ${BUCKETS[origin].n} −${money(p.c)}`:`Gasto registrado · caja −${money(p.c)} · pendiente de revisión`); },

function liqGross(){ return $$("#l-list input:checked").reduce((s,x)=>s+movById(x.value).amount,0); }

function updateDen(k,p="den"){
  const s=openSession(), D=draftFor(p,s), d=DENOMS.find(x=>x.k===k), q=D.count[k]||0, inp=document.getElementById(p+"-"+k);
  if(inp&&document.activeElement!==inp) inp.value=q||""; const ds=document.getElementById(p+"-ds-"+k); if(ds) ds.textContent=money(q*d.v);
  const t=document.getElementById(p+"-total"); if(t) t.textContent=money(countTotal(D.count));
}

  importFile(el){ const f=el.files&&el.files[0]; if(!f) return; if(f.size>5*1024*1024){ el.value=""; return toast("El archivo es demasiado grande para un respaldo.",true); }

      const st=o&&o.estado?o.estado:o; const errs=validateState(st); if(errs.length) return toast("No se puede restaurar: "+errs[0],true);
      openSheet("confirm",{title:"Restaurar respaldo", ok:"Restaurar", body:`<p>Archivo: <b>${esc(f.name)}</b> · ${st.movs.length} movimientos, ${st.cortes.length} cortes.</p><div class="callout info">${ico("i-shield")}<span>Lo actual se guarda antes como “Copia anterior”.</span></div>`,

    const first=f[0], last=f[f.length-1]; if(ev.shiftKey&&document.activeElement===first){ last.focus(); ev.preventDefault(); } else if(!ev.shiftKey&&document.activeElement===last){ first.focus(); ev.preventDefault(); } }
  if(ev.key==="Enter"&&SH&&ev.target.tagName==="INPUT"&&ev.target.type!=="checkbox"&&ev.target.type!=="radio"){ ev.preventDefault(); ev.target.blur(); }
});

/* Arranque: modo conectado a la caja fuerte (si se configuró) o modo DEMO local. */

if(cfBoot()){ VIEWS.mas=vMas; VIEWS.arqueo=vArqueo; }
else {

}

<!--tema-lux-js:inicio--><script id="tema-lux-js">
/* ALAGA · Tema Lux: movimiento entre pantallas. No toca datos ni lógica: solo agrega clases a lo ya dibujado.
   1) Transición: al cambiar de pantalla, las barras fijas se quedan quietas; el contenido nuevo entra deslizándose
      (paso siguiente → desde la derecha, paso anterior → desde la izquierda, otra sección → sube) y una copia
      inerte del contenido anterior se desvanece encima (0.38 s), para que no haya corte.
   2) Cascada: en pantallas principales (con menú inferior) tarjetas y botones suben uno tras otro (0.05 s).
   En firma (lienzo) solo hay fundido: un trazo sobre algo que se desliza se pierde. */
(function () {
  "use strict";
  var app = document.getElementById("app");
  if (!app || !window.MutationObserver) return;
