<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface-2:#f3f0ea; --surface-3:#e8e4dc; --line:#e3ded5; --line-2:#d3cdc2;
  --ink:#1c1917; --ink-2:#433e39; --ink-3:#655e56;
  --carbon:#151210; --carbon-2:#1b1815; --on-carbon:#f5f1ea; --on-carbon-2:#cdc5b8;
  --gold:#c9a45c; --gold-ink:#7a520a; --gold-bg:#f6eedd;
  --ok:#1f6f46; --ok-bg:#e7f4ec; --warn:#8a4b00; --warn-bg:#fdf0dc; --err:#b42318; --err-bg:#fdecea;
  --info:#245a94; --info-bg:#e8f0fa; --violet:#5b3c8f; --violet-bg:#f1ebfa;
  --pri-bg:#151210; --pri-ink:#f5f1ea;
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow-1:0 1px 0 rgba(28,25,23,.03),0 1px 2px rgba(28,25,23,.06);
  --shadow-2:0 1px 2px rgba(28,25,23,.05),0 12px 28px -14px rgba(28,25,23,.22);
  --shadow-3:0 28px 56px -18px rgba(28,25,23,.38);
  --scrim:rgba(21,18,16,.52);
  --t-fast:140ms; --t-med:240ms; --ease-out:cubic-bezier(.2,.8,.2,1);
  --tab-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0c0b; --surface:#191614; --surface-2:#221e1b; --surface-3:#2d2824; --line:#332e29; --line-2:#433c35;
  --ink:#f5f1ea; --ink-2:#d8d1c6; --ink-3:#aca397;
  --gold-ink:#e2c48a; --gold-bg:#2b2418;
  --ok:#6fcf97; --ok-bg:#15291e; --warn:#f0b35a; --warn-bg:#2d2112; --err:#ff8a7a; --err-bg:#331a17;
  --info:#8ab8ee; --info-bg:#142335; --violet:#c4a8f0; --violet-bg:#2a2237;
  --pri-bg:#c9a45c; --pri-ink:#151210;
  --shadow-1:0 0 0 1px rgba(255,255,255,.02); --shadow-2:0 0 0 1px rgba(255,255,255,.03),0 14px 30px -16px rgba(0,0,0,.8); --shadow-3:0 28px 60px -18px rgba(0,0,0,.9);
  --scrim:rgba(0,0,0,.66);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e0c0b; --surface:#191614; --surface-2:#221e1b; --surface-3:#2d2824; --line:#332e29; --line-2:#433c35;
  --ink:#f5f1ea; --ink-2:#d8d1c6; --ink-3:#aca397;
  --gold-ink:#e2c48a; --gold-bg:#2b2418;
  --ok:#6fcf97; --ok-bg:#15291e; --warn:#f0b35a; --warn-bg:#2d2112; --err:#ff8a7a; --err-bg:#331a17;
  --info:#8ab8ee; --info-bg:#142335; --violet:#c4a8f0; --violet-bg:#2a2237;
  --pri-bg:#c9a45c; --pri-ink:#151210;
  --shadow-1:0 0 0 1px rgba(255,255,255,.02); --shadow-2:0 0 0 1px rgba(255,255,255,.03),0 14px 30px -16px rgba(0,0,0,.8); --shadow-3:0 28px 60px -18px rgba(0,0,0,.9);
  --scrim:rgba(0,0,0,.66);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px;scroll-padding-bottom:calc(var(--tab-h) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}.i.lg{width:24px;height:24px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--surface);padding:10px 14px;border-radius:10px;z-index:200}
.skip:focus{top:8px}

/* ---------- Encabezado de mando (carbón) ---------- */
.brandbar{background:linear-gradient(180deg,var(--carbon-2) 0%,var(--carbon) 100%);color:var(--on-carbon);padding:calc(env(safe-area-inset-top) + 12px) 16px 18px}
.bb-row{display:flex;align-items:center;gap:10px;max-width:1080px;margin:0 auto}
.logo{display:flex;flex-direction:column;line-height:1;margin-right:auto}
.logo b{font-weight:800;letter-spacing:.3em;color:var(--gold);font-size:20px}
.logo small{font-size:11.5px;letter-spacing:.22em;white-space:nowrap;color:var(--on-carbon-2);margin-top:5px;font-weight:600}
.demo-badge{background:var(--gold);color:#151210;font-weight:800;font-size:12px;letter-spacing:.08em;border-radius:999px;padding:4px 10px}
.rolebtn{min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;border:1px solid rgba(205,197,184,.32);background:rgba(255,255,255,.04);color:var(--on-carbon);border-radius:12px;padding:4px 10px 4px 8px;text-align:left}
.rolebtn .i{color:var(--gold)}
.rolebtn span{display:flex;flex-direction:column;line-height:1.15}
.rolebtn b{font-size:13.5px;white-space:nowrap}.rolebtn small{font-size:12px;color:var(--on-carbon-2);white-space:nowrap}
.clockline .demo-inline{display:none;margin-left:auto}
@media(max-width:430px){.rolebtn small{display:none}.bb-row>.demo-badge{display:none}.clockline .demo-inline{display:inline-block}.logo b{font-size:18px;letter-spacing:.26em}.logo small{font-size:11px;letter-spacing:.18em}}
.iconbtn{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(205,197,184,.32);background:rgba(255,255,255,.04);color:var(--on-carbon)}
.clockline{max-width:1080px;margin:10px auto 0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--on-carbon-2)}
.clockline .warnc{color:var(--gold)}

/* ---------- Contenido ---------- */
main:focus{outline:none}
main{max-width:1080px;margin:0 auto;padding:16px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 32px)}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.vhead h1{font-size:26px;line-height:1.15;margin:0;font-weight:750;letter-spacing:-.01em}
.vhead p{margin:4px 0 0;color:var(--ink-3);font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.grid{display:grid;gap:14px}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}.g2 .span2{grid-column:1/-1}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1);padding:14px 16px 16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;margin-bottom:8px;min-height:32px}
.panel-h h2{font-size:16.5px;font-weight:750;margin:0;display:flex;align-items:center;gap:8px}
.panel-h h2 .i{color:var(--gold-ink)}
.panel-h .lnk{border:0;background:none;color:var(--gold-ink);font-weight:700;font-size:14px;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:2px}
.note{font-size:13.5px;color:var(--ink-3);line-height:1.45;margin:6px 0 0}
.count{min-width:26px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;font-size:13px;font-weight:800;background:var(--surface-2);color:var(--ink-2)}
.count.warn{background:var(--warn-bg);color:var(--warn)}.count.ok{background:var(--ok-bg);color:var(--ok)}.count.err{background:var(--err-bg);color:var(--err)}.count.violet{background:var(--violet-bg);color:var(--violet)}

/* Héroe de caja (carbón) */
.hero{background:linear-gradient(180deg,var(--carbon-2),var(--carbon));color:var(--on-carbon);border-radius:20px;padding:18px 18px 16px;box-shadow:var(--shadow-2);position:relative;overflow:hidden}
.hero .lbl{text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--on-carbon-2);font-weight:700}
.hero .val{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1.1;color:var(--gold);letter-spacing:-.015em;margin-top:4px}
.hero .sub{font-size:13.5px;color:var(--on-carbon-2);margin-top:4px}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 10px;background:rgba(255,255,255,.07);color:var(--on-carbon)}
.hchip .i{width:14px;height:14px;color:var(--gold)}

/* Cascada (waterfall horizontal) */
.wf{list-style:none;margin:0;padding:0}
.wf li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.wf li:first-child{border-top:0}
.wf .wl{display:flex;align-items:center;gap:8px;font-size:14.5px;min-width:0}
.wf .wl small{color:var(--ink-3);font-size:12.5px}
.wf .wv{font-weight:750;font-size:15px;white-space:nowrap}
.wf .wv.pos{color:var(--ok)}.wf .wv.neg{color:var(--err)}
.wf .trk{grid-column:1/-1;position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.wf .trk i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--c)}
.wf li.tot{border-top:2px solid var(--ink);margin-top:2px}
.wf li.tot .wl{font-weight:800}.wf li.tot .wv{font-family:var(--serif);font-size:22px;color:var(--ink)}
.sgn{width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;background:var(--surface-2);color:var(--ink-2)}
.sgn.pos{background:var(--ok-bg);color:var(--ok)}.sgn.neg{background:var(--err-bg);color:var(--err)}.sgn.eq{background:var(--gold-bg);color:var(--gold-ink)}

/* Acciones rápidas */
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa button{min-width:0;overflow-wrap:break-word;hyphens:auto;display:flex;align-items:center;gap:10px;min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-1);padding:10px 12px;font-weight:750;font-size:15px;text-align:left;color:var(--ink);transition:transform var(--t-fast) var(--ease-out)}
.qa button .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--gold-bg);color:var(--gold-ink);flex:none}
.qa button small{display:block;font-weight:500;font-size:12.5px;color:var(--ink-3);line-height:1.3}
.qa button.pri{background:var(--pri-bg);color:var(--pri-ink);border-color:var(--pri-bg)}
.qa button.pri small{color:inherit;opacity:.82}
.qa button.pri .ic{background:rgba(201,164,92,.18);color:var(--gold)}
:root[data-theme="dark"] .qa button.pri .ic{background:rgba(21,18,16,.16);color:#151210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qa button.pri .ic{background:rgba(21,18,16,.16);color:#151210}}
.qa button:active,.row:active,.mrow:active{transform:scale(.985)}
.qa button:disabled{opacity:.45;transform:none}

/* Separación de cuentas */
.accts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acct{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface-2);min-width:0}
.acct .an{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.acct .an .i{color:var(--gold-ink);width:16px;height:16px}
.acct .av{font-family:var(--serif);font-weight:600;font-size:22px;margin-top:2px}
.acct .ad{font-size:12.5px;color:var(--ink-3);line-height:1.35}
.acct.phys{background:var(--surface)}
.acct.neg .av{color:var(--err)}

/* Filas */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-height:56px;transition:transform var(--t-fast)}
.list>.row:first-child{border-top:0}
.ricon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.ricon.ok{background:var(--ok-bg);color:var(--ok)}.ricon.warn{background:var(--warn-bg);color:var(--warn)}.ricon.err{background:var(--err-bg);color:var(--err)}.ricon.info{background:var(--info-bg);color:var(--info)}.ricon.violet{background:var(--violet-bg);color:var(--violet)}.ricon.gold{background:var(--gold-bg);color:var(--gold-ink)}
.rmain{min-width:0}
.rmain>.rt,.rmain>.rs{display:block}
.rt{font-weight:750;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.rs{font-size:13px;color:var(--ink-3);line-height:1.35;overflow-wrap:anywhere}
.ramt{text-align:right;white-space:nowrap}
.ramt b{display:block;font-size:15.5px}
.ramt small{display:block;font-size:12px;color:var(--ink-3)}
.pos{color:var(--ok)}.neg{color:var(--err)}
.mrow{width:100%;border:0;background:none;text-align:left;padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;min-height:60px;color:var(--ink)}
.dgroup>.mrow:first-of-type{border-top:0}
.mrow.void .rt,.mrow.void .ramt b{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-3)}
.dayh{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:18px 2px 4px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:750;white-space:nowrap;line-height:1.5;vertical-align:middle}
.badge .i{width:12px;height:12px;stroke-width:2.2}
.b-pend{background:var(--warn-bg);color:var(--warn)}.b-rev{background:var(--ok-bg);color:var(--ok)}.b-acl{background:var(--violet-bg);color:var(--violet)}
.b-void{background:var(--err-bg);color:var(--err)}.b-info{background:var(--info-bg);color:var(--info)}.b-neutral{background:var(--surface-2);color:var(--ink-2)}.b-gold{background:var(--gold-bg);color:var(--gold-ink)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:13px;padding:0 16px;font-weight:750;font-size:15.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);text-align:center;line-height:1.2}
.btn.pri{background:var(--pri-bg);color:var(--pri-ink);border-color:var(--pri-bg)}
.btn.danger{background:var(--surface);color:var(--err);border-color:var(--err)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--gold-ink)}
.btn.sm{min-height:44px;font-size:14px;padding:0 12px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btn:active:not(:disabled){transform:scale(.985)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

/* Segmentado y chips */
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button,.seg label{flex:1 1 auto;min-height:44px;border:0;background:none;border-radius:10px;font-weight:700;font-size:14px;padding:0 12px;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.seg [aria-pressed="true"],.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg label{padding:0;position:relative;flex:1 1 0;min-width:0;white-space:normal}
.seg label span{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;width:100%;padding:4px 10px;border-radius:10px;text-align:center;line-height:1.2}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:focus-visible+span{outline:3px solid var(--gold);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cgrid label{position:relative;display:block}
.cgrid input{position:absolute;opacity:0;pointer-events:none}
.cgrid span{display:flex;align-items:center;min-height:52px;padding:8px 12px;border-radius:13px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:14.5px;line-height:1.25;cursor:pointer}
.cgrid input:checked+span{border:2px solid var(--gold-ink);background:var(--gold-bg);padding:7px 11px}
.cgrid input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}

/* Formularios */
.field{margin-top:14px}
.field>label,.flabel{display:block;font-weight:750;font-size:14.5px;margin-bottom:6px}
.field .opt{font-weight:500;color:var(--ink-3);font-size:13px}
.inp{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:10px 12px;font-size:16px}
fieldset{min-width:0}
.inp{min-width:0}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{outline:none;border-color:var(--gold-ink);box-shadow:0 0 0 3px rgba(201,164,92,.28)}
.inp[aria-invalid="true"]{border-color:var(--err)}
.amt{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:16px;background:var(--surface);padding:6px 14px;min-height:72px}
.amt:focus-within{border-color:var(--gold-ink);box-shadow:0 0 0 3px rgba(201,164,92,.28)}
.amt span{font-family:var(--serif);font-size:30px;color:var(--ink-3)}
.amt input{border:0;outline:0;background:none;width:100%;font-family:var(--serif);font-size:36px;font-weight:600;min-height:56px;padding:0}
.amt[data-invalid="true"]{border-color:var(--err)}
.ferr{color:var(--err);font-size:13.5px;font-weight:650;margin-top:6px;min-height:0}
.ferr:empty{display:none}
.help{font-size:13px;color:var(--ink-3);margin-top:6px;line-height:1.4}
.callout{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4;margin-top:12px}
.callout .i{margin-top:1px}
.callout.info{background:var(--info-bg);color:var(--info)}.callout.warn{background:var(--warn-bg);color:var(--warn)}.callout.ok{background:var(--ok-bg);color:var(--ok)}.callout.err{background:var(--err-bg);color:var(--err)}.callout.gold{background:var(--gold-bg);color:var(--gold-ink)}
.callout b{font-weight:800}
.errsum{border:2px solid var(--err);border-radius:14px;padding:10px 12px;margin-top:12px;color:var(--err)}
.errsum h3{margin:0 0 4px;font-size:15px}
.errsum ul{margin:0;padding-left:18px;font-size:14px}
.errsum a{color:var(--err);font-weight:700}

/* Tablas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;border-top:0;font-weight:750}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{border-top:2px solid var(--ink);font-weight:800}
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;font-weight:650;overflow-wrap:anywhere}

/* Indicadores */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:900px){.kpis.k4{grid-template-columns:repeat(4,1fr)}}
.kpi{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface);box-shadow:var(--shadow-2);min-width:0}
.kpi .k{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.kpi .v{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--ink-3);line-height:1.35}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.hb .tr{grid-column:1/-1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--gold-ink);border-radius:5px}

/* Arqueo */
.den{display:grid;grid-template-columns:minmax(64px,1fr) auto minmax(78px,auto);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.den:first-of-type{border-top:0}
.den .dl{font-weight:800;font-size:16px}
.den .dl small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.step{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:13px;overflow:hidden;background:var(--surface)}
.step button{width:44px;height:44px;border:0;background:var(--surface-2);font-size:22px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center}
.step input{width:54px;height:44px;border:0;text-align:center;font-size:17px;font-weight:750;background:none;font-variant-numeric:tabular-nums}
.step input:focus{outline:none;background:var(--gold-bg)}
.den .ds{text-align:right;font-weight:750;font-variant-numeric:tabular-nums}
.dockbar{position:sticky;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 8px);z-index:20;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-3);padding:12px 14px;display:flex;align-items:center;gap:12px}
.dockbar .dv{margin-right:auto}
.dockbar .dv small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.dockbar .dv b{font-family:var(--serif);font-size:26px;font-weight:600}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cmp>div{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface-2);min-width:0}
.cmp small{display:block;font-size:12px;font-weight:750;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.cmp b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;overflow-wrap:anywhere}
.cmp .dif.neg{background:var(--err-bg);border-color:transparent}.cmp .dif.neg b,.cmp .dif.neg small{color:var(--err)}
.cmp .dif.pos{background:var(--warn-bg);border-color:transparent}.cmp .dif.pos b,.cmp .dif.pos small{color:var(--warn)}
.cmp .dif.zero{background:var(--ok-bg);border-color:transparent}.cmp .dif.zero b,.cmp .dif.zero small{color:var(--ok)}

/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 24px -18px rgba(0,0,0,.35)}
.tabbar ul{list-style:none;margin:0 auto;padding:0 4px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:640px;height:var(--tab-h);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;width:100%;border:0;background:none;color:var(--ink-3);font-size:12px;font-weight:700;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .i{color:var(--gold-ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:2px;width:26px;height:3px;border-radius:2px;background:var(--gold)}
.tab .tl-s{display:none}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--err);color:#fff;font-size:11.5px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:800}
.tab.fab .fabc{width:52px;height:52px;border-radius:16px;background:var(--gold);color:#151210;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 10px 22px -8px rgba(122,82,10,.55),0 0 0 4px var(--surface)}
.tab.fab{color:var(--ink)}

/* Hojas (L3) */
#layer{position:relative;z-index:100}
.scrim{position:fixed;inset:0;background:var(--scrim);animation:fade var(--t-med) var(--ease-out)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:min(92dvh,920px);background:var(--bg);border-radius:22px 22px 0 0;box-shadow:var(--shadow-3);display:flex;flex-direction:column;animation:up var(--t-med) var(--ease-out);max-width:680px;margin:0 auto}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-h h2{margin:0;font-size:18px;font-weight:800;margin-right:auto;line-height:1.25}
.sh-h .x{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.sh-b{padding:4px 16px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px}
.sh-f .btn{flex:1}
.sec{margin-top:16px}
.sec h3{font-size:13px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--carbon);color:var(--on-carbon);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;max-width:min(92vw,520px);width:max-content;z-index:300;box-shadow:var(--shadow-3);font-size:14.5px;transition:opacity var(--t-med),transform var(--t-med) var(--ease-out)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .i{color:var(--gold)}
.toast.err .i{color:#ff8a7a}
.empty{text-align:center;padding:22px 10px;color:var(--ink-3);font-size:14.5px}
.empty .i{width:30px;height:30px;color:var(--ink-3);margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:2px}
.banner{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:650}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.err{background:var(--err-bg);color:var(--err)}.banner.info{background:var(--info-bg);color:var(--info)}.banner.violet{background:var(--violet-bg);color:var(--violet)}
.banner{flex-wrap:wrap}.banner>span{flex:1 1 200px;min-width:0}
.banner .btn{margin-left:auto;flex:none}
.hist{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.hist li{position:relative;padding:0 0 12px 16px;font-size:13.5px;line-height:1.4}
.hist li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--line-2))}
.hist li b{font-size:14px}
.hist li small{display:block;color:var(--ink-3)}
.perm{text-align:center;padding:32px 16px}
.perm .i{width:36px;height:36px;color:var(--gold-ink)}
.mx{width:100%;border-collapse:collapse;font-size:13.5px}
.mx td,.mx th{padding:7px 6px}
.yes{color:var(--ok);font-weight:800}.no{color:var(--ink-3)}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:middle}
@media(max-width:374px){.logo b{font-size:16px;letter-spacing:.2em}.logo small{font-size:10.5px;letter-spacing:.12em}.rolebtn b{font-size:13px}.rolebtn .i.sm{display:none}.bb-row{gap:8px}}
@media(max-width:359px){.tab .tl-l{display:none}.tab .tl-s{display:inline}

  .qa{grid-template-columns:1fr}.accts{grid-template-columns:1fr}.cmp{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}
  .hero .val{font-size:36px}.rolebtn small{display:none}.logo small{letter-spacing:.2em}
  .den{grid-template-columns:1fr auto}.den .ds{grid-column:1/-1;text-align:left;font-size:13px;color:var(--ink-3)}
}

/* v0.2 · Cierre con fondo fijo: tres indicadores independientes y pasos */
.ind{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:599px){.ind{grid-template-columns:1fr}}
.indc{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:10px 12px;background:var(--surface);min-width:0}
.indc .ii{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--cb);color:var(--c);flex:none}
.indc small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.indc b{display:block;font-size:15.5px;line-height:1.25;color:var(--c)}
.indc span>span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.35;margin-top:2px}
.indc.ok,.ind-b.ok{--c:var(--ok);--cb:var(--ok-bg)}.indc.err,.ind-b.err{--c:var(--err);--cb:var(--err-bg)}.indc.warn,.ind-b.warn{--c:var(--warn);--cb:var(--warn-bg)}
.indc.pend,.ind-b.pend{--c:var(--violet);--cb:var(--violet-bg)}.indc.neutral,.ind-b.neutral{--c:var(--ink-2);--cb:var(--surface-2)}
.ind-b{display:inline-block;background:var(--cb);color:var(--c);white-space:normal;line-height:1.45;padding:3px 9px}
.ind-b .i{vertical-align:-2px;margin-right:4px}
.ind-b b{font-weight:800}
.rs.inds{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.stepper{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stepper li{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink-3);text-align:center}
.stepper li span{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--line-2);background:var(--surface);font-weight:800;font-size:13px}
.stepper li span .i{width:16px;height:16px;stroke-width:2.4}
.stepper li.done{color:var(--ok)}.stepper li.done span{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.stepper li.cur{color:var(--ink)}.stepper li.cur span{border-color:var(--gold-ink);background:var(--gold-bg);color:var(--gold-ink)}
.opt-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.opt-card>b{font-size:15.5px}.opt-card>span{font-size:13.5px;color:var(--ink-3);line-height:1.4}
.hchip.fchip .i{color:var(--ok-on-carbon,#6fcf97)}.hchip.fchip.bad{background:rgba(255,138,122,.16);color:#ffb3a8}.hchip.fchip.bad .i{color:#ff8a7a}

/* v0.2.1 · interfaz compacta */
.vhead{margin:2px 0 12px}.vhead h1{font-size:24px}
.qa3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.qa3 button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-1);font-weight:750;font-size:13.5px;color:var(--ink);padding:8px 4px;text-align:center;line-height:1.15}
.qa3 button .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--gold-bg);color:var(--gold-ink)}
.qa3 button.pri{grid-column:span 2;flex-direction:row;gap:10px;font-size:15px;background:var(--pri-bg);color:var(--pri-ink);border-color:var(--pri-bg)}
.qa3 button.pri .ic{background:rgba(201,164,92,.2);color:var(--gold)}
.qa3 button:disabled{opacity:.45}
.qa3 button:active:not(:disabled){transform:scale(.97)}
.trow{grid-template-columns:1fr auto auto;gap:10px}
.trow .tamt{font-size:15px;white-space:nowrap}
.trow .tamt .tdif{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-ink,#8a6a2f);margin-right:2px}
.trow .btn{min-width:84px}
.mrow{min-height:56px;padding:8px 0}
.rt{font-size:15px}
.ramt small{max-width:110px;white-space:normal}
.dockbar{position:static;box-shadow:var(--shadow-1)}
.hero{padding:16px 16px 14px}.hero .chips{margin-top:10px}
.rs.inds .badge{font-size:12px}
.wf li{padding:8px 0}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{.tabbar,.brandbar .rolebtn,.iconbtn,.qa,.toast{display:none!important}main{padding-bottom:16px}}

/* =====================================================================
   ALAGA · Tema Lux (cristal + oro líquido). Capa visual: no cambia lógica, textos ni botones de las pruebas.
   Se inyecta al final del <head> de ALAGA SYSTEM v0.4 y Finanzas v0.4 al armarlas (tema/aplicar.js).
   Equivalencias exactas de las clases pedidas (sin Tailwind: la caja fuerte bloquea recursos externos):
     bg-zinc-950 #09090b · bg-zinc-900/40 rgba(24,24,27,.4) · backdrop-blur-xl 24px · border-zinc-800/60 rgba(39,39,42,.6)
     oro líquido: linear-gradient(to right, #DFBA73, #F5E3B5, #C29B53) · brillo 0 0 25px rgba(223,186,115,.15)
     curva Apple: cubic-bezier(0.16, 1, 0.3, 1), 0.6 s · scale-95 al presionar · títulos tracking 0.15em, font-light
   ===================================================================== */

/* ---------- Paleta (aplica con cualquier tema elegido) ---------- */
:root, :root[data-theme="light"], :root[data-theme="dark"], :root:not([data-theme="light"]) {
  color-scheme: dark;
  --lux-bg: #09090b;
  --lux-glass: rgba(24,24,27,.4);
  --lux-glass-strong: rgba(24,24,27,.72);
  --lux-border: rgba(39,39,42,.6);
  --lux-blur: blur(24px);
  --lux-gold: linear-gradient(to right, #DFBA73, #F5E3B5, #C29B53);
  --lux-gold-text: linear-gradient(110deg, #C29B53 0%, #DFBA73 28%, #F5E3B5 50%, #DFBA73 72%, #C29B53 100%);
  --lux-gold-soft: #DFBA73;
  --lux-glow: 0 0 25px rgba(223,186,115,.15);
  --lux-ease: cubic-bezier(0.16, 1, 0.3, 1);
  --lux-ink-on-gold: #1f1607;
  --lux-display: -apple-system, "SF Pro Display", BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --serif: var(--lux-display);   /* las cifras grandes usaban una letra con remates: ahora todo es SF Pro */

  --page: #09090b; --bg: #09090b;
  --surface: #18181b; --surface-2: #1f1f23; --surface-3: #27272a;
  --line: rgba(39,39,42,.6); --line-2: #3f3f46; --line-strong: #3f3f46;
  --ink: #f4f4f5; --ink-2: #d4d4d8; --ink-3: #a1a1aa;
  --carbon: #09090b; --carbon-2: #18181b; --carbon-3: #27272a;
  --on-carbon: #f4f4f5; --on-carbon-2: #a1a1aa;
  --gold: #DFBA73; --gold-hi: #DFBA73; --gold-ink: #DFBA73; --gold-bg: rgba(223,186,115,.09);
  --on-gold: #1f1607; --pri-bg: #DFBA73; --pri-ink: #1f1607;
  --btn-dark: rgba(39,39,42,.7); --sel: #27272a; --chip-on-bg: rgba(223,186,115,.14); --chip-on-fg: #F5E3B5;
  --focus: #DFBA73;
  --ok: #6fcf97; --ok-bg: rgba(34,197,94,.12); --warn: #f0b35a; --warn-bg: rgba(245,158,11,.12);
  --err: #ff8a7a; --err-bg: rgba(239,68,68,.12); --info: #8ab8ee; --info-bg: rgba(59,130,246,.12);
  --violet: #c4a8f0; --violet-bg: rgba(139,92,246,.12);
  --st-recibido: #4a86cc; --st-proceso: #b8862a; --st-validacion: #8f6cc9; --st-listo: #3a9a6a; --st-entregado: #71717a;
  --shadow-1: 0 0 0 1px rgba(255,255,255,.02);
  --shadow-2: 0 0 0 1px rgba(255,255,255,.03), 0 18px 40px -20px rgba(0,0,0,.85);
  --shadow-3: 0 30px 70px -20px rgba(0,0,0,.92);
  --scrim: rgba(0,0,0,.6);
}
/* Fondo con profundidad: dos halos dorados muy tenues para que el cristal tenga algo que desenfocar */
html, body {
  background-color: var(--lux-bg);
  background-image: radial-gradient(60% 40% at 85% -5%, rgba(223,186,115,.10), transparent 70%),
                    radial-gradient(50% 35% at -10% 45%, rgba(194,155,83,.06), transparent 70%);
  background-attachment: fixed;
}

/* ---------- 1. Cristal: ningún contenedor sólido ---------- */
.card, .ccard, .kpi, .fkpi, .panel, .acct, .loycard, .choice, .qa button, .opt-card, .dockbar, .xrow, .li, .cta, .hero, .seg {
  background-color: var(--lux-glass) !important;
  -webkit-backdrop-filter: var(--lux-blur) saturate(1.15); backdrop-filter: var(--lux-blur) saturate(1.15);
  border: 1px solid var(--lux-border);
}
.hero { background-image: radial-gradient(120% 140% at 100% 0%, rgba(223,186,115,.09), transparent 55%) !important; }
.cta::before { border-color: rgba(223,186,115,.38) !important; }
.cta small { color: var(--ink-3); }
.cta .chev { color: var(--lux-gold-soft); }
.loycard.ready { border-color: rgba(223,186,115,.4); box-shadow: var(--lux-glow); }
/* Barras fijas: cristal más denso (85 %) para que el contenido que pasa por debajo nunca estorbe la lectura */
.appbar, .tabbar, .dock {
  background: rgba(9,9,11,.85) !important;
  -webkit-backdrop-filter: var(--lux-blur) saturate(1.2); backdrop-filter: var(--lux-blur) saturate(1.2);
  border-color: var(--lux-border);
}
.appbar { border-bottom: 1px solid var(--lux-border); }
.sheet, .dialog { background: var(--lux-glass-strong); -webkit-backdrop-filter: var(--lux-blur); backdrop-filter: var(--lux-blur); border: 1px solid var(--lux-border); }
.toast { background: var(--lux-glass-strong); -webkit-backdrop-filter: var(--lux-blur); backdrop-filter: var(--lux-blur); border: 1px solid var(--lux-border); color: var(--ink); }
input.input, input.inp, .input, .inp, textarea, select { background: rgba(24,24,27,.55); border-color: var(--lux-border); color: var(--ink); }
input:focus, textarea:focus, select:focus { border-color: rgba(223,186,115,.55); box-shadow: var(--lux-glow); }

/* ---------- 2. Oro líquido ---------- */
.btn.primary, .btn.pri, .fab:not(.tab), .fabc, .qa button.pri, .qa3 button.pri, .cta .plus {
  background-image: var(--lux-gold) !important;
  background-color: #DFBA73 !important;
  color: var(--lux-ink-on-gold) !important; border-color: transparent !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(120,85,30,.25), var(--lux-glow);
}
.fab:not(.tab) svg, .fabc svg, .cta .plus svg { stroke: var(--lux-ink-on-gold); }
:root .qa button.pri .ic, :root .qa3 button.pri .ic { background: rgba(31,22,7,.12) !important; color: var(--lux-ink-on-gold) !important; }
:root .qa button.pri small, :root .qa3 button.pri small { color: rgba(31,22,7,.78) !important; opacity: 1; }
.btn.dark { background: rgba(39,39,42,.7); color: var(--ink); border: 1px solid #3f3f46; }
.btn.secondary, .btn:not(.primary):not(.pri):not(.dark) { border-color: var(--lux-border); }
/* Texto destacado con oro recortado */
.wordmark b, .logo b {
  background-image: var(--lux-gold-text); background-size: 250% 100%; background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
}
/* Detalles pequeños */
.eyebrow, .lnk, .linkbtn, .qa button .ic, .acct .an .i { color: var(--lux-gold-soft); }
/* Elementos activos: oro + brillo externo */
.tab[aria-current="page"], .tab.on, .tab[aria-selected="true"] { color: #F5E3B5; text-shadow: 0 0 18px rgba(223,186,115,.35); }
.seg [aria-pressed="true"], .seg [aria-selected="true"], .seg .on, .seg input:checked + span {
  background: rgba(223,186,115,.12) !important; color: #F5E3B5 !important;
  box-shadow: inset 0 0 0 1px rgba(223,186,115,.4), var(--lux-glow);
}
.choice[aria-pressed="true"], .xrow[aria-checked="true"], .kpi.on, .chip[aria-pressed="true"] { border-color: rgba(223,186,115,.45); box-shadow: var(--lux-glow); }
:focus-visible { outline-color: #DFBA73; }

/* ---------- 3. Títulos: escala tipográfica estricta (seguimiento óptico tipo Apple: grande = apretado, pequeño = abierto) ---------- */
.vhead h1, .greet h1 {
  font-family: var(--lux-display); font-weight: 650; letter-spacing: -.022em; line-height: 1.12;
  background-image: var(--lux-gold-text); background-size: 250% 100%; background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
}
.appbar .ttl h1 { font-family: var(--lux-display); font-weight: 600; letter-spacing: -.012em; }
.section-h h2, .panel-h h2, .sh-h h2, .sheet .sh h2, .dialog h2 { font-family: var(--lux-display); font-weight: 600; letter-spacing: -.008em; line-height: 1.25; }
.eyebrow { font-weight: 600; letter-spacing: .12em; }

/* ---------- 4. Físicas de animación ---------- */
.btn, button, a, .card, .ccard, .kpi, .fkpi, .panel, .acct, .choice, .chip, .tab, .row, .mrow, .li, .xrow, .badge, .cta, .seg button, input, select, textarea {
  transition: all .6s var(--lux-ease);
}
/* Microinteracción: se encoge al presionar (rápido) y se expande al soltar (curva de 0.6 s) */
button:active, .btn:active, .choice:active, .cta:active, .kpi:active, .ccard:active, .row:active, .mrow:active, .chip:active, .tab:active {
  transform: scale(.95); transition-duration: .14s;
}
@media (hover: hover) {
  .btn.primary:hover, .btn.pri:hover, .fab:not(.tab):hover, .tab.fab:hover .fabc, .qa button.pri:hover, .qa3 button.pri:hover, .cta:hover, .cta:hover .plus {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 25px rgba(223,186,115,.28);
  }
  .card:hover, .ccard:hover, .kpi:hover, .panel:hover, .choice:hover, .qa button:hover { border-color: rgba(82,82,91,.75); }
  .btn.dark:hover, .btn.secondary:hover { border-color: rgba(223,186,115,.4); }
}
.btn:disabled, .btn[disabled] { box-shadow: none !important; filter: saturate(.35); opacity: .5; }
.sheet, .dialog, .toast, .scrim { transition-duration: .6s !important; transition-timing-function: var(--lux-ease) !important; }

/* Cascada de entrada (la activa tema/lux-dark.js al cambiar de pantalla; 0.05 s entre elementos) */
@keyframes lux-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.lux-rise { animation: lux-rise .6s var(--lux-ease) backwards; }

/* Destello que cruza el logo y los botones dorados cada 4 s */
@keyframes lux-text-shimmer { 0% { background-position: 100% 0; } 30%, 100% { background-position: 0 0; } }
.wordmark b, .logo b { animation: lux-text-shimmer 4s var(--lux-ease) infinite; }
@keyframes lux-sweep { 0% { transform: translateX(-180%) skewX(-20deg); } 30%, 100% { transform: translateX(320%) skewX(-20deg); } }
.btn.primary, .btn.pri, .fab:not(.tab), .fabc, .qa button.pri, .qa3 button.pri, .cta .plus { position: relative; overflow: hidden; isolation: isolate; }
.btn.primary::after, .btn.pri::after, .fab:not(.tab)::after, .fabc::after, .qa button.pri::after, .qa3 button.pri::after, .cta .plus::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; pointer-events: none; z-index: 1;
  background: linear-gradient(90deg, transparent, rgba(255,250,235,.55), transparent);
  transform: translateX(-180%) skewX(-20deg);
  animation: lux-sweep 4s var(--lux-ease) infinite;
}
.btn:disabled::after, .btn[disabled]::after { animation: none; opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* =====================================================================
   5. Marca ALAGA: emblema oficial, nombre tipográfico de lujo, entrada 3D y sello de registro.
   --lux-logo y --lux-logo-sm los inyecta tema/aplicar.js (imagen incrustada; la caja fuerte no permite imágenes externas).
   ===================================================================== */
/* ---------- Nombre ALAGA (encabezados): tipografía de alta moda + oro metálico grabado ---------- */
.wordmark, .logo { position: relative; padding-left: 56px; min-height: 46px; justify-content: center; }
.wordmark::before, .logo::before {
  content: ""; position: absolute; left: 0; top: 50%; width: 46px; height: 46px; transform: translateY(-50%);
  background: var(--lux-logo-sm) center / contain no-repeat;

}
.wordmark b, .logo b {
  font-family: "Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", "Times New Roman", serif;
  font-weight: 700; font-size: 25px; line-height: 1; letter-spacing: .26em; margin-right: -.26em;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-kerning: normal;

    linear-gradient(105deg, transparent 38%, rgba(255,251,240,.95) 50%, transparent 62%),
    linear-gradient(180deg, #FFF4D6 0%, #F1D9A0 22%, #DFBA73 45%, #9C7536 58%, #E7C988 74%, #C29B53 100%);
  background-size: 260% 100%, 100% 100%; background-position: 140% 0, 0 0; background-repeat: no-repeat;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 14px rgba(223,186,115,.18));
  animation: lux-word-shine 4s var(--lux-ease) infinite;
}
.wordmark small, .logo small {
  display: flex; align-items: center; gap: 9px; margin-top: 6px;
  font-family: "Avenir Next", "Avenir", "Helvetica Neue", system-ui, sans-serif; font-weight: 500; font-size: 9.5px; line-height: 1;
  letter-spacing: .48em; margin-right: -.48em; text-transform: uppercase;
  color: #d9dade; -webkit-font-smoothing: antialiased;
  text-shadow: 0 1px 0 rgba(0,0,0,.6);
}
.wordmark small::before, .wordmark small::after, .logo small::before, .logo small::after {
  content: ""; width: 14px; height: 1px; flex: none; background: linear-gradient(90deg, transparent, #DFBA73, transparent); opacity: .85;
}
@keyframes lux-word-shine { 0% { background-position: 140% 0, 0 0; } 32%, 100% { background-position: -40% 0, 0 0; } }
.provisional { display: none !important; }   /* ya hay logo oficial */

/* ---------- Logo ALAGA 3D: el logo ORIGINAL separado en dos planos (logo/separar-capas.py) ----------
   Fondo: anillo, auto y salpicadura. Frente: la A, las estrellas y ALAGA · CAR WASH, 34 px más cerca.
   Cada plano tiene canto metálico (copias oscurecidas apiladas hacia atrás) y un reflejo de luz que solo toca el metal. */
.lg3 { position: relative; width: var(--sz, 340px); height: var(--sz, 340px); transform-style: preserve-3d; }
.lg3 .pl { position: absolute; inset: 0; transform-style: preserve-3d; }
.lg3 .pl > i { position: absolute; inset: 0; display: block; background: center / 100% 100% no-repeat; transform: translateZ(var(--z, 0px)); }
.lg3 .back > i { background-image: var(--lux-capa-fondo); }
.lg3 .front > i { background-image: var(--lux-capa-frente); }
.lg3 .pl > i.e { filter: brightness(var(--b, .4)) saturate(1.25); }
.lg3 .pl > i.sh {   /* reflejo: degradado claro recortado con la forma exacta del metal */
  background: linear-gradient(112deg, transparent 38%, rgba(255,250,232,.85) 50%, transparent 62%) 130% 0 / 320% 100% no-repeat;
  mix-blend-mode: screen; opacity: .9;
  -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat;
}
.lg3 .back > i.sh { --m: var(--lux-capa-fondo); }
.lg3 .front > i.sh { --m: var(--lux-capa-frente); }
.lg3 .front { transform: translateZ(34px); }

/* ---------- Partículas doradas ---------- */
.lux-particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.lux-particles i {
  position: absolute; bottom: -10px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%;
  background: radial-gradient(circle, #FFF6DC, #DFBA73 55%, transparent 70%); opacity: 0;
  animation: lux-rise-p var(--dur) cubic-bezier(.2,.7,.3,1) var(--del) forwards;
}
@keyframes lux-rise-p { 0% { opacity: 0; transform: translate3d(0,0,0) scale(.6); } 15% { opacity: .95; } 100% { opacity: 0; transform: translate3d(var(--dx), var(--dy), 0) scale(1.1); } }

/* ---------- Entrada al iniciar la app (~7 s, no se puede saltar) ---------- */
.lux-intro {
  position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(70% 50% at 50% 44%, rgba(70,50,18,.5), transparent 72%), #030304;

.lux-intro .spark {
  position: absolute; top: 44%; left: 50%; width: 140vw; height: 2px; margin: -1px 0 0 -70vw;
  background: linear-gradient(90deg, transparent, rgba(245,227,181,0) 22%, #FFF3D1 50%, rgba(245,227,181,0) 78%, transparent);
  box-shadow: 0 0 34px 8px rgba(223,186,115,.45); transform: scaleX(0); opacity: 0; animation: lux-flare 1.4s var(--lux-ease) .1s forwards;
}
@keyframes lux-flare { 0% { transform: scaleX(0); opacity: 0; } 35% { opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
.lux-intro .halo {
  position: absolute; top: 44%; left: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%;
  background: radial-gradient(circle, rgba(223,186,115,.24), rgba(223,186,115,.05) 46%, transparent 68%);
  opacity: 0; animation: lux-halo 5.8s ease-in-out .6s forwards;
}
@keyframes lux-halo { 0% { opacity: 0; transform: scale(.6); } 35% { opacity: 1; transform: scale(1); } 65% { opacity: .6; transform: scale(1.06); } 100% { opacity: .9; transform: scale(1); } }
.lux-intro .scene { position: relative; transform-style: preserve-3d; animation: lux-scene 6.2s cubic-bezier(.45,.05,.25,1) .2s both; }
.lux-intro .lg3 { --sz: min(88vw, 360px); }
@keyframes lux-scene {   /* de frente mientras se traza; después un giro sobrio que revela la profundidad y vuelve al centro */
  0%, 40% { transform: none; }
  68% { transform: rotateX(6deg) rotateY(-14deg); }
  86% { transform: rotateX(-2deg) rotateY(8deg); }
  100% { transform: none; }
}
/* Arranque preciso: el anillo y el auto se TRAZAN en un barrido circular (como un instrumento que se calibra),
   con un punto de luz que recorre el anillo y una escala de marcas finas; luego el frente emerge desde la profundidad. */
@property --lux-sweep { syntax: "<angle>"; inherits: true; initial-value: 360deg; }
.lux-intro .back { --lux-sweep: 0deg; animation: lux-trace 1.9s cubic-bezier(.65,0,.25,1) .55s both; }
.lux-intro .back > i:not(.sh) {
  -webkit-mask-image: conic-gradient(from 0deg at 49% 50.4%, #000 var(--lux-sweep), transparent var(--lux-sweep));
          mask-image: conic-gradient(from 0deg at 49% 50.4%, #000 var(--lux-sweep), transparent var(--lux-sweep));
}
@keyframes lux-trace { from { --lux-sweep: 0deg; } to { --lux-sweep: 361deg; } }
.lux-intro .comet { position: absolute; left: 49%; top: 50.4%; width: 0; height: 0; transform: translateZ(1px) rotate(0deg); opacity: 0;
  animation: lux-comet 1.9s cubic-bezier(.65,0,.25,1) .55s both; }
.lux-intro .comet::before { content: ""; position: absolute; left: -5px; top: calc(var(--sz, 340px) * -.462 - 5px); width: 10px; height: 10px; border-radius: 50%;
  background: radial-gradient(circle, #FFFBEF 0 30%, #F5E3B5 45%, rgba(223,186,115,0) 72%); box-shadow: 0 0 18px 6px rgba(245,227,181,.55); }
@keyframes lux-comet { 0% { opacity: 0; transform: translateZ(1px) rotate(0deg); } 8% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; transform: translateZ(1px) rotate(361deg); } }
.lux-intro .dial { position: absolute; left: 49%; top: 50.4%; width: calc(var(--sz, 340px) * 1.04); height: calc(var(--sz, 340px) * 1.04); border-radius: 50%;
  transform: translate(-50%, -50%) rotate(-24deg); opacity: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(233,211,160,.7) 0 .5deg, transparent .5deg 6deg);
  -webkit-mask-image: radial-gradient(closest-side, transparent 93.5%, #000 94.5%, #000 98.5%, transparent 99.5%);
          mask-image: radial-gradient(closest-side, transparent 93.5%, #000 94.5%, #000 98.5%, transparent 99.5%);
  animation: lux-dial 2.9s cubic-bezier(.45,0,.25,1) .3s both; }
@keyframes lux-dial { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-24deg) scale(.96); } 30% { opacity: .55; } 70% { opacity: .55; transform: translate(-50%, -50%) rotate(0deg) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(0deg) scale(1.02); } }
.lux-intro .front { animation: lux-front 1.4s cubic-bezier(.16,1,.3,1) 2.05s both; }
@keyframes lux-front { 0% { opacity: 0; transform: translateZ(-140px); } 45% { opacity: 1; } 100% { opacity: 1; transform: translateZ(34px); } }
.lux-intro .pl > i.sh { animation: lux-sheen 1.6s cubic-bezier(.5,0,.3,1) 4.1s forwards; }
.lux-intro .front > i.sh { animation-delay: 4.25s; }
@keyframes lux-sheen { from { background-position: 130% 0; } to { background-position: -30% 0; } }
.lux-intro .mirror {   /* reflejo en el piso brillante, como en el logo original */
  position: relative; width: min(88vw, 360px); height: calc(min(88vw, 360px) * .22); margin-top: -2px; overflow: hidden; opacity: 0;
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 90%); mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 90%);
  animation: lux-mirror 2.4s var(--lux-ease) 2.6s forwards;
}
.lux-intro .mirror i { position: absolute; left: 0; right: 0; top: 0; height: min(88vw, 360px); transform: scaleY(-1); transform-origin: 50% 50%;
  background: var(--lux-capa-frente) center / 100% 100% no-repeat, var(--lux-capa-fondo) center / 100% 100% no-repeat; filter: blur(2px) brightness(.9); }
@keyframes lux-mirror { to { opacity: .8; } }
.lux-intro .tag { display: flex; align-items: center; gap: 14px; margin-top: 6px; height: 18px; }
.lux-intro .tag i { width: 0; height: 1px; background: linear-gradient(90deg, transparent, #DFBA73); animation: lux-rule .9s var(--lux-ease) 4.5s forwards; }
.lux-intro .tag i:last-child { background: linear-gradient(90deg, #DFBA73, transparent); }
@keyframes lux-rule { to { width: 38px; } }
.lux-intro .tag span { font: 500 11.5px/1 "Avenir Next", "Avenir", "Helvetica Neue", system-ui, sans-serif; letter-spacing: .5em; margin-right: -.5em; text-transform: uppercase; color: #E9D3A0; white-space: nowrap; }
.lux-intro .tag span b { font-weight: 500; display: inline-block; opacity: 0; transform: translateY(8px); filter: blur(4px);
  animation: lux-letter .7s var(--lux-ease) forwards; animation-delay: calc(4.4s + var(--i) * .045s); }
@keyframes lux-letter { to { opacity: 1; transform: none; filter: blur(0); } }
.lux-intro .lux-particles i { --dy: -62vh; }
.lux-intro.out .scene { transform: translateZ(160px); opacity: 0; transition: transform 1s var(--lux-ease), opacity 1s var(--lux-ease); animation: none; }
.lux-intro.out .mirror, .lux-intro.out .tag { opacity: 0; transition: opacity .6s; }

/* ---------- Sello de registro (anotación o movimiento: ~3.2 s, no bloquea el resto de la pantalla) ---------- */
.lux-seal {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 9500; width: min(94vw, 440px);
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px; padding: 14px 18px 14px 14px;
  border-radius: 24px; overflow: hidden; cursor: pointer;
  background: radial-gradient(120% 140% at 0% 0%, rgba(223,186,115,.16), transparent 55%), rgba(16,16,19,.94);
  -webkit-backdrop-filter: blur(24px) saturate(1.2); backdrop-filter: blur(24px) saturate(1.2);
  border: 1px solid rgba(223,186,115,.35); box-shadow: 0 0 25px rgba(223,186,115,.18), 0 24px 60px -18px rgba(0,0,0,.9);
  transform: translate(-50%, -130%) scale(.96); opacity: 0;
  transition: transform .7s var(--lux-ease), opacity .6s var(--lux-ease);
}
.lux-seal.on { transform: translate(-50%, 0) scale(1); opacity: 1; }
.lux-seal.bottom { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); transform: translate(-50%, 130%) scale(.96); }
.lux-seal.bottom.on { transform: translate(-50%, 0) scale(1); }
.lux-seal .ring { position: relative; width: 84px; height: 84px; display: grid; place-items: center; }
.lux-seal .ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.lux-seal .ring > svg circle { fill: none; stroke-width: 2.5; }
.lux-seal .ring .trk { stroke: rgba(63,63,70,.7); }
.lux-seal .ring .prg { stroke: url(#luxGold); stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289; }
.lux-seal.on .ring .prg { animation: lux-ring var(--dur) var(--lux-sync-ease) forwards; }
@keyframes lux-ring { to { stroke-dashoffset: 0; } }
.lux-seal .ring .em {   /* emblema real dentro de un círculo: nada se sale del anillo */
  position: relative; width: 66px; height: 66px; border-radius: 50%; overflow: hidden; isolation: isolate;
  box-shadow: inset 0 0 0 1px rgba(223,186,115,.25);
  animation: lux-em-in .7s var(--lux-ease) .05s both;
}
/* Giro del logotipo SOLO con transformaciones planas (2D). Antes era un giro 3D con caras ocultas por el reverso,
   y Safari/iPhone lo ocultaba dentro del círculo recortado. Ahora una sola cara se angosta y se ensancha (|cos θ|),
   como una moneda que gira, con sombra de canto; nunca se ve al revés y termina completa. La anima tema/lux-dark.js
   con la misma duración y curva que el relleno del anillo (--lux-sync-ease): avanzan igual y terminan juntos. */
.lux-seal { --lux-sync-ease: cubic-bezier(.45, 0, .25, 1); }
.lux-seal .ring .lux-giro { position: absolute; inset: 0; border-radius: 50%; transform-origin: 50% 50%;
  background: var(--lux-logo) center / 112% 112% no-repeat; }
.lux-seal .ring .lux-giro .lux-sombra { position: absolute; inset: 0; border-radius: 50%; opacity: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.65), rgba(0,0,0,.15) 45%, rgba(0,0,0,.65)); }
@keyframes lux-em-in { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: scale(1); } }
.lux-seal .ring .em::after {   /* destello que cruza el emblema dos veces */
  content: ""; position: absolute; inset: -10%; background: linear-gradient(112deg, transparent 45%, rgba(255,248,226,.42) 50%, transparent 55%) 140% 0 / 320% 100% no-repeat;
  mix-blend-mode: screen; z-index: 1; animation: lux-em-sweep 1.1s cubic-bezier(.5,0,.3,1) .5s 1 both;
}
@keyframes lux-em-sweep { from { background-position: 140% 0; } to { background-position: -40% 0; } }
.lux-seal .ring .ok { position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, #F5E3B5, #DFBA73 55%, #C29B53); box-shadow: 0 0 0 3px rgba(16,16,19,.95), 0 0 16px rgba(223,186,115,.45);
  transform: scale(0); animation: lux-ok-pop .5s cubic-bezier(.34,1.56,.64,1) calc(var(--dur) - .05s) forwards; }
.lux-seal .ring .ok svg { width: 14px; height: 14px; stroke: #1f1607; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: lux-ok-draw .35s ease-out calc(var(--dur) + .2s) forwards; }
@keyframes lux-ok-pop { to { transform: scale(1); } }
@keyframes lux-ok-draw { to { stroke-dashoffset: 0; } }
.lux-seal .txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.lux-seal .txt b {
  font-family: "Avenir Next", "Avenir", "Helvetica Neue", system-ui, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
  background-image: linear-gradient(90deg, #C29B53, #F5E3B5, #DFBA73); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
}
.lux-seal .txt .msg { font-size: 15px; font-weight: 600; color: #f4f4f5; line-height: 1.3; overflow-wrap: anywhere; }
.lux-seal .txt small { font-size: 12.5px; color: #a1a1aa; display: flex; align-items: center; gap: 6px; }
.lux-seal .txt small.ok { color: #8fdcae; }
.lux-seal .txt small.wait { color: #f0c27a; }
.lux-seal .lux-particles i { --dy: -120px; bottom: -6px; }
.lux-seal::after {   /* destello al aparecer */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 35%, rgba(255,248,226,.18) 50%, transparent 65%); background-size: 300% 100%; background-position: 130% 0;
}
.lux-seal.on::after { animation: lux-seal-sweep 1.6s var(--lux-ease) .25s forwards; }
@keyframes lux-seal-sweep { to { background-position: -30% 0; } }

/* ---------- Envío a la caja fuerte cuando no hay sello en pantalla (píldora discreta) ---------- */
.lux-sync { position: fixed; left: 0; right: 0; top: 0; z-index: 9000; pointer-events: none; }
.lux-sync .bar { height: 2px; width: 100%; transform-origin: left; transform: scaleX(0); opacity: 0;
  background: linear-gradient(90deg, #C29B53, #F5E3B5, #DFBA73, #C29B53); background-size: 300% 100%;
  transition: transform .6s var(--lux-ease), opacity .5s var(--lux-ease); }
.lux-sync .pill {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; align-items: center; gap: 9px;
  padding: 7px 14px 7px 7px; border-radius: 999px; font-size: 13px; font-weight: 500; letter-spacing: .02em; color: #F5E3B5; white-space: nowrap;
  background: rgba(18,18,21,.94); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  border: 1px solid rgba(223,186,115,.28); box-shadow: 0 0 25px rgba(223,186,115,.15);
  opacity: 0; transform: translate(-50%, -14px) scale(.96); transition: opacity .5s var(--lux-ease), transform .6s var(--lux-ease);
}
.lux-sync .em { width: 24px; height: 24px; border-radius: 50%; background: var(--lux-logo-sm) center / contain no-repeat; flex: none; }
.lux-sync.on .pill { opacity: 1; transform: translate(-50%, 0) scale(1); }
.lux-sync.sending .bar { opacity: 1; transform: scaleX(.85); animation: lux-sync-flow 1.2s linear infinite; }
.lux-sync.sending .em { animation: lux-sync-spin 1.4s var(--lux-ease) infinite; }
.lux-sync.ok .bar { opacity: 1; transform: scaleX(1); }
.lux-sync.ok .pill { border-color: rgba(111,207,151,.35); }
.lux-sync.wait .pill { color: #d4d4d8; border-color: rgba(161,161,170,.3); box-shadow: none; }
@keyframes lux-sync-flow { from { background-position: 0 0; } to { background-position: 300% 0; } }
@keyframes lux-sync-spin { 0% { transform: rotate(0); } 60%, 100% { transform: rotate(360deg); } }

/* Aviso de registro exitoso: palomita dorada */
.toast.lux-ok { border-color: rgba(223,186,115,.45) !important; box-shadow: 0 0 25px rgba(223,186,115,.18), var(--shadow-3); }
.toast.lux-ok svg, .toast.lux-ok .i { color: #DFBA73; stroke: #DFBA73; animation: lux-check .6s var(--lux-ease) both; }
@keyframes lux-check { from { transform: scale(.4) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .lux-intro { display: none !important; }
  .lux-seal .ring .em, .lux-seal .ring .em::after, .wordmark b, .logo b { animation: none !important; }
  .lux-seal .ring .ok { transform: none; } .lux-seal .ring .ok svg { stroke-dashoffset: 0; }
}

/* =====================================================================
   6. Lectura: tipografía estricta, cifras claras, botones corregidos y transiciones fluidas entre pantallas
   ===================================================================== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  font-kerning: normal; font-variant-numeric: tabular-nums lining-nums;   /* cifras del mismo ancho: las cantidades no "bailan" */
}
/* Cifras grandes: SF Pro Display semibold, sin remates, color sólido de alto contraste */
.kpi .v, .fkpi .v, .hero .val, .hero .side .val2, .flowtop .big, .cs .n, .pkg .price, .bigtotal, .pendsplit b,
.acct .av, .wf li.tot .wv, .amt span, .amt input, .dockbar .dv b, .cmp b {
  font-family: var(--lux-display) !important; font-weight: 600; letter-spacing: -.028em;
  font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1, "lnum" 1;
}
.kpi .v, .fkpi .v, .acct .av, .pendsplit b, .cmp b, .dockbar .dv b, .hero .side .val2, .cs .n { color: #FAFAFA; }
.hero .val, .bigtotal, .flowtop .big { color: #F4DDA6 !important; -webkit-text-fill-color: #F4DDA6; background: none !important;
  text-shadow: 0 0 22px rgba(223,186,115,.22); }
.pkg .price { color: #F4DDA6; }

/* Obturador de fotos: siempre círculo perfecto (el botón vecino lo aplastaba) */
.shot { gap: 18px; }
.shot .btn { white-space: nowrap; flex: 0 1 auto; font-size: 15px; letter-spacing: -.01em; padding: 0 14px; border: 1px solid rgba(63,63,70,.8); border-radius: 14px; }
.shutter { flex: none !important; width: 76px !important; height: 76px !important; aspect-ratio: 1; border: 4px solid rgba(244,244,245,.95) !important;
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 25px rgba(223,186,115,.18); }
.shutter span { flex: none; width: 58px; height: 58px; background-image: radial-gradient(circle at 35% 30%, #FFF1CC, #DFBA73 55%, #B88A3E) !important; }
.shot .tnum { min-width: 48px; text-align: center; font-family: var(--lux-display); font-weight: 600; font-size: 19px; letter-spacing: -.01em; }

/* Botón principal deshabilitado: gris limpio y legible (antes era oro desteñido) */
.btn.primary:disabled, .btn.primary[disabled], .btn.pri:disabled, .btn.pri[disabled] {
  background-image: none !important; background-color: rgba(39,39,42,.92) !important; color: #b4b4bb !important;
  box-shadow: inset 0 0 0 1px rgba(63,63,70,.9) !important; filter: none; opacity: 1;
}

/* Transiciones entre pantallas: las barras fijas no se mueven; el contenido nuevo entra deslizándose
   (adelante → desde la derecha, atrás → desde la izquierda, otra sección → sube) y el anterior se desvanece encima. */
.view { animation: none !important; }
.lux-nav { animation: lux-nav-up .56s var(--lux-ease) both; }
.lux-nav.fwd { animation-name: lux-nav-fwd; }
.lux-nav.back { animation-name: lux-nav-back; }
.lux-nav.fade { animation-name: lux-nav-fade; }
@keyframes lux-nav-up { from { opacity: 0; transform: translate3d(0, 18px, 0) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes lux-nav-fwd { from { opacity: 0; transform: translate3d(34px, 0, 0); } to { opacity: 1; transform: none; } }
@keyframes lux-nav-back { from { opacity: 0; transform: translate3d(-34px, 0, 0); } to { opacity: 1; transform: none; } }
@keyframes lux-nav-fade { from { opacity: 0; } to { opacity: 1; } }
.lux-ghost { position: fixed; z-index: 6; pointer-events: none; overflow: hidden; animation: lux-ghost-out .38s var(--lux-ease) forwards; }
.lux-ghost.fwd { --gx: -26px; } .lux-ghost.back { --gx: 26px; } .lux-ghost.up { --gy: -10px; }
.lux-ghost .appbar, .lux-ghost .tabbar, .lux-ghost .dock, .lux-ghost .brandbar, .lux-ghost header, .lux-ghost .dockbar, .lux-ghost .toast { visibility: hidden !important; }
.lux-ghost * { animation: none !important; transition: none !important; }
@keyframes lux-ghost-out { from { opacity: 1; } to { opacity: 0; transform: translate3d(var(--gx, 0), var(--gy, 0), 0) scale(.985); } }
@media (prefers-reduced-motion: reduce) { .lux-ghost { display: none; } }

/* =====================================================================
   7. Encabezado de Finanzas Pro: dos niveles que no dependen del ancho de la letra
      Fila 1: marca ALAGA (todo el ancho que necesite, sin encogerse) + ajustes.
      Fila 2: fecha y hora + rol y DEMO; si no caben juntos, el rol y DEMO bajan a su propia línea (nunca se enciman).
   ===================================================================== */
.brandbar .bb-row { gap: 10px; }
.brandbar .logo { flex: 1 0 auto; min-width: max-content; padding-left: 50px; min-height: 42px; margin-right: auto; }
.brandbar .logo::before { width: 42px; height: 42px; }
.brandbar .logo b { font-size: 22px; letter-spacing: .22em; margin-right: -.22em; }
.brandbar .logo small { font-size: 9px; letter-spacing: .34em; margin-right: -.34em; gap: 7px; margin-top: 5px; }
.brandbar .bb-row > .demo-badge { display: none !important; }
.brandbar .iconbtn { flex: 0 0 auto; margin-left: auto; }
.brandbar .clockline { flex-wrap: wrap; row-gap: 10px; column-gap: 12px; align-items: center; margin-top: 12px; }
.brandbar .bb-when { display: inline-flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; }
.brandbar .bb-when > span { white-space: nowrap; }
.brandbar .bb-acts { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; flex: 0 0 auto; }
.brandbar .bb-acts .demo-badge { display: inline-block !important; margin-left: 0; }
.brandbar .rolebtn { flex: 0 0 auto; gap: 6px; min-height: 40px; padding: 4px 10px 4px 9px; border-radius: 12px; }
.brandbar .rolebtn b { font-size: 13.5px; letter-spacing: -.005em; white-space: nowrap; }
@media (max-width: 520px) {   /* teléfono: rol a la izquierda y DEMO a la derecha; debajo, fecha y hora */
  .brandbar .bb-acts { order: -1; flex: 1 1 100%; margin-left: 0; justify-content: space-between; }
  .brandbar .bb-when { flex: 1 1 100%; }
}
@media (max-width: 359px) {
  .brandbar .logo b { font-size: 19px; letter-spacing: .18em; margin-right: -.18em; }
  .brandbar .logo small { font-size: 8px; letter-spacing: .26em; margin-right: -.26em; }
}

/* =====================================================================
   8. Fondo «Acabado espejo» (canvas fijo detrás de todo el contenido; lo dibuja tema/lux-dark.js)
   ===================================================================== */
html { background-color: var(--lux-bg); }
body, #app { background: transparent !important; }    /* el fondo vive en <html>, así el fondo animado queda entre el fondo y el contenido */
#lux-fondo { position: fixed; inset: 0; z-index: -1; pointer-events: none; display: block; }

/* =====================================================================
   9. Encabezado: respiración entre marca, ícono de perfil y texto del rol (sin encimados 320–430 px)
   ===================================================================== */
.brandbar .bb-row { gap: 10px; }
.brandbar .rolebtn { gap: 10px; padding: 4px 10px 4px 11px; }
.brandbar .rolebtn > .i:first-child { flex: none; }
.brandbar .rolebtn > .i.sm { flex: none; margin-left: -2px; }
@media (max-width: 430px) {
  .brandbar .logo b { font-size: 18px; letter-spacing: .16em; margin-right: -.16em; }
  .brandbar .logo small { letter-spacing: .2em; margin-right: -.2em; }
  .brandbar .logo small::before, .brandbar .logo small::after { display: none; }
}
@media (max-width: 400px) {
  .brandbar .rolebtn > .i.sm { display: none; }
}
.brandbar .rolebtn b em { font-style: normal; }
.brandbar .rolebtn b .rl-s { display: none; }
@media (max-width: 374px) {
  .brandbar .rolebtn { padding: 4px 11px; }
  .brandbar .rolebtn b .rl-l { display: none; }
  .brandbar .rolebtn b .rl-s { display: inline; }
}

/* =====================================================================
   10. LUX CLARO — marfil y champaña con el mismo oro (más profundo para que se lea sobre claro).
   Se activa con la clase html.lux-light, que pone el script del <head> (tema/aplicar.js) según:
   la elección Claro/Oscuro de ALAGA SYSTEM o, en «Sistema», la apariencia del teléfono.
   La entrada, el sello de registro y la píldora de envío siguen oscuros a propósito (son superposiciones de marca).
   ===================================================================== */
:root.lux-light {
  color-scheme: light;
  --lux-bg: #F5F0E6;
  --lux-glass: rgba(255,255,255,.66);
  --lux-glass-strong: rgba(255,253,248,.9);
  --lux-border: rgba(140,110,60,.22);
  --lux-gold-text: linear-gradient(110deg, #7A5A20 0%, #9C7536 28%, #B8914A 50%, #9C7536 72%, #7A5A20 100%);
  --lux-gold-soft: #8F6A2C;
  --lux-glow: 0 0 22px rgba(166,124,52,.16);
  --page: #F5F0E6; --bg: #F5F0E6;
  --surface: #FFFFFF; --surface-2: #FBF8F2; --surface-3: #F1EBDF;
  --line: rgba(120,95,50,.18); --line-2: #DDD3C2; --line-strong: #CFC3AE;
  --ink: #1C1913; --ink-2: #3B352B; --ink-3: #6A6152;
  --carbon: #FBF8F2; --carbon-2: #FFFFFF; --carbon-3: #F1EBDF;
  --on-carbon: #1C1913; --on-carbon-2: #6A6152;
  --gold: #8F6A2C; --gold-hi: #7A5A20; --gold-ink: #7A5A20; --gold-bg: rgba(166,124,52,.10);
  --on-gold: #1f1607; --pri-bg: #DFBA73; --pri-ink: #1f1607;
  --btn-dark: #2B261D; --sel: #F1EBDF; --chip-on-bg: rgba(166,124,52,.14); --chip-on-fg: #6E5019;
  --focus: #8F6A2C;
  --ok: #1E7D4A; --ok-bg: rgba(30,125,74,.11); --warn: #A35F00; --warn-bg: rgba(200,130,20,.13);
  --err: #B3261E; --err-bg: rgba(179,38,30,.09); --info: #2A62A8; --info-bg: rgba(42,98,168,.10);
  --violet: #5E3FA8; --violet-bg: rgba(94,63,168,.10);
  --st-entregado: #8A8476;
  --shadow-1: 0 1px 2px rgba(60,45,20,.06);
  --shadow-2: 0 1px 2px rgba(60,45,20,.05), 0 14px 32px -20px rgba(60,45,20,.38);
  --shadow-3: 0 30px 60px -24px rgba(60,45,20,.45);
  --scrim: rgba(30,25,15,.32);
}
:root.lux-light, :root.lux-light body {
  background-color: var(--lux-bg);
  background-image: radial-gradient(60% 40% at 85% -5%, rgba(223,186,115,.22), transparent 70%),
                    radial-gradient(50% 35% at -10% 45%, rgba(194,155,83,.12), transparent 70%);
}
:root.lux-light body { background: transparent !important; }
:root.lux-light .card, :root.lux-light .ccard, :root.lux-light .kpi, :root.lux-light .fkpi, :root.lux-light .panel, :root.lux-light .acct,
:root.lux-light .loycard, :root.lux-light .choice, :root.lux-light .qa button, :root.lux-light .opt-card, :root.lux-light .xrow, :root.lux-light .li, :root.lux-light .cta, :root.lux-light .hero {
  box-shadow: var(--shadow-2);
}
:root.lux-light .appbar, :root.lux-light .tabbar, :root.lux-light .dock { background: rgba(251,248,242,.9) !important; }
:root.lux-light .brandbar { background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(251,248,242,.7)) !important; border-bottom: 1px solid var(--lux-border); }
:root.lux-light input.input, :root.lux-light input.inp, :root.lux-light .input, :root.lux-light .inp, :root.lux-light textarea, :root.lux-light select { background: rgba(255,255,255,.88); }
:root.lux-light .btn.dark { background: #2B261D; color: #F6F2EA; border-color: #2B261D; }
:root.lux-light .tab[aria-current="page"], :root.lux-light .tab.on, :root.lux-light .tab[aria-selected="true"] { color: #7A5A20; text-shadow: none; }
:root.lux-light .seg [aria-pressed="true"], :root.lux-light .seg [aria-selected="true"], :root.lux-light .seg .on, :root.lux-light .seg input:checked + span {
  background: rgba(166,124,52,.14) !important; color: #6E5019 !important; box-shadow: inset 0 0 0 1px rgba(166,124,52,.45);
}
@media (hover: hover) {
  :root.lux-light .card:hover, :root.lux-light .ccard:hover, :root.lux-light .kpi:hover, :root.lux-light .panel:hover, :root.lux-light .choice:hover, :root.lux-light .qa button:hover { border-color: rgba(150,115,60,.45); }
}
:root.lux-light :focus-visible { outline-color: #8F6A2C; }
/* Marca: oro grabado profundo sobre marfil */
:root.lux-light .wordmark b, :root.lux-light .logo b {
  background-image: linear-gradient(105deg, transparent 38%, rgba(255,252,240,.9) 50%, transparent 62%),
                    linear-gradient(180deg, #B8914A 0%, #9C7536 35%, #6E5019 60%, #A9823F 80%, #7A5A20 100%);
  filter: drop-shadow(0 1px 0 rgba(255,255,255,.7));
}
:root.lux-light .wordmark small, :root.lux-light .logo small { color: #4A4335; text-shadow: none; }
:root.lux-light .wordmark::before, :root.lux-light .logo::before { filter: drop-shadow(0 2px 6px rgba(60,45,20,.35)); }
/* Cifras: alto contraste sobre claro */
:root.lux-light .kpi .v, :root.lux-light .fkpi .v, :root.lux-light .acct .av, :root.lux-light .pendsplit b, :root.lux-light .cmp b,
:root.lux-light .dockbar .dv b, :root.lux-light .hero .side .val2, :root.lux-light .cs .n { color: #1C1913; }
:root.lux-light .hero .val, :root.lux-light .bigtotal, :root.lux-light .flowtop .big { color: #6E5019 !important; -webkit-text-fill-color: #6E5019; text-shadow: none; }
:root.lux-light .pkg .price { color: #6E5019; }
/* Obturador y botón deshabilitado */
:root.lux-light .shutter { border-color: #2B261D !important; box-shadow: 0 0 0 1px rgba(255,255,255,.6), 0 6px 18px -6px rgba(60,45,20,.45); }
:root.lux-light .shot .btn { border-color: var(--line-2); color: var(--ink); }
:root.lux-light .btn.primary:disabled, :root.lux-light .btn.primary[disabled], :root.lux-light .btn.pri:disabled, :root.lux-light .btn.pri[disabled] {
  background-color: #E8E1D3 !important; color: #7D7362 !important; box-shadow: inset 0 0 0 1px #D6CCB9 !important;
}
/* Encabezado de Finanzas Pro */
:root.lux-light .brandbar .rolebtn, :root.lux-light .brandbar .iconbtn { background: rgba(255,255,255,.75); border-color: rgba(120,95,50,.28); color: #1C1913; }
:root.lux-light .brandbar .rolebtn .i { color: #8F6A2C; }
:root.lux-light .clockline { color: #5A5244; }


/* =====================================================================
   11. Pantallas de cierre (Ticket creado / cobro / entrega): el círculo lleva el EMBLEMA oficial;
   la palomita (o el reloj si el cobro queda pendiente) pasa a una insignia dorada, igual que en el sello de registro.
   Solo 2D (sin 3D), para que Safari/iPhone lo dibuje siempre.
   ===================================================================== */
.okmark {
  position: relative; width: 104px; height: 104px; border-radius: 50%; overflow: visible;
  background: var(--lux-logo) center / 112% 112% no-repeat, #050506 !important;
  box-shadow: 0 0 0 2px rgba(223,186,115,.55), 0 0 0 8px rgba(223,186,115,.12), 0 0 34px rgba(223,186,115,.25) !important;
  animation: lux-okmark-in .8s var(--lux-ease) both;
}
.okmark::before {   /* destello que cruza el emblema una vez */
  content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: linear-gradient(112deg, transparent 44%, rgba(255,248,226,.45) 50%, transparent 56%) 140% 0 / 320% 100% no-repeat;
  mix-blend-mode: screen; animation: lux-em-sweep 1.2s cubic-bezier(.5,0,.3,1) .5s both;
}
.okmark svg {
  position: absolute; right: -16px; bottom: -6px; width: 32px !important; height: 32px !important; padding: 7px; box-sizing: border-box;
  border-radius: 50%; background: linear-gradient(135deg, #F5E3B5, #DFBA73 55%, #C29B53);
  box-shadow: 0 0 0 3px var(--lux-bg), 0 0 16px rgba(223,186,115,.45);
  stroke: #1f1607 !important; stroke-width: 2.8 !important;
  transform: scale(0); animation: lux-ok-pop .5s cubic-bezier(.34,1.56,.64,1) .55s forwards, draw 420ms .9s var(--ease-out, ease-out) forwards !important;
}
@keyframes lux-okmark-in { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .okmark, .okmark::before { animation: none !important; } .okmark svg { transform: none; stroke-dashoffset: 0 !important; animation: none !important; } }
/* ---------- Avisos y barra inferior legibles (reporte de Gand, 6 nov 2026) ---------- */
/* El aviso era translúcido (72 % / 90 %) y lo de abajo se leía a través: ahora es sólido */
.toast { background: #18181B !important; box-shadow: 0 10px 30px rgba(0,0,0,.45) !important; }
:root.lux-light .toast { background: #FFFDF8 !important; box-shadow: 0 10px 28px rgba(60,45,20,.18) !important; }
/* Barras fijas sólidas: el contenido ya no se asoma por debajo de los íconos */
.appbar, .tabbar, .dock { background: #09090B !important; }
:root.lux-light .appbar, :root.lux-light .tabbar, :root.lux-light .dock { background: #FBF8F2 !important; }
/* En teléfono, el aviso inferior queda arriba del botón + central, con aire */
@media (max-width: 1099px) { .toast:not(.top) { bottom: calc(env(safe-area-inset-bottom, 0px) + 112px) !important; } }

<script>
"use strict";
/* =====================================================================
   ALAGA FINANZAS PRO · DEMO v0.3 — núcleo contable (fondo fijo, sin devoluciones, almacenamiento protegido)
   Todos los importes se guardan en CENTAVOS (enteros) para evitar errores de redondeo.
   El dinero solo cambia mediante movimientos. Nada se borra: las correcciones son
   movimientos nuevos ("reverso") que anulan el efecto del original y quedan enlazados.
   ===================================================================== */
const KEY = "alaga-fin-demo-v3";
const VERSION = "Finanzas Pro v0.4 (DEMO + conexión a caja fuerte)";
/* Regla operativa DEFINITIVA aprobada: fondo fijo de caja de $500 MXN. Al cierre, administración recibe el excedente
   y deben permanecer físicamente $500 para la siguiente apertura. */
const FONDO_FIJO = 50000;
function deepFreeze(o){Object.values(o).forEach(v=>{if(v&&typeof v==="object")deepFreeze(v)});return Object.freeze(o)}

/* Catálogo oficial copiado SIN CAMBIOS de ALAGA SYSTEM v0.3 (lona). Solo lectura. */
const CATS = deepFreeze([
  {id:"sedan", name:"Sedán / compacto"},{id:"suv", name:"SUV"},{id:"pickup", name:"Pickup"},{id:"moto", name:"Moto"},{id:"rzr", name:"RZR"}
]);
const PKGS = deepFreeze({alaga:{name:"Paquete ALAGA"}, super:{name:"Súper ALAGA"}});
const PRICES = deepFreeze({

  super:{sedan:180, suv:210, pickup:240, moto:110, rzr:290}
});
const EXTRAS = deepFreeze([
